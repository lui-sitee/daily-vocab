e a ballpark figure for the total fees?","exampleZh":"可否给我一个总费用的大概数字？"},{"id":"gen-183","bank":"general","word":"bottom line","full":"","ipa":"/ˌbɒtəm ˈlaɪn/","pos":"n.","meaning":"最终结论；底线；（账目上的）净利润。口语中常指“最重要的一点”。","example":"The bottom line is that the product is not suitable for her.","exampleZh":"关键在于，这个产品并不适合她。"},{"id":"gen-184","bank":"general","word":"in a nutshell","full":"","ipa":"/ɪn ə ˈnʌtʃel/","pos":"phr.","meaning":"简而言之。用于用一句话概括复杂内容。","example":"In a nutshell, the note pays a higher coupon in exchange for more risk.","exampleZh":"简而言之，这份票据以承担更多风险换取较高票息。"},{"id":"gen-185","bank":"general","word":"moving forward","full":"","ipa":"/ˌmuːvɪŋ ˈfɔːwəd/","pos":"phr.","meaning":"今后；从现在起。用于宣布新安排或改进做法。","example":"Moving forward, all trade requests must be sent by email.","exampleZh":"今后所有交易要求都须以电邮发出。"},{"id":"gen-186","bank":"general","word":"going forward","full":"","ipa":"/ˌɡəʊɪŋ ˈfɔːwəd/","pos":"phr.","meaning":"今后；往后。与 moving forward 意思相近，常见于商务语境。","example":"Going forward, we will review the portfolio every quarter.","exampleZh":"今后我们每季检讨一次投资组合。"},{"id":"gen-187","bank":"general","word":"in light of","full":"","ipa":"/ɪn ˈlaɪt əv/","pos":"phr.","meaning":"鉴于；考虑到。用于说明作出某决定的原因。","example":"In light of the market volatility, we have postponed the launch.","exampleZh":"鉴于市场波动，我们已押后推出。"},{"id":"gen-188","bank":"general","word":"due to","full":"","ipa":"/ˈdjuː tə/","pos":"phr.","meaning":"由于；因为。正式写作中常用于说明原因，后接名词短语。","example":"The meeting was cancelled due to the typhoon signal.","exampleZh":"由于台风信号，会议取消了。"},{"id":"gen-189","bank":"general","word":"as per","full":"","ipa":"/æz ˈpɜː/","pos":"phr.","meaning":"按照；根据。商务英语常见用法，正式文书中可改为 in accordance with。","example":"As per our discussion, I have updated the proposal.","exampleZh":"按照我们讨论的内容，我已更新了建议书。"},{"id":"gen-190","bank":"general","word":"in accordance with","full":"","ipa":"/ɪn əˈkɔːdns wɪð/","pos":"phr.","meaning":"依照；按照。多用于正式文件，表示符合规定或协议。","example":"Fees will be charged in accordance with the tariff.","exampleZh":"费用将按收费表收取。"},{"id":"gen-191","bank":"general","word":"take into account","full":"","ipa":"/ˌteɪk ɪntu əˈkaʊnt/","pos":"phr.","meaning":"考虑到；顾及。把某因素纳入判断之中。","example":"We take into account your liquidity needs when building the portfolio.","exampleZh":"建构组合时，我们会考虑您的流动资金需要。"},{"id":"gen-192","bank":"general","word":"point of contact","full":"","ipa":"/ˌpɔɪnt əv ˈkɒntækt/","pos":"n.","meaning":"联络人。负责某事项、其他人有问题时首先联系的人。","example":"I will be your main point of contact during the transition.","exampleZh":"过渡期间我会是您的主要联络人。"},{"id":"gen-193","bank":"general","word":"counterproposal","full":"","ipa":"/ˈkaʊntəprəpəʊzl/","pos":"n.","meaning":"反建议（还价方案）。对对方提出的方案作出修改后提出的另一方案。","example":"The client came back with a counterproposal on the fee level.","exampleZh":"客户就收费水平提出了反建议。"},{"id":"gen-194","bank":"general","word":"pushback","full":"","ipa":"/ˈpʊʃbæk/","pos":"n.","meaning":"反对；阻力。对某项建议或决定的抗拒或异议。","example":"We got some pushback from the team about the new reporting format.","exampleZh":"团队对新的报告格式有些反对意见。"},{"id":"gen-195","bank":"general","word":"buy-in","full":"","ipa":"/ˈbaɪ ɪn/","pos":"n.","meaning":"认同和支持。相关人员对计划的同意与投入。","example":"We need buy-in from the regional head before we proceed.","exampleZh":"我们需要取得区域主管的支持才能推进。"},{"id":"gen-196","bank":"general","word":"low-hanging fruit","full":"","ipa":"/ˌləʊ ˌhæŋɪŋ ˈfruːt/","pos":"n.","meaning":"容易取得的成果。不需太多努力便可完成或改善的事项。","example":"Let's start with the low-hanging fruit, such as fixing the typos.","exampleZh":"我们先从容易的着手，例如修正错别字。"},{"id":"gen-197","bank":"general","word":"quick win","full":"","ipa":"/ˌkwɪk ˈwɪn/","pos":"n.","meaning":"速效成果。能在短时间内取得、见效明显的改善。","example":"Automating the daily report would be a quick win.","exampleZh":"把每日报告自动化，可以很快见效。"},{"id":"gen-198","bank":"general","word":"pain point","full":"","ipa":"/ˈpeɪn pɔɪnt/","pos":"n.","meaning":"痛点。客户或员工反复遇到、令人困扰的问题。","example":"Long onboarding time is the biggest pain point for new clients.","exampleZh":"开户时间长是新客户最大的痛点。"},{"id":"gen-199","bank":"general","word":"value proposition","full":"","ipa":"/ˈvæljuː ˌprɒpəˈzɪʃn/","pos":"n.","meaning":"价值主张。产品或服务能为客户带来的独特好处的说明。","example":"What is our value proposition compared with online platforms?","exampleZh":"与网上平台相比，我们的价值主张是什么？"},{"id":"gen-200","bank":"general","word":"key performance indicator","full":"Key Performance Indicator (KPI)","ipa":"/ˌkiː pəˈfɔːməns ˌɪndɪkeɪtə/","pos":"n.","meaning":"关键绩效指标。用来衡量个人或团队是否达成目标的量化指标。","example":"Client satisfaction is one of our key performance indicators.","exampleZh":"客户满意度是我们的关键绩效指标之一。"},{"id":"gen-201","bank":"general","word":"OKR","full":"Objectives and Key Results","ipa":"/ˌəʊ keɪ ˈɑː/","pos":"n.","meaning":"目标与关键成果。一种设定目标的管理方法：先订方向性的目标，再以可量化的关键成果衡量进度。","example":"Our team's OKR this quarter is to cut response time by half.","exampleZh":"本季团队的目标与关键成果是把回应时间减半。"},{"id":"gen-202","bank":"general","word":"performance review","full":"","ipa":"/pəˈfɔːməns rɪˌvjuː/","pos":"n.","meaning":"绩效评核。定期评估员工工作表现、并讨论发展方向的过程。","example":"My performance review is scheduled for next Tuesday.","exampleZh":"我的绩效评核安排在下星期二。"},{"id":"gen-203","bank":"general","word":"feedback","full":"","ipa":"/ˈfiːdbæk/","pos":"n.","meaning":"反馈意见。对某人表现或某项工作提出的评价和建议，不可数名词。","example":"Thanks for the feedback; I'll revise the slides accordingly.","exampleZh":"谢谢您的意见，我会据此修改简报。"},{"id":"gen-204","bank":"general","word":"constructive criticism","full":"","ipa":"/kənˌstrʌktɪv ˈkrɪtɪsɪzəm/","pos":"n.","meaning":"建设性批评。指出问题并提出改进方向、目的在于帮助对方的批评。","example":"She welcomes constructive criticism on her presentations.","exampleZh":"她欢迎别人对她的演示提出建设性批评。"},{"id":"gen-205","bank":"general","word":"onboarding","full":"","ipa":"/ˈɒnbɔːdɪŋ/","pos":"n.","meaning":"入职（开户）安排。新员工入职或新客户开户时的一系列程序。","example":"The client onboarding process takes about two weeks.","exampleZh":"客户开户程序大约需时两星期。"},{"id":"gen-206","bank":"general","word":"offboarding","full":"","ipa":"/ˈɒfbɔːdɪŋ/","pos":"n.","meaning":"离职（销户）安排。员工离职或客户结束关系时的交接、权限收回等程序。","example":"IT will revoke system access as part of offboarding.","exampleZh":"资讯科技部会在离职程序中收回系统权限。"},{"id":"gen-207","bank":"general","word":"headcount","full":"","ipa":"/ˈhedkaʊnt/","pos":"n.","meaning":"人数编制。部门或公司的员工人数，或获批准招聘的名额。","example":"We have approval for two additional headcount next year.","exampleZh":"我们获批准明年增加两个人手编制。"},{"id":"gen-208","bank":"general","word":"line manager","full":"","ipa":"/ˈlaɪn ˌmænɪdʒə/","pos":"n.","meaning":"直属上司。直接管理和评核某员工的主管。","example":"Please get your line manager's approval for the training course.","exampleZh":"报读培训课程须取得直属上司批准。"},{"id":"gen-209","bank":"general","word":"report to","full":"","ipa":"/rɪˈpɔːt tə/","pos":"phr.","meaning":"向……汇报（隶属于）。表示组织架构中的上下级关系。","example":"I report to the head of wealth management.","exampleZh":"我向财富管理主管汇报。"},{"id":"gen-210","bank":"general","word":"cross-functional","full":"","ipa":"/ˌkrɒs ˈfʌŋkʃənl/","pos":"adj.","meaning":"跨部门的。由不同职能部门的人员组成或协作的。","example":"A cross-functional team reviewed the new product.","exampleZh":"一个跨部门团队审阅了这项新产品。"},{"id":"gen-211","bank":"general","word":"silo","full":"","ipa":"/ˈsaɪləʊ/","pos":"n.","meaning":"各自为政的部门（信息孤岛）。指部门之间缺乏沟通协作的状况。","example":"We need to break down silos between sales and operations.","exampleZh":"我们需要打破销售与营运部门之间各自为政的状况。"},{"id":"gen-212","bank":"general","word":"synergy","full":"","ipa":"/ˈsɪnədʒi/","pos":"n.","meaning":"协同效应。双方合作产生的效果大于各自单独行事的总和。","example":"The merger is expected to create cost synergies.","exampleZh":"这宗合并预期可产生成本协同效应。"},{"id":"gen-213","bank":"general","word":"roadmap","full":"","ipa":"/ˈrəʊdmæp/","pos":"n.","meaning":"路线图（发展规划）。按时间排列的目标和步骤计划。","example":"The product roadmap shows three launches next year.","exampleZh":"产品路线图显示明年有三项产品推出。"},{"id":"gen-214","bank":"general","word":"kick-off meeting","full":"","ipa":"/ˈkɪk ɒf ˌmiːtɪŋ/","pos":"n.","meaning":"启动会议。项目开始时召开、说明目标、分工和时间表的会议。","example":"The kick-off meeting for the system upgrade is on Monday.","exampleZh":"系统升级项目的启动会议在星期一举行。"},{"id":"gen-215","bank":"general","word":"debrief","full":"","ipa":"/ˌdiːˈbriːf/","pos":"v./n.","meaning":"事后汇报（检讨）。在活动或会议结束后，回顾经过、得失和下一步。","example":"Let's debrief after the client meeting.","exampleZh":"和客户开完会后，我们检讨一下。"},{"id":"gen-216","bank":"general","word":"brainstorm","full":"","ipa":"/ˈbreɪnstɔːm/","pos":"v.","meaning":"集思广益（头脑风暴）。一群人自由提出想法，先求多，后再筛选。","example":"Let's brainstorm topics for next month's client seminar.","exampleZh":"我们一起想想下月客户讲座的主题。"},{"id":"gen-217","bank":"general","word":"wrap up","full":"","ipa":"/ˌræp ˈʌp/","pos":"phr.","meaning":"结束；收尾。用于会议或工作接近完成时。","example":"Let's wrap up with a quick summary of next steps.","exampleZh":"最后我们简单总结一下下一步工作。"},{"id":"gen-218","bank":"general","word":"next steps","full":"","ipa":"/ˌnekst ˈsteps/","pos":"n.","meaning":"下一步安排。会议或讨论结束时，确定之后要做的事情。","example":"I'll send an email summarising the next steps.","exampleZh":"我会发电邮总结下一步安排。"},{"id":"gen-219","bank":"general","word":"take the floor","full":"","ipa":"/ˌteɪk ðə ˈflɔː/","pos":"phr.","meaning":"发言。在会议上获得发言机会开始讲话。","example":"I'd now like to invite our CIO to take the floor.","exampleZh":"现在请我们的首席投资总监发言。"},{"id":"gen-220","bank":"general","word":"chair","full":"","ipa":"/tʃeə/","pos":"v.","meaning":"主持（会议）。负责掌控议程、发言次序和会议时间。","example":"Who will chair the investment committee meeting?","exampleZh":"谁来主持投资委员会会议？"},{"id":"gen-221","bank":"general","word":"quorum","full":"","ipa":"/ˈkwɔːrəm/","pos":"n.","meaning":"法定人数。会议作出有效决定所需的最少出席人数。","example":"We cannot vote today because we don't have a quorum.","exampleZh":"我们今天不能表决，因为出席人数未达法定人数。"},{"id":"gen-222","bank":"general","word":"motion","full":"","ipa":"/ˈməʊʃn/","pos":"n.","meaning":"动议。在正式会议上提出、供与会者讨论和表决的建议。","example":"The motion to approve the budget was carried.","exampleZh":"批准预算的动议获得通过。"},{"id":"gen-223","bank":"general","word":"unanimous","full":"","ipa":"/juˈnænɪməs/","pos":"adj.","meaning":"一致同意的。所有人都赞成，没有反对。","example":"The board's decision was unanimous.","exampleZh":"董事会的决定是一致通过的。"},{"id":"gen-224","bank":"general","word":"abstain","full":"","ipa":"/əbˈsteɪn/","pos":"v.","meaning":"弃权。在表决时既不投赞成票也不投反对票。","example":"Two directors abstained because of a conflict of interest.","exampleZh":"两名董事因利益冲突而弃权。"},{"id":"gen-225","bank":"general","word":"adjourn","full":"","ipa":"/əˈdʒɜːn/","pos":"v.","meaning":"休会；延期。暂停会议，择日再续。","example":"The meeting was adjourned until next week.","exampleZh":"会议延至下星期再续。"},{"id":"gen-226","bank":"general","word":"on hold","full":"","ipa":"/ɒn ˈhəʊld/","pos":"phr.","meaning":"暂缓；搁置。表示某事暂停处理，等待进一步指示。","example":"The project is on hold until the budget is approved.","exampleZh":"项目暂时搁置，等待预算获批。"},{"id":"gen-227","bank":"general","word":"in the pipeline","full":"","ipa":"/ɪn ðə ˈpaɪplaɪn/","pos":"phr.","meaning":"正在筹备中。指计划已开始准备，但尚未完成或公布。","example":"We have two new funds in the pipeline.","exampleZh":"我们有两只新基金正在筹备中。"},{"id":"gen-228","bank":"general","word":"status update","full":"","ipa":"/ˈsteɪtəs ˌʌpdeɪt/","pos":"n.","meaning":"进度更新。简要报告某项工作的目前状况。","example":"Please send me a status update on the account opening.","exampleZh":"请告诉我开户的最新进度。"},{"id":"gen-229","bank":"general","word":"heads-down","full":"","ipa":"/ˌhedz ˈdaʊn/","pos":"adj.","meaning":"专心工作的。指埋头处理工作、暂时不便被打扰。","example":"I'm heads-down on the year-end report this afternoon.","exampleZh":"今天下午我要专心赶年终报告。"},{"id":"gen-230","bank":"general","word":"deadline","full":"","ipa":"/ˈdedlaɪn/","pos":"n.","meaning":"截止日期（期限）。必须完成某事的最后时间。","example":"The deadline for submitting documents is 30 November.","exampleZh":"提交文件的截止日期是 11 月 30 日。"},{"id":"gen-231","bank":"general","word":"extension","full":"","ipa":"/ɪkˈstenʃn/","pos":"n.","meaning":"延期。把原定期限推后的安排。","example":"Could we request a one-week extension for the report?","exampleZh":"报告可否申请延期一星期？"},{"id":"gen-232","bank":"general","word":"lead time","full":"","ipa":"/ˈliːd taɪm/","pos":"n.","meaning":"准备时间（前置期）。由提出要求到完成交付所需的时间。","example":"Please allow three working days of lead time for wire transfers.","exampleZh":"电汇请预留三个工作天的处理时间。"},{"id":"gen-233","bank":"general","word":"working day","full":"","ipa":"/ˈwɜːkɪŋ deɪ/","pos":"n.","meaning":"工作日。不包括周末和公众假期的日子；计算期限时须留意不同地区的假期。","example":"We will reply within two working days.","exampleZh":"我们会在两个工作日内回复。"},{"id":"gen-234","bank":"general","word":"time zone","full":"","ipa":"/ˈtaɪm zəʊn/","pos":"n.","meaning":"时区。安排跨地区会议或截止时间时须注明，以免误会。","example":"Please state the time zone when proposing a meeting time.","exampleZh":"建议开会时间时，请注明时区。"},{"id":"gen-235","bank":"general","word":"reschedule","full":"","ipa":"/ˌriːˈʃedjuːl/","pos":"v.","meaning":"重新安排时间；改期。","example":"Would it be possible to reschedule our call to Thursday?","exampleZh":"我们的电话会议可否改到星期四？"},{"id":"gen-236","bank":"general","word":"availability","full":"","ipa":"/əˌveɪləˈbɪləti/","pos":"n.","meaning":"有空的时间；（物品）供应情况。约人开会时常问对方的 availability。","example":"Please let me know your availability next week.","exampleZh":"请告诉我您下星期哪些时间有空。"},{"id":"gen-237","bank":"general","word":"calendar invite","full":"","ipa":"/ˈkælɪndər ɪnˌvaɪt/","pos":"n.","meaning":"日历邀请。通过电邮或日历系统发出的会议邀请，可直接接受或拒绝。","example":"I'll send a calendar invite with the dial-in details.","exampleZh":"我会发出附有拨入资料的日历邀请。"},{"id":"gen-238","bank":"general","word":"dial in","full":"","ipa":"/ˌdaɪəl ˈɪn/","pos":"phr.","meaning":"拨号加入（电话或视像会议）。","example":"Clients overseas can dial in to the call.","exampleZh":"海外客户可以拨号加入会议。"},{"id":"gen-239","bank":"general","word":"on mute","full":"","ipa":"/ɒn ˈmjuːt/","pos":"phr.","meaning":"处于静音状态。视像会议中常见提示：You're on mute.","example":"Sorry, I was on mute. Could you repeat the question?","exampleZh":"抱歉，我刚才静音了。可以再说一次问题吗？"},{"id":"gen-240","bank":"general","word":"share my screen","full":"","ipa":"/ˌʃeə maɪ ˈskriːn/","pos":"phr.","meaning":"共享我的屏幕。在线上会议中展示自己的电脑画面。","example":"Let me share my screen so you can see the chart.","exampleZh":"我来共享屏幕，让大家看看这张图表。"},{"id":"gen-241","bank":"general","word":"breakout session","full":"","ipa":"/ˈbreɪkaʊt ˌseʃn/","pos":"n.","meaning":"分组讨论环节。大型会议中把与会者分成小组讨论的时段。","example":"We'll split into breakout sessions after the keynote.","exampleZh":"主题演讲后我们会分组讨论。"},{"id":"gen-242","bank":"general","word":"keynote","full":"","ipa":"/ˈkiːnəʊt/","pos":"n.","meaning":"主题演讲。会议中由重要讲者发表、奠定主题的演讲。","example":"The keynote focused on the outlook for interest rates.","exampleZh":"主题演讲聚焦利率前景。"},{"id":"gen-243","bank":"general","word":"Q&A","full":"Question and Answer","ipa":"/ˌkjuː ən ˈeɪ/","pos":"n.","meaning":"问答环节。演讲后由听众提问、讲者回答的时段。","example":"We'll leave fifteen minutes for Q&A at the end.","exampleZh":"最后会预留十五分钟作问答环节。"},{"id":"gen-244","bank":"general","word":"action plan","full":"","ipa":"/ˈækʃn plæn/","pos":"n.","meaning":"行动计划。列明目标、步骤、负责人和期限的具体计划。","example":"Please draft an action plan to clear the account-opening backlog.","exampleZh":"请拟定一份行动计划，处理积压的开户申请。"},{"id":"gen-245","bank":"general","word":"offline","full":"","ipa":"/ˌɒfˈlaɪn/","pos":"adv.","meaning":"会后私下（另行）讨论。会议中用 take this offline 表示不占用大家时间、另找时间细谈。","example":"Let's take this offline and discuss it after the call.","exampleZh":"这一点我们会后再另外谈。"},{"id":"gen-246","bank":"general","word":"devil's advocate","full":"","ipa":"/ˌdevlz ˈædvəkət/","pos":"n.","meaning":"唱反调的人。为了检验论点而故意提出相反意见。","example":"Let me play devil's advocate: what if rates rise instead?","exampleZh":"我来唱个反调：如果利率反而上升呢？"},{"id":"gen-247","bank":"general","word":"food for thought","full":"","ipa":"/ˌfuːd fə ˈθɔːt/","pos":"phr.","meaning":"值得思考的内容。指某观点或资料引人深思。","example":"Your analysis gave us plenty of food for thought.","exampleZh":"您的分析给了我们很多值得思考的地方。"},{"id":"gen-248","bank":"general","word":"elephant in the room","full":"","ipa":"/ˌelɪfənt ɪn ðə ˈruːm/","pos":"phr.","meaning":"大家心照不宣的难题。明显存在却无人愿意提出的问题。","example":"The elephant in the room is the budget cut.","exampleZh":"大家都避而不谈的问题，就是预算削减。"},{"id":"gen-249","bank":"general","word":"think outside the box","full":"","ipa":"/ˌθɪŋk aʊtsaɪd ðə ˈbɒks/","pos":"phr.","meaning":"跳出框框思考。以新颖、不受常规限制的方式想办法。","example":"We need to think outside the box to reach younger clients.","exampleZh":"要接触年轻客户，我们需要跳出框框思考。"},{"id":"gen-250","bank":"general","word":"get the ball rolling","full":"","ipa":"/ˌɡet ðə ˈbɔːl ˌrəʊlɪŋ/","pos":"phr.","meaning":"开个头；让事情开始运作。","example":"I'll get the ball rolling by sharing last quarter's numbers.","exampleZh":"我先分享上季的数字，开个头。"},{"id":"gen-251","bank":"general","word":"up to speed","full":"","ipa":"/ˌʌp tə ˈspiːd/","pos":"phr.","meaning":"掌握最新情况。常用于 bring someone up to speed（让某人了解最新进展）。","example":"Could you bring the new analyst up to speed on this account?","exampleZh":"可否让新来的分析员了解这个客户的最新情况？"},{"id":"gen-252","bank":"general","word":"hit the ground running","full":"","ipa":"/ˌhɪt ðə ˌɡraʊnd ˈrʌnɪŋ/","pos":"phr.","meaning":"一上手就全力投入。形容新人或新项目开始时便迅速进入状态。","example":"She hit the ground running in her first week.","exampleZh":"她第一个星期就已全情投入。"},{"id":"gen-253","bank":"general","word":"learning curve","full":"","ipa":"/ˈlɜːnɪŋ kɜːv/","pos":"n.","meaning":"学习曲线。掌握新技能所需的过程；steep learning curve 指要在短时间内学很多东西。","example":"There's a steep learning curve with the new trading system.","exampleZh":"新交易系统要在短时间内学很多东西。"},{"id":"gen-254","bank":"general","word":"skill set","full":"","ipa":"/ˈskɪl set/","pos":"n.","meaning":"技能组合。一个人具备的各种技能。","example":"Her skill set includes both credit analysis and client service.","exampleZh":"她的技能涵盖信用分析和客户服务。"},{"id":"gen-255","bank":"general","word":"transferable skills","full":"","ipa":"/trænsˈfɜːrəbl ˈskɪlz/","pos":"n.","meaning":"可迁移技能。可应用于不同工作或行业的能力，如沟通、分析、时间管理。","example":"Teaching gave him strong transferable skills, such as explaining complex ideas.","exampleZh":"教学经验令他具备很强的可迁移技能，例如解释复杂概念。"},{"id":"gen-256","bank":"general","word":"upskill","full":"","ipa":"/ˈʌpskɪl/","pos":"v.","meaning":"提升技能。通过培训学习新的或更高层次的技能。","example":"The bank is upskilling its staff in digital tools.","exampleZh":"银行正提升员工使用数码工具的技能。"},{"id":"gen-257","bank":"general","word":"mentor","full":"","ipa":"/ˈmentɔː/","pos":"n./v.","meaning":"导师；指导。在工作上给予经验分享和建议的资深同事。","example":"My mentor helped me prepare for the licensing exam.","exampleZh":"我的导师帮我准备考牌试。"},{"id":"gen-258","bank":"general","word":"work-life balance","full":"","ipa":"/ˌwɜːk ˈlaɪf ˌbæləns/","pos":"n.","meaning":"工作与生活的平衡。在工作投入与个人、家庭生活之间取得合理分配。","example":"Flexible hours have improved my work-life balance.","exampleZh":"弹性工时改善了我的工作与生活平衡。"},{"id":"gen-259","bank":"general","word":"burnout","full":"","ipa":"/ˈbɜːnaʊt/","pos":"n.","meaning":"身心耗竭（职业倦怠）。长期压力过大导致的疲惫和工作动力下降。","example":"Taking regular breaks can help prevent burnout.","exampleZh":"定时休息有助预防身心耗竭。"},{"id":"gen-260","bank":"general","word":"flexible working","full":"","ipa":"/ˌfleksəbl ˈwɜːkɪŋ/","pos":"n.","meaning":"弹性工作安排。在工作时间或地点上有一定弹性的安排，例如在家工作。","example":"The firm offers flexible working two days a week.","exampleZh":"公司提供每周两天的弹性工作安排。"},{"id":"gen-261","bank":"general","word":"annual leave","full":"","ipa":"/ˌænjuəl ˈliːv/","pos":"n.","meaning":"年假。员工每年享有的带薪假期。","example":"I'll be on annual leave from 20 to 27 December.","exampleZh":"我 12 月 20 日至 27 日放年假。"},{"id":"gen-262","bank":"general","word":"sick leave","full":"","ipa":"/ˈsɪk liːv/","pos":"n.","meaning":"病假。员工因病不能上班而请的假。","example":"He is on sick leave today, so I'm covering his clients.","exampleZh":"他今天请了病假，所以由我照顾他的客户。"},{"id":"gen-263","bank":"general","word":"cover for","full":"","ipa":"/ˈkʌvə fə/","pos":"phr.","meaning":"代班；顶替。在同事不在时代为处理其工作。","example":"Could you cover for me during my leave?","exampleZh":"我放假期间可否请你代我处理工作？"},{"id":"gen-264","bank":"general","word":"handle","full":"","ipa":"/ˈhændl/","pos":"v.","meaning":"处理；应付。负责并妥善处理某事务或某人。","example":"I'll handle the client's complaint personally.","exampleZh":"我会亲自处理客户的投诉。"},{"id":"gen-265","bank":"general","word":"troubleshoot","full":"","ipa":"/ˈtrʌblʃuːt/","pos":"v.","meaning":"排查（故障）。找出并解决技术或流程上的问题。","example":"IT is troubleshooting the login issue.","exampleZh":"资讯科技部正在排查登入问题。"},{"id":"gen-266","bank":"general","word":"glitch","full":"","ipa":"/ɡlɪtʃ/","pos":"n.","meaning":"小故障。系统或设备突然出现的暂时性问题。","example":"A system glitch delayed the statements.","exampleZh":"系统小故障令结单延迟发出。"},{"id":"gen-267","bank":"general","word":"loophole","full":"","ipa":"/ˈluːphuːl/","pos":"n.","meaning":"漏洞。规则或制度中可被利用来规避原意的缺陷。","example":"The new policy closes a loophole in the approval process.","exampleZh":"新政策堵塞了审批流程中的一个漏洞。"},{"id":"gen-268","bank":"general","word":"red tape","full":"","ipa":"/ˌred ˈteɪp/","pos":"n.","meaning":"繁文缛节（官僚程序）。过多、不必要的规定和手续。","example":"There's a lot of red tape involved in opening an overseas account.","exampleZh":"开设海外账户涉及很多繁复手续。"},{"id":"gen-269","bank":"general","word":"paperwork","full":"","ipa":"/ˈpeɪpəwɜːk/","pos":"n.","meaning":"文书工作。须填写、签署和存档的表格与文件。","example":"Please complete the paperwork before the account can be activated.","exampleZh":"请先完成文件手续，账户才能启用。"},{"id":"gen-270","bank":"general","word":"signatory","full":"","ipa":"/ˈsɪɡnətəri/","pos":"n.","meaning":"签署人。有权签署某文件或代表公司签约的人。","example":"Both signatories must sign the instruction.","exampleZh":"该指示须由两名签署人共同签署。"},{"id":"gen-271","bank":"general","word":"letterhead","full":"","ipa":"/ˈletəhed/","pos":"n.","meaning":"信笺抬头。印有公司名称、标志和地址的正式信纸，或此类信纸的抬头部分。","example":"Please provide the confirmation on company letterhead.","exampleZh":"请以公司信笺提供该确认书。"},{"id":"gen-272","bank":"general","word":"memo","full":"","ipa":"/ˈmeməʊ/","pos":"n.","meaning":"内部备忘录。机构内部发出的简短书面通知。","example":"HR sent a memo about the new leave policy.","exampleZh":"人力资源部发出了关于新假期政策的备忘录。"},{"id":"gen-273","bank":"general","word":"circulate","full":"","ipa":"/ˈsɜːkjəleɪt/","pos":"v.","meaning":"传阅；分发。把文件发给一组人阅读。","example":"I'll circulate the draft for comments by Wednesday.","exampleZh":"我会把初稿传阅，请大家在星期三前给意见。"},{"id":"gen-274","bank":"general","word":"proofread","full":"","ipa":"/ˈpruːfriːd/","pos":"v.","meaning":"校对。检查文稿中的错字、标点和格式问题。","example":"Please proofread the client letter before it goes out.","exampleZh":"客户信件发出前请先校对。"},{"id":"gen-275","bank":"general","word":"template","full":"","ipa":"/ˈtempleɪt/","pos":"n.","meaning":"模板。可重复使用的文件格式。","example":"Use the standard template for all portfolio reviews.","exampleZh":"所有组合检讨都请使用标准模板。"},{"id":"gen-276","bank":"general","word":"spreadsheet","full":"","ipa":"/ˈspredʃiːt/","pos":"n.","meaning":"电子表格。以行和列整理数据并可作计算的文件，如 Excel。","example":"I've put the fee comparison in a spreadsheet.","exampleZh":"我已把收费比较整理成电子表格。"},{"id":"gen-277","bank":"general","word":"slide deck","full":"","ipa":"/ˈslaɪd dek/","pos":"n.","meaning":"一套简报（演示文稿）。用于会议或讲解的一组投影片。","example":"Please send me the slide deck before the meeting.","exampleZh":"请在会议前把简报发给我。"},{"id":"gen-278","bank":"general","word":"talking points","full":"","ipa":"/ˈtɔːkɪŋ pɔɪnts/","pos":"n.","meaning":"发言要点。事先准备、确保讲到的几个重点。","example":"Here are the talking points for tomorrow's client call.","exampleZh":"以下是明天与客户通话的发言要点。"},{"id":"gen-279","bank":"general","word":"elevator pitch","full":"","ipa":"/ˈelɪveɪtə pɪtʃ/","pos":"n.","meaning":"电梯游说（简短推介）。在约三十秒内清楚介绍自己或产品的说法。","example":"Every RM should have a clear elevator pitch for the new service.","exampleZh":"每位客户经理都应准备好新服务的简短推介。"},{"id":"gen-280","bank":"general","word":"rapport","full":"","ipa":"/ræˈpɔː/","pos":"n.","meaning":"融洽关系。彼此信任、沟通顺畅的关系。","example":"Building rapport with clients takes time.","exampleZh":"与客户建立融洽关系需要时间。"},{"id":"gen-281","bank":"general","word":"small talk","full":"","ipa":"/ˈsmɔːl tɔːk/","pos":"n.","meaning":"寒暄；闲聊。会议开始前就天气、近况等轻松话题的交谈。","example":"A little small talk helps put clients at ease.","exampleZh":"适当寒暄，有助客户放松。"},{"id":"gen-282","bank":"general","word":"networking","full":"","ipa":"/ˈnetwɜːkɪŋ/","pos":"n.","meaning":"建立人脉。在行业活动或社交场合结识和联系有用的人。","example":"The conference is a good networking opportunity.","exampleZh":"这个会议是建立人脉的好机会。"},{"id":"gen-283","bank":"general","word":"referral","full":"","ipa":"/rɪˈfɜːrəl/","pos":"n.","meaning":"转介（推荐）。把客户或人选介绍给他人或另一部门。","example":"Most of our new clients come from referrals.","exampleZh":"我们大部分新客户来自转介。"},{"id":"gen-284","bank":"general","word":"cold call","full":"","ipa":"/ˈkəʊld kɔːl/","pos":"n.","meaning":"陌生电话推销。在对方未有表示兴趣下主动致电推销；须遵守相关的私隐和推广规定。","example":"Cold calls are subject to strict rules on direct marketing.","exampleZh":"陌生电话推销须遵守有关直接促销的严格规定。"},{"id":"gen-285","bank":"general","word":"upsell","full":"","ipa":"/ˈʌpsel/","pos":"v.","meaning":"追加销售。向现有客户推介价格较高或附加的产品；仍须以客户利益和适合性为先。","example":"Staff should never upsell a product that doesn't suit the client.","exampleZh":"员工绝不应向客户追加销售不适合的产品。"},{"id":"gen-286","bank":"general","word":"client retention","full":"","ipa":"/ˈklaɪənt rɪˌtenʃn/","pos":"n.","meaning":"客户维系（留存）。保持现有客户继续使用服务的能力。","example":"Good service is the key to client retention.","exampleZh":"良好服务是维系客户的关键。"},{"id":"gen-287","bank":"general","word":"turnover","full":"","ipa":"/ˈtɜːnəʊvə/","pos":"n.","meaning":"营业额；人员流失率。视语境指一段时间内的销售总额，或员工离职更替的比率。","example":"Staff turnover has fallen since the new training programme.","exampleZh":"推出新培训计划后，员工流失率下降了。"},{"id":"gen-288","bank":"general","word":"win-win","full":"","ipa":"/ˌwɪn ˈwɪn/","pos":"adj.","meaning":"双赢的。对双方都有利的。","example":"We are looking for a win-win arrangement with the partner bank.","exampleZh":"我们希望与合作银行达成双赢安排。"},{"id":"gen-289","bank":"general","word":"deal-breaker","full":"","ipa":"/ˈdiːl breɪkə/","pos":"n.","meaning":"决定性障碍。会导致交易或合作告吹的关键问题。","example":"The long lock-up period was a deal-breaker for the client.","exampleZh":"漫长的禁售期令客户决定放弃。"},{"id":"gen-290","bank":"general","word":"non-negotiable","full":"","ipa":"/ˌnɒn nɪˈɡəʊʃiəbl/","pos":"adj.","meaning":"不可商议的。没有让步余地的条件。","example":"Compliance checks are non-negotiable.","exampleZh":"合规检查没有商量余地。"},{"id":"gen-291","bank":"general","word":"candid","full":"","ipa":"/ˈkændɪd/","pos":"adj.","meaning":"坦率的。直言不讳、诚实地表达看法。","example":"Thank you for your candid feedback on the proposal.","exampleZh":"谢谢您对建议书坦率的意见。"},{"id":"gen-292","bank":"general","word":"diplomatic","full":"","ipa":"/ˌdɪpləˈmætɪk/","pos":"adj.","meaning":"圆融得体的。处理敏感问题时顾及各方感受、措辞得当。","example":"She gave a diplomatic answer to the difficult question.","exampleZh":"她对那个棘手的问题作了得体的回答。"},{"id":"gen-293","bank":"general","word":"courteous","full":"","ipa":"/ˈkɜːtiəs/","pos":"adj.","meaning":"有礼貌的；客气周到的。","example":"Always be courteous, even when the client is upset.","exampleZh":"即使客户不满，也要保持礼貌。"},{"id":"gen-294","bank":"general","word":"punctual","full":"","ipa":"/ˈpʌŋktʃuəl/","pos":"adj.","meaning":"守时的。按约定时间到达或完成。","example":"Please be punctual; the meeting starts at nine sharp.","exampleZh":"请准时出席，会议九时正开始。"},{"id":"gen-295","bank":"general","word":"delegate","full":"","ipa":"/ˈdelɪɡeɪt/","pos":"v.","meaning":"委派；授权。把工作或权力交给下属或同事处理。作名词 /ˈdelɪɡət/ 时指“代表”。","example":"A good manager knows which tasks to delegate.","exampleZh":"好的管理者知道哪些工作应当委派他人。"},{"id":"gen-296","bank":"general","word":"brief","full":"","ipa":"/briːf/","pos":"v.","meaning":"向……简要介绍情况。在会议或行动前提供必要的背景资料。","example":"I'll brief you on the client's background before the meeting.","exampleZh":"会前我会向您简介客户的背景。"},{"id":"gen-297","bank":"general","word":"sync","full":"","ipa":"/sɪŋk/","pos":"n.","meaning":"简短碰头会；同步沟通。口语中 a quick sync 指简短对齐进度的会议。","example":"Can we have a quick sync at 2 p.m.?","exampleZh":"下午两点可以简短碰个头吗？"},{"id":"gen-298","bank":"general","word":"hybrid meeting","full":"","ipa":"/ˌhaɪbrɪd ˈmiːtɪŋ/","pos":"n.","meaning":"混合式会议。部分与会者在现场、部分在线上参与的会议。","example":"Please use the room microphone during hybrid meetings.","exampleZh":"开混合式会议时，请使用会议室的麦克风。"},{"id":"gen-299","bank":"general","word":"rest assured","full":"","ipa":"/ˌrest əˈʃʊəd/","pos":"phr.","meaning":"请放心。用于向对方保证某事会妥善处理。","example":"Rest assured that your personal data is kept confidential.","exampleZh":"请放心，您的个人资料会被保密。"},{"id":"gen-300","bank":"general","word":"bear with me","full":"","ipa":"/ˌbeə ˈwɪð mi/","pos":"phr.","meaning":"请稍候（请耐心等我一下）。在查资料或处理问题时请对方稍等。","example":"Please bear with me while I check your account.","exampleZh":"请稍候，我查一下您的账户。"}],"ielts":[{"id":"ielts-0001","bank":"ielts","word":"analyse","full":"","ipa":"/ˈænəlaɪz/","pos":"v.","meaning":"分析。把事物拆分成各部分，仔细研究其构成、原因或关系。英式拼法为 analyse，美式为 analyze。","example":"The report analyses how commuting patterns changed after the new railway opened.","exampleZh":"报告分析了新铁路通车后通勤模式的变化。"},{"id":"ielts-0002","bank":"ielts","word":"approach","full":"","ipa":"/əˈprəʊtʃ/","pos":"n.","meaning":"方法；处理方式。也可作动词，表示“接近”或“着手处理”。","example":"A more flexible approach to teaching may suit students with different abilities.","exampleZh":"较灵活的教学方法，或许更适合能力不同的学生。"},{"id":"ielts-0003","bank":"ielts","word":"assume","full":"","ipa":"/əˈsjuːm/","pos":"v.","meaning":"假定；认为（未经证实）。也可指“承担（责任）”。","example":"Many people assume that technology always makes life easier.","exampleZh":"很多人想当然地认为科技总能让生活更方便。"},{"id":"ielts-0004","bank":"ielts","word":"authority","full":"","ipa":"/ɔːˈθɒrəti/","pos":"n.","meaning":"当局；权力；权威。复数 the authorities 指政府有关部门。","example":"Local authorities are responsible for collecting household waste.","exampleZh":"地方当局负责收集家居废物。"},{"id":"ielts-0005","bank":"ielts","word":"available","full":"","ipa":"/əˈveɪləbl/","pos":"adj.","meaning":"可获得的；可用的；有空的。","example":"Free health check-ups are available to residents over sixty.","exampleZh":"六十岁以上的居民可享免费健康检查。"},{"id":"ielts-0006","bank":"ielts","word":"concept","full":"","ipa":"/ˈkɒnsept/","pos":"n.","meaning":"概念；观念。指对某事物的抽象理解。","example":"The concept of working from home was unfamiliar to many firms before 2020.","exampleZh":"在 2020 年之前，在家工作的概念对许多公司来说还很陌生。"},{"id":"ielts-0007","bank":"ielts","word":"consist of","full":"","ipa":"/kənˈsɪst əv/","pos":"phr.","meaning":"由……组成。不用于进行式；近义表达为 be made up of。","example":"The committee consists of teachers, parents and two students.","exampleZh":"委员会由教师、家长和两名学生组成。"},{"id":"ielts-0008","bank":"ielts","word":"constitute","full":"","ipa":"/ˈkɒnstɪtjuːt/","pos":"v.","meaning":"构成；组成；被视为。较正式。","example":"Women constitute almost half of the workforce in the sector.","exampleZh":"女性约占该行业劳动人口的一半。"},{"id":"ielts-0009","bank":"ielts","word":"context","full":"","ipa":"/ˈkɒntekst/","pos":"n.","meaning":"背景；语境。指理解某事件或词语所需的周边情况。","example":"The figures should be read in the context of the economic downturn.","exampleZh":"这些数字应放在经济下行的背景下解读。"},{"id":"ielts-0010","bank":"ielts","word":"derive","full":"","ipa":"/dɪˈraɪv/","pos":"v.","meaning":"获得；源自。常用 derive from（从……得到／源于）。","example":"Many medicines are derived from plants.","exampleZh":"许多药物都来自植物。"},{"id":"ielts-0011","bank":"ielts","word":"distribute","full":"","ipa":"/dɪˈstrɪbjuːt/","pos":"v.","meaning":"分发；分配；分布。","example":"Food parcels were distributed to families affected by the flood.","exampleZh":"食物包分发给了受水灾影响的家庭。"},{"id":"ielts-0012","bank":"ielts","word":"economy","full":"","ipa":"/ɪˈkɒnəmi/","pos":"n.","meaning":"经济；经济体。也可指“节约”。","example":"Tourism plays a major role in the local economy.","exampleZh":"旅游业在当地经济中担当重要角色。"},{"id":"ielts-0013","bank":"ielts","word":"establish","full":"","ipa":"/ɪˈstæblɪʃ/","pos":"v.","meaning":"建立；设立；确立（事实）。","example":"The university was established in 1911.","exampleZh":"这所大学创立于 1911 年。"},{"id":"ielts-0014","bank":"ielts","word":"estimate","full":"","ipa":"/ˈestɪmeɪt/","pos":"v.","meaning":"估计；估算。作名词时读作 /ˈestɪmət/。","example":"It is estimated that a third of food produced is wasted.","exampleZh":"据估计，生产的食物有三分之一被浪费。"},{"id":"ielts-0015","bank":"ielts","word":"evident","full":"","ipa":"/ˈevɪdənt/","pos":"adj.","meaning":"明显的；显而易见的。","example":"It is evident that the policy has reduced traffic in the city centre.","exampleZh":"显然，这项政策减少了市中心的交通流量。"},{"id":"ielts-0016","bank":"ielts","word":"factor","full":"","ipa":"/ˈfæktə/","pos":"n.","meaning":"因素；要素。","example":"Cost is a key factor when families choose a school.","exampleZh":"费用是家庭选择学校时的重要因素。"},{"id":"ielts-0017","bank":"ielts","word":"formula","full":"","ipa":"/ˈfɔːmjələ/","pos":"n.","meaning":"公式；方案；配方。复数可作 formulae 或 formulas。","example":"There is no simple formula for a happy workplace.","exampleZh":"营造愉快的工作环境，并无简单的公式可循。"},{"id":"ielts-0018","bank":"ielts","word":"function","full":"","ipa":"/ˈfʌŋkʃn/","pos":"n.","meaning":"功能；作用；函数。","example":"One function of museums is to educate the public.","exampleZh":"博物馆的功能之一是教育公众。"},{"id":"ielts-0019","bank":"ielts","word":"identify","full":"","ipa":"/aɪˈdentɪfaɪ/","pos":"v.","meaning":"识别；确定；认出。","example":"The study identified three main causes of stress among students.","exampleZh":"研究找出了学生压力的三个主要来源。"},{"id":"ielts-0020","bank":"ielts","word":"indicate","full":"","ipa":"/ˈɪndɪkeɪt/","pos":"v.","meaning":"表明；显示；指出。图表题常用。","example":"The graph indicates a steady rise in car ownership.","exampleZh":"图表显示汽车拥有量稳步上升。"},{"id":"ielts-0021","bank":"ielts","word":"individual","full":"","ipa":"/ˌɪndɪˈvɪdʒuəl/","pos":"n./adj.","meaning":"个人；个体的；单独的。","example":"Each individual has a responsibility to reduce waste.","exampleZh":"每个人都有责任减少浪费。"},{"id":"ielts-0022","bank":"ielts","word":"interpret","full":"","ipa":"/ɪnˈtɜːprɪt/","pos":"v.","meaning":"解释；理解；口译。","example":"The data can be interpreted in different ways.","exampleZh":"这些数据可以有不同的解读。"},{"id":"ielts-0023","bank":"ielts","word":"involve","full":"","ipa":"/ɪnˈvɒlv/","pos":"v.","meaning":"涉及；包含；使参与。","example":"The job involves travelling abroad twice a month.","exampleZh":"这份工作每月须出国两次。"},{"id":"ielts-0024","bank":"ielts","word":"legislation","full":"","ipa":"/ˌledʒɪsˈleɪʃn/","pos":"n.","meaning":"法例；立法。不可数名词，指一套法律或立法过程。","example":"New legislation requires all new buildings to be energy-efficient.","exampleZh":"新法例规定所有新建筑须节能。"},{"id":"ielts-0025","bank":"ielts","word":"method","full":"","ipa":"/ˈmeθəd/","pos":"n.","meaning":"方法；办法。尤指有系统的做法。","example":"Online learning is now a common method of training staff.","exampleZh":"网上学习已成为培训员工的常见方法。"},{"id":"ielts-0026","bank":"ielts","word":"occur","full":"","ipa":"/əˈkɜː/","pos":"v.","meaning":"发生；出现。较 happen 正式；occur to sb 指“某人想到”。","example":"Most accidents occur within a few kilometres of home.","exampleZh":"大多数意外发生在离家几公里之内。"},{"id":"ielts-0027","bank":"ielts","word":"principle","full":"","ipa":"/ˈprɪnsəpl/","pos":"n.","meaning":"原则；原理。注意不要与 principal（主要的；校长）混淆。","example":"The scheme is based on the principle that polluters should pay.","exampleZh":"这项计划基于“污染者自付”的原则。"},{"id":"ielts-0028","bank":"ielts","word":"proceed","full":"","ipa":"/prəˈsiːd/","pos":"v.","meaning":"继续进行；开展。proceed with 指着手进行某事。","example":"The council decided to proceed with the new park.","exampleZh":"议会决定继续推进新公园的建设。"},{"id":"ielts-0029","bank":"ielts","word":"process","full":"","ipa":"/ˈprəʊses/","pos":"n.","meaning":"过程；程序；工序。也可作动词“处理”。","example":"Learning a language is a gradual process.","exampleZh":"学习语言是循序渐进的过程。"},{"id":"ielts-0030","bank":"ielts","word":"require","full":"","ipa":"/rɪˈkwaɪə/","pos":"v.","meaning":"需要；要求。较 need 正式。","example":"All visitors are required to show identification.","exampleZh":"所有访客须出示身份证明。"},{"id":"ielts-0031","bank":"ielts","word":"respond","full":"","ipa":"/rɪˈspɒnd/","pos":"v.","meaning":"回应；作出反应。respond to 回应某事。","example":"The government responded quickly to the outbreak.","exampleZh":"政府迅速应对疫情爆发。"},{"id":"ielts-0032","bank":"ielts","word":"role","full":"","ipa":"/rəʊl/","pos":"n.","meaning":"角色；作用。常见 play a role in（在……中起作用）。","example":"Parents play a vital role in children's education.","exampleZh":"父母在孩子的教育中起着至关重要的作用。"},{"id":"ielts-0033","bank":"ielts","word":"sector","full":"","ipa":"/ˈsektə/","pos":"n.","meaning":"部门；行业；领域。如 public sector（公营部门）。","example":"Jobs in the service sector have grown rapidly.","exampleZh":"服务业的职位增长迅速。"},{"id":"ielts-0034","bank":"ielts","word":"significant","full":"","ipa":"/sɪɡˈnɪfɪkənt/","pos":"adj.","meaning":"显著的；重要的。学术写作中常指“有统计意义的”。","example":"There was a significant drop in crime after street lights were installed.","exampleZh":"安装街灯后，罪案显著减少。"},{"id":"ielts-0035","bank":"ielts","word":"source","full":"","ipa":"/sɔːs/","pos":"n.","meaning":"来源；出处。","example":"Wind is a clean source of energy.","exampleZh":"风是一种洁净的能源来源。"},{"id":"ielts-0036","bank":"ielts","word":"structure","full":"","ipa":"/ˈstrʌktʃə/","pos":"n.","meaning":"结构；构造；建筑物。","example":"The essay should have a clear structure.","exampleZh":"文章应有清晰的结构。"},{"id":"ielts-0037","bank":"ielts","word":"theory","full":"","ipa":"/ˈθɪəri/","pos":"n.","meaning":"理论；学说。in theory 指“理论上”。","example":"In theory, everyone has equal access to education.","exampleZh":"理论上，人人都有平等的受教育机会。"},{"id":"ielts-0038","bank":"ielts","word":"vary","full":"","ipa":"/ˈveəri/","pos":"v.","meaning":"变化；不同。vary from…to… 指“由……至……不等”。","example":"House prices vary greatly from one district to another.","exampleZh":"楼价因区而异，差别很大。"},{"id":"ielts-0039","bank":"ielts","word":"achieve","full":"","ipa":"/əˈtʃiːv/","pos":"v.","meaning":"实现；达到；取得（成就）。","example":"Students achieve better results when they get enough sleep.","exampleZh":"学生睡眠充足时，成绩会更好。"},{"id":"ielts-0040","bank":"ielts","word":"acquire","full":"","ipa":"/əˈkwaɪə/","pos":"v.","meaning":"获得；习得；收购。acquire a skill 指学会一项技能。","example":"Children acquire language naturally through interaction.","exampleZh":"儿童通过互动自然地习得语言。"},{"id":"ielts-0041","bank":"ielts","word":"administration","full":"","ipa":"/ədˌmɪnɪˈstreɪʃn/","pos":"n.","meaning":"管理；行政；（美国的）政府。","example":"Too much money is spent on administration rather than teaching.","exampleZh":"太多资金花在行政上，而不是教学上。"},{"id":"ielts-0042","bank":"ielts","word":"affect","full":"","ipa":"/əˈfekt/","pos":"v.","meaning":"影响。注意名词“效果”是 effect；affect 通常是动词。","example":"Air pollution affects the health of millions of people.","exampleZh":"空气污染影响数以百万计人的健康。"},{"id":"ielts-0043","bank":"ielts","word":"appropriate","full":"","ipa":"/əˈprəʊpriət/","pos":"adj.","meaning":"适当的；合适的。反义词 inappropriate。","example":"Schools should provide appropriate support for disabled students.","exampleZh":"学校应为残疾学生提供适当支援。"},{"id":"ielts-0044","bank":"ielts","word":"aspect","full":"","ipa":"/ˈæspekt/","pos":"n.","meaning":"方面；层面。","example":"Technology has changed every aspect of our lives.","exampleZh":"科技改变了我们生活的方方面面。"},{"id":"ielts-0045","bank":"ielts","word":"assist","full":"","ipa":"/əˈsɪst/","pos":"v.","meaning":"协助；帮助。较 help 正式。","example":"Volunteers assist elderly residents with their shopping.","exampleZh":"义工协助长者购物。"},{"id":"ielts-0046","bank":"ielts","word":"category","full":"","ipa":"/ˈkætəɡəri/","pos":"n.","meaning":"类别；范畴。","example":"The survey divides respondents into four age categories.","exampleZh":"调查把受访者分为四个年龄组别。"},{"id":"ielts-0047","bank":"ielts","word":"commission","full":"","ipa":"/kəˈmɪʃn/","pos":"n./v.","meaning":"委员会；佣金；委托（制作）。","example":"The government commissioned a study on youth unemployment.","exampleZh":"政府委托进行一项关于青年失业的研究。"},{"id":"ielts-0048","bank":"ielts","word":"community","full":"","ipa":"/kəˈmjuːnəti/","pos":"n.","meaning":"社区；群体；共同体。","example":"Libraries are important meeting places for the local community.","exampleZh":"图书馆是当地社区重要的聚会场所。"},{"id":"ielts-0049","bank":"ielts","word":"complex","full":"","ipa":"/ˈkɒmpleks/","pos":"adj.","meaning":"复杂的。作名词时指“建筑群”或“情结”。","example":"Climate change is a complex problem with no single solution.","exampleZh":"气候变化是一个复杂的问题，没有单一的解决办法。"},{"id":"ielts-0050","bank":"ielts","word":"conclude","full":"","ipa":"/kənˈkluːd/","pos":"v.","meaning":"得出结论；结束。","example":"The researchers concluded that exercise improves memory.","exampleZh":"研究人员得出结论：运动能改善记忆力。"},{"id":"ielts-0051","bank":"ielts","word":"conduct","full":"","ipa":"/kənˈdʌkt/","pos":"v.","meaning":"进行；实施（研究、调查）。作名词 /ˈkɒndʌkt/ 时指“行为”。","example":"The survey was conducted among 2,000 adults.","exampleZh":"这项调查在两千名成年人中进行。"},{"id":"ielts-0052","bank":"ielts","word":"consequence","full":"","ipa":"/ˈkɒnsɪkwəns/","pos":"n.","meaning":"后果；结果。as a consequence 意为“因此”。","example":"Deforestation has serious consequences for wildlife.","exampleZh":"砍伐森林给野生动物带来严重后果。"},{"id":"ielts-0053","bank":"ielts","word":"construct","full":"","ipa":"/kənˈstrʌkt/","pos":"v.","meaning":"建造；构建。也可指构思（论点、理论）。","example":"A new bridge will be constructed across the river.","exampleZh":"河上将兴建一座新桥。"},{"id":"ielts-0054","bank":"ielts","word":"consume","full":"","ipa":"/kənˈsjuːm/","pos":"v.","meaning":"消耗；消费；吃喝。","example":"Developed countries consume far more energy per person.","exampleZh":"发达国家的人均能源消耗高得多。"},{"id":"ielts-0055","bank":"ielts","word":"culture","full":"","ipa":"/ˈkʌltʃə/","pos":"n.","meaning":"文化；文明；（组织的）风气。","example":"Learning a language helps you understand another culture.","exampleZh":"学习一种语言，有助于理解另一种文化。"},{"id":"ielts-0056","bank":"ielts","word":"distinct","full":"","ipa":"/dɪˈstɪŋkt/","pos":"adj.","meaning":"明显不同的；清楚的。distinct from 与……截然不同。","example":"The two regions have distinct dialects.","exampleZh":"这两个地区的方言截然不同。"},{"id":"ielts-0057","bank":"ielts","word":"element","full":"","ipa":"/ˈelɪmənt/","pos":"n.","meaning":"要素；成分；元素。","example":"Trust is an essential element of any partnership.","exampleZh":"信任是任何合作关系的基本要素。"},{"id":"ielts-0058","bank":"ielts","word":"equate","full":"","ipa":"/iˈkweɪt/","pos":"v.","meaning":"把……等同起来。常用 equate A with B。","example":"Many people equate success with a high income.","exampleZh":"很多人把成功与高收入等同起来。"},{"id":"ielts-0059","bank":"ielts","word":"evaluate","full":"","ipa":"/ɪˈvæljueɪt/","pos":"v.","meaning":"评估；评价。指判断其价值、质量或成效。","example":"It is too early to evaluate the effects of the new law.","exampleZh":"现在评估新法律的成效还为时过早。"},{"id":"ielts-0060","bank":"ielts","word":"feature","full":"","ipa":"/ˈfiːtʃə/","pos":"n.","meaning":"特点；特征；专题报道。","example":"A key feature of the city is its efficient metro system.","exampleZh":"这座城市的一大特色是高效的地铁系统。"},{"id":"ielts-0061","bank":"ielts","word":"focus","full":"","ipa":"/ˈfəʊkəs/","pos":"v./n.","meaning":"集中（注意力）；焦点。focus on 侧重于。","example":"The course focuses on practical skills.","exampleZh":"这门课程侧重实用技能。"},{"id":"ielts-0062","bank":"ielts","word":"impact","full":"","ipa":"/ˈɪmpækt/","pos":"n.","meaning":"影响；冲击。have an impact on 对……有影响。","example":"Social media has had a huge impact on how news spreads.","exampleZh":"社交媒体对新闻的传播方式影响巨大。"},{"id":"ielts-0063","bank":"ielts","word":"injury","full":"","ipa":"/ˈɪndʒəri/","pos":"n.","meaning":"伤害；损伤。","example":"Wearing a helmet reduces the risk of head injury.","exampleZh":"戴头盔可降低头部受伤的风险。"},{"id":"ielts-0064","bank":"ielts","word":"institute","full":"","ipa":"/ˈɪnstɪtjuːt/","pos":"n.","meaning":"学院；研究所；协会。作动词时指“设立、实施”。","example":"She works at a research institute for marine biology.","exampleZh":"她在一所海洋生物研究所工作。"},{"id":"ielts-0065","bank":"ielts","word":"invest","full":"","ipa":"/ɪnˈvest/","pos":"v.","meaning":"投资；投入（时间、精力）。","example":"Governments should invest more in public transport.","exampleZh":"政府应在公共交通上投入更多资金。"},{"id":"ielts-0066","bank":"ielts","word":"journal","full":"","ipa":"/ˈdʒɜːnl/","pos":"n.","meaning":"期刊；学报；日志。","example":"The findings were published in a medical journal.","exampleZh":"研究结果发表在一份医学期刊上。"},{"id":"ielts-0067","bank":"ielts","word":"maintain","full":"","ipa":"/meɪnˈteɪn/","pos":"v.","meaning":"维持；保养；坚持认为。","example":"It is expensive to maintain old buildings.","exampleZh":"维修保养旧建筑费用高昂。"},{"id":"ielts-0068","bank":"ielts","word":"obtain","full":"","ipa":"/əbˈteɪn/","pos":"v.","meaning":"获得；取得。较 get 正式。","example":"Students must obtain permission before leaving campus.","exampleZh":"学生离开校园前须取得批准。"},{"id":"ielts-0069","bank":"ielts","word":"participate","full":"","ipa":"/pɑːˈtɪsɪpeɪt/","pos":"v.","meaning":"参与；参加。participate in 参加某活动。","example":"More than 500 people participated in the study.","exampleZh":"超过五百人参与了这项研究。"},{"id":"ielts-0070","bank":"ielts","word":"perceive","full":"","ipa":"/pəˈsiːv/","pos":"v.","meaning":"察觉；认为；看待。perceive A as B 把 A 视为 B。","example":"Teaching is often perceived as a stressful profession.","exampleZh":"教师往往被视为压力很大的职业。"},{"id":"ielts-0071","bank":"ielts","word":"potential","full":"","ipa":"/pəˈtenʃl/","pos":"n./adj.","meaning":"潜力；潜在的。","example":"Solar power has enormous potential in sunny regions.","exampleZh":"太阳能在日照充足的地区潜力巨大。"},{"id":"ielts-0072","bank":"ielts","word":"previous","full":"","ipa":"/ˈpriːviəs/","pos":"adj.","meaning":"先前的；以前的。","example":"Sales were higher than in the previous year.","exampleZh":"销售额高于上一年。"},{"id":"ielts-0073","bank":"ielts","word":"primary","full":"","ipa":"/ˈpraɪməri/","pos":"adj.","meaning":"主要的；首要的；初级的。primary school 指小学。","example":"The primary aim of the scheme is to reduce poverty.","exampleZh":"这项计划的首要目标是减少贫困。"},{"id":"ielts-0074","bank":"ielts","word":"purchase","full":"","ipa":"/ˈpɜːtʃəs/","pos":"v./n.","meaning":"购买；购买的物品。较 buy 正式。","example":"More and more purchases are made online.","exampleZh":"越来越多的购物在网上进行。"},{"id":"ielts-0075","bank":"ielts","word":"range","full":"","ipa":"/reɪndʒ/","pos":"n.","meaning":"范围；一系列。a wide range of 指“各种各样的”。","example":"The centre offers a wide range of evening courses.","exampleZh":"该中心提供各式各样的夜间课程。"},{"id":"ielts-0076","bank":"ielts","word":"region","full":"","ipa":"/ˈriːdʒən/","pos":"n.","meaning":"地区；区域。","example":"Rainfall is lowest in the northern region.","exampleZh":"北部地区的降雨量最低。"},{"id":"ielts-0077","bank":"ielts","word":"regulate","full":"","ipa":"/ˈreɡjuleɪt/","pos":"v.","meaning":"规管；调节；控制。","example":"Governments should regulate the use of personal data.","exampleZh":"政府应规管个人资料的使用。"},{"id":"ielts-0078","bank":"ielts","word":"relevant","full":"","ipa":"/ˈreləvənt/","pos":"adj.","meaning":"相关的；切题的。relevant to 与……有关。","example":"Make sure your examples are relevant to the question.","exampleZh":"确保你举的例子与题目相关。"},{"id":"ielts-0079","bank":"ielts","word":"reside","full":"","ipa":"/rɪˈzaɪd/","pos":"v.","meaning":"居住；（权力等）归属于。较正式。","example":"Most of the population resides in coastal cities.","exampleZh":"大部分人口居住在沿海城市。"},{"id":"ielts-0080","bank":"ielts","word":"resource","full":"","ipa":"/rɪˈsɔːs/","pos":"n.","meaning":"资源；资料。natural resources 指天然资源。","example":"Water is becoming a scarce resource in many countries.","exampleZh":"在许多国家，水正成为稀缺资源。"},{"id":"ielts-0081","bank":"ielts","word":"restrict","full":"","ipa":"/rɪˈstrɪkt/","pos":"v.","meaning":"限制；约束。","example":"The city restricts car access to the old town.","exampleZh":"该市限制汽车驶入旧城区。"},{"id":"ielts-0082","bank":"ielts","word":"secure","full":"","ipa":"/sɪˈkjʊə/","pos":"adj./v.","meaning":"安全的；稳妥的；获得（不易得到的东西）。","example":"She secured a place at a top university.","exampleZh":"她获得了一所顶尖大学的取录。"},{"id":"ielts-0083","bank":"ielts","word":"seek","full":"","ipa":"/siːk/","pos":"v.","meaning":"寻求；寻找；试图。过去式为 sought。","example":"Many young people seek work in big cities.","exampleZh":"许多年轻人到大城市找工作。"},{"id":"ielts-0084","bank":"ielts","word":"select","full":"","ipa":"/sɪˈlekt/","pos":"v.","meaning":"挑选；选择。较 choose 正式，强调仔细挑选。","example":"Participants were selected at random.","exampleZh":"参与者是随机挑选的。"},{"id":"ielts-0085","bank":"ielts","word":"site","full":"","ipa":"/saɪt/","pos":"n.","meaning":"地点；场所；网站。注意与 sight（视力；景象）区分。","example":"The site of the old factory will become a park.","exampleZh":"旧工厂的原址将改建为公园。"},{"id":"ielts-0086","bank":"ielts","word":"strategy","full":"","ipa":"/ˈstrætədʒi/","pos":"n.","meaning":"策略；战略。","example":"The school has a clear strategy to reduce bullying.","exampleZh":"学校有清晰的策略减少欺凌。"},{"id":"ielts-0087","bank":"ielts","word":"survey","full":"","ipa":"/ˈsɜːveɪ/","pos":"n.","meaning":"调查；民意测验。作动词 /səˈveɪ/ 时指“调查、勘测”。","example":"A recent survey found that most adults sleep less than seven hours.","exampleZh":"最近一项调查发现，大多数成年人睡眠少于七小时。"},{"id":"ielts-0088","bank":"ielts","word":"tradition","full":"","ipa":"/trəˈdɪʃn/","pos":"n.","meaning":"传统；惯例。","example":"The festival is an old tradition in this village.","exampleZh":"这个节日是该村的古老传统。"},{"id":"ielts-0089","bank":"ielts","word":"transfer","full":"","ipa":"/trænsˈfɜː/","pos":"v.","meaning":"转移；调动；转学。作名词时重音在前 /ˈtrænsfɜː/。","example":"Knowledge can be transferred from one generation to the next.","exampleZh":"知识可以一代一代地传承下去。"},{"id":"ielts-0090","bank":"ielts","word":"alternative","full":"","ipa":"/ɔːlˈtɜːnətɪv/","pos":"n./adj.","meaning":"替代方案；可供选择的。","example":"Cycling is a healthy alternative to driving.","exampleZh":"骑自行车是取代驾车的健康选择。"},{"id":"ielts-0091","bank":"ielts","word":"circumstance","full":"","ipa":"/ˈsɜːkəmstəns/","pos":"n.","meaning":"情况；环境（多用复数）。under no circumstances 意为“在任何情况下都不”。","example":"In some circumstances, students may take the exam later.","exampleZh":"在某些情况下，学生可延后应考。"},{"id":"ielts-0092","bank":"ielts","word":"compensate","full":"","ipa":"/ˈkɒmpenseɪt/","pos":"v.","meaning":"补偿；弥补。compensate for 弥补某种不足。","example":"Nothing can compensate for the loss of a natural habitat.","exampleZh":"天然栖息地的丧失是无法弥补的。"},{"id":"ielts-0093","bank":"ielts","word":"component","full":"","ipa":"/kəmˈpəʊnənt/","pos":"n.","meaning":"组成部分；部件。","example":"Exercise is an important component of a healthy lifestyle.","exampleZh":"运动是健康生活方式的重要组成部分。"},{"id":"ielts-0094","bank":"ielts","word":"consent","full":"","ipa":"/kənˈsent/","pos":"n./v.","meaning":"同意；许可。","example":"Patients must give their consent before surgery.","exampleZh":"病人须在手术前表示同意。"},{"id":"ielts-0095","bank":"ielts","word":"considerable","full":"","ipa":"/kənˈsɪdərəbl/","pos":"adj.","meaning":"相当大的；可观的。","example":"The project required a considerable amount of money.","exampleZh":"这个项目需要相当大笔的资金。"},{"id":"ielts-0096","bank":"ielts","word":"constant","full":"","ipa":"/ˈkɒnstənt/","pos":"adj.","meaning":"持续不断的；恒定的。","example":"Big cities suffer from constant noise.","exampleZh":"大城市饱受持续不断的噪音困扰。"},{"id":"ielts-0097","bank":"ielts","word":"contribute","full":"","ipa":"/kənˈtrɪbjuːt/","pos":"v.","meaning":"促成；贡献；捐助。contribute to 导致或有助于。","example":"Fast food contributes to rising obesity rates.","exampleZh":"快餐是肥胖率上升的原因之一。"},{"id":"ielts-0098","bank":"ielts","word":"convene","full":"","ipa":"/kənˈviːn/","pos":"v.","meaning":"召集（会议）；聚集。较正式。","example":"The council convened an emergency meeting after the storm.","exampleZh":"风暴过后，议会召开了紧急会议。"},{"id":"ielts-0099","bank":"ielts","word":"core","full":"","ipa":"/kɔː/","pos":"n./adj.","meaning":"核心；核心的。core subjects 指主科。","example":"Maths and English are core subjects in most schools.","exampleZh":"数学和英文在大多数学校都是主科。"},{"id":"ielts-0100","bank":"ielts","word":"corporate","full":"","ipa":"/ˈkɔːpərət/","pos":"adj.","meaning":"公司的；企业的。","example":"Corporate sponsorship helps fund many sports events.","exampleZh":"企业赞助为许多体育活动提供资金。"},{"id":"ielts-0101","bank":"ielts","word":"correspond","full":"","ipa":"/ˌkɒrəˈspɒnd/","pos":"v.","meaning":"相符；相当于；通信。correspond to/with 与……一致。","example":"The rise in temperature corresponds with an increase in sales of fans.","exampleZh":"气温上升，风扇销量也随之增加。"},{"id":"ielts-0102","bank":"ielts","word":"criteria","full":"","ipa":"/kraɪˈtɪəriə/","pos":"n.","meaning":"标准（复数）。单数为 criterion。","example":"Applicants are assessed against five criteria.","exampleZh":"申请人按五项标准接受评估。"},{"id":"ielts-0103","bank":"ielts","word":"deduce","full":"","ipa":"/dɪˈdjuːs/","pos":"v.","meaning":"推断；演绎。","example":"From the evidence, we can deduce that the city was abandoned suddenly.","exampleZh":"根据证据，我们可推断这座城市是突然被遗弃的。"},{"id":"ielts-0104","bank":"ielts","word":"demonstrate","full":"","ipa":"/ˈdemənstreɪt/","pos":"v.","meaning":"证明；展示；示威。","example":"The study demonstrates a clear link between diet and health.","exampleZh":"研究证明饮食与健康之间有明确关系。"},{"id":"ielts-0105","bank":"ielts","word":"document","full":"","ipa":"/ˈdɒkjumənt/","pos":"n./v.","meaning":"文件；记录（证明）。","example":"The changes are documented in a government report.","exampleZh":"这些变化记录在一份政府报告中。"},{"id":"ielts-0106","bank":"ielts","word":"dominate","full":"","ipa":"/ˈdɒmɪneɪt/","pos":"v.","meaning":"主导；支配；占主要地位。","example":"A few large companies dominate the market.","exampleZh":"少数几家大公司主导着市场。"},{"id":"ielts-0107","bank":"ielts","word":"emphasis","full":"","ipa":"/ˈemfəsɪs/","pos":"n.","meaning":"强调；重点。place emphasis on 着重于。","example":"Modern schools place more emphasis on teamwork.","exampleZh":"现代学校更加注重团队合作。"},{"id":"ielts-0108","bank":"ielts","word":"ensure","full":"","ipa":"/ɪnˈʃʊə/","pos":"v.","meaning":"确保；保证。","example":"Parents should ensure that children wear seat belts.","exampleZh":"父母应确保孩子系上安全带。"},{"id":"ielts-0109","bank":"ielts","word":"exclude","full":"","ipa":"/ɪkˈskluːd/","pos":"v.","meaning":"排除；不包括。","example":"Low-income families are often excluded from good schools.","exampleZh":"低收入家庭往往被排除在好学校门外。"},{"id":"ielts-0110","bank":"ielts","word":"framework","full":"","ipa":"/ˈfreɪmwɜːk/","pos":"n.","meaning":"框架；体制。指组织想法或制度的基本结构。","example":"The law provides a framework for protecting endangered species.","exampleZh":"这项法律为保护濒危物种提供了框架。"},{"id":"ielts-0111","bank":"ielts","word":"illustrate","full":"","ipa":"/ˈɪləstreɪt/","pos":"v.","meaning":"说明；阐明；配图。","example":"The chart illustrates changes in water use over fifty years.","exampleZh":"图表说明了五十年来用水量的变化。"},{"id":"ielts-0112","bank":"ielts","word":"immigrate","full":"","ipa":"/ˈɪmɪɡreɪt/","pos":"v.","meaning":"移居入境。指从外国移入某国定居；从本国移出则用 emigrate。","example":"His grandparents immigrated to Canada in the 1960s.","exampleZh":"他的祖父母在六十年代移居加拿大。"},{"id":"ielts-0113","bank":"ielts","word":"imply","full":"","ipa":"/ɪmˈplaɪ/","pos":"v.","meaning":"暗示；意味着。","example":"The results imply that smaller classes improve learning.","exampleZh":"结果意味着小班教学能改善学习。"},{"id":"ielts-0114","bank":"ielts","word":"initial","full":"","ipa":"/ɪˈnɪʃl/","pos":"adj.","meaning":"最初的；开始的。","example":"Initial reactions to the plan were positive.","exampleZh":"对该计划的最初反应是正面的。"},{"id":"ielts-0115","bank":"ielts","word":"instance","full":"","ipa":"/ˈɪnstəns/","pos":"n.","meaning":"例子；实例。for instance 等于 for example。","example":"There are many instances of animals adapting to city life.","exampleZh":"有许多动物适应城市生活的例子。"},{"id":"ielts-0116","bank":"ielts","word":"interact","full":"","ipa":"/ˌɪntərˈækt/","pos":"v.","meaning":"互动；相互作用。","example":"Children who interact with peers develop social skills faster.","exampleZh":"多与同龄人互动的孩子，社交能力发展得更快。"},{"id":"ielts-0117","bank":"ielts","word":"justify","full":"","ipa":"/ˈdʒʌstɪfaɪ/","pos":"v.","meaning":"证明……合理；为……辩护。","example":"It is hard to justify spending so much on a new stadium.","exampleZh":"花这么多钱兴建新体育馆，很难说得过去。"},{"id":"ielts-0118","bank":"ielts","word":"layer","full":"","ipa":"/ˈleɪə/","pos":"n.","meaning":"层；阶层。","example":"The ozone layer protects the Earth from ultraviolet rays.","exampleZh":"臭氧层保护地球免受紫外线伤害。"},{"id":"ielts-0119","bank":"ielts","word":"locate","full":"","ipa":"/ləʊˈkeɪt/","pos":"v.","meaning":"找到……的位置；把……设于。be located in 位于。","example":"The airport is located twenty kilometres from the city.","exampleZh":"机场位于离市区二十公里处。"},{"id":"ielts-0120","bank":"ielts","word":"maximise","full":"","ipa":"/ˈmæksɪmaɪz/","pos":"v.","meaning":"使最大化。英式拼法 maximise，美式 maximize。","example":"Farmers use fertilisers to maximise crop production.","exampleZh":"农民使用肥料以使农作物产量最大化。"},{"id":"ielts-0121","bank":"ielts","word":"minor","full":"","ipa":"/ˈmaɪnə/","pos":"adj.","meaning":"次要的；较小的。作名词时指“未成年人”。","example":"Most of the changes were minor.","exampleZh":"大部分改动都是小改动。"},{"id":"ielts-0122","bank":"ielts","word":"negate","full":"","ipa":"/nɪˈɡeɪt/","pos":"v.","meaning":"抵消；否定；使无效。","example":"The benefits of exercise can be negated by a poor diet.","exampleZh":"饮食不当可能抵消运动的好处。"},{"id":"ielts-0123","bank":"ielts","word":"outcome","full":"","ipa":"/ˈaʊtkʌm/","pos":"n.","meaning":"结果；成果。","example":"The outcome of the election was uncertain until the last moment.","exampleZh":"选举结果直到最后一刻仍未明朗。"},{"id":"ielts-0124","bank":"ielts","word":"philosophy","full":"","ipa":"/fəˈlɒsəfi/","pos":"n.","meaning":"哲学；人生观；理念。","example":"The school's philosophy is that every child can succeed.","exampleZh":"这所学校的理念是每个孩子都能成功。"},{"id":"ielts-0125","bank":"ielts","word":"physical","full":"","ipa":"/ˈfɪzɪkl/","pos":"adj.","meaning":"身体的；物质的；物理的。","example":"Physical activity reduces the risk of heart disease.","exampleZh":"体育活动可降低患心脏病的风险。"},{"id":"ielts-0126","bank":"ielts","word":"proportion","full":"","ipa":"/prəˈpɔːʃn/","pos":"n.","meaning":"比例；部分。in proportion to 与……成比例。","example":"A large proportion of the budget goes on healthcare.","exampleZh":"预算中很大一部分用于医疗。"},{"id":"ielts-0127","bank":"ielts","word":"publish","full":"","ipa":"/ˈpʌblɪʃ/","pos":"v.","meaning":"出版；发表；公布。","example":"The results will be published next month.","exampleZh":"结果将于下月公布。"},{"id":"ielts-0128","bank":"ielts","word":"react","full":"","ipa":"/riˈækt/","pos":"v.","meaning":"作出反应。react to 对……作出反应。","example":"Markets reacted sharply to the news.","exampleZh":"市场对这则消息反应激烈。"},{"id":"ielts-0129","bank":"ielts","word":"register","full":"","ipa":"/ˈredʒɪstə/","pos":"v.","meaning":"登记；注册；显示（读数）。","example":"All voters must register before the deadline.","exampleZh":"所有选民须在截止日期前登记。"},{"id":"ielts-0130","bank":"ielts","word":"rely on","full":"","ipa":"/rɪˈlaɪ ɒn/","pos":"phr.","meaning":"依赖；依靠。名词为 reliance。","example":"Many rural areas rely on tourism for income.","exampleZh":"许多乡郊地区依赖旅游业维持收入。"},{"id":"ielts-0131","bank":"ielts","word":"remove","full":"","ipa":"/rɪˈmuːv/","pos":"v.","meaning":"移除；去掉；免职。","example":"The council removed several trees to widen the road.","exampleZh":"为扩阔道路，议会移走了几棵树。"},{"id":"ielts-0132","bank":"ielts","word":"scheme","full":"","ipa":"/skiːm/","pos":"n.","meaning":"计划；方案。英式英语中多为中性词，美式英语中常带“诡计”之意。","example":"The recycling scheme has been a great success.","exampleZh":"这项回收计划非常成功。"},{"id":"ielts-0133","bank":"ielts","word":"sequence","full":"","ipa":"/ˈsiːkwəns/","pos":"n.","meaning":"顺序；一连串。in sequence 按顺序。","example":"Put the stages of the process in the correct sequence.","exampleZh":"按正确顺序排列这个过程的各个阶段。"},{"id":"ielts-0134","bank":"ielts","word":"shift","full":"","ipa":"/ʃɪft/","pos":"n./v.","meaning":"转变；转移；轮班。","example":"There has been a shift towards plant-based diets.","exampleZh":"人们的饮食已转向以植物为主。"},{"id":"ielts-0135","bank":"ielts","word":"specify","full":"","ipa":"/ˈspesɪfaɪ/","pos":"v.","meaning":"具体说明；明确规定。","example":"The contract specifies the working hours.","exampleZh":"合约明确规定了工作时间。"},{"id":"ielts-0136","bank":"ielts","word":"sufficient","full":"","ipa":"/səˈfɪʃnt/","pos":"adj.","meaning":"足够的；充分的。较 enough 正式。","example":"Many children do not get sufficient sleep.","exampleZh":"许多孩子睡眠不足。"},{"id":"ielts-0137","bank":"ielts","word":"task","full":"","ipa":"/tɑːsk/","pos":"n.","meaning":"任务；工作。","example":"Robots can perform repetitive tasks more efficiently.","exampleZh":"机械人能更有效率地执行重复性工作。"},{"id":"ielts-0138","bank":"ielts","word":"technical","full":"","ipa":"/ˈteknɪkl/","pos":"adj.","meaning":"技术的；专业的。","example":"The report is too technical for the general public.","exampleZh":"这份报告对一般公众来说太专业了。"},{"id":"ielts-0139","bank":"ielts","word":"technique","full":"","ipa":"/tekˈniːk/","pos":"n.","meaning":"技巧；技术；方法。","example":"Doctors are developing new techniques for treating cancer.","exampleZh":"医生正在研发治疗癌症的新技术。"},{"id":"ielts-0140","bank":"ielts","word":"valid","full":"","ipa":"/ˈvælɪd/","pos":"adj.","meaning":"有效的；合理的；有根据的。","example":"Your passport must be valid for at least six months.","exampleZh":"您的护照须有至少六个月有效期。"},{"id":"ielts-0141","bank":"ielts","word":"volume","full":"","ipa":"/ˈvɒljuːm/","pos":"n.","meaning":"量；体积；音量；（书的）卷册。","example":"The volume of traffic doubles during rush hour.","exampleZh":"繁忙时间的交通流量增加一倍。"},{"id":"ielts-0142","bank":"ielts","word":"access","full":"","ipa":"/ˈækses/","pos":"n./v.","meaning":"使用（机会）；进入；获取。have access to 能够使用或接触。","example":"Millions still lack access to clean water.","exampleZh":"仍有数以百万计的人无法获得洁净食水。"},{"id":"ielts-0143","bank":"ielts","word":"adequate","full":"","ipa":"/ˈædɪkwət/","pos":"adj.","meaning":"足够的；适当的；尚可的。","example":"The hospital lacks adequate staff.","exampleZh":"这家医院人手不足。"},{"id":"ielts-0144","bank":"ielts","word":"annual","full":"","ipa":"/ˈænjuəl/","pos":"adj.","meaning":"每年的；年度的。","example":"The annual rainfall here is less than 300 millimetres.","exampleZh":"这里的年降雨量少于三百毫米。"},{"id":"ielts-0145","bank":"ielts","word":"apparent","full":"","ipa":"/əˈpærənt/","pos":"adj.","meaning":"明显的；表面上的。apparently 可指“看来、据说”。","example":"There was no apparent reason for the decline.","exampleZh":"下降并无明显原因。"},{"id":"ielts-0146","bank":"ielts","word":"approximate","full":"","ipa":"/əˈprɒksɪmət/","pos":"adj.","meaning":"大约的；近似的。作动词时读 /əˈprɒksɪmeɪt/。","example":"The approximate cost of the project is two billion dollars.","exampleZh":"这个项目的成本约为二十亿元。"},{"id":"ielts-0147","bank":"ielts","word":"attitude","full":"","ipa":"/ˈætɪtjuːd/","pos":"n.","meaning":"态度；看法。attitude towards 对……的态度。","example":"Attitudes towards recycling have changed a lot.","exampleZh":"人们对回收的态度已大为改变。"},{"id":"ielts-0148","bank":"ielts","word":"attribute","full":"","ipa":"/əˈtrɪbjuːt/","pos":"v.","meaning":"把……归因于。attribute A to B。作名词 /ˈætrɪbjuːt/ 时指“特质”。","example":"The rise in obesity is often attributed to poor diet.","exampleZh":"肥胖率上升常被归因于饮食不当。"},{"id":"ielts-0149","bank":"ielts","word":"civil","full":"","ipa":"/ˈsɪvl/","pos":"adj.","meaning":"公民的；民用的；民事的；文明有礼的。civil servant 指公务员。","example":"Civil rights are protected by the constitution.","exampleZh":"公民权利受宪法保障。"},{"id":"ielts-0150","bank":"ielts","word":"code","full":"","ipa":"/kəʊd/","pos":"n.","meaning":"准则；守则；代码。dress code 指着装规定。","example":"The school has a strict dress code.","exampleZh":"这所学校有严格的着装规定。"},{"id":"ielts-0151","bank":"ielts","word":"commit","full":"","ipa":"/kəˈmɪt/","pos":"v.","meaning":"犯（罪）；承诺；投入。be committed to 致力于。","example":"The city is committed to cutting emissions by half.","exampleZh":"该市致力于把排放量减半。"},{"id":"ielts-0152","bank":"ielts","word":"communicate","full":"","ipa":"/kəˈmjuːnɪkeɪt/","pos":"v.","meaning":"沟通；传达。","example":"Teenagers increasingly communicate through text messages.","exampleZh":"青少年越来越多地通过短讯沟通。"},{"id":"ielts-0153","bank":"ielts","word":"concentrate","full":"","ipa":"/ˈkɒnsntreɪt/","pos":"v.","meaning":"集中（注意力）；聚集。concentrate on 专注于。","example":"It is difficult to concentrate in a noisy classroom.","exampleZh":"在嘈杂的课室里很难集中精神。"},{"id":"ielts-0154","bank":"ielts","word":"confer","full":"","ipa":"/kənˈfɜː/","pos":"v.","meaning":"授予；商议。confer a degree 颁授学位。","example":"The university conferred an honorary degree on the scientist.","exampleZh":"大学向这位科学家颁授荣誉学位。"},{"id":"ielts-0155","bank":"ielts","word":"contrast","full":"","ipa":"/ˈkɒntrɑːst/","pos":"n.","meaning":"对比；差异。in contrast 相反。作动词时读 /kənˈtrɑːst/。","example":"In contrast, rural areas saw a fall in population.","exampleZh":"相比之下，乡郊地区人口下降。"},{"id":"ielts-0156","bank":"ielts","word":"cycle","full":"","ipa":"/ˈsaɪkl/","pos":"n.","meaning":"循环；周期。the water cycle 水循环。","example":"The diagram shows the life cycle of a butterfly.","exampleZh":"这幅图展示了蝴蝶的生命周期。"},{"id":"ielts-0157","bank":"ielts","word":"debate","full":"","ipa":"/dɪˈbeɪt/","pos":"n./v.","meaning":"辩论；讨论；争论。","example":"There is an ongoing debate about the value of homework.","exampleZh":"关于家课是否有用的讨论一直持续。"},{"id":"ielts-0158","bank":"ielts","word":"dimension","full":"","ipa":"/daɪˈmenʃn/","pos":"n.","meaning":"方面；维度；尺寸。","example":"The problem has a social as well as an economic dimension.","exampleZh":"这个问题既有经济层面，也有社会层面。"},{"id":"ielts-0159","bank":"ielts","word":"domestic","full":"","ipa":"/dəˈmestɪk/","pos":"adj.","meaning":"国内的；家庭的。domestic flights 国内航班。","example":"Domestic tourism grew while international travel fell.","exampleZh":"国际旅游减少，本地旅游却增长。"},{"id":"ielts-0160","bank":"ielts","word":"emerge","full":"","ipa":"/ɪˈmɜːdʒ/","pos":"v.","meaning":"出现；显露；（事实）被知悉。","example":"New technologies continue to emerge every year.","exampleZh":"每年都有新科技涌现。"},{"id":"ielts-0161","bank":"ielts","word":"ethnic","full":"","ipa":"/ˈeθnɪk/","pos":"adj.","meaning":"种族的；民族的。ethnic minority 少数族裔。","example":"The city is home to many ethnic groups.","exampleZh":"这座城市居住着许多不同族群。"},{"id":"ielts-0162","bank":"ielts","word":"goal","full":"","ipa":"/ɡəʊl/","pos":"n.","meaning":"目标；（球赛的）入球。","example":"The goal is to plant one million trees by 2030.","exampleZh":"目标是在 2030 年前种植一百万棵树。"},{"id":"ielts-0163","bank":"ielts","word":"grant","full":"","ipa":"/ɡrɑːnt/","pos":"n./v.","meaning":"拨款；助学金；准予。take for granted 视为理所当然。","example":"Students from poor families can apply for a grant.","exampleZh":"来自贫困家庭的学生可申请助学金。"},{"id":"ielts-0164","bank":"ielts","word":"hence","full":"","ipa":"/hens/","pos":"adv.","meaning":"因此；由此。较正式，常接名词短语。","example":"The road is narrow, hence the speed limit.","exampleZh":"道路狭窄，因而设有车速限制。"},{"id":"ielts-0165","bank":"ielts","word":"hypothesis","full":"","ipa":"/haɪˈpɒθəsɪs/","pos":"n.","meaning":"假设；假说。复数 hypotheses。","example":"The experiment was designed to test the hypothesis.","exampleZh":"这个实验是为了验证该假设而设计的。"},{"id":"ielts-0166","bank":"ielts","word":"implement","full":"","ipa":"/ˈɪmplɪment/","pos":"v.","meaning":"实施；执行。作名词 /ˈɪmplɪmənt/ 时指“工具”。","example":"The new policy will be implemented next year.","exampleZh":"新政策将于明年实施。"},{"id":"ielts-0167","bank":"ielts","word":"impose","full":"","ipa":"/ɪmˈpəʊz/","pos":"v.","meaning":"强制实行；施加。impose a tax on 对……征税。","example":"The government imposed a tax on sugary drinks.","exampleZh":"政府对含糖饮品征税。"},{"id":"ielts-0168","bank":"ielts","word":"integrate","full":"","ipa":"/ˈɪntɪɡreɪt/","pos":"v.","meaning":"融合；整合；融入。","example":"Immigrants need support to integrate into society.","exampleZh":"移民需要支援才能融入社会。"},{"id":"ielts-0169","bank":"ielts","word":"internal","full":"","ipa":"/ɪnˈtɜːnl/","pos":"adj.","meaning":"内部的；国内的。","example":"The company carried out an internal investigation.","exampleZh":"公司进行了内部调查。"},{"id":"ielts-0170","bank":"ielts","word":"investigate","full":"","ipa":"/ɪnˈvestɪɡeɪt/","pos":"v.","meaning":"调查；研究。","example":"Scientists are investigating the causes of the disease.","exampleZh":"科学家正在研究该疾病的成因。"},{"id":"ielts-0171","bank":"ielts","word":"label","full":"","ipa":"/ˈleɪbl/","pos":"n./v.","meaning":"标签；给……贴标签。","example":"Food labels should show how much sugar a product contains.","exampleZh":"食品标签应显示产品的含糖量。"},{"id":"ielts-0172","bank":"ielts","word":"mechanism","full":"","ipa":"/ˈmekənɪzəm/","pos":"n.","meaning":"机制；机理；机械装置。","example":"The body has natural mechanisms to fight infection.","exampleZh":"人体有对抗感染的自然机制。"},{"id":"ielts-0173","bank":"ielts","word":"obvious","full":"","ipa":"/ˈɒbviəs/","pos":"adj.","meaning":"显然的；明显的。","example":"The most obvious solution is to build more housing.","exampleZh":"最明显的解决办法是兴建更多房屋。"},{"id":"ielts-0174","bank":"ielts","word":"occupy","full":"","ipa":"/ˈɒkjupaɪ/","pos":"v.","meaning":"占用；占据；使忙碌。","example":"Offices occupy most of the building.","exampleZh":"大楼的大部分空间用作办公室。"},{"id":"ielts-0175","bank":"ielts","word":"option","full":"","ipa":"/ˈɒpʃn/","pos":"n.","meaning":"选择；选项。","example":"Public transport is the cheapest option for most students.","exampleZh":"对大多数学生来说，公共交通是最便宜的选择。"},{"id":"ielts-0176","bank":"ielts","word":"output","full":"","ipa":"/ˈaʊtpʊt/","pos":"n.","meaning":"产量；输出。","example":"Industrial output rose by five percent.","exampleZh":"工业产量上升了百分之五。"},{"id":"ielts-0177","bank":"ielts","word":"overall","full":"","ipa":"/ˌəʊvərˈɔːl/","pos":"adj./adv.","meaning":"总体的；总的来说。图表作文常以 Overall 开始总结段。","example":"Overall, the number of tourists increased over the period.","exampleZh":"总体而言，游客人数在这段期间有所增加。"},{"id":"ielts-0178","bank":"ielts","word":"parallel","full":"","ipa":"/ˈpærəlel/","pos":"adj./n.","meaning":"平行的；相似之处。draw a parallel 作比较。","example":"There are interesting parallels between the two cities.","exampleZh":"这两座城市有一些有趣的相似之处。"},{"id":"ielts-0179","bank":"ielts","word":"parameter","full":"","ipa":"/pəˈræmɪtə/","pos":"n.","meaning":"参数；界限；规范。","example":"The research was conducted within strict parameters.","exampleZh":"这项研究在严格的界限内进行。"},{"id":"ielts-0180","bank":"ielts","word":"phase","full":"","ipa":"/feɪz/","pos":"n.","meaning":"阶段；时期。phase out 逐步淘汰。","example":"Coal power will be phased out over the next decade.","exampleZh":"未来十年会逐步淘汰燃煤发电。"},{"id":"ielts-0181","bank":"ielts","word":"predict","full":"","ipa":"/prɪˈdɪkt/","pos":"v.","meaning":"预测；预言。","example":"Experts predict that the population will peak in 2050.","exampleZh":"专家预测人口将在 2050 年见顶。"},{"id":"ielts-0182","bank":"ielts","word":"principal","full":"","ipa":"/ˈprɪnsəpl/","pos":"adj./n.","meaning":"主要的；校长。注意与 principle（原则）区分。","example":"The principal cause of the fire was faulty wiring.","exampleZh":"火灾的主要原因是电线故障。"},{"id":"ielts-0183","bank":"ielts","word":"professional","full":"","ipa":"/prəˈfeʃənl/","pos":"adj./n.","meaning":"专业的；职业的；专业人士。","example":"Professional advice may be needed before starting a business.","exampleZh":"开业前可能需要寻求专业意见。"},{"id":"ielts-0184","bank":"ielts","word":"project","full":"","ipa":"/ˈprɒdʒekt/","pos":"n.","meaning":"项目；工程。作动词 /prəˈdʒekt/ 时指“预计、投射”。","example":"Sales are projected to double by next year.","exampleZh":"预计明年销售额将翻一番。"},{"id":"ielts-0185","bank":"ielts","word":"promote","full":"","ipa":"/prəˈməʊt/","pos":"v.","meaning":"促进；推广；晋升。","example":"The campaign aims to promote healthy eating.","exampleZh":"这项运动旨在推广健康饮食。"},{"id":"ielts-0186","bank":"ielts","word":"regime","full":"","ipa":"/reɪˈʒiːm/","pos":"n.","meaning":"政权；制度；（饮食、锻炼的）规定方案。","example":"He followed a strict exercise regime.","exampleZh":"他遵循严格的锻炼计划。"},{"id":"ielts-0187","bank":"ielts","word":"resolve","full":"","ipa":"/rɪˈzɒlv/","pos":"v.","meaning":"解决；决心。","example":"The dispute was resolved through negotiation.","exampleZh":"这场纠纷通过谈判得以解决。"},{"id":"ielts-0188","bank":"ielts","word":"retain","full":"","ipa":"/rɪˈteɪn/","pos":"v.","meaning":"保留；保持；记住。","example":"The town has retained much of its traditional charm.","exampleZh":"这个小镇保留了大部分传统风貌。"},{"id":"ielts-0189","bank":"ielts","word":"series","full":"","ipa":"/ˈsɪəriːz/","pos":"n.","meaning":"一系列；系列。单复数同形。","example":"A series of measures were introduced to reduce traffic.","exampleZh":"政府推出了一系列减少交通流量的措施。"},{"id":"ielts-0190","bank":"ielts","word":"statistic","full":"","ipa":"/stəˈtɪstɪk/","pos":"n.","meaning":"统计数字；统计资料（多用复数）。","example":"Statistics show that more people are living alone.","exampleZh":"统计数字显示，越来越多人独居。"},{"id":"ielts-0191","bank":"ielts","word":"status","full":"","ipa":"/ˈsteɪtəs/","pos":"n.","meaning":"地位；身份；状况。","example":"Owning a car is no longer a status symbol for young people.","exampleZh":"对年轻人来说，拥有汽车已不再是身份的象征。"},{"id":"ielts-0192","bank":"ielts","word":"stress","full":"","ipa":"/stres/","pos":"n./v.","meaning":"压力；强调。","example":"Long working hours can cause stress and illness.","exampleZh":"长时间工作可能导致压力和疾病。"},{"id":"ielts-0193","bank":"ielts","word":"sum","full":"","ipa":"/sʌm/","pos":"n.","meaning":"金额；总数。sum up 总结。","example":"Governments spend large sums on defence.","exampleZh":"各国政府在国防上花费巨额资金。"},{"id":"ielts-0194","bank":"ielts","word":"summary","full":"","ipa":"/ˈsʌməri/","pos":"n.","meaning":"摘要；概要。in summary 总之。","example":"Write a brief summary of the main points.","exampleZh":"简要概括主要论点。"},{"id":"ielts-0195","bank":"ielts","word":"undertake","full":"","ipa":"/ˌʌndəˈteɪk/","pos":"v.","meaning":"承担；着手；从事。","example":"The council will undertake a review of parking policy.","exampleZh":"议会将对泊车政策进行检讨。"},{"id":"ielts-0196","bank":"ielts","word":"academy","full":"","ipa":"/əˈkædəmi/","pos":"n.","meaning":"学院；研究院；专门学校。","example":"She trained at a music academy in Vienna.","exampleZh":"她在维也纳一所音乐学院受训。"},{"id":"ielts-0197","bank":"ielts","word":"adjust","full":"","ipa":"/əˈdʒʌst/","pos":"v.","meaning":"调整；适应。adjust to 适应新环境。","example":"It takes time to adjust to a new culture.","exampleZh":"适应新文化需要时间。"},{"id":"ielts-0198","bank":"ielts","word":"alter","full":"","ipa":"/ˈɔːltə/","pos":"v.","meaning":"改变；修改。较 change 正式。","example":"Climate change could alter migration patterns of birds.","exampleZh":"气候变化可能改变鸟类的迁徙模式。"},{"id":"ielts-0199","bank":"ielts","word":"aware","full":"","ipa":"/əˈweə/","pos":"adj.","meaning":"意识到的；知道的。be aware of 知道某事。","example":"People are more aware of the dangers of smoking.","exampleZh":"人们更清楚吸烟的害处。"},{"id":"ielts-0200","bank":"ielts","word":"capacity","full":"","ipa":"/kəˈpæsəti/","pos":"n.","meaning":"容量；能力；身份。","example":"The stadium has a capacity of 50,000.","exampleZh":"这个体育场可容纳五万人。"},{"id":"ielts-0201","bank":"ielts","word":"challenge","full":"","ipa":"/ˈtʃælɪndʒ/","pos":"n./v.","meaning":"挑战；质疑。","example":"One major challenge for cities is providing affordable housing.","exampleZh":"城市面对的一大挑战是提供可负担的住屋。"},{"id":"ielts-0202","bank":"ielts","word":"compound","full":"","ipa":"/ˈkɒmpaʊnd/","pos":"n.","meaning":"化合物；复合物；（围起来的）院落。作动词 /kəmˈpaʊnd/ 时指“使恶化”。","example":"Water is a compound of hydrogen and oxygen.","exampleZh":"水是由氢和氧组成的化合物。"},{"id":"ielts-0203","bank":"ielts","word":"conflict","full":"","ipa":"/ˈkɒnflɪkt/","pos":"n.","meaning":"冲突；矛盾。作动词 /kənˈflɪkt/ 时指“相冲突”。","example":"Conflict between work and family is common.","exampleZh":"工作与家庭之间的矛盾很常见。"},{"id":"ielts-0204","bank":"ielts","word":"consult","full":"","ipa":"/kənˈsʌlt/","pos":"v.","meaning":"咨询；查阅；与……商量。","example":"You should consult a doctor before starting a diet.","exampleZh":"开始节食前应先咨询医生。"},{"id":"ielts-0205","bank":"ielts","word":"discrete","full":"","ipa":"/dɪˈskriːt/","pos":"adj.","meaning":"分开的；独立的；离散的。注意与 discreet（谨慎的）区分。","example":"The course is divided into discrete units.","exampleZh":"课程分为几个独立单元。"},{"id":"ielts-0206","bank":"ielts","word":"enable","full":"","ipa":"/ɪˈneɪbl/","pos":"v.","meaning":"使能够。enable sb to do sth。","example":"The internet enables people to work from anywhere.","exampleZh":"互联网使人们可以在任何地方工作。"},{"id":"ielts-0207","bank":"ielts","word":"enforce","full":"","ipa":"/ɪnˈfɔːs/","pos":"v.","meaning":"执行；强制实施。","example":"Speed limits must be strictly enforced.","exampleZh":"车速限制必须严格执行。"},{"id":"ielts-0208","bank":"ielts","word":"entity","full":"","ipa":"/ˈentəti/","pos":"n.","meaning":"实体；独立存在的事物。","example":"The two companies remain separate legal entities.","exampleZh":"两家公司仍是独立的法律实体。"},{"id":"ielts-0209","bank":"ielts","word":"equivalent","full":"","ipa":"/ɪˈkwɪvələnt/","pos":"adj./n.","meaning":"相等的；相当的；等价物。","example":"A degree from this college is equivalent to a bachelor's degree.","exampleZh":"这所学院颁授的学位相当于学士学位。"},{"id":"ielts-0210","bank":"ielts","word":"evolve","full":"","ipa":"/iˈvɒlv/","pos":"v.","meaning":"演变；进化；逐步发展。","example":"Language constantly evolves over time.","exampleZh":"语言随时间不断演变。"},{"id":"ielts-0211","bank":"ielts","word":"expand","full":"","ipa":"/ɪkˈspænd/","pos":"v.","meaning":"扩大；扩张；展开。","example":"The city has expanded rapidly over the past thirty years.","exampleZh":"过去三十年，这座城市迅速扩张。"},{"id":"ielts-0212","bank":"ielts","word":"expose","full":"","ipa":"/ɪkˈspəʊz/","pos":"v.","meaning":"使暴露；揭露。be exposed to 接触到（危险等）。","example":"Children are exposed to advertising from an early age.","exampleZh":"儿童从小就接触到广告。"},{"id":"ielts-0213","bank":"ielts","word":"external","full":"","ipa":"/ɪkˈstɜːnl/","pos":"adj.","meaning":"外部的；外来的。","example":"External factors such as weather affect crop prices.","exampleZh":"天气等外部因素会影响农作物价格。"},{"id":"ielts-0214","bank":"ielts","word":"fundamental","full":"","ipa":"/ˌfʌndəˈmentl/","pos":"adj.","meaning":"基本的；根本的。","example":"Education is a fundamental human right.","exampleZh":"教育是一项基本人权。"},{"id":"ielts-0215","bank":"ielts","word":"generate","full":"","ipa":"/ˈdʒenəreɪt/","pos":"v.","meaning":"产生；引起；发（电）。","example":"Tourism generates millions of jobs worldwide.","exampleZh":"旅游业在全球创造了数以百万计的职位。"},{"id":"ielts-0216","bank":"ielts","word":"liberal","full":"","ipa":"/ˈlɪbərəl/","pos":"adj.","meaning":"开明的；自由主义的；宽松的。","example":"The country has liberal laws on freedom of speech.","exampleZh":"该国在言论自由方面的法律较宽松。"},{"id":"ielts-0217","bank":"ielts","word":"licence","full":"","ipa":"/ˈlaɪsns/","pos":"n.","meaning":"执照；许可证。英式英语中名词拼作 licence，动词为 license。","example":"You need a licence to sell alcohol.","exampleZh":"售卖酒类需要牌照。"},{"id":"ielts-0218","bank":"ielts","word":"logic","full":"","ipa":"/ˈlɒdʒɪk/","pos":"n.","meaning":"逻辑；道理。","example":"I can't see the logic of raising fares now.","exampleZh":"我看不出现在加价有什么道理。"},{"id":"ielts-0219","bank":"ielts","word":"margin","full":"","ipa":"/ˈmɑːdʒɪn/","pos":"n.","meaning":"差额；幅度；页边空白。by a narrow margin 以些微之差。","example":"The proposal was rejected by a narrow margin.","exampleZh":"该提案以些微之差被否决。"},{"id":"ielts-0220","bank":"ielts","word":"mental","full":"","ipa":"/ˈmentl/","pos":"adj.","meaning":"精神的；心理的；智力的。","example":"Exercise benefits both physical and mental health.","exampleZh":"运动对身心健康都有益处。"},{"id":"ielts-0221","bank":"ielts","word":"modify","full":"","ipa":"/ˈmɒdɪfaɪ/","pos":"v.","meaning":"修改；改变；改良。genetically modified 转基因的。","example":"The design was modified to reduce costs.","exampleZh":"为了降低成本，设计作了修改。"},{"id":"ielts-0222","bank":"ielts","word":"monitor","full":"","ipa":"/ˈmɒnɪtə/","pos":"v./n.","meaning":"监测；监视；显示屏。","example":"Air quality is monitored every hour.","exampleZh":"空气质素每小时监测一次。"},{"id":"ielts-0223","bank":"ielts","word":"notion","full":"","ipa":"/ˈnəʊʃn/","pos":"n.","meaning":"概念；观念；看法。","example":"The notion that money brings happiness is widely questioned.","exampleZh":"“金钱带来快乐”的观念受到广泛质疑。"},{"id":"ielts-0224","bank":"ielts","word":"objective","full":"","ipa":"/əbˈdʒektɪv/","pos":"n./adj.","meaning":"目标；客观的。","example":"Journalists should report events in an objective way.","exampleZh":"记者应客观地报道事件。"},{"id":"ielts-0225","bank":"ielts","word":"perspective","full":"","ipa":"/pəˈspektɪv/","pos":"n.","meaning":"观点；角度；透视法。from a … perspective 从……角度来看。","example":"From an economic perspective, the plan makes sense.","exampleZh":"从经济角度来看，这个计划是合理的。"},{"id":"ielts-0226","bank":"ielts","word":"precise","full":"","ipa":"/prɪˈsaɪs/","pos":"adj.","meaning":"精确的；准确的；明确的。","example":"The precise cause of the disease is unknown.","exampleZh":"这种疾病的确切成因尚不清楚。"},{"id":"ielts-0227","bank":"ielts","word":"prime","full":"","ipa":"/praɪm/","pos":"adj.","meaning":"首要的；主要的；最好的。","example":"Location is a prime consideration when buying a home.","exampleZh":"置业时，地点是首要考虑因素。"},{"id":"ielts-0228","bank":"ielts","word":"psychology","full":"","ipa":"/saɪˈkɒlədʒi/","pos":"n.","meaning":"心理学；心理。","example":"She studied child psychology at university.","exampleZh":"她在大学修读儿童心理学。"},{"id":"ielts-0229","bank":"ielts","word":"pursue","full":"","ipa":"/pəˈsjuː/","pos":"v.","meaning":"追求；从事；继续进行。","example":"More women now pursue careers in science.","exampleZh":"现在有更多女性投身科学事业。"},{"id":"ielts-0230","bank":"ielts","word":"ratio","full":"","ipa":"/ˈreɪʃiəʊ/","pos":"n.","meaning":"比率；比例。","example":"The teacher-student ratio in the school is one to twenty.","exampleZh":"这所学校的师生比例为一比二十。"},{"id":"ielts-0231","bank":"ielts","word":"reject","full":"","ipa":"/rɪˈdʒekt/","pos":"v.","meaning":"拒绝；否决；不接纳。","example":"Voters rejected the proposal to build a casino.","exampleZh":"选民否决了兴建赌场的建议。"},{"id":"ielts-0232","bank":"ielts","word":"revenue","full":"","ipa":"/ˈrevənjuː/","pos":"n.","meaning":"收入；收益；税收。","example":"Advertising is the main source of revenue for the website.","exampleZh":"广告是该网站的主要收入来源。"},{"id":"ielts-0233","bank":"ielts","word":"stable","full":"","ipa":"/ˈsteɪbl/","pos":"adj.","meaning":"稳定的；稳固的。","example":"A stable family environment is important for children.","exampleZh":"稳定的家庭环境对孩子很重要。"},{"id":"ielts-0234","bank":"ielts","word":"substitute","full":"","ipa":"/ˈsʌbstɪtjuːt/","pos":"n./v.","meaning":"替代品；代替。substitute A for B 用 A 代替 B。","example":"Online meetings cannot fully substitute for face-to-face contact.","exampleZh":"网上会议无法完全取代面对面的接触。"},{"id":"ielts-0235","bank":"ielts","word":"symbol","full":"","ipa":"/ˈsɪmbl/","pos":"n.","meaning":"象征；符号。","example":"The tower has become a symbol of the city.","exampleZh":"这座塔已成为这座城市的象征。"},{"id":"ielts-0236","bank":"ielts","word":"target","full":"","ipa":"/ˈtɑːɡɪt/","pos":"n./v.","meaning":"目标；对象；以……为目标。","example":"The advertisement targets young adults.","exampleZh":"这则广告的目标对象是年轻人。"},{"id":"ielts-0237","bank":"ielts","word":"transit","full":"","ipa":"/ˈtrænzɪt/","pos":"n.","meaning":"运输；过境；公共交通。in transit 在运送途中。","example":"The city plans to expand its mass transit system.","exampleZh":"该市计划扩展集体运输系统。"},{"id":"ielts-0238","bank":"ielts","word":"trend","full":"","ipa":"/trend/","pos":"n.","meaning":"趋势；潮流。","example":"There is a growing trend towards working from home.","exampleZh":"在家工作的趋势日益明显。"},{"id":"ielts-0239","bank":"ielts","word":"version","full":"","ipa":"/ˈvɜːʃn/","pos":"n.","meaning":"版本；说法。","example":"An updated version of the app was released last week.","exampleZh":"这个应用程序的更新版本于上星期推出。"},{"id":"ielts-0240","bank":"ielts","word":"welfare","full":"","ipa":"/ˈwelfeə/","pos":"n.","meaning":"福利；福祉；社会救济。","example":"The government spends a large share of its budget on welfare.","exampleZh":"政府把大
