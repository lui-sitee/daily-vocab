<title>每日背单词</title>
<style>
:root {
  --cream: #F8F0E1;
  --cream-deep: #EFE2CB;
  --paper: #FFF8EE;
  --paper-2: #FBF3E6;
  --ink: #3B2A1C;
  --ink-soft: #6A4E3A;
  --muted: #A08A72;
  --line: #E8D3B4;
  --vermilion: #C43C22;
  --vermilion-deep: #9E2E1A;
  --terra: #B85C38;
  --orange: #E07A35;
  --amber: #E3A01A;
  --ochre: #C4842A;
  --gold: #C9A84C;
  --gold-bright: #E0C36A;
  --peach: #F6D3B0;
  --blush: #F3C7A8;
  --ok: #9A5A24;
  --shadow: 0 10px 30px rgba(90, 45, 20, 0.08);
  --shadow-sm: 0 2px 10px rgba(90, 45, 20, 0.06);
  --radius: 18px;
  --radius-sm: 12px;
  --nav-h: calc(64px + env(safe-area-inset-bottom, 0px));
  --font-sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", "Source Han Sans SC", system-ui, sans-serif;
  --font-serif: "Songti SC", "Noto Serif CJK SC", "STSong", "SimSun", "Source Han Serif SC", Georgia, serif;
  --font-en: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
  --font-ipa: "DejaVu Sans", "Noto Sans", "Segoe UI", "Lucida Grande", "Apple SD Gothic Neo", "Charis SIL", "Doulos SIL", Times, serif;
  --font-mono: "SF Mono", "Menlo", "Consolas", "Noto Sans Mono CJK SC", monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
html { height: 100%; scroll-padding-bottom: calc(var(--nav-h) + 16px); }
body {
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--font-sans);
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(224, 122, 53, 0.16), transparent 55%),
    radial-gradient(900px 500px at 0% 100%, rgba(196, 60, 34, 0.08), transparent 50%),
    linear-gradient(180deg, #FBEED8 0%, var(--cream) 28%, #F4E6CE 100%);
  overflow-x: hidden;
}
body.locked { overflow: hidden; }
button, input, select, textarea { font-family: inherit; }
button { color: inherit; }
a { color: var(--vermilion-deep); }
.wrap {
  width: min(980px, 100%);
  margin: 0 auto;
  padding: 16px 16px calc(var(--nav-h) + 24px);
}
.card, .btn, .rate, .choice { scroll-margin-bottom: calc(var(--nav-h) + 16px); }
.app-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0 14px;
}
.brand { display: flex; gap: 12px; align-items: center; min-width: 0; }
.seal {
  width: 48px; height: 48px; flex: 0 0 48px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #F0C36A, transparent 45%),
    linear-gradient(160deg, #E07A35, #C43C22 60%, #9E2E1A);
  box-shadow: 0 6px 16px rgba(196, 60, 34, 0.28), inset 0 0 0 2px rgba(224, 195, 106, 0.45);
  display: grid; place-items: center;
}
.seal svg { width: 30px; height: 30px; }
.brand h1 {
  font-family: var(--font-serif);
  font-size: 1.45rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: 0.06em;
  line-height: 1.2;
}
.brand p {
  margin: 2px 0 0;
  font-size: 0.78rem;
  color: var(--ink-soft);
  letter-spacing: 0.12em;
}
.icon-btn {
  appearance: none; border: 0; background: var(--paper);
  width: 44px; height: 44px; border-radius: 14px;
  display: grid; place-items: center;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  color: var(--terra);
}
.icon-btn:active { transform: scale(0.97); }
.icon-btn svg { width: 22px; height: 22px; }
.card {
  background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid rgba(201, 168, 76, 0.22);
  padding: 16px;
  margin-bottom: 14px;
  position: relative;
}
.card::after {
  content: "";
  position: absolute; inset: 8px;
  border-radius: 12px;
  pointer-events: none;
  border: 1px solid rgba(201, 168, 76, 0.0);
}
.card h2, .sec-title {
  font-family: var(--font-serif);
  font-size: 1.02rem;
  margin: 0 0 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.kicker {
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  color: var(--ochre);
  font-weight: 600;
  margin-bottom: 6px;
}
.energy-grid {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 14px;
  align-items: center;
}
.pillar-seal {
  aspect-ratio: 1;
  border-radius: 16px;
  background:
    radial-gradient(circle at 50% 0%, rgba(224, 195, 106, 0.5), transparent 55%),
    linear-gradient(180deg, #F8E3C0, #F3C8A0);
  border: 2px solid rgba(196, 60, 34, 0.35);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: inset 0 0 0 4px rgba(255, 248, 238, 0.65);
}
.pillar-seal .gz {
  font-family: var(--font-serif);
  font-size: 1.85rem;
  letter-spacing: 0.12em;
  color: var(--vermilion-deep);
  font-weight: 700;
  line-height: 1;
}
.pillar-seal .sub {
  margin-top: 6px;
  font-size: 0.7rem;
  color: var(--terra);
  letter-spacing: 0.08em;
}
.energy-copy p { margin: 0 0 8px; line-height: 1.65; font-size: 0.95rem; }
.energy-copy .suggest {
  background: rgba(224, 122, 53, 0.1);
  border-left: 3px solid var(--orange);
  padding: 8px 10px;
  border-radius: 0 10px 10px 0;
  font-size: 0.9rem;
}
.disclaimer {
  margin-top: 10px;
  font-size: 0.72rem;
  color: var(--muted);
  line-height: 1.5;
}
.hours {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-top: 4px;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(196, 132, 42, 0.12);
  color: var(--ok);
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 0.8rem;
}
.chip.warn { background: rgba(196, 60, 34, 0.1); color: var(--vermilion-deep); }
.chip.now { background: var(--vermilion); color: #FFF8EE; }
.progress-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat {
  background: rgba(255, 255, 255, 0.45);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
}
.stat b { display: block; font-size: 1.25rem; color: var(--vermilion-deep); font-family: var(--font-serif); }
.stat span { font-size: 0.75rem; color: var(--ink-soft); }
.bar {
  height: 8px; background: var(--cream-deep); border-radius: 99px; overflow: hidden; margin: 8px 0 4px;
}
.bar > i {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--gold-bright), var(--orange) 55%, var(--vermilion));
  border-radius: 99px;
  transition: width .35s ease;
}
.cta-row, .row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  appearance: none; border: 0; cursor: pointer;
  min-height: 48px; padding: 0 16px;
  border-radius: 14px;
  font-size: 0.95rem; font-weight: 650;
  letter-spacing: 0.04em;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .12s ease, filter .12s ease;
}
.btn:active { transform: scale(0.98); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary {
  background: linear-gradient(180deg, #D55336, var(--vermilion-deep));
  color: #FFF8EE;
  box-shadow: 0 8px 18px rgba(196, 60, 34, 0.25);
  flex: 1;
}
.btn-ghost {
  background: var(--paper);
  color: var(--terra);
  border: 1px solid var(--line);
  flex: 1;
}
.btn-gold {
  background: linear-gradient(180deg, #E8C56A, #C9A84C);
  color: #3B2A1C;
  flex: 1;
}
.encourage {
  font-family: var(--font-serif);
  font-size: 0.95rem;
  line-height: 1.7;
  color: var(--ink-soft);
  margin: 0;
}
.word-today .en {
  font-family: var(--font-en);
  font-size: 1.6rem;
  margin: 4px 0 2px;
}
.ipa { color: var(--terra); font-family: var(--font-ipa); font-size: 0.92rem; }
.muted { color: var(--ink-soft); font-size: 0.86rem; }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0;
  height: var(--nav-h);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: rgba(255, 248, 238, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  z-index: 20;
}
.nav button {
  appearance: none; border: 0; background: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 0.7rem; color: var(--muted); cursor: pointer;
  min-height: 48px;
}
.nav button svg { width: 22px; height: 22px; }
.nav button.active { color: var(--vermilion-deep); font-weight: 700; }
.view { display: none; animation: fade .25s ease; }
.view.on { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.study-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.flash {
  min-height: 320px;
  display: flex; flex-direction: column; justify-content: center;
  text-align: center;
  padding: 22px 16px 16px;
  cursor: pointer;
}
.flash .word {
  font-family: var(--font-en);
  font-size: clamp(1.8rem, 7vw, 2.6rem);
  line-height: 1.2;
  margin: 0 0 8px;
  word-break: break-word;
}
.flash .full { color: var(--ink-soft); font-size: 0.95rem; margin-bottom: 6px; }
.speak-row { display: flex; justify-content: center; gap: 8px; margin: 8px 0 4px; }
.speak {
  min-height: 40px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line); background: #fffaf3; cursor: pointer;
  font-size: 0.82rem; color: var(--terra);
}
.pos-tag {
  display: inline-block; font-size: 0.75rem; color: var(--ochre);
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; margin-bottom: 8px;
}
.meaning { text-align: left; font-size: 0.95rem; line-height: 1.7; margin: 12px 0 0; }
.example {
  text-align: left; margin-top: 12px; padding: 10px 12px;
  background: rgba(196, 132, 42, 0.08); border-radius: 12px;
  font-size: 0.9rem; line-height: 1.65;
}
.example .en { font-family: var(--font-en); font-style: italic; }
.example .zh { color: var(--ink-soft); margin-top: 4px; }
.hint-flip { margin-top: 22px; color: var(--muted); font-size: 0.82rem; }
.rate-bar {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
  margin-top: 12px;
}
.rate {
  min-height: 52px; border: 0; border-radius: 14px; cursor: pointer; font-weight: 700;
}
.rate.again { background: #F8D7CE; color: var(--vermilion-deep); }
.rate.hard { background: #F6E2B8; color: #8A5A10; }
.rate.good { background: #F0D59A; color: #6A3F12; }
.hidden { display: none !important; }

.quiz-q { font-family: var(--font-en); font-size: 1.5rem; text-align: center; margin: 8px 0 16px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice {
  text-align: left; min-height: 52px; padding: 10px 14px;
  border-radius: 14px; border: 1px solid var(--line);
  background: #fffaf3; cursor: pointer; font-size: 0.92rem; line-height: 1.5;
}
.choice.correct { background: #F0D59A; border-color: var(--ochre); }
.choice.wrong { background: #F8D7CE; border-color: var(--vermilion); }
.spell-input {
  width: 100%; min-height: 52px; font-size: 16px; padding: 12px 14px;
  border-radius: 14px; border: 1px solid var(--line); background: #fffaf3;
  color: var(--ink);
}
.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.tab {
  min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; cursor: pointer; font-size: 0.82rem; color: var(--ink-soft);
}
.tab.on { background: var(--vermilion); color: #FFF8EE; border-color: transparent; }

.heat { overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
.heat-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 3px; width: max-content; }
.heat-cell { width: 12px; height: 12px; border-radius: 3px; background: #EFE2CB; }
.legend { display: flex; align-items: center; gap: 4px; font-size: 0.72rem; color: var(--muted); margin-top: 8px; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.list-item {
  display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
  padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 0.9rem;
}
.list-item .w { font-family: var(--font-en); }
.toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid var(--line);
}
.toggle label { font-size: 0.92rem; }
.switch {
  position: relative; width: 46px; height: 28px; flex: 0 0 46px;
}
.switch input { opacity: 0; width: 0; height: 0; }
.switch span {
  position: absolute; inset: 0; background: #E4CDB0; border-radius: 99px; cursor: pointer;
}
.switch span::before {
  content: ""; position: absolute; width: 22px; height: 22px; border-radius: 50%;
  background: #fff; top: 3px; left: 3px; transition: transform .18s ease;
}
.switch input:checked + span { background: var(--vermilion); }
.switch input:checked + span::before { transform: translateX(18px); }
.field { margin: 10px 0; }
.field label { display: block; font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; font-size: 16px; padding: 10px 12px;
  border-radius: 12px; border: 1px solid var(--line); background: #fffaf3; color: var(--ink);
}
.field textarea { min-height: 120px; resize: vertical; font-family: var(--font-mono); font-size: 13px; }
.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 12px);
  transform: translateX(-50%) translateY(12px);
  background: var(--ink); color: #F8F0E1;
  padding: 10px 16px; border-radius: 999px; font-size: 0.85rem;
  opacity: 0; pointer-events: none; transition: .25s ease; z-index: 40;
  max-width: 90vw; text-align: center;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.modal-bg {
  position: fixed; inset: 0; background: rgba(59, 42, 28, 0.4);
  z-index: 30; display: flex; align-items: flex-end; justify-content: center;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
.modal {
  width: min(560px, 100%);
  background: var(--paper);
  border-radius: 20px;
  padding: 20px 18px 16px;
  box-shadow: 0 20px 50px rgba(59, 42, 28, 0.25);
  max-height: 86vh; overflow: auto;
}
.modal h3 { font-family: var(--font-serif); margin: 0 0 10px; }
@media (min-width: 720px) {
  .home-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 14px; align-items: start; }
  .home-grid .card { margin-bottom: 14px; }
  .card-energy { grid-column: 1; grid-row: 1; }
  .card-hours { grid-column: 1; grid-row: 2; }
  .card-progress { grid-column: 2; grid-row: 1; }
  .card-encourage { grid-column: 2; grid-row: 2; }
  .card-word { grid-column: 2; grid-row: 3; }
  .modal-bg { align-items: center; }
  .flash { min-height: 380px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>

      <div class="brand">

  <script>
const BANKS = {"finance":[{"id":"fin-001","bank":"finance","word":"FCN","full":"Fixed Coupon Note","ipa":"/ˌef siː ˈen/","pos":"n.","meaning":"固定票息票据。一种结构性票据，投资者通常按约定在各派息日收取固定票息；到期或提前终止时，本金能否全额返还，取决于挂钩标的表现以及是否触发敲入、敲出等条款。投资须承担发行人信用风险，具体权利义务以发行文件为准。","example":"The banker walked the client through how the FCN's knock-in barrier could affect principal at maturity.","exampleZh":"客户经理向客户说明，这份固定票息票据的敲入障碍会如何影响到期本金。"},{"id":"fin-002","bank":"finance","word":"CMT","full":"Constant Maturity Treasury","ipa":"/ˌsiː em ˈtiː/","pos":"n.","meaning":"固定期限国债（收益率）。指由美国国债收益率曲线按某一固定期限（如十年）插值得到的基准利率，常作为结构性票据或利率挂钩产品的参考利率。它不是某只特定国债的到期收益率，而是该期限的曲线点位。","example":"The note's coupon is linked to the 10-year CMT rate observed on each accrual date.","exampleZh":"该票据的票息与各累积观察日的十年期固定期限国债收益率挂钩。"},{"id":"fin-003","bank":"finance","word":"10-year CMT","full":"10-year Constant Maturity Treasury rate","ipa":"/ˌten jɪə ˌsiː em ˈtiː/","pos":"n.","meaning":"十年期固定期限国债收益率。美国国债收益率曲线上十年这一期限的基准利率，常见于与 CMT（Constant Maturity Treasury，固定期限国债收益率）挂钩的结构性产品。具体取值来源与观察日以产品条款为准。","example":"A rise in the 10-year CMT may change the coupon accrual of an interest-rate-linked note.","exampleZh":"十年期固定期限国债收益率上升，可能改变利率挂钩票据的票息累积。"},{"id":"fin-004","bank":"finance","word":"structured note","full":"","ipa":"/ˌstrʌktʃəd ˈnəʊt/","pos":"n.","meaning":"结构性票据。回报取决于挂钩标的（如股票、指数、利率或汇率等）表现，并按预设公式计算的债务工具。可能包含票息、敲入敲出、提前赎回等条款，风险与收益都可能不同于普通债券，须阅读发行文件。","example":"She compared the term sheet of the structured note with the product key facts statement.","exampleZh":"她把这份结构性票据的条款清单与产品资料概要对照阅读。"},{"id":"fin-005","bank":"finance","word":"structured product","full":"","ipa":"/ˌstrʌktʃəd ˈprɒdʌkt/","pos":"n.","meaning":"结构性产品。泛指将债券、期权或其他衍生工具组合而成、回报与挂钩标的挂钩的投资产品，包括结构性票据、结构性存款等。条款、风险和是否保本因产品而异，不能一概而论。","example":"Hong Kong regulators treat many structured products as complex products that require enhanced disclosure.","exampleZh":"香港监管机构将许多结构性产品视为复杂产品，并要求作更充分的披露。"},{"id":"fin-006","bank":"finance","word":"structured deposit","full":"","ipa":"/ˌstrʌktʃəd dɪˈpɒzɪt/","pos":"n.","meaning":"结构性存款。一种存款类产品，部分或全部回报与挂钩标的表现相连。它在法律与保障安排上可能有别于结构性票据，也不等于本金一定获得保障；具体以银行条款及适用的存款保障安排为准。","example":"The client asked whether the structured deposit was covered by the Deposit Protection Scheme.","exampleZh":"客户询问该结构性存款是否受存款保障计划保障。"},{"id":"fin-007","bank":"finance","word":"term sheet","full":"","ipa":"/ˈtɜːm ʃiːt/","pos":"n.","meaning":"条款清单（亦常称询价表或指示性条款表）。用简表概括产品主要条款，如期限、票息、障碍水平与观察日等。多数情况下属于指示性文件，并不等于具有完整约束力的最终条款或发行说明书。","example":"Please do not circulate the indicative term sheet until the issuer confirms the levels.","exampleZh":"在发行人确认各项水平之前，请勿传阅这份指示性条款清单。"},{"id":"fin-008","bank":"finance","word":"indicative terms","full":"","ipa":"/ɪnˈdɪkətɪv tɜːmz/","pos":"n.","meaning":"指示性条款。报价或条款清单上尚未最终确定的条款，通常可随市场变动而调整，对发行人与投资者一般不构成最终承诺。成交应以最终条款、定价补充文件或成交确认书为准。","example":"The knock-out barrier on the indicative terms may be revised at trade time.","exampleZh":"指示性条款中的敲出障碍，可能在成交时被修订。"},{"id":"fin-009","bank":"finance","word":"final terms","full":"","ipa":"/ˌfaɪnl ˈtɜːmz/","pos":"n.","meaning":"最终条款。在发行或成交时确定下来的产品条款，通常构成法律文件的一部分，效力高于先前的指示性条款清单。阅读时应与基础募集文件一并理解。","example":"The final terms set the strike at the official closing prices on the trade date.","exampleZh":"最终条款把行权水平定为交易日的官方收市价。"},{"id":"fin-010","bank":"finance","word":"pricing supplement","full":"","ipa":"/ˈpraɪsɪŋ ˌsʌplɪmənt/","pos":"n.","meaning":"定价补充文件。在中期票据或结构性票据计划下，就某一期产品补充具体定价与条款的法律文件，通常与基础募集说明书（base prospectus）一并阅读。","example":"The pricing supplement should be read together with the issuer's base prospectus.","exampleZh":"定价补充文件应与发行人的基础募集说明书一并阅读。"},{"id":"fin-011","bank":"finance","word":"offering circular","full":"","ipa":"/ˈɒfərɪŋ ˌsɜːkjələ/","pos":"n.","meaning":"发售通函。介绍证券发行安排、风险因素、发行人资料与条款的发售文件，供潜在投资者在认购前阅读。不同市场或计划下的文件名称可能不同。","example":"Investors were advised to read the offering circular before subscribing.","exampleZh":"建议投资者在认购前阅读发售通函。"},{"id":"fin-012","bank":"finance","word":"base prospectus","full":"","ipa":"/ˌbeɪs prəˈspektəs/","pos":"n.","meaning":"基础募集说明书（亦称基础招股章程）。在发行计划（programme）项下预先登记的基础文件，载明通用条款与风险；每一期产品再以最终条款或定价补充文件明确具体条件。","example":"Credit risk of the issuer is described in detail in the base prospectus.","exampleZh":"发行人信用风险在基础募集说明书中有详细说明。"},{"id":"fin-013","bank":"finance","word":"issuer","full":"","ipa":"/ˈɪʃuə/","pos":"n.","meaning":"发行人。发行票据或债券并承诺按条款付款的机构。即使产品在营销上被描述为“保本”，投资者仍须承担发行人（及如有的担保人）的信用风险：若发行人未能履约，本金与票息都可能受损。","example":"The team's due diligence started with the issuer's credit rating and financial disclosures.","exampleZh":"团队的尽职调查从发行人的信用评级与财务披露开始。"},{"id":"fin-014","bank":"finance","word":"guarantor","full":"","ipa":"/ˌɡærənˈtɔː/","pos":"n.","meaning":"担保人。在设有担保的产品中，承诺在发行人未能履约时，按担保文件履行相应付款或责任的机构。担保范围、条件与法律效力以担保文件为准，并不当然覆盖全部损失。","example":"The note is issued by the bank's vehicle and guaranteed by the parent company as guarantor.","exampleZh":"该票据由银行的发行载体发行，并由母公司作为担保人提供担保。"},{"id":"fin-015","bank":"finance","word":"underlying","full":"","ipa":"/ˌʌndəˈlaɪɪŋ/","pos":"n.","meaning":"挂钩标的（相关资产）。决定结构性产品回报的参考资产，可以是个股、指数、利率、汇率、一篮子资产等。条款中的观察、定盘与调整规则都围绕挂钩标的展开。","example":"This FCN has three underlyings and uses a worst-of payoff.","exampleZh":"这份固定票息票据挂钩三只标的，并采用表现最差者结算。"},{"id":"fin-016","bank":"finance","word":"basket","full":"","ipa":"/ˈbɑːskɪt/","pos":"n.","meaning":"一篮子标的。由多只股票、指数或其他资产组成的挂钩组合。回报可能取决于篮子平均值、表现最差或表现最优者，具体以条款中的公式为准。","example":"A worst-of basket can be riskier than a single-stock underlying because any one name may drag down the payoff.","exampleZh":"表现最差篮子可能比单只股票标的风险更高，因为任何一只都可能拖低回报。"},{"id":"fin-017","bank":"finance","word":"worst-of","full":"","ipa":"/ˈwɜːst ɒv/","pos":"adj./n.","meaning":"表现最差（标的）。指回报、是否敲入或是否自动赎回，按篮子中表现最差的那一只来计算。该结构常见于股票挂钩票据，通常比看单一标的或看平均值更严格。","example":"Because it is a worst-of note, a sharp drop in any one stock can trigger knock-in.","exampleZh":"由于这是表现最差结构，任何一只股票大跌都可能触发敲入。"},{"id":"fin-018","bank":"finance","word":"strike","full":"","ipa":"/straɪk/","pos":"n.","meaning":"行权价／执行水平。用于判断产品回报、敲入或交割数量的参考价格水平，通常由期初定盘价乘以约定百分比得出，或以期初定盘价本身作为行权水平。具体定义以条款为准。","example":"The strike was set at 100% of the official closing price on the initial fixing date.","exampleZh":"行权水平定为初始定盘日官方收市价的百分之一百。"},{"id":"fin-019","bank":"finance","word":"initial fixing","full":"","ipa":"/ɪˈnɪʃl ˈfɪksɪŋ/","pos":"n.","meaning":"期初定价／初始定盘。在约定的初始定盘日，按指定价格来源（如交易所官方收市价）确定挂钩标的初始水平的过程，常作为行权水平和各障碍的计算基准。","example":"The trade is subject to initial fixing on the two underlyings tomorrow.","exampleZh":"这笔交易须待明日就两只挂钩标的完成初始定盘。"},{"id":"fin-020","bank":"finance","word":"coupon","full":"","ipa":"/ˈkuːpɒn/","pos":"n.","meaning":"票息。债券或票据按约定向投资者支付的利息或收益金额。普通债券的票息多按固定或浮动利率计算；结构性票据的票息则可能是固定的，也可能取决于是否触发观察条件。","example":"The note pays a quarterly coupon of 12% per annum, subject to the terms.","exampleZh":"该票据按年利率百分之十二按季派息，具体以条款为准。"},{"id":"fin-021","bank":"finance","word":"autocall","full":"","ipa":"/ˈɔːtəʊkɔːl/","pos":"n.","meaning":"自动赎回（亦称自动提前终止）。若挂钩标的在预定观察日达到或超过自动赎回／敲出水平，产品提前终止，并按条款支付本金及相应票息或返还金额。未触发则继续存续至下一观察日或到期。","example":"The autocall barrier is set at 100% of the initial fixing.","exampleZh":"自动赎回障碍设为初始定盘水平的百分之一百。"},{"id":"fin-022","bank":"finance","word":"autocallable","full":"","ipa":"/ˌɔːtəʊˈkɔːləbl/","pos":"adj.","meaning":"可自动赎回的。形容含有自动赎回机制的票据或结构：在观察日若满足预定条件，产品即提前结束。是否触发、支付多少，须按该产品的自动赎回条款确定。","example":"The client preferred an autocallable note with monthly observations.","exampleZh":"客户更倾向选择每月观察的可自动赎回票据。"},{"id":"fin-023","bank":"finance","word":"knock-out","full":"KO","ipa":"/ˌnɒk ˈaʊt/","pos":"n.","meaning":"敲出（Knock-Out，简称 KO）。当挂钩标的触及预定敲出障碍时，某一期权成分或整个产品结构被终止；在自动赎回产品中，敲出常意味着提前赎回。障碍是连续观察还是仅在观察日观察，以条款为准。","example":"If the index closes at or above the knock-out barrier, the note is redeemed early.","exampleZh":"若指数收市价达到或高于敲出障碍，票据将提前赎回。"},{"id":"fin-024","bank":"finance","word":"knock-in","full":"KI","ipa":"/ˌnɒk ˈɪn/","pos":"n.","meaning":"敲入（Knock-In，简称 KI）。当挂钩标的触及预定敲入障碍时，某一或有条款被激活，常见的是使投资者开始承担类似卖出看跌期权的下跌风险。若从未敲入，到期本金处理可能更有利，但仍须阅读具体条款并承担发行人信用风险。","example":"The knock-in barrier is 70% of the initial fixing and is observed at the close only.","exampleZh":"敲入障碍为初始定盘的百分之七十，且仅以收市价观察。"},{"id":"fin-025","bank":"finance","word":"barrier","full":"","ipa":"/ˈbæriə/","pos":"n.","meaning":"障碍（水平）。结构性产品中用于判断敲入、敲出、派息或自动赎回的价格或收益率水平。应同时分清障碍的高低、观察方式（持续、收市或仅在指定日）以及触发后的后果。","example":"The term sheet lists separate barriers for coupon, autocall and knock-in.","exampleZh":"条款清单分别列明了派息、自动赎回和敲入的障碍水平。"},{"id":"fin-026","bank":"finance","word":"KO rebate","full":"knock-out rebate","ipa":"/ˌkeɪ ˈəʊ ˌriːbeɪt/","pos":"n.","meaning":"敲出返还（Knock-Out rebate）。产品因触发敲出或自动赎回而提前终止时，按条款支付的额外金额或补偿，有别于常规票息。是否支付、如何计算，必须以发行文件为准，不能假设一定有返还。","example":"The shark-fin structure pays a KO rebate if the upper barrier is touched.","exampleZh":"若触及上障碍，该鲨鱼鳍结构将支付敲出返还。"},{"id":"fin-027","bank":"finance","word":"participation rate","full":"","ipa":"/pɑːˌtɪsɪˈpeɪʃn reɪt/","pos":"n.","meaning":"参与率。用于计算投资者能分享多少挂钩标的上涨（或约定方向的表现）的比例。例如参与率为百分之八十，通常表示只按标的正向表现的八成计算收益部分，具体公式以条款为准。","example":"A higher participation rate usually means less attractive coupon or barrier terms, all else equal.","exampleZh":"在其他条件相近时，更高的参与率通常意味着票息或障碍条款相对不那么优厚。"},{"id":"fin-028","bank":"finance","word":"minimum redemption","full":"","ipa":"/ˌmɪnɪməm rɪˈdempʃn/","pos":"n.","meaning":"最低赎回金额。条款中约定的到期或赎回时可能支付的最低金额，常见于部分保本或设有下限的结构。最低赎回并不消除发行人信用风险，也不等于在所有提前终止情形下都适用。","example":"The note offers 100% minimum redemption at maturity, subject to issuer credit risk.","exampleZh":"该票据约定到期最低赎回百分之百本金，但仍须承担发行人信用风险。"},{"id":"fin-029","bank":"finance","word":"principal protection","full":"","ipa":"/ˌprɪnsəpl prəˈtekʃn/","pos":"n.","meaning":"本金保障（亦称保本安排）。指按条款在到期时偿还全部或约定比例本金的设计。即使有本金保障，投资者仍须承担发行人信用风险、流动性风险以及提前赎回或机会成本等；保障范围以法律文件为准。","example":"Principal protection does not mean the product is risk-free if the issuer defaults.","exampleZh":"如果发行人违约，本金保障并不意味着产品没有风险。"},{"id":"fin-030","bank":"finance","word":"principal-at-risk","full":"","ipa":"/ˌprɪnsəpl ət ˈrɪsk/","pos":"adj.","meaning":"本金受险／非保本。指投资者可能因挂钩表现、敲入或交割机制而无法收回全部本金的产品特征。最大亏损在不少股票挂钩产品中可以达到全部本金，另须承担发行人信用风险。","example":"The relationship manager clearly labelled the FCN as a principal-at-risk product.","exampleZh":"客户经理明确将该固定票息票据标注为本金受险产品。"},{"id":"fin-031","bank":"finance","word":"notional amount","full":"","ipa":"/ˈnəʊʃənl əˌmaʊnt/","pos":"n.","meaning":"名义本金（亦称名义金额）。用于计算票息、赎回金额或交割数量的参考金额，通常也是投资者的投资金额。它是计算基数，并不保证到期一定全额收回。","example":"Coupons are calculated on a notional amount of 100,000 US dollars.","exampleZh":"票息按十万美元的名义本金计算。"},{"id":"fin-032","bank":"finance","word":"tenor","full":"","ipa":"/ˈtenə/","pos":"n.","meaning":"期限。产品从生效或发行到计划到期之间的存续时长，如六个月、一年或三年。若有自动赎回或发行人赎回权，实际存续期可能短于原定年限。","example":"The client wanted a tenor of about six months rather than two years.","exampleZh":"客户希望期限大约六个月，而不是两年。"},{"id":"fin-033","bank":"finance","word":"maturity","full":"","ipa":"/məˈtʃʊərəti/","pos":"n.","meaning":"到期（日）。产品计划终止并按条款结算剩余款项或进行交割的时点。若已提前赎回，则不会持有至原到期日。应同时留意到期日、最终估值日与资金交收日的区别。","example":"The final valuation date is three business days before maturity.","exampleZh":"最终估值日在到期日前三个营业日。"},{"id":"fin-034","bank":"finance","word":"observation date","full":"","ipa":"/ˌɒbzəˈveɪʃn deɪt/","pos":"n.","meaning":"观察日。按条款观察挂钩标的价格或利率，以判断是否派息、敲入、敲出或自动赎回的预定日期。若遇市场中断，可能按中断事件条款顺延或改用备用来源。","example":"There is an observation date each month, starting from the first month after issue.","exampleZh":"自发行后第一个月起，每月设有一个观察日。"},{"id":"fin-035","bank":"finance","word":"valuation date","full":"","ipa":"/ˌvæljuˈeɪʃn deɪt/","pos":"n.","meaning":"估值日／定价日。用于确定挂钩水平和结算金额的日期，包括期初估值、定期观察及最终估值等。估值日不一定等于付款日或到期日。","example":"Payoff is determined on the final valuation date, with payment at maturity.","exampleZh":"回报在最终估值日确定，并在到期日支付。"},{"id":"fin-036","bank":"finance","word":"early redemption","full":"","ipa":"/ˌɜːli rɪˈdempʃn/","pos":"n.","meaning":"提前赎回。产品在原定到期日之前终止并按条款还款，原因可能包括自动赎回、发行人行使赎回权或发生约定的提前终止事件。提前赎回会影响实际持有期和再投资安排。","example":"Early redemption will be paid in cash five business days after the trigger date.","exampleZh":"提前赎回款项将在触发日后五个营业日以现金支付。"},{"id":"fin-037","bank":"finance","word":"callable","full":"","ipa":"/ˈkɔːləbl/","pos":"adj.","meaning":"可赎回的。通常指发行人有权在约定日期按约定价格赎回债券或票据。对投资者而言，赎回权往往在对发行人有利时行使，从而带来再投资风险。","example":"The callable bond may be redeemed by the issuer on any coupon date after year three.","exampleZh":"该可赎回债券可由发行人在第三年后的任何一个派息日赎回。"},{"id":"fin-038","bank":"finance","word":"range accrual","full":"","ipa":"/reɪndʒ əˈkruːəl/","pos":"n.","meaning":"区间累积。一种计息方式：仅当参考利率或挂钩标的落在约定区间内时，当日（或当期）才累积票息；在区间外的日子可能不累积或按较低利率累积，具体以条款为准。","example":"The range accrual note accrues interest only on days when the 10-year CMT stays inside the corridor.","exampleZh":"该区间累积票据仅在十年期固定期限国债收益率处于约定走廊内的日子累积利息。"},{"id":"fin-039","bank":"finance","word":"snowball","full":"","ipa":"/ˈsnəʊbɔːl/","pos":"n.","meaning":"雪球结构。市场对一类自动赎回股票挂钩结构的俗称，通常定期观察，若满足条件则提前赎回并派发约定收益；若未赎回且触及敲入等条件，到期可能承受本金损失。不同发行人的条款差异很大，须以文件为准。","example":"The team prepared a one-page comparison of two snowball structures with different knock-in levels.","exampleZh":"团队做了一页对照，比较两款敲入水平不同的雪球结构。"},{"id":"fin-040","bank":"finance","word":"shark fin","full":"","ipa":"/ˈʃɑːk fɪn/","pos":"n.","meaning":"鲨鱼鳍。一类障碍期权结构（看涨或看跌变体），在标的未触及障碍时，收益常随表现按参与率计算；一旦触及障碍，收益可能变为较低的敲出返还或固定金额。常见于结构性票据或结构性存款，条款以发行文件为准。","example":"The bullish shark fin pays enhanced upside unless the knock-out barrier is hit.","exampleZh":"除非触及敲出障碍，否则该看涨鲨鱼鳍可提供增强的上行参与。"},{"id":"fin-041","bank":"finance","word":"reverse convertible","full":"","ipa":"/rɪˌvɜːs kənˈvɜːtəbl/","pos":"n.","meaning":"反向可转换票据。一种股票挂钩短期票据，通常提供较高票息，但若标的下跌并满足约定条件，投资者可能以现金或股票形式承受本金损失，相当于在持有债券的同时卖出了看跌期权。","example":"A reverse convertible typically offers a high coupon in exchange for downside risk on the underlying share.","exampleZh":"反向可转换票据通常以较高票息，换取投资者承担挂钩股票的下行风险。"},{"id":"fin-042","bank":"finance","word":"ELN","full":"Equity Linked Note","ipa":"/ˌiː el ˈen/","pos":"n.","meaning":"股票挂钩票据（Equity Linked Note）。回报与一只或多只股票表现挂钩的结构性票据，可能包含票息、敲入、敲出或到期转股等机制，本金通常受险。须承担挂钩股票风险与发行人信用风险。","example":"The ELN may deliver shares of the worst-performing stock if it finishes below the strike.","exampleZh":"若表现最差的股票期末低于行权水平，该股票挂钩票据可能以股票交割。"},{"id":"fin-043","bank":"finance","word":"ELI","full":"Equity Linked Instrument","ipa":"/ˌiː el ˈaɪ/","pos":"n.","meaning":"股票挂钩投资工具（Equity Linked Instrument）。香港市场对一类股票挂钩结构性产品的常用称谓，回报与挂钩股票表现相连，通常本金受险。销售文件中可能同时出现 ELI 与其他产品名称，应以该产品的法律文件为准。","example":"The bank's private wealth desk offers ELIs to professional investors only.","exampleZh":"该行私人财富部门仅向专业投资者提供股票挂钩投资工具。"},{"id":"fin-044","bank":"finance","word":"phoenix note","full":"","ipa":"/ˈfiːnɪks nəʊt/","pos":"n.","meaning":"凤凰票据。一类自动赎回结构，通常在观察日若标的高于派息障碍即可派息，即使未必触发提前赎回；部分产品带有记忆机制。名称是市场俗称，具体条件以条款为准。","example":"This phoenix note pays a coupon if the worst-of stock closes above 70% of its initial fixing.","exampleZh":"若表现最差的股票收市高于其初始定盘的百分之七十，该凤凰票据即派发票息。"},{"id":"fin-045","bank":"finance","word":"memory coupon","full":"","ipa":"/ˈmeməri ˌkuːpɒn/","pos":"n.","meaning":"记忆票息／记忆机制。若某期因未达到派息条件而没有派息，在后续观察日一旦满足条件，可把此前未付的票息一并补发。是否具备记忆、补发几期，必须以条款为准。","example":"Thanks to the memory coupon, missed coupons may be paid later if the barrier is met.","exampleZh":"由于设有记忆票息，若之后满足障碍条件，此前未付的票息有可能被补发。"},{"id":"fin-046","bank":"finance","word":"accumulator","full":"","ipa":"/əˈkjuːmjəleɪtə/","pos":"n.","meaning":"累积认购合约（Accumulator）。一种高风险的场外衍生合约，投资者按约定在期限内分批以低于期初市价的行使价买入挂钩股票；若价格大涨可能被提前敲出，若大跌则可能按约定被要求持续买入，亏损可能很大。香港证监会及投资者及理财教育委员会曾多次提醒其风险。","example":"An accumulator can require repeated share purchases if the stock falls, which may lead to substantial losses.","exampleZh":"若股价下跌，累积认购合约可能要求投资者持续买入股票，从而造成重大亏损。"},{"id":"fin-047","bank":"finance","word":"decumulator","full":"","ipa":"/diːˈkjuːmjəleɪtə/","pos":"n.","meaning":"累积认沽／分批卖出合约（Decumulator）。与累积认购相反的高风险场外结构，投资者按约定分批卖出挂钩股票。价格向不利方向运行时，卖出数量或亏损可能扩大，同样必须充分理解条款与最坏情况。","example":"A decumulator may force the investor to sell more shares if the price rises sharply.","exampleZh":"若价格大幅上涨，累积认沽合约可能迫使投资者卖出更多股票。"},{"id":"fin-048","bank":"finance","word":"unwind","full":"","ipa":"/ʌnˈwaɪnd/","pos":"v./n.","meaning":"提前平仓／提前终止。在到期前把结构性产品或衍生合约终止，并按当时市值或发行人报价结算盈亏。平仓价格通常包含买卖差价与终止成本，可能明显差于理论估值。","example":"The client asked for an unwind quote because she needed liquidity this week.","exampleZh":"客户需要本周动用资金，因而要求给出提前平仓报价。"},{"id":"fin-049","bank":"finance","word":"RFQ","full":"Request for Quote","ipa":"/ˌɑːr ef ˈkjuː/","pos":"n.","meaning":"询价（Request for Quote）。向发行人、交易台或经纪发出的报价请求，用于获取指示性或可成交的价格与条款。询价结果在确认成交前通常仍可变更。","example":"Please send an RFQ for a six-month FCN on those two names with a 70% knock-in.","exampleZh":"请就这两只股票、敲入百分之七十、期限六个月的固定票息票据发出询价。"},{"id":"fin-050","bank":"finance","word":"issue price","full":"","ipa":"/ˈɪʃuː praɪs/","pos":"n.","meaning":"发行价。产品在发行或成交时的价格，常以名义本金的百分比表示，例如百分之一百。发行价不等于二级市场此后的买入或卖出价，也不保证投资者可按该价格提前变现。","example":"The notes were issued at an issue price of 100% of the notional amount.","exampleZh":"该票据按名义本金的百分之一百发行。"},{"id":"fin-051","bank":"finance","word":"cash settlement","full":"","ipa":"/kæʃ ˈsetlmənt/","pos":"n.","meaning":"现金结算。到期或触发事件后，以现金支付应付金额，而不交割股票或其他挂钩资产。现金数额按条款中的公式及估值日价格计算。","example":"If the product is cash-settled, the investor will not receive physical shares.","exampleZh":"若产品以现金结算，投资者不会收到实物股票。"},{"id":"fin-052","bank":"finance","word":"physical delivery","full":"","ipa":"/ˌfɪzɪkl dɪˈlɪvəri/","pos":"n.","meaning":"实物交割。到期时按条款向投资者交付挂钩股票（或其他资产），而不是只支付现金。交割数量通常与名义本金和行权价有关，可能出现零股以现金结清的安排。","example":"Physical delivery of the worst-of stock will occur if knock-in has been triggered and the final level is below the strike.","exampleZh":"若已触发敲入且期末水平低于行权价，将以表现最差的股票进行实物交割。"},{"id":"fin-053","bank":"finance","word":"official closing price","full":"","ipa":"/əˌfɪʃl ˈkləʊzɪŋ praɪs/","pos":"n.","meaning":"官方收市价。交易所或条款指定来源公布的正式收市价格，常作为定盘、观察与结算的依据。它可能不同于盘中成交价或某数据商的临时报价。","example":"Knock-in is observed against the official closing price, not the intra-day low.","exampleZh":"是否敲入按官方收市价观察，而不是按盘中最低价。"},{"id":"fin-054","bank":"finance","word":"market disruption","full":"","ipa":"/ˌmɑːkɪt dɪsˈrʌpʃn/","pos":"n.","meaning":"市场中断。交易暂停、无法公布收市价或其他条款所列事件，导致无法按原定方式定盘。发生后通常按市场中断条款顺延估值日或改用备用来源，具体处理以发行文件为准。","example":"If a market disruption event occurs, the valuation date may be postponed.","exampleZh":"如发生市场中断事件，估值日可能被顺延。"},{"id":"fin-055","bank":"finance","word":"corporate action","full":"","ipa":"/ˌkɔːpərət ˈækʃn/","pos":"n.","meaning":"公司行动。如分红、拆股、合并、换股、退市等可能影响挂钩股票价格或可交割性的事件。结构性产品通常授权计算代理人按条款作出调整，以维持经济效果尽量公平。","example":"A special dividend may lead to a corporate action adjustment of the strike and barriers.","exampleZh":"特别股息可能导致行权价和障碍水平按公司行动规则调整。"},{"id":"fin-056","bank":"finance","word":"issuer risk","full":"","ipa":"/ˈɪʃuə rɪsk/","pos":"n.","meaning":"发行人风险（信用风险的一种）。指发行人未能按期支付票息或偿还本金的风险。即使产品在结构上设计为到期偿还本金，一旦发行人违约，投资者仍可能损失部分或全部投资。","example":"Issuer risk remains even when a structured note is described as principal-protected.","exampleZh":"即使结构性票据被描述为保本，发行人风险依然存在。"},{"id":"fin-057","bank":"finance","word":"liquidity risk","full":"","ipa":"/lɪˈkwɪdəti rɪsk/","pos":"n.","meaning":"流动性风险。指难以在需要时按合理价格变现的风险。许多结构性票据没有活跃的二级市场，提前退出往往只能依赖发行人的指示性回购报价，买卖差价可能较宽。","example":"Liquidity risk means you may not be able to sell the note quickly without a significant cost.","exampleZh":"流动性风险意味着，你可能无法在不承担显著成本的情况下迅速卖出该票据。"},{"id":"fin-058","bank":"finance","word":"market risk","full":"","ipa":"/ˈmɑːkɪt rɪsk/","pos":"n.","meaning":"市场风险。因挂钩标的价格、利率、汇率或波动率等市场变量变动，导致产品市值或最终回报不利变化的风险。它是结构性产品和普通证券都可能面对的基本风险。","example":"Market risk on a worst-of note can be higher than on a single-stock note.","exampleZh":"表现最差结构票据的市场风险，可能高于单只股票挂钩票据。"},{"id":"fin-059","bank":"finance","word":"currency risk","full":"","ipa":"/ˈkʌrənsi rɪsk/","pos":"n.","meaning":"汇率风险（亦称货币风险）。当投资币种与投资者的参考货币不同，或产品本身含有汇率挂钩成分时，汇率变动可能增加收益或扩大亏损。即使挂钩股票表现理想，汇率不利也可能侵蚀回报。","example":"The dollar-denominated note carries currency risk for an investor whose spending is in Hong Kong dollars.","exampleZh":"对以港元作为主要支出货币的投资者而言，该美元计价票据带有汇率风险。"},{"id":"fin-060","bank":"finance","word":"reinvestment risk","full":"","ipa":"/ˌriːɪnˈvestmənt rɪsk/","pos":"n.","meaning":"再投资风险。产品被提前赎回或付息后，投资者可能无法再按原来的收益率找到类似投资。可赎回债券和自动赎回票据都可能使投资者更早面对这一问题。","example":"If the note is autocalled after one month, the client faces reinvestment risk in a lower-yield market.","exampleZh":"若票据在一个月后即被自动赎回，客户在较低收益的市场中就会面临再投资风险。"},{"id":"fin-061","bank":"finance","word":"European barrier","full":"","ipa":"/ˌjʊərəˈpiːən ˈbæriə/","pos":"n.","meaning":"欧式障碍。仅在指定估值日或到期时观察是否触及障碍，而不在整个期限内持续观察。因此盘中或非观察日触及该水平，通常并不构成触发，除非条款另有约定。","example":"A European barrier is checked only on the final valuation date, not intra-day.","exampleZh":"欧式障碍只在最终估值日检查，而不按盘中价格检查。"},{"id":"fin-062","bank":"finance","word":"American barrier","full":"","ipa":"/əˈmerɪkən ˈbæriə/","pos":"n.","meaning":"美式障碍。在约定期间内持续观察（或每个交易日观察）是否触及障碍，因此比仅在到期观察的欧式障碍更容易被触发。持续观察的具体规则，如是否包括盘中价格，须以条款为准。","example":"An American barrier can be triggered on any trading day during the life of the note.","exampleZh":"美式障碍在票据存续期内的任何一个交易日都可能被触发。"},{"id":"fin-063","bank":"finance","word":"bond","full":"","ipa":"/bɒnd/","pos":"n.","meaning":"债券。发行人向投资者借入资金并承诺按约定支付利息、到期偿还本金的债务凭证。债券价格会随利率、信用评级和市场供求变动，同样存在信用风险与流动性风险。","example":"Government bonds are often used as a benchmark for pricing corporate credit.","exampleZh":"政府债券常被用作为企业信用定价的基准。"},{"id":"fin-064","bank":"finance","word":"yield","full":"","ipa":"/jiːld/","pos":"n.","meaning":"收益率。衡量债券或投资回报水平的指标，常见的有当期收益率、到期收益率等。收益率与价格通常反向变动：价格上升时，到期收益率往往下降。不同口径的收益率不可直接混用。","example":"Bond prices fell and the yield moved higher after the data release.","exampleZh":"数据公布后，债券价格下跌，收益率走高。"},{"id":"fin-065","bank":"finance","word":"YTM","full":"Yield to Maturity","ipa":"/ˌwaɪ tiː ˈem/","pos":"n.","meaning":"到期收益率（Yield to Maturity）。假设投资者持有债券至到期、按期收到全部票息并再投资、且发行人未违约时，使未来现金流现值等于当前全价的内部回报率。它是估计值，并不保证实际回报。","example":"The bond was quoted at a YTM of 4.2% on a semi-annual basis.","exampleZh":"该债券按半年复利口径报出的到期收益率为百分之四点二。"},{"id":"fin-066","bank":"finance","word":"YTC","full":"Yield to Call","ipa":"/ˌwaɪ tiː ˈsiː/","pos":"n.","meaning":"至赎回收益率（Yield to Call）。假设债券在下一个或某一约定赎回日被发行人赎回，并按赎回价格计算得到的收益率。对可赎回债券，除到期收益率外，还常需关注至赎回收益率。","example":"Because the bond is trading above par, its YTC is lower than its yield to maturity.","exampleZh":"由于该债券溢价交易，其至赎回收益率低于到期收益率。"},{"id":"fin-067","bank":"finance","word":"duration","full":"","ipa":"/djʊˈreɪʃn/","pos":"n.","meaning":"久期。衡量债券价格对利率变动敏感度的常用指标，也反映收回现金流的加权平均时间。久期越长，在其他条件相近时，利率上升通常导致更大的价格跌幅。须分清麦考利久期与修正久期等不同口径。","example":"Longer-duration bonds lost more value when yields rose.","exampleZh":"收益率上升时，久期较长的债券跌幅更大。"},{"id":"fin-068","bank":"finance","word":"modified duration","full":"","ipa":"/ˌmɒdɪfaɪd djʊˈreɪʃn/","pos":"n.","meaning":"修正久期。在麦考利久期基础上调整计息频率后，用来近似估计收益率变动百分之一（或一个百分点）时债券价格变动的百分比。它是线性近似，大幅利率变动时还需考虑凸性。","example":"A modified duration of 6 suggests a 1% rise in yield may cut the price by about 6%, all else equal.","exampleZh":"在其他条件不变时，修正久期为六，意味着收益率上升一个百分点，价格大约下跌百分之六。"},{"id":"fin-069","bank":"finance","word":"convexity","full":"","ipa":"/kənˈveksəti/","pos":"n.","meaning":"凸性。描述债券价格与收益率关系弯曲程度的指标，用来补充久期的线性近似。正凸性意味着利率下降时价格升幅可能大于利率同样幅度上升时的跌幅，具体仍取决于债券条款。","example":"Callable bonds can have negative convexity when the issuer is likely to call.","exampleZh":"当发行人很可能行使赎回权时，可赎回债券可能呈现负凸性。"},{"id":"fin-070","bank":"finance","word":"DV01","full":"Dollar Value of an 01","ipa":"/ˌdiː viː ˈəʊ wʌn/","pos":"n.","meaning":"基点价值（Dollar Value of an 01，亦称 PV01）。衡量收益率变动一个基点（百分之零点零一）时，债券或利率头寸价格变动的金额。常用于利率风险管理与对冲规模估算。","example":"The desk hedged the portfolio so that the net DV01 was close to zero.","exampleZh":"交易台对投资组合做了对冲，使净基点价值接近于零。"},{"id":"fin-071","bank":"finance","word":"yield curve","full":"","ipa":"/ˈjiːld kɜːv/","pos":"n.","meaning":"收益率曲线。把不同期限的利率或债券收益率连成的曲线，常见的有国债曲线和掉期曲线。曲线变陡、变平或倒挂，往往被用来观察市场对增长与利率路径的预期，但并不能单独作为预测依据。","example":"The Treasury yield curve flattened after the central bank's comments.","exampleZh":"央行表态后，国债收益率曲线变得更平坦。"},{"id":"fin-072","bank":"finance","word":"credit spread","full":"","ipa":"/ˈkredɪt spred/","pos":"n.","meaning":"信用利差。债券收益率高于相应期限无风险或基准利率的部分，用来补偿发行人信用风险及其他因素。利差扩大通常表示信用资产相对更便宜或风险溢价上升，须结合评级与流动性理解。","example":"The credit spread on the issuer's five-year bond widened by ten basis points.","exampleZh":"该发行人五年期债券的信用利差扩大了十个基点。"},{"id":"fin-073","bank":"finance","word":"basis point","full":"","ipa":"/ˈbeɪsɪs pɔɪnt/","pos":"n.","meaning":"基点。利率或收益率的计量单位，一个基点等于百分之零点零一，即万分之一。例如收益率从百分之三点五〇升至百分之三点六〇，就是上升十个基点。","example":"The coupon was cut by 25 basis points to 3.75%.","exampleZh":"票息下调二十五个基点，至百分之三点七五。"},{"id":"fin-074","bank":"finance","word":"par value","full":"","ipa":"/pɑː ˈvæljuː/","pos":"n.","meaning":"面值／平价。债券上载明的本金金额，也常作价格报价的百分之百基准。债券以平价交易，指价格约等于面值；高于面值为溢价，低于面值为折价。","example":"The bond was issued at par value and later traded at a premium.","exampleZh":"该债券按面值发行，后来溢价交易。"},{"id":"fin-075","bank":"finance","word":"clean price","full":"","ipa":"/kliːn praɪs/","pos":"n.","meaning":"净价。不含应计利息的债券报价。国际债券市场通常以净价报价，但买方实际支付的是净价加上应计利息后的全价。","example":"The clean price does not include the accrued interest that the buyer must pay.","exampleZh":"净价不包括买方须支付的应计利息。"},{"id":"fin-076","bank":"finance","word":"dirty price","full":"","ipa":"/ˈdɜːti praɪs/","pos":"n.","meaning":"全价。净价加上应计利息后的实际成交金额，也就是买方为购入债券真正支付的价格。计算到期收益率时，通常使用全价作为当前投入。","example":"Yield to maturity is calculated from the dirty price, not the clean price alone.","exampleZh":"到期收益率按全价计算，而不是只按净价。"},{"id":"fin-077","bank":"finance","word":"accrued interest","full":"","ipa":"/əˌkruːd ˈɪntrəst/","pos":"n.","meaning":"应计利息。自上一个派息日（或起息日）起，按照计息基准已经累积、但尚未支付的利息。买卖债券时，买方通常向卖方支付应计利息。","example":"Accrued interest depends on the day-count convention stated in the bond terms.","exampleZh":"应计利息取决于债券条款中列明的计息基准。"},{"id":"fin-078","bank":"finance","word":"senior unsecured","full":"","ipa":"/ˌsiːniə ʌnˈsɪkjʊəd/","pos":"adj.","meaning":"高级无抵押。指清偿顺序相对靠前、但没有以特定资产作抵押的债务。一旦发行人破产，其受偿顺序通常优于次级债，但仍可能无法全额收回，具体以法律文件及当地破产规则为准。","example":"The structured notes were issued as senior unsecured obligations of the bank.","exampleZh":"这些结构性票据以该银行的高级无抵押债务形式发行。"},{"id":"fin-079","bank":"finance","word":"subordinated bond","full":"","ipa":"/səˈbɔːdɪneɪtɪd bɒnd/","pos":"n.","meaning":"次级债券。清偿顺序排在高级债务之后的债券，因此信用风险通常高于同一发行人的高级债，收益率也往往较高。部分银行资本工具还可能含有减记或转股条款。","example":"A subordinated bond usually yields more than the issuer's senior notes to compensate for lower priority.","exampleZh":"次级债券的收益率通常高于同一发行人的高级票据，以补偿其较低的清偿顺序。"},{"id":"fin-080","bank":"finance","word":"investment grade","full":"","ipa":"/ɪnˈvestmənt ɡreɪd/","pos":"adj./n.","meaning":"投资级。信用评级机构把相对较高信用质量的债券列为投资级，例如标普（Standard & Poor's）口径下通常为 BBB- 或以上。投资级并不等于没有违约风险，也不构成投资建议。","example":"The mandate allows only investment-grade bonds in the credit portfolio.","exampleZh":"该投资授权仅允许信用组合配置投资级债券。"},{"id":"fin-081","bank":"finance","word":"high-yield bond","full":"","ipa":"/ˌhaɪ ˈjiːld bɒnd/","pos":"n.","meaning":"高收益债券。信用评级低于投资级的债券，亦常被称为投机级债券。其票息或收益率通常较高，以补偿更高的违约风险、价格波动和流动性风险。","example":"High-yield bonds can fall sharply when investors become more risk-averse.","exampleZh":"当投资者风险偏好下降时，高收益债券可能大幅下跌。"},{"id":"fin-082","bank":"finance","word":"credit rating","full":"","ipa":"/ˈkredɪt ˌreɪtɪŋ/","pos":"n.","meaning":"信用评级。评级机构对发行人或不特定债务工具偿付能力的意见，常见机构包括标普、穆迪（Moody's）和惠誉（Fitch）。评级会调整，且只是意见，不能替代独立的尽职调查。","example":"A downgrade of the credit rating may widen the issuer's credit spread.","exampleZh":"信用评级被下调，可能导致该发行人的信用利差扩大。"},{"id":"fin-083","bank":"finance","word":"default","full":"","ipa":"/dɪˈfɔːlt/","pos":"n./v.","meaning":"违约。债务人未能按约定支付利息、偿还本金，或发生条款所定义的其他违约事件。违约后的回收金额不确定，投资者可能遭受重大本金损失。","example":"Issuer default can cause losses even on a note that was marketed as principal-protected.","exampleZh":"即使产品在营销中被称作保本，发行人违约仍可能造成亏损。"},{"id":"fin-084","bank":"finance","word":"perpetual bond","full":"","ipa":"/pəˈpetʃuəl bɒnd/","pos":"n.","meaning":"永续债券。没有固定到期日、原则上可长期支付票息的债券，许多品种带有发行人赎回权和停息或重置条款。价格对利率和信用利差往往更敏感，条款也比普通债券复杂。","example":"The perpetual bond pays a coupon until the issuer calls it or an interest-cancellation feature is triggered.","exampleZh":"该永续债券会持续派息，直至发行人赎回或触发停息条款。"},{"id":"fin-085","bank":"finance","word":"convertible bond","full":"","ipa":"/kənˈvɜːtəbl bɒnd/","pos":"n.","meaning":"可转换债券。持有人有权在约定条件下把债券转换成发行人股票的债券。其价值既受利率和信用的影响，也受正股价格与波动率影响，分析时需同时看到债性和股性。","example":"The convertible bond rose after the share price moved well above the conversion price.","exampleZh":"正股价格明显高于转股价后，该可转换债券价格上涨。"},{"id":"fin-086","bank":"finance","word":"day-count convention","full":"","ipa":"/ˈdeɪ kaʊnt kənˈvenʃn/","pos":"n.","meaning":"计息基准／日算惯例。约定如何计算一段期间的天数与一年的天数，例如 Actual/365、Actual/360 或 30/360，从而影响应计利息和票息金额。同一票面利率在不同计息基准下，实际金额可能不同。","example":"The accrual follows an Actual/365 day-count convention.","exampleZh":"利息按实际天数／365 的计息基准累积。"},{"id":"fin-087","bank":"finance","word":"business day convention","full":"","ipa":"/ˈbɪznɪs deɪ kənˈvenʃn/","pos":"n.","meaning":"营业日调整惯例。当付款日或观察日不是营业日时，如何调整到邻近营业日的规则，常见的有顺延（Following）、修正顺延（Modified Following）和提前（Preceding）。相关营业日中心（如香港、纽约）也由条款指定。","example":"Payment dates are adjusted in accordance with the Modified Following business day convention.","exampleZh":"付款日按修正顺延的营业日惯例调整。"},{"id":"fin-088","bank":"finance","word":"ISIN","full":"International Securities Identification Number","ipa":"/ˈaɪsɪn/","pos":"n.","meaning":"国际证券识别码（International Securities Identification Number）。为证券分配的十二位字母数字代码，便于在清算、托管和查询中准确识别同一只债券、票据或股票。它标识证券本身，并不保证产品的风险高低。","example":"Please include the ISIN in the trade confirmation so operations can settle the note.","exampleZh":"请在成交确认书中写上国际证券识别码，以便运营部门办理交收。"},{"id":"fin-089","bank":"finance","word":"prospectus","full":"","ipa":"/prəˈspektəs/","pos":"n.","meaning":"招股章程／募集说明书。向投资者披露发行人资料、条款、风险因素和发售安排的法律文件。认购前应阅读该文件及其补充文件，而不能只依赖宣传材料或条款清单。","example":"Any marketing slide should be consistent with the prospectus and the key facts statement.","exampleZh":"任何营销幻灯片都应与募集说明书和产品资料概要保持一致。"},{"id":"fin-090","bank":"finance","word":"NAV","full":"Net Asset Value","ipa":"/ˌen eɪ ˈviː/","pos":"n.","meaning":"资产净值（Net Asset Value）。基金资产减去负债后的价值，通常以每单位资产净值报价，作为认购和赎回的主要参考价格。不同基金的估值时点、费用计提与摆动定价安排可能不同。","example":"The fund was subscribed at the NAV published on the dealing day.","exampleZh":"该基金按交易日公布的每单位资产净值认购。"},{"id":"fin-091","bank":"finance","word":"subscription","full":"","ipa":"/səbˈskrɪpʃn/","pos":"n.","meaning":"认购。投资者按基金的发售或交易安排申请买入基金份额的行为。成交价格通常与相应交易日的资产净值及费用安排有关，并须遵守截止时间与结算周期。","example":"The subscription instruction must be received before the dealing cut-off time.","exampleZh":"认购指示必须在交易截止时间之前送达。"},{"id":"fin-092","bank":"finance","word":"redemption","full":"","ipa":"/rɪˈdempʃn/","pos":"n.","meaning":"赎回。投资者按基金章程要求把基金份额卖回给基金并取得款项的行为；在债券或票据中，也可指发行人偿还本金。基金赎回可能受截止时间、流动性管理和赎回费用约束。","example":"Large redemptions can force a fund to sell assets and may affect remaining investors.","exampleZh":"大规模赎回可能迫使基金卖出资产，并影响仍留在基金中的投资者。"},{"id":"fin-093","bank":"finance","word":"switching","full":"","ipa":"/ˈswɪtʃɪŋ/","pos":"n.","meaning":"转换。在同一基金系列或管理人安排下，把一个基金份额转换为另一基金份额的交易。转换可能仍涉及买卖价差、费用或税务后果，并须在允许的范围与时间内进行。","example":"The client requested a switching from the bond fund into a money market fund.","exampleZh":"客户申请把债券基金转换为货币市场基金。"},{"id":"fin-094","bank":"finance","word":"ETF","full":"Exchange Traded Fund","ipa":"/ˌiː tiː ˈef/","pos":"n.","meaning":"交易所买卖基金（Exchange Traded Fund）。在交易所上市交易的基金，价格随市变动，通常追踪指数或一篮子资产。其市价可能略高于或低于每单位资产净值，还须考虑买卖差价与跟踪误差。","example":"The ETF can be bought and sold on the exchange during market hours.","exampleZh":"该交易所买卖基金可在市场交易时间内于交易所买卖。"},{"id":"fin-095","bank":"finance","word":"money market fund","full":"","ipa":"/ˈmʌni ˌmɑːkɪt fʌnd/","pos":"n.","meaning":"货币市场基金。主要投资于短期货币市场工具的基金，通常以本金相对稳定和较高流动性为目标，但并不保证不会亏损，也不等于银行存款。费用、持仓和浮动净值安排会影响实际回报。","example":"She parked unused cash in a US-dollar money market fund while awaiting allocation.","exampleZh":"在等待配置期间，她把闲置资金暂时放在美元货币市场基金。"},{"id":"fin-096","bank":"finance","word":"management fee","full":"","ipa":"/ˈmænɪdʒmənt fiː/","pos":"n.","meaning":"管理费。向基金管理公司或投资经理支付的费用，通常按资产净值的年费率计提。它是基金持有成本的一部分，但不是全部，还需关注其他经常性开支。","example":"The management fee is 0.80% per annum of the fund's net asset value.","exampleZh":"管理费为基金资产净值的每年百分之零点八。"},{"id":"fin-097","bank":"finance","word":"ongoing charges","full":"","ipa":"/ˌɒnɡəʊɪŋ ˈtʃɑːdʒɪz/","pos":"n.","meaning":"经常性开支。香港基金销售文件中常用的综合费用率，用来概括在一段期间内经常产生的费用，通常以占资产净值的百分比披露。它便于比较持有成本，但不一定包含全部交易费用或或有表现费。","example":"Compare the ongoing charges in the product key facts statement before choosing a share class.","exampleZh":"选择份额类别前，请比较产品资料概要中的经常性开支。"},{"id":"fin-098","bank":"finance","word":"AUM","full":"Assets Under Management","ipa":"/ˌeɪ juː ˈem/","pos":"n.","meaning":"资产管理规模（Assets Under Management）。机构或组合所管理的资产总金额。该指标反映规模，但单独并不能说明投资表现、风险或费用是否合理。","example":"The team's AUM grew after several new private wealth clients were onboarded.","exampleZh":"在多名私人财富客户开户后，团队的资产管理规模有所增长。"},{"id":"fin-099","bank":"finance","word":"custodian","full":"","ipa":"/kʌˈstəʊdiən/","pos":"n.","meaning":"托管人。负责保管基金或客户资产、办理交收并记录持仓的机构，职能与投资经理相互分离，以降低资产被挪用的风险。托管并不等于保证投资本金或收益。","example":"The fund's assets are held by an independent custodian.","exampleZh":"该基金的资产由独立托管人保管。"},{"id":"fin-100","bank":"finance","word":"trustee","full":"","ipa":"/trʌˈstiː/","pos":"n.","meaning":"受托人。在单位信托等结构中，按信托安排为持有人的利益持有资产并监督信托契诺执行的机构。其职责以信托文件及适用法律为准，不能简单等同于投资决策者。","example":"The trustee oversees whether the fund is managed in accordance with the trust deed.","exampleZh":"受托人监督基金是否按照信托契据进行管理。"},{"id":"fin-101","bank":"finance","word":"fund manager","full":"","ipa":"/ˈfʌnd ˌmænɪdʒə/","pos":"n.","meaning":"基金经理／投资经理。负责按照投资目标与限制作出投资决策的个人或公司。表现会随市场波动，过往业绩不能预示未来结果，投资者仍须阅读销售文件中的风险披露。","example":"The fund manager reduced duration before the expected rate announcement.","exampleZh":"基金经理在预期的利率公布前降低了组合久期。"},{"id":"fin-102","bank":"finance","word":"explanatory memorandum","full":"","ipa":"/ɪkˌsplænətəri ˌmeməˈrændəm/","pos":"n.","meaning":"解释备忘录。香港单位信托及互惠基金常用的销售文件，向投资者说明投资目标、风险、费用和交易安排，作用类似于其他市场的基金说明书。应与产品资料概要一并阅读。","example":"The explanatory memorandum sets out the fund's investment restrictions.","exampleZh":"解释备忘录列明了该基金的投资限制。"},{"id":"fin-103","bank":"finance","word":"distribution","full":"","ipa":"/ˌdɪstrɪˈbjuːʃn/","pos":"n.","meaning":"派息／收益分配。基金向持有人分派的现金或再投资份额，来源可能包括利息、股息或资本。高派息并不等于高回报，有时可能从资本中支付，须阅读派息政策说明。","example":"The monthly distribution may include a return of capital, as disclosed in the documents.","exampleZh":"每月派息可能包含资本返还，有关安排已在文件中披露。"},{"id":"fin-104","bank":"finance","word":"benchmark","full":"","ipa":"/ˈbentʃmɑːk/","pos":"n.","meaning":"基准（业绩比较基准）。用来比较组合或基金表现的参考指数或利率。跑赢或落后基准并不自动说明投资是否合适，还须看风险、费用和投资目标是否一致。","example":"The bond fund aims to outperform its benchmark after fees over a full market cycle.","exampleZh":"该债券基金的目标，是在完整市场周期内、扣除费用后跑赢其基准。"},{"id":"fin-105","bank":"finance","word":"tracking error","full":"","ipa":"/ˈtrækɪŋ ˌerə/","pos":"n.","meaning":"跟踪误差。组合回报与其基准回报之间差异的波动程度，常用于指数基金和交易所买卖基金。跟踪误差来自费用、抽样复制、现金拖累或再平衡等因素，并非计算错误本身。","example":"The ETF's tracking error widened during a volatile month.","exampleZh":"在波动较大的一个月里，该交易所买卖基金的跟踪误差有所扩大。"},{"id":"fin-106","bank":"finance","word":"asset allocation","full":"","ipa":"/ˈæset æləˌkeɪʃn/","pos":"n.","meaning":"资产配置。在股票、债券、现金、基金及另类资产等类别之间分配投资比例的过程。它通常是组合风险与长期回报的重要来源，应与投资者的目标、年期和风险承受能力相符。","example":"The discretionary mandate starts with a strategic asset allocation review.","exampleZh":"全权委托授权从战略资产配置检讨开始。"},{"id":"fin-107","bank":"finance","word":"diversification","full":"","ipa":"/daɪˌvɜːsɪfɪˈkeɪʃn/","pos":"n.","meaning":"分散投资。通过持有不完全同步波动的不同资产、地区或发行人以降低个别风险的方法。分散不能消除系统性市场风险，也不能保证不亏损。","example":"Diversification across issuers can reduce concentration risk, but not market risk as a whole.","exampleZh":"在不同发行人之间分散投资，可以降低集中度风险，但不能消除整体市场风险。"},{"id":"fin-108","bank":"finance","word":"drawdown","full":"","ipa":"/ˈdrɔːdaʊn/","pos":"n.","meaning":"回撤。投资组合或资产从前期高点到随后低点的下跌幅度，常用来观察历史波动和亏损深度。过往回撤不能预示未来最大亏损。","example":"The portfolio's maximum drawdown last year was 8%.","exampleZh":"该组合去年的最大回撤为百分之八。"},{"id":"fin-109","bank":"finance","word":"volatility","full":"","ipa":"/ˌvɒləˈtɪləti/","pos":"n.","meaning":"波动性／波动率。衡量价格或回报变动幅度的指标，常用标准差表示。波动率高意味着价格起伏更大，但波动率本身并不等于必然亏损或必然获利。","example":"Higher equity volatility can make structured-note terms appear more attractive, but the risks also rise.","exampleZh":"股票波动率上升可能使结构性票据条款看起来更有吸引力，但风险也会增加。"},{"id":"fin-110","bank":"finance","word":"implied volatility","full":"","ipa":"/ɪmˌplaɪd ˌvɒləˈtɪləti/","pos":"n.","meaning":"隐含波动率。从期权市场价格反推出来的、市场对未来波动程度的估计，是为期权定价的重要输入。它反映当时的市场定价，并不是对未来波动的保证。","example":"Richer implied volatility can improve the coupon on a new equity-linked note.","exampleZh":"较高的隐含波动率，可能提高新发行股票挂钩票据的票息。"},{"id":"fin-111","bank":"finance","word":"due diligence","full":"","ipa":"/ˌdjuː ˈdɪlɪdʒəns/","pos":"n.","meaning":"尽职调查。在推荐、购买或引入产品与交易前，对发行人、条款、风险、法律文件和运营安排等进行审慎核实的过程。完善的尽职调查有助于识别风险，但不能消除风险。","example":"Product due diligence includes a review of the issuer, the payoff, and the legal documents.","exampleZh":"产品尽职调查包括对发行人、收益结构及法律文件的审阅。"},{"id":"fin-112","bank":"finance","word":"KYC","full":"Know Your Client","ipa":"/ˌkeɪ waɪ ˈsiː/","pos":"n.","meaning":"认识你的客户（Know Your Client，亦称 Know Your Customer）。金融机构在建立业务关系时，识别和核实客户身份、了解其背景与业务性质的监管要求，是反洗钱和合适性安排的基础。","example":"The account cannot be opened until the KYC documents are complete.","exampleZh":"在认识你的客户的文件齐备之前，账户不能开立。"},{"id":"fin-113","bank":"finance","word":"AML","full":"Anti-Money Laundering","ipa":"/ˌeɪ em ˈel/","pos":"n.","meaning":"反洗钱（Anti-Money Laundering）。防止犯罪分子把非法所得转入合法金融体系的法律与合规制度，包括客户尽职调查、持续监控和可疑交易报告等。香港的银行与持牌机构均须遵守相关条例及监管指引。","example":"The transfer was held pending an AML review of the source of funds.","exampleZh":"该笔转账因资金来源的反洗钱审查而暂缓处理。"},{"id":"fin-114","bank":"finance","word":"CFT","full":"Counter-Financing of Terrorism","ipa":"/ˌsiː ef ˈtiː/","pos":"n.","meaning":"反恐融资（Counter-Financing of Terrorism，亦常作 Combating the Financing of Terrorism）。防止资金被用于恐怖主义活动的制度，通常与反洗钱要求一并执行，包括名单筛查、监控和报告义务。","example":"CFT screening is performed against designated sanctions and terrorist-financing lists.","exampleZh":"反恐融资筛查会对照指定的制裁及恐怖分子资金筹集名单进行。"},{"id":"fin-115","bank":"finance","word":"FATCA","full":"Foreign Account Tax Compliance Act","ipa":"/ˈfætkə/","pos":"n.","meaning":"海外账户税收合规法案（Foreign Account Tax Compliance Act）。美国一项税务合规制度，要求外国金融机构识别并申报美国纳税人账户资料，否则可能面临预提税等后果。银行开户和资料更新时常会收集相关声明。","example":"The client completed a FATCA self-certification when opening the account.","exampleZh":"客户在开户时填写了海外账户税收合规法案自我证明。"},{"id":"fin-116","bank":"finance","word":"CRS","full":"Common Reporting Standard","ipa":"/ˌsiː ɑːr ˈes/","pos":"n.","meaning":"共同汇报标准（Common Reporting Standard）。由经济合作与发展组织推动的自动交换财务账户资料标准，香港已实施。金融机构须识别税务居民身份并按要求向税务机关申报。","example":"Under the CRS, the bank may report the account to the tax authority based on the client's tax residency.","exampleZh":"根据共同汇报标准，银行可能按客户的税务居民身份向税务机关申报该账户。"},{"id":"fin-117","bank":"finance","word":"SFC","full":"Securities and Futures Commission","ipa":"/ˌes ef ˈsiː/","pos":"n.","meaning":"证券及期货事务监察委员会（Securities and Futures Commission，证监会）。负责监管香港证券及期货市场的独立法定机构，包括持牌人操守、产品认可与投资者保护等相关职能。","example":"The SFC requires intermediaries to assess suitability when recommending certain investment products.","exampleZh":"证监会要求中介人在建议若干投资产品时评估合适性。"},{"id":"fin-118","bank":"finance","word":"HKMA","full":"Hong Kong Monetary Authority","ipa":"/ˌeɪtʃ keɪ em ˈeɪ/","pos":"n.","meaning":"香港金融管理局（Hong Kong Monetary Authority，金管局）。香港的政府当局，负责维持货币及银行体系稳定，并监管银行业务。私人银行业务亦须遵守金管局的监管要求与指引。","example":"The HKMA issues guidance on the sale of investment products by authorized institutions.","exampleZh":"金管局就认可机构销售投资产品发出指引。"},{"id":"fin-119","bank":"finance","word":"IFEC","full":"Investor and Financial Education Council","ipa":"/ˌaɪ ef iː ˈsiː/","pos":"n.","meaning":"投资者及理财教育委员会（Investor and Financial Education Council）。由香港证监会成立、负责推动投资者及理财教育的机构，提供中立的公众教育资料，并不销售产品或提供个性化投资建议。","example":"The IFEC publishes plain-language explanations of structured products and their risks.","exampleZh":"投资者及理财教育委员会以浅白语言刊载有关结构性产品及其风险的说明。"},{"id":"fin-120","bank":"finance","word":"professional investor","full":"","ipa":"/prəˌfeʃənl ɪnˈvestə/","pos":"n.","meaning":"专业投资者。香港《证券及期货条例》及相关规则下的类别，包括机构专业投资者及符合资产或其他准则的个人或法团专业投资者。被归类为专业投资者后，部分投资者保护及披露安排可能不同，中介人仍须遵守适用的操守要求。","example":"The product is offered only to professional investors as defined under Hong Kong law.","exampleZh":"该产品仅向香港法例所界定的专业投资者发售。"},{"id":"fin-121","bank":"finance","word":"complex product","full":"","ipa":"/ˌkɒmpleks ˈprɒdʌkt/","pos":"n.","meaning":"复杂产品。香港证监会操守准则下的用语，泛指条款、特征和风险可能不易被零售投资者合理理解的投资产品，许多结构性产品属于此类。销售复杂产品通常须有加强的披露与合适性安排。","example":"A principal-at-risk structured note is generally treated as a complex product.","exampleZh":"本金受险的结构性票据一般被视为复杂产品。"},{"id":"fin-122","bank":"finance","word":"suitability","full":"","ipa":"/ˌsuːtəˈbɪləti/","pos":"n.","meaning":"合适性。中介人在提供投资建议或进行招揽时，应合理确保所建议产品符合客户的财政状况、投资目标、投资年期、风险承受能力及投资知识等。合适性评估并不能保证产品将来盈利。","example":"The suitability assessment must be completed before the recommendation is made.","exampleZh":"在作出建议之前，必须完成合适性评估。"},{"id":"fin-123","bank":"finance","word":"KFS","full":"Key Facts Statement","ipa":"/ˌkeɪ ef ˈes/","pos":"n.","meaning":"产品资料概要（Key Facts Statement，亦称 Product Key Facts Statement）。香港基金及部分投资产品须向投资者提供的简明文档，概述关键条款、风险、费用和交易资料。它是重要的披露文件，但不能替代完整的销售法律文件。","example":"The salesperson went through the KFS with the client page by page.","exampleZh":"销售人员与客户逐页审阅了产品资料概要。"},{"id":"fin-124","bank":"finance","word":"risk disclosure","full":"","ipa":"/rɪsk dɪsˈkləʊʒə/","pos":"n.","meaning":"风险披露。向投资者说明产品主要风险的文件或口头说明，例如市场风险、信用风险、流动性风险和本金损失风险。签署或确认风险披露并不等于产品一定合适，也不能消除风险本身。","example":"The risk disclosure highlights that the investor may lose the entire principal.","exampleZh":"风险披露强调，投资者可能损失全部本金。"},{"id":"fin-125","bank":"finance","word":"risk profile","full":"","ipa":"/rɪsk ˈprəʊfaɪl/","pos":"n.","meaning":"风险取向／风险概况。对客户能够并愿意承担多大投资风险的综合描述，通常结合目标、年期、流动资金需要和风险承受能力评估得出，用于匹配产品与组合。风险取向会随情况变化，应定期检视。","example":"A conservative risk profile may not be consistent with a principal-at-risk snowball note.","exampleZh":"保守的风险取向，可能与本金受险的雪球票据并不相符。"},{"id":"fin-126","bank":"finance","word":"investment horizon","full":"","ipa":"/ɪnˈvestmənt həˌraɪzn/","pos":"n.","meaning":"投资年期／投资期限。投资者计划持有投资的时间长度。年期较短时，通常更需关注流动性和价格波动；结构性票据若难以提前变现，尤其要与投资年期相匹配。","example":"Her investment horizon is three years, which is longer than the note's maximum tenor.","exampleZh":"她的投资年期是三年，比该票据的最长存续期更长。"},{"id":"fin-127","bank":"finance","word":"private wealth management","full":"PWM","ipa":"/ˌpraɪvət ˈwelθ ˌmænɪdʒmənt/","pos":"n.","meaning":"私人财富管理（Private Wealth Management）。向高净值客户提供的综合财富服务，可能包括投资建议、全权委托、信托与信贷安排等。服务范围、收费和适合的产品，以客户协议及监管要求为准。","example":"She works in product design support for the private wealth management desk.","exampleZh":"她在私人财富管理团队从事产品设计支持工作。"},{"id":"fin-128","bank":"finance","word":"discretionary management","full":"","ipa":"/dɪˈskreʃənəri ˈmænɪdʒmənt/","pos":"n.","meaning":"全权委托管理。客户授权管理人在约定的投资范围和限制内，不必就每笔交易事先征求同意即可作出投资决定的安排。客户仍须理解授权范围、风险、收费及自己仍承担的市场与信用风险。","example":"Under discretionary management, the team rebalances the portfolio within the agreed mandate.","exampleZh":"在全权委托管理下，团队可在约定授权范围内再平衡投资组合。"},{"id":"fin-129","bank":"finance","word":"execution-only","full":"","ipa":"/ˌeksɪˈkjuːʃn ˈəʊnli/","pos":"adj.","meaning":"只执行交易。中介人按照客户的指示执行买卖，而不就该笔交易提供投资建议的服务模式。在此模式下，合适性责任可能与顾问服务不同，但中介人仍须遵守适用的监管与披露要求。","example":"The client placed an execution-only order after declining investment advice.","exampleZh":"客户在拒绝投资建议后，下达了一笔只执行交易的指示。"},{"id":"fin-130","bank":"finance","word":"Lombard loan","full":"","ipa":"/ˈlɒmbɑːd ləʊn/","pos":"n.","meaning":"证券抵押融资（亦称伦巴德贷款）。以投资组合或合资格证券作抵押，向银行借入资金的融资安排。借款比率、保证金要求与强制平仓条款由授信文件规定，抵押品下跌时可能被要求还款或平仓。","example":"The Lombard loan allowed the client to raise liquidity without selling the bonds immediately.","exampleZh":"这笔证券抵押融资让客户不必立刻卖出债券也能筹集流动资金。"},{"id":"fin-131","bank":"finance","word":"LTV","full":"Loan-to-Value","ipa":"/ˌel tiː ˈviː/","pos":"n.","meaning":"贷款价值比（Loan-to-Value）。贷款金额相对于抵押品价值的比率，用来控制信贷风险。抵押品估值下跌时，贷款价值比上升，可能触发补仓、强制还款或平仓。","example":"If the LTV exceeds the limit, the bank may issue a margin call.","exampleZh":"若贷款价值比超过上限，银行可能发出追加保证金通知。"},{"id":"fin-132","bank":"finance","word":"margin call","full":"","ipa":"/ˈmɑːdʒɪn kɔːl/","pos":"n.","meaning":"追加保证金通知。当抵押品价值下跌、贷款价值比或保证金水平触碰约定阈值时，贷款人要求借款人补充保证金、偿还部分贷款或增加抵押品的通知。若未能按时满足，可能被强制平仓。","example":"The client met the margin call by pledging additional bonds the same day.","exampleZh":"客户在当天增补质押债券，以满足追加保证金要求。"},{"id":"fin-133","bank":"finance","word":"collateral","full":"","ipa":"/kəˈlætərəl/","pos":"n.","meaning":"抵押品／担保品。借款人或交易方向贷款人、交易对手提供的、用于担保偿付或履约的资产，如债券、股票或现金。抵押品的折扣率（haircut）和估值规则会影响可借金额。","example":"Only eligible bonds can be posted as collateral under the facility.","exampleZh":"在该授信安排下，只有合资格债券可作为抵押品。"},{"id":"fin-134","bank":"finance","word":"premium financing","full":"","ipa":"/ˈpriːmiəm ˌfaɪnænsɪŋ/","pos":"n.","meaning":"保费融资。以保单现金价值或其他合资格资产作安排，借入资金支付寿险等保费的融资方式。利息成本、汇率、保单退保价值和补仓条款都会影响净效果，必须结合贷款合同与保险合同理解，而不能只看宣传回报。","example":"Premium financing can magnify both the potential return and the loss if policy values or interest rates move adversely.","exampleZh":"若保单价值或利率朝不利方向变动，保费融资可能同时放大潜在回报与亏损。"},{"id":"fin-135","bank":"finance","word":"hedging","full":"","ipa":"/ˈhedʒɪŋ/","pos":"n.","meaning":"对冲。通过相反或互补的头寸，降低某一已有风险暴露的做法，例如用利率掉期对冲债券的利率风险。对冲通常无法消除全部风险，还可能带来基差、流动性和交易对手风险。","example":"The desk is hedging the interest-rate exposure, not taking a directional view.","exampleZh":"交易台是在对冲利率敞口，而不是在表达方向性观点。"},{"id":"fin-136","bank":"finance","word":"leverage","full":"","ipa":"/ˈliːvərɪdʒ/","pos":"n.","meaning":"杠杆。通过借款或衍生工具，使投资暴露大于实际投入资金的做法。杠杆可以放大收益，也会放大亏损，并可能带来追加保证金或强制平仓的风险。","example":"Using leverage to buy more of the same bond increased both the yield pickup and the downside risk.","exampleZh":"使用杠杆增持同一只债券，既提高了额外收益，也加大了下行风险。"},{"id":"fin-137","bank":"finance","word":"mark-to-market","full":"MTM","ipa":"/ˌmɑːk tə ˈmɑːkɪt/","pos":"n./v.","meaning":"按市价计值（Mark-to-Market）。按当前市场价格估算持仓或产品的价值，从而得出未实现盈亏。结构性票据的按市值计价往往还受买卖差价、发行人报价和模型假设影响，只是估计而非保证可成交价。","example":"The mark-to-market on the note turned negative after the underlying shares fell.","exampleZh":"挂钩股票下跌后，该票据的按市值计价转为负值。"},{"id":"fin-138","bank":"finance","word":"bid-offer spread","full":"","ipa":"/ˌbɪd ˈɒfə spred/","pos":"n.","meaning":"买卖差价。买方报价（bid）与卖方报价（offer/ask）之间的差额，是流动性成本和交易成本的重要部分。结构性票据在二级市场的买卖差价往往明显宽于流动性高的政府债券。","example":"A wide bid-offer spread can make early exit from a structured note expensive.","exampleZh":"较宽的买卖差价，可能使结构性票据的提前退出成本很高。"},{"id":"fin-139","bank":"finance","word":"SOFR","full":"Secured Overnight Financing Rate","ipa":"/ˈsəʊfə/","pos":"n.","meaning":"有担保隔夜融资利率（Secured Overnight Financing Rate）。由纽约联邦储备银行公布的美元隔夜利率，基于国债回购市场的实际成交，已被广泛用作替代已停止使用的伦敦银行同业拆息（LIBOR）的美元参考利率。","example":"The floating-rate note pays a coupon of SOFR plus a margin.","exampleZh":"该浮动利率票据的票息为有担保隔夜融资利率加上一定利差。"},{"id":"fin-140","bank":"finance","word":"HIBOR","full":"Hong Kong Interbank Offered Rate","ipa":"/ˈhaɪbɔː/","pos":"n.","meaning":"香港银行同业拆息（Hong Kong Interbank Offered Rate）。香港银行之间港元（及若干其他币种）拆借的参考利率，常用于港元贷款、浮息票据和利率对冲。具体期限（如隔夜、一个月、三个月）须在条款中写明。","example":"The Lombard loan interest is reset monthly with reference to one-month HIBOR.","exampleZh":"该证券抵押融资的利率每月参照一个月香港银行同业拆息重新定价。"},{"id":"fin-141","bank":"finance","word":"settlement date","full":"","ipa":"/ˈsetlmənt deɪt/","pos":"n.","meaning":"交收日／结算日。买卖双方完成付款与证券交付的日期，通常晚于交易日，例如债券常见为交易日后一个或两个营业日。款项、持仓和应计利息的计算都以交收安排为准。","example":"The notes will be delivered on the settlement date against payment of the issue price.","exampleZh":"该票据将在交收日凭支付发行价完成交付。"},{"id":"fin-142","bank":"finance","word":"trade date","full":"","ipa":"/ˈtreɪd deɪt/","pos":"n.","meaning":"交易日。双方达成交易、价格或主要条款被确认的日期，通常以交易日作为初始定盘或价格观察的参考日之一。交易日与交收日、起息日不一定是同一天。","example":"The initial fixing is taken from official closing prices on the trade date.","exampleZh":"初始定盘采用交易日的官方收市价。"},{"id":"fin-143","bank":"finance","word":"concentration risk","full":"","ipa":"/ˌkɒnsnˈtreɪʃn rɪsk/","pos":"n.","meaning":"集中度风险。投资过分集中于同一发行人、同一股票、同一行业或同一产品类型，从而使个别不利事件造成过大损失的风险。合适的分散可以降低集中度风险，但不能消除市场整体下跌的风险。","example":"Holding several notes all linked to the same stock creates concentration risk.","exampleZh":"持有多份都挂钩同一只股票的票据，会形成集中度风险。"},{"id":"fin-144","bank":"finance","word":"secondary market","full":"","ipa":"/ˈsekəndri ˌmɑːkɪt/","pos":"n.","meaning":"二级市场。证券发行后，投资者之间（或投资者与做市商、发行人之间）再买卖的市场。许多结构性票据的二级市场并不活跃，可变现性取决于发行人是否愿意给出回购报价。","example":"There is no active secondary market, so any exit depends on an issuer bid.","exampleZh":"没有活跃的二级市场，因此任何退出都取决于发行人是否给出买入报价。"},{"id":"fin-145","bank":"finance","word":"unwind cost","full":"","ipa":"/ʌnˈwaɪnd kɒst/","pos":"n.","meaning":"平仓成本。提前终止结构性产品或衍生合约时，除市值变动外还需承担的买卖差价、终止费用或不利报价。平仓成本可能相当显著，尤其在市场波动或流动性不足时。","example":"The unwind cost widened during the sell-off, so the client decided to hold to the next observation date.","exampleZh":"在下跌行情中平仓成本扩大，客户因此决定持有至下一个观察日。"},{"id":"fin-146","bank":"finance","word":"selling restriction","full":"","ipa":"/ˈselɪŋ rɪˌstrɪkʃn/","pos":"n.","meaning":"销售限制。发行文件中规定的、关于何地、向何类投资者以及以何种方式销售产品的限制，例如仅限专业投资者，或不向美国人士发售。分销人员必须遵守这些限制，否则可能违反证券法规。","example":"The selling restriction states that the notes may not be offered to US persons.","exampleZh":"销售限制订明，该票据不得向美国人士发售。"},{"id":"fin-147","bank":"finance","word":"governing law","full":"","ipa":"/ˈɡʌvənɪŋ lɔː/","pos":"n.","meaning":"管辖法律。合同或发行文件约定用来解释和执行该文件的法律制度，例如英格兰法律或香港法律。管辖法律与争议解决地会影响权利如何被执行，是法律文件中的关键条款。","example":"The notes are issued under English governing law, with disputes submitted to Hong Kong courts.","exampleZh":"该票据以英格兰法律为管辖法律，争议提交香港法院处理。"},{"id":"fin-148","bank":"finance","word":"trade confirmation","full":"","ipa":"/treɪd ˌkɒnfəˈmeɪʃn/","pos":"n.","meaning":"成交确认书。交易达成后向客户发出的书面确认，列明产品名称、名义本金、价格、日期及其他关键条款。客户应核对确认书是否与约定一致，如有出入应立即提出。","example":"Please check the trade confirmation against the agreed term sheet.","exampleZh":"请将成交确认书与已约定的条款清单核对。"},{"id":"fin-149","bank":"finance","word":"minimum denomination","full":"","ipa":"/ˌmɪnɪməm dɪˌnɒmɪˈneɪʃn/","pos":"n.","meaning":"最低面额／最低认购单位。投资者可以认购或转售该证券的最小金额及其整数倍。最低面额会影响可否分拆转让，以及是否适合较小的投资金额。","example":"The minimum denomination is 100,000 US dollars and integral multiples of 10,000 thereafter.","exampleZh":"最低面额为十万美元，其后须为一万美元的整数倍。"},{"id":"fin-150","bank":"finance","word":"US Treasury","full":"","ipa":"/ˌjuː es ˈtreʒəri/","pos":"n.","meaning":"美国国债。由美国财政部发行的主权债务工具，包括短期国库券（Treasury bills）、中期国债（Treasury notes）和长期国债（Treasury bonds）。其收益率曲线是许多美元资产定价的基准，也是固定期限国债收益率（CMT，Constant Maturity Treasury）的数据来源。","example":"The 10-year US Treasury yield is a widely watched benchmark for dollar interest rates.","exampleZh":"十年期美国国债收益率是美元利率中广受关注的基准。"},{"id":"fin-151","bank":"finance","word":"credit-linked note","full":"Credit-Linked Note (CLN)","ipa":"/ˈkredɪt lɪŋkt nəʊt/","pos":"n.","meaning":"信贷挂钩票据。一种结构性票据，回报与一个或多个参考实体的信用状况挂钩；若参考实体发生约定的信用事件（如违约、破产），投资者可能损失部分或全部本金，同时仍承担发行人信用风险。","example":"If a credit event occurs on the reference entity, holders of the credit-linked note may lose part of their principal.","exampleZh":"如果参考实体发生信用事件，该信贷挂钩票据的持有人可能损失部分本金。"},{"id":"fin-152","bank":"finance","word":"reference entity","full":"","ipa":"/ˈrefrəns ˈentəti/","pos":"n.","meaning":"参考实体。信贷挂钩产品或信用违约掉期中，其信用状况决定产品赔付的公司或主权国家。它不一定是产品的发行人。","example":"The note pays a higher coupon because the reference entity has a lower credit rating.","exampleZh":"由于参考实体的信用评级较低，这份票据的票息较高。"},{"id":"fin-153","bank":"finance","word":"credit event","full":"","ipa":"/ˈkredɪt ɪˈvent/","pos":"n.","meaning":"信用事件。按 ISDA 定义及产品文件约定、会触发信用保护赔付的事件，常见包括未能付款、破产和债务重组。具体范围以条款为准。","example":"The term sheet lists bankruptcy and failure to pay as credit events.","exampleZh":"条款书把破产和未能付款列为信用事件。"},{"id":"fin-154","bank":"finance","word":"dual currency investment","full":"Dual Currency Investment (DCI)","ipa":"/ˌdjuːəl ˈkʌrənsi ɪnˈvestmənt/","pos":"n.","meaning":"双币投资。一种短期结构性投资，投资者以基础货币存入，赚取较高收益；到期时银行可按约定的挂钩汇率，以基础货币或另一种挂钩货币偿还本金及收益，因此可能被兑换成弱势货币并承受汇兑损失。它不是存款，不受存款保障。","example":"With a dual currency investment, you may be repaid in the alternate currency if it weakens past the strike rate.","exampleZh":"做双币投资时，如果挂钩货币贬值越过协定汇率，您可能会以挂钩货币收回款项。"},{"id":"fin-155","bank":"finance","word":"conversion rate","full":"","ipa":"/kənˈvɜːʃn reɪt/","pos":"n.","meaning":"兑换汇率（协定汇率）。双币投资或货币挂钩产品中事先约定的汇率，决定到期时是否以及按什么比例转换成另一种货币。","example":"The conversion rate was set slightly below the current spot rate.","exampleZh":"协定汇率定在略低于当前即期汇率的位置。"},{"id":"fin-156","bank":"finance","word":"step-down","full":"","ipa":"/ˈstep daʊn/","pos":"adj.","meaning":"递减的（敲出水平逐期下调）。指自动赎回产品的敲出价随观察期逐步降低，使后期较容易触发提前赎回。","example":"The step-down feature lowers the autocall level by two percent each quarter.","exampleZh":"递减安排使自动赎回水平每季度下调百分之二。"},{"id":"fin-157","bank":"finance","word":"coupon barrier","full":"","ipa":"/ˈkuːpɒn ˈbæriə/","pos":"n.","meaning":"派息障碍。部分结构性票据只有在观察日挂钩标的不低于该水平时才派发当期票息；与决定本金的敲入障碍不同。","example":"The coupon is paid only if every stock closes above the coupon barrier on the observation date.","exampleZh":"只有在观察日每只股票的收市价都高于派息障碍，才会派发票息。"},{"id":"fin-158","bank":"finance","word":"final fixing","full":"","ipa":"/ˈfaɪnl ˈfɪksɪŋ/","pos":"n.","meaning":"最终定价（期末观察）。在最终估值日记录挂钩标的价格，用来计算到期赎回金额。","example":"Your redemption amount depends on the worst performer at final fixing.","exampleZh":"您的赎回金额取决于最终定价时表现最差的标的。"},{"id":"fin-159","bank":"finance","word":"redemption amount","full":"","ipa":"/rɪˈdempʃn əˈmaʊnt/","pos":"n.","meaning":"赎回金额。产品到期或提前终止时，发行人按条款公式向投资者支付的金额，可能低于投资本金。","example":"The redemption amount may be paid in cash or in shares, depending on the final level.","exampleZh":"视乎最终水平，赎回金额可能以现金或股票支付。"},{"id":"fin-160","bank":"finance","word":"call option","full":"","ipa":"/ˈkɔːl ˌɒpʃn/","pos":"n.","meaning":"认购期权（看涨期权）。买方有权但无义务在约定期限内或到期时，以行使价买入标的资产；买方付出期权金，卖方承担相应义务。","example":"Buying a call option limits your loss to the premium paid.","exampleZh":"买入认购期权，损失以已付期权金为限。"},{"id":"fin-161","bank":"finance","word":"put option","full":"","ipa":"/ˈpʊt ˌɒpʃn/","pos":"n.","meaning":"认沽期权（看跌期权）。买方有权但无义务以行使价卖出标的资产。不少结构性产品实质上是投资者卖出了一份认沽期权。","example":"An FCN investor is effectively selling a put option on the underlying stocks.","exampleZh":"固定票息票据的投资者实际上是卖出了挂钩股票的认沽期权。"},{"id":"fin-162","bank":"finance","word":"option premium","full":"","ipa":"/ˈɒpʃn ˈpriːmiəm/","pos":"n.","meaning":"期权金。期权买方为取得权利而支付给卖方的价格，由内在价值和时间价值组成。","example":"The higher coupon is funded by the option premium the investor earns.","exampleZh":"较高的票息来自投资者赚取的期权金。"},{"id":"fin-163","bank":"finance","word":"in-the-money","full":"","ipa":"/ˌɪn ðə ˈmʌni/","pos":"adj.","meaning":"价内的。认购期权的标的价格高于行使价，或认沽期权的标的价格低于行使价，此时期权具有内在价值。","example":"The put option finished in-the-money, so the shares were delivered to the investor.","exampleZh":"该认沽期权到期时处于价内，所以股票被交付给投资者。"},{"id":"fin-164","bank":"finance","word":"intrinsic value","full":"","ipa":"/ɪnˈtrɪnsɪk ˈvæljuː/","pos":"n.","meaning":"内在价值。期权若立即行使可获得的收益，不会小于零。","example":"A deep in-the-money call has a large intrinsic value.","exampleZh":"深度价内的认购期权具有较高的内在价值。"},{"id":"fin-165","bank":"finance","word":"time value","full":"","ipa":"/ˈtaɪm ˌvæljuː/","pos":"n.","meaning":"时间价值。期权价格中超出内在价值的部分，反映到期前标的价格变动的可能性，随到期日临近而递减。","example":"Time value erodes faster as expiry approaches.","exampleZh":"越接近到期，时间价值消耗得越快。"},{"id":"fin-166","bank":"finance","word":"delta","full":"","ipa":"/ˈdeltə/","pos":"n.","meaning":"德尔塔（Delta）。衡量期权或衍生产品价格对标的价格变动敏感度的指标，也可理解为对冲所需的标的数量比例。","example":"The trader adjusted the hedge as the option's delta rose.","exampleZh":"随着期权的德尔塔上升，交易员调整了对冲头寸。"},{"id":"fin-167","bank":"finance","word":"gamma","full":"","ipa":"/ˈɡæmə/","pos":"n.","meaning":"伽马（Gamma）。衡量德尔塔随标的价格变动的速度；接近障碍价或行使价时伽马通常较大，对冲难度增加。","example":"Gamma risk increases sharply when the underlying trades close to the barrier.","exampleZh":"当标的价格接近障碍价时，伽马风险会急剧上升。"},{"id":"fin-168","bank":"finance","word":"expiry","full":"","ipa":"/ɪkˈspaɪəri/","pos":"n.","meaning":"到期（期权到期日）。期权或权证权利终止的时间；过了到期日未行使的权利即失效。","example":"The warrant becomes worthless if it is out of the money at expiry.","exampleZh":"若权证在到期时处于价外，便会变得毫无价值。"},{"id":"fin-169","bank":"finance","word":"exercise","full":"","ipa":"/ˈeksəsaɪz/","pos":"v.","meaning":"行使（期权）。期权持有人按合约条款执行买入或卖出标的的权利。","example":"American-style options can be exercised at any time before expiry.","exampleZh":"美式期权可在到期前任何时间行使。"},{"id":"fin-170","bank":"finance","word":"derivative warrant","full":"","ipa":"/dɪˈrɪvətɪv ˈwɒrənt/","pos":"n.","meaning":"衍生权证（窝轮）。由第三方发行、在香港交易所上市的一种结构性产品，赋予持有人以行使价买入或卖出标的资产的权利，具有杠杆效应，到期时可能变得毫无价值。","example":"Derivative warrants can lose all their value if the underlying moves the wrong way.","exampleZh":"若标的走势不利，衍生权证可能损失全部价值。"},{"id":"fin-171","bank":"finance","word":"CBBC","full":"Callable Bull/Bear Contract","ipa":"/ˌsiː biː biː ˈsiː/","pos":"n.","meaning":"牛熊证。在香港交易所上市的结构性产品，追踪标的资产表现并带有杠杆；当标的价格触及收回价时，发行人须提早收回，投资者可能损失全部或大部分投资。","example":"The CBBC was called after the index touched its call price in the morning session.","exampleZh":"恒指在早市触及收回价后，这只牛熊证被收回。"},{"id":"fin-172","bank":"finance","word":"mandatory call event","full":"","ipa":"/ˈmændətəri ˈkɔːl ɪˈvent/","pos":"n.","meaning":"强制收回事件。牛熊证的标的价格触及收回价时，发行人须提早终止该产品，交易随即停止。","example":"After a mandatory call event, the CBBC stops trading immediately.","exampleZh":"发生强制收回事件后，牛熊证即时停止买卖。"},{"id":"fin-173","bank":"finance","word":"equity-linked investment","full":"Equity-Linked Investment (ELI)","ipa":"/ˈekwəti lɪŋkt ɪnˈvestmənt/","pos":"n.","meaning":"股票挂钩投资。将资金存放于银行、回报与挂钩股票价格表现相连的非上市结构性投资；投资者可能以低于市价的协定价接收股票，从而损失本金。它不是定期存款。","example":"An equity-linked investment is not a time deposit and is not protected by the Deposit Protection Scheme.","exampleZh":"股票挂钩投资不是定期存款，不受存款保障计划保障。"},{"id":"fin-174","bank":"finance","word":"interest rate swap","full":"Interest Rate Swap (IRS)","ipa":"/ˈɪntrəst reɪt ˈswɒp/","pos":"n.","meaning":"利率掉期。双方按同一名义本金交换不同类型利息现金流的场外衍生合约，最常见的是固定利率与浮动利率互换，用于管理利率风险。","example":"The issuer hedges its fixed coupons with an interest rate swap.","exampleZh":"发行人用利率掉期对冲其固定票息。"},{"id":"fin-175","bank":"finance","word":"FX forward","full":"Foreign Exchange Forward","ipa":"/ˌef eks ˈfɔːwəd/","pos":"n.","meaning":"外汇远期合约。双方约定在未来某日以事先锁定的汇率交换两种货币的合约，可用来对冲汇率风险。","example":"The client used an FX forward to lock in the rate for next year's tuition payment.","exampleZh":"客户用外汇远期合约锁定明年支付学费的汇率。"},{"id":"fin-176","bank":"finance","word":"non-deliverable forward","full":"Non-Deliverable Forward (NDF)","ipa":"/ˌnɒn dɪˈlɪvərəbl ˈfɔːwəd/","pos":"n.","meaning":"无本金交割远期。到期时不交换本金，只按约定汇率与定盘汇率的差额以可兑换货币（通常是美元）结算的外汇远期合约，常用于资本管制货币。","example":"The fund hedged its rupee exposure through a non-deliverable forward.","exampleZh":"该基金通过无本金交割远期对冲其卢比敞口。"},{"id":"fin-177","bank":"finance","word":"spot rate","full":"","ipa":"/ˈspɒt reɪt/","pos":"n.","meaning":"即期汇率。按惯例在短期内（多数货币为两个营业日）交收的外汇买卖所用的汇率。","example":"The forward rate is derived from the spot rate and the interest rate differential.","exampleZh":"远期汇率由即期汇率和两种货币的利差推算出来。"},{"id":"fin-178","bank":"finance","word":"forward points","full":"","ipa":"/ˈfɔːwəd pɔɪnts/","pos":"n.","meaning":"远期点数（掉期点）。远期汇率与即期汇率之间的差额，主要反映两种货币的利率差。","example":"Forward points are positive when the base currency has the lower interest rate.","exampleZh":"当基础货币的利率较低时，远期点数为正。"},{"id":"fin-179","bank":"finance","word":"counterparty risk","full":"","ipa":"/ˈkaʊntəpɑːti rɪsk/","pos":"n.","meaning":"交易对手风险。场外交易的另一方在合约到期前未能履约而造成损失的风险。","example":"Counterparty risk is a key concern in over-the-counter derivatives.","exampleZh":"交易对手风险是场外衍生工具的一项主要考虑。"},{"id":"fin-180","bank":"finance","word":"ISDA","full":"International Swaps and Derivatives Association","ipa":"/ˈɪzdə/","pos":"n.","meaning":"国际掉期与衍生工具协会。制定场外衍生工具标准合约文件（如 ISDA 主协议）的行业组织；“签 ISDA”通常指与交易对手签订该主协议。","example":"We need to sign an ISDA Master Agreement before trading swaps with you.","exampleZh":"我们需要先与您签订 ISDA 主协议，才能和您进行掉期交易。"},{"id":"fin-181","bank":"finance","word":"CSA","full":"Credit Support Annex","ipa":"/ˌsiː es ˈeɪ/","pos":"n.","meaning":"信用支持附件。ISDA 主协议的附件，规定双方如何按市值变动交付及退还抵押品，以降低交易对手风险。","example":"Under the CSA, collateral is exchanged daily based on the mark-to-market value.","exampleZh":"根据信用支持附件，双方每日按市值交换抵押品。"},{"id":"fin-182","bank":"finance","word":"OTC","full":"Over-the-Counter","ipa":"/ˌəʊ tiː ˈsiː/","pos":"adj.","meaning":"场外的。不在交易所买卖、由双方直接协商条款的交易方式，例如多数结构性票据和利率掉期。","example":"Most structured notes are traded OTC, so prices are quoted by the issuer.","exampleZh":"大部分结构性票据在场外交易，因此价格由发行人报出。"},{"id":"fin-183","bank":"finance","word":"exchange-traded","full":"","ipa":"/ɪksˈtʃeɪndʒ ˈtreɪdɪd/","pos":"adj.","meaning":"交易所买卖的。在认可交易所挂牌、按统一规则交易和结算的。","example":"Exchange-traded options have standardised contract terms.","exampleZh":"交易所买卖的期权合约条款是标准化的。"},{"id":"fin-184","bank":"finance","word":"zero-coupon bond","full":"","ipa":"/ˌzɪərəʊ ˈkuːpɒn bɒnd/","pos":"n.","meaning":"零息债券。期间不派息、以低于面值的价格发行，到期按面值偿还的债券；其回报来自价格差，对利率变动较为敏感。","example":"A zero-coupon bond has a duration equal to its maturity.","exampleZh":"零息债券的久期等于其年期。"},{"id":"fin-185","bank":"finance","word":"floating rate note","full":"Floating Rate Note (FRN)","ipa":"/ˌfləʊtɪŋ reɪt ˈnəʊt/","pos":"n.","meaning":"浮动利率票据。票息按参考利率（如 SOFR）加上固定息差定期重设的债务工具，利率风险较低，但票息会随市场利率下降而减少。","example":"The floating rate note pays SOFR plus 80 basis points each quarter.","exampleZh":"这份浮动利率票据每季支付 SOFR 加 80 个基点的利息。"},{"id":"fin-186","bank":"finance","word":"fixed-to-floating","full":"","ipa":"/ˌfɪkst tə ˈfləʊtɪŋ/","pos":"adj.","meaning":"先固定后浮动的。债券在首个赎回日前支付固定票息，之后若未被赎回，改为按参考利率加息差浮动计息。","example":"The fixed-to-floating bond will reset to SOFR plus a margin if it is not called.","exampleZh":"这只先固定后浮动的债券若未被赎回，票息将重设为 SOFR 加息差。"},{"id":"fin-187","bank":"finance","word":"reset date","full":"","ipa":"/ˈriːset deɪt/","pos":"n.","meaning":"利率重设日。浮息或可重设票息债券重新厘定票息的日期。","example":"The coupon will be recalculated on the first reset date in 2029.","exampleZh":"票息将在 2029 年的首个重设日重新计算。"},{"id":"fin-188","bank":"finance","word":"bullet bond","full":"","ipa":"/ˈbʊlɪt bɒnd/","pos":"n.","meaning":"到期一次还本债券。不设提前赎回或分期还款、到期时一次偿还全部本金的债券。","example":"Investors who want predictable cash flows often prefer bullet bonds.","exampleZh":"追求现金流可预期的投资者往往偏好到期一次还本的债券。"},{"id":"fin-189","bank":"finance","word":"non-call period","full":"","ipa":"/ˌnɒn ˈkɔːl ˈpɪəriəd/","pos":"n.","meaning":"不可赎回期。可赎回债券在发行后一段时间内，发行人不得提前赎回的期间。","example":"The bond has a five-year non-call period, after which the issuer may redeem it at par.","exampleZh":"这只债券有五年不可赎回期，之后发行人可按面值赎回。"},{"id":"fin-190","bank":"finance","word":"call schedule","full":"","ipa":"/ˈkɔːl ˌʃedjuːl/","pos":"n.","meaning":"赎回时间表。列明发行人可提前赎回债券的各个日期及对应赎回价格的安排。","example":"Please check the call schedule in the offering circular before you buy.","exampleZh":"购买前请先查看发行通函中的赎回时间表。"},{"id":"fin-191","bank":"finance","word":"make-whole call","full":"","ipa":"/ˌmeɪk ˈhəʊl kɔːl/","pos":"n.","meaning":"全额补偿赎回条款。允许发行人随时提前赎回，但须按剩余现金流以某基准利率加息差折现后的价值（通常不低于面值）支付，以补偿投资者。","example":"Because of the make-whole call, early redemption is usually expensive for the issuer.","exampleZh":"由于有全额补偿赎回条款，提前赎回对发行人来说通常代价不菲。"},{"id":"fin-192","bank":"finance","word":"puttable bond","full":"","ipa":"/ˈpʊtəbl bɒnd/","pos":"n.","meaning":"可回售债券。赋予持有人在指定日期按约定价格把债券卖回给发行人的权利的债券，收益率通常较同类普通债券低。","example":"A puttable bond protects investors if interest rates rise sharply.","exampleZh":"如果利率大幅上升，可回售债券能为投资者提供保护。"},{"id":"fin-193","bank":"finance","word":"amortizing bond","full":"","ipa":"/əˈmɔːtaɪzɪŋ bɒnd/","pos":"n.","meaning":"分期摊还债券。本金在债券期内按计划分批偿还，而非到期一次偿还的债券。","example":"The outstanding principal of an amortizing bond falls with each payment.","exampleZh":"分期摊还债券的未偿还本金随每期还款而减少。"},{"id":"fin-194","bank":"finance","word":"covenant","full":"","ipa":"/ˈkʌvənənt/","pos":"n.","meaning":"契约条款。债券或贷款文件中发行人承诺须做或不得做的事项，例如限制额外举债或维持某些财务比率。","example":"The loan covenant restricts the company from paying dividends above a certain level.","exampleZh":"贷款契约条款限制公司派发超过某水平的股息。"},{"id":"fin-195","bank":"finance","word":"negative pledge","full":"","ipa":"/ˌneɡətɪv ˈpledʒ/","pos":"n.","meaning":"消极担保条款。发行人承诺不以其资产为其他债务设定担保（或须同时给予本债券同等担保）的条款，以保障无抵押债权人。","example":"The negative pledge stops the issuer from giving secured status to new lenders.","exampleZh":"消极担保条款防止发行人给予新贷款人有抵押的地位。"},{"id":"fin-196","bank":"finance","word":"pari passu","full":"","ipa":"/ˌpæri ˈpæsuː/","pos":"adv.","meaning":"同等受偿。拉丁语，意为“同步”；指同一类别的债务在偿付次序上地位相同，按比例受偿。","example":"The notes rank pari passu with all other senior unsecured obligations of the issuer.","exampleZh":"该票据与发行人所有其他高级无抵押债务同等受偿。"},{"id":"fin-197","bank":"finance","word":"event of default","full":"","ipa":"/ɪˈvent əv dɪˈfɔːlt/","pos":"n.","meaning":"违约事件。债务文件中列明、发生后债权人可宣布债务提前到期的情形，例如逾期未付本息或破产。","example":
