"Non-payment of interest for 30 days constitutes an event of default.","exampleZh":"逾期 30 天未付利息即构成违约事件。"},{"id":"fin-198","bank":"finance","word":"cross-default","full":"","ipa":"/ˌkrɒs dɪˈfɔːlt/","pos":"n.","meaning":"交叉违约。若发行人在其他债务上违约，即视为本债务也违约的条款。","example":"A cross-default clause links this bond to the issuer's bank loans.","exampleZh":"交叉违约条款把这只债券与发行人的银行贷款联系起来。"},{"id":"fin-199","bank":"finance","word":"bondholder","full":"","ipa":"/ˈbɒndhəʊldə/","pos":"n.","meaning":"债券持有人。持有债券、对发行人享有收取本息权利的投资者。","example":"Bondholders rank ahead of shareholders in a liquidation.","exampleZh":"在清盘时，债券持有人的受偿次序先于股东。"},{"id":"fin-200","bank":"finance","word":"yield to worst","full":"Yield to Worst (YTW)","ipa":"/ˌjiːld tə ˈwɜːst/","pos":"n.","meaning":"最差收益率。在债券的所有可能赎回日中，按对投资者最不利情况计算的收益率，取到期收益率与各赎回收益率中的最低值。","example":"For callable bonds trading above par, we quote the yield to worst.","exampleZh":"对价格高于面值的可赎回债券，我们报的是最差收益率。"},{"id":"fin-201","bank":"finance","word":"sovereign bond","full":"","ipa":"/ˈsɒvrɪn bɒnd/","pos":"n.","meaning":"主权债券。由国家政府发行的债券，信用风险取决于该国的偿债能力与意愿。","example":"Emerging-market sovereign bonds carry higher yields but also higher risk.","exampleZh":"新兴市场主权债券收益较高，但风险也较高。"},{"id":"fin-202","bank":"finance","word":"green bond","full":"","ipa":"/ˈɡriːn bɒnd/","pos":"n.","meaning":"绿色债券。募集资金专门用于合资格环保或气候项目的债券，通常须按框架披露资金用途；其信用风险与发行人其他同级债券相同。","example":"The proceeds of the green bond will finance offshore wind projects.","exampleZh":"这只绿色债券的募集资金将用于海上风电项目。"},{"id":"fin-203","bank":"finance","word":"AT1","full":"Additional Tier 1 capital instrument","ipa":"/ˌeɪ tiː ˈwʌn/","pos":"n.","meaning":"额外一级资本工具。银行发行的永续、可吸收亏损的资本工具；在银行资本不足或监管机构认定无法持续经营时，可能被暂停派息、减记或转换为股份，投资者可能损失全部本金。","example":"AT1 coupons are discretionary and may be cancelled without causing a default.","exampleZh":"额外一级资本工具的票息属酌情派发，可被取消而不构成违约。"},{"id":"fin-204","bank":"finance","word":"contingent convertible","full":"Contingent Convertible (CoCo)","ipa":"/kənˌtɪndʒənt kənˈvɜːtəbl/","pos":"n.","meaning":"或有可转换债券。在触发事件（如资本比率低于某水平）发生时，会自动转换为股份或被减记的债务工具，属复杂产品。","example":"Contingent convertibles can be written down if the bank's capital ratio falls below the trigger.","exampleZh":"如果银行资本比率跌破触发水平，或有可转换债券可能被减记。"},{"id":"fin-205","bank":"finance","word":"write-down","full":"","ipa":"/ˈraɪt daʊn/","pos":"n.","meaning":"减记。按条款或监管决定，把债务工具的本金部分或全部注销。","example":"A full write-down would leave the noteholders with nothing.","exampleZh":"若全额减记，票据持有人将一无所有。"},{"id":"fin-206","bank":"finance","word":"bail-in","full":"","ipa":"/ˈbeɪl ɪn/","pos":"n.","meaning":"自救（内部纾困）。金融机构陷入危机时，由处置机构把其股东和债权人的权益减记或转为股份来吸收亏损，而不是用公帑救助。","example":"Under the resolution regime, senior bonds may also be subject to bail-in.","exampleZh":"根据处置机制，高级债券也可能须承担自救。"},{"id":"fin-207","bank":"finance","word":"Tier 2 capital","full":"","ipa":"/ˌtɪə ˈtuː ˈkæpɪtl/","pos":"n.","meaning":"二级资本。银行监管资本中次于一级资本的部分，常见为有固定年期的次级债务，在银行无法持续经营时同样可能被用来吸收亏损。","example":"The bank issued ten-year Tier 2 capital notes to strengthen its capital base.","exampleZh":"该银行发行十年期二级资本票据，以增强资本基础。"},{"id":"fin-208","bank":"finance","word":"fallen angel","full":"","ipa":"/ˌfɔːlən ˈeɪndʒl/","pos":"n.","meaning":"堕落天使。原属投资级、后被下调至高收益级的债券或发行人。","example":"Some funds must sell a bond once it becomes a fallen angel.","exampleZh":"某些基金在债券沦为堕落天使后必须将其卖出。"},{"id":"fin-209","bank":"finance","word":"downgrade","full":"","ipa":"/ˌdaʊnˈɡreɪd/","pos":"v.","meaning":"下调（评级）。评级机构调低发行人或债券的信用评级，通常会令其价格下跌、融资成本上升。","example":"The agency downgraded the developer to B minus last week.","exampleZh":"评级机构上周把该发展商的评级下调至 B 减。"},{"id":"fin-210","bank":"finance","word":"rating outlook","full":"","ipa":"/ˈreɪtɪŋ ˌaʊtlʊk/","pos":"n.","meaning":"评级展望。评级机构对未来一段时间内评级可能变动方向的看法，分为正面、稳定、负面等。","example":"The rating was affirmed, but the outlook was revised to negative.","exampleZh":"评级获维持，但展望被调整为负面。"},{"id":"fin-211","bank":"finance","word":"repo","full":"Repurchase Agreement","ipa":"/ˈriːpəʊ/","pos":"n.","meaning":"回购协议。一方出售证券并约定在未来以较高价格购回，实质是以证券作抵押的短期借款。","example":"Banks use repo to fund their bond inventories overnight.","exampleZh":"银行利用回购协议为其债券库存进行隔夜融资。"},{"id":"fin-212","bank":"finance","word":"policy rate","full":"","ipa":"/ˈpɒləsi reɪt/","pos":"n.","meaning":"政策利率。中央银行用来实施货币政策的主要利率指标，例如美联储的联邦基金利率目标区间。","example":"Markets expect the central bank to keep the policy rate unchanged this month.","exampleZh":"市场预期中央银行本月维持政策利率不变。"},{"id":"fin-213","bank":"finance","word":"FOMC","full":"Federal Open Market Committee","ipa":"/ˌef əʊ em ˈsiː/","pos":"n.","meaning":"联邦公开市场委员会。美国联邦储备系统中负责制定货币政策、决定联邦基金利率目标的机构。","example":"Bond yields fell after the FOMC signalled two cuts next year.","exampleZh":"联邦公开市场委员会暗示明年减息两次后，债券收益率回落。"},{"id":"fin-214","bank":"finance","word":"federal funds rate","full":"","ipa":"/ˌfedərəl ˈfʌndz reɪt/","pos":"n.","meaning":"联邦基金利率。美国存款机构之间隔夜拆借准备金的利率；联邦公开市场委员会为其设定目标区间。","example":"The federal funds rate target range was lowered by 25 basis points.","exampleZh":"联邦基金利率目标区间被下调了 25 个基点。"},{"id":"fin-215","bank":"finance","word":"rate cut","full":"","ipa":"/ˈreɪt kʌt/","pos":"n.","meaning":"减息。中央银行调低政策利率。减息通常推高现有债券价格，但会降低浮息产品和存款的收益。","example":"A rate cut would reduce the coupon on your floating rate notes.","exampleZh":"减息会令您持有的浮息票据票息下降。"},{"id":"fin-216","bank":"finance","word":"HKD Prime Rate","full":"","ipa":"/ˌeɪtʃ keɪ ˈdiː ˈpraɪm reɪt/","pos":"n.","meaning":"港元最优惠利率。香港银行自行公布、作为按揭和部分贷款定价基础的利率，各银行可不相同。","example":"The mortgage is priced at Prime minus 1.75 percent.","exampleZh":"这笔按揭以最优惠利率减 1.75% 计息。"},{"id":"fin-217","bank":"finance","word":"Linked Exchange Rate System","full":"Linked Exchange Rate System (LERS)","ipa":"/ˌlɪŋkt ɪksˈtʃeɪndʒ reɪt ˈsɪstəm/","pos":"n.","meaning":"联系汇率制度。香港自 1983 年起实行的货币制度，由金管局在 7.75 至 7.85 港元兑 1 美元的兑换保证范围内维持港元汇率稳定。","example":"Under the Linked Exchange Rate System, HIBOR tends to follow US dollar rates.","exampleZh":"在联系汇率制度下，香港银行同业拆息往往跟随美元利率走动。"},{"id":"fin-218","bank":"finance","word":"inverted yield curve","full":"","ipa":"/ɪnˌvɜːtɪd ˈjiːld kɜːv/","pos":"n.","meaning":"倒挂收益率曲线。短期利率高于长期利率的收益率曲线形态，常被视为经济放缓的信号之一。","example":"An inverted yield curve makes short-dated deposits look more attractive than long bonds.","exampleZh":"收益率曲线倒挂时，短期存款看来比长债更吸引。"},{"id":"fin-219","bank":"finance","word":"real yield","full":"","ipa":"/ˈrɪəl jiːld/","pos":"n.","meaning":"实际收益率。扣除通胀预期后的收益率，通常以通胀挂钩国债的收益率来观察。","example":"Real yields turned positive as inflation expectations fell.","exampleZh":"随着通胀预期回落，实际收益率转为正数。"},{"id":"fin-220","bank":"finance","word":"CPI","full":"Consumer Price Index","ipa":"/ˌsiː piː ˈaɪ/","pos":"n.","meaning":"消费物价指数。衡量一篮子消费品和服务价格变动的指数，是观察通胀的主要指标。","example":"The latest CPI print came in above expectations.","exampleZh":"最新公布的消费物价指数高于预期。"},{"id":"fin-221","bank":"finance","word":"term SOFR","full":"Term Secured Overnight Financing Rate","ipa":"/ˌtɜːm ˈsəʊfə/","pos":"n.","meaning":"定期有担保隔夜融资利率。以 SOFR 期货等市场数据推算的前瞻性定期利率（如一个月、三个月），在期初即可得知，常用于贷款定价。","example":"The loan facility references three-month term SOFR.","exampleZh":"这笔贷款额度参考三个月定期 SOFR。"},{"id":"fin-222","bank":"finance","word":"compounded in arrears","full":"","ipa":"/kəmˈpaʊndɪd ɪn əˈreəz/","pos":"adj.","meaning":"后置复利计算的。按计息期内每日实际公布的隔夜利率复利计算，期末才能确定该期利率；这是 SOFR 浮息债券的常见做法。","example":"The coupon is based on SOFR compounded in arrears, so it is only known near the payment date.","exampleZh":"票息按后置复利计算的 SOFR 厘定，因此临近付息日才会确定。"},{"id":"fin-223","bank":"finance","word":"unit trust","full":"","ipa":"/ˌjuːnɪt ˈtrʌst/","pos":"n.","meaning":"单位信托。以信托形式成立的集体投资计划，由受托人持有资产、基金经理负责投资，投资者持有基金单位。香港向公众销售须获证监会认可。","example":"The unit trust is authorized by the SFC, but authorization does not mean it is recommended.","exampleZh":"这只单位信托获证监会认可，但认可不等于推介。"},{"id":"fin-224","bank":"finance","word":"open-ended fund","full":"","ipa":"/ˌəʊpən ˈendɪd ˈfʌnd/","pos":"n.","meaning":"开放式基金。可按资产净值持续发行和赎回基金单位的基金，规模随申购和赎回而变动。","example":"You can redeem an open-ended fund on any dealing day at the prevailing NAV.","exampleZh":"开放式基金可在任何交易日按当时的资产净值赎回。"},{"id":"fin-225","bank":"finance","word":"closed-ended fund","full":"","ipa":"/ˌkləʊzd ˈendɪd ˈfʌnd/","pos":"n.","meaning":"封闭式基金。发行后份额固定、投资者一般不能向基金赎回，只能在二级市场买卖的基金，价格可能偏离资产净值。","example":"The closed-ended fund trades at a 12 percent discount to its NAV.","exampleZh":"这只封闭式基金以较资产净值折让百分之十二的价格交易。"},{"id":"fin-226","bank":"finance","word":"OFC","full":"Open-ended Fund Company","ipa":"/ˌəʊ ef ˈsiː/","pos":"n.","meaning":"开放式基金型公司。香港法例下以公司形式成立、股本可变动的开放式基金载体，须在证监会注册。","example":"The manager chose an OFC structure to domicile the fund in Hong Kong.","exampleZh":"基金经理选择开放式基金型公司结构，把基金设在香港。"},{"id":"fin-227","bank":"finance","word":"UCITS","full":"Undertakings for Collective Investment in Transferable Securities","ipa":"/ˈjuːsɪts/","pos":"n.","meaning":"可转让证券集体投资计划。欧盟就零售基金在投资范围、分散度和流动性等方面订立的监管框架；在香港销售给公众仍须另获证监会认可。","example":"Many funds sold to Hong Kong retail investors are Luxembourg-domiciled UCITS.","exampleZh":"向香港散户销售的不少基金是在卢森堡注册的可转让证券集体投资计划。"},{"id":"fin-228","bank":"finance","word":"share class","full":"","ipa":"/ˈʃeə klɑːs/","pos":"n.","meaning":"股份类别（基金类别）。同一基金内在货币、收费、派息方式或对冲安排上有所不同的份额类别，底层投资组合相同。","example":"The USD and HKD share classes invest in the same portfolio but in different currencies.","exampleZh":"美元和港元股份类别投资于同一组合，只是货币不同。"},{"id":"fin-229","bank":"finance","word":"dividend paid out of capital","full":"","ipa":"/ˈdɪvɪdend peɪd aʊt əv ˈkæpɪtl/","pos":"n.","meaning":"从资本中派息。基金以本金而非投资收益支付股息，等同于退还部分原投资额，会令每单位资产净值即时减少。证监会要求基金在销售文件中披露。","example":"Dividends paid out of capital amount to a partial return of your original investment.","exampleZh":"从资本中派息，相当于退还您部分原有投资。"},{"id":"fin-230","bank":"finance","word":"hedged share class","full":"","ipa":"/ˈhedʒd ˈʃeə klɑːs/","pos":"n.","meaning":"对冲股份类别。以对冲工具减少基金基础货币与该类别货币之间汇率波动影响的份额类别；对冲不一定完全有效，也有成本。","example":"The AUD hedged share class reduces, but does not eliminate, currency risk.","exampleZh":"澳元对冲股份类别可降低但不能消除货币风险。"},{"id":"fin-231","bank":"finance","word":"subscription fee","full":"","ipa":"/səbˈskrɪpʃn fiː/","pos":"n.","meaning":"认购费。投资者认购基金时缴付的一次性费用，通常按认购金额的百分比计算。","example":"The subscription fee is up to 5 percent of the subscription amount.","exampleZh":"认购费最高为认购金额的百分之五。"},{"id":"fin-232","bank":"finance","word":"redemption fee","full":"","ipa":"/rɪˈdempʃn fiː/","pos":"n.","meaning":"赎回费。赎回基金份额时收取的费用，部分基金只在持有期较短时收取。","example":"A redemption fee applies if you sell within 90 days.","exampleZh":"若在 90 日内卖出，须缴付赎回费。"},{"id":"fin-233","bank":"finance","word":"performance fee","full":"","ipa":"/pəˈfɔːməns fiː/","pos":"n.","meaning":"表现费。基金经理在基金回报超过约定水平时按超额部分收取的费用。","example":"The performance fee is charged only above the high-water mark.","exampleZh":"只有超过高水位线的部分才收取表现费。"},{"id":"fin-234","bank":"finance","word":"high-water mark","full":"","ipa":"/ˌhaɪ ˈwɔːtə mɑːk/","pos":"n.","meaning":"高水位线。基金曾经达到的最高资产净值；只有净值超过此水平，才会再次收取表现费，以免对同一段回报重复收费。","example":"After last year's loss, the fund must regain its high-water mark before charging fees again.","exampleZh":"经历去年的亏损后，基金须重回高水位线才能再收表现费。"},{"id":"fin-235","bank":"finance","word":"hurdle rate","full":"","ipa":"/ˈhɜːdl reɪt/","pos":"n.","meaning":"门槛回报率。收取表现费或附带权益前，投资回报必须超过的最低水平。","example":"The fund has an 8 percent hurdle rate before any carried interest is paid.","exampleZh":"该基金须达到百分之八的门槛回报率，才会支付附带权益。"},{"id":"fin-236","bank":"finance","word":"dealing day","full":"","ipa":"/ˈdiːlɪŋ deɪ/","pos":"n.","meaning":"交易日（基金买卖日）。基金接受申购和赎回并计算资产净值的日子，由基金文件规定。","example":"Orders received before the cut-off time are processed on the same dealing day.","exampleZh":"在截单时间前收到的指示会在同一交易日处理。"},{"id":"fin-237","bank":"finance","word":"cut-off time","full":"","ipa":"/ˈkʌt ɒf taɪm/","pos":"n.","meaning":"截单时间。交易或基金申购赎回指示须在此时间前提交，才能按当日价格处理。","example":"The cut-off time for this fund is 4 p.m. Hong Kong time.","exampleZh":"这只基金的截单时间为香港时间下午四时。"},{"id":"fin-238","bank":"finance","word":"forward pricing","full":"","ipa":"/ˈfɔːwəd ˈpraɪsɪŋ/","pos":"n.","meaning":"远期定价。基金申购和赎回按下单后下一次计算的资产净值成交，投资者下单时并不知道成交价。","example":"Because of forward pricing, you will only know your unit price the next day.","exampleZh":"由于采用远期定价，您要到翌日才知道成交单位价格。"},{"id":"fin-239","bank":"finance","word":"swing pricing","full":"","ipa":"/ˈswɪŋ ˈpraɪsɪŋ/","pos":"n.","meaning":"摆动定价。基金在大额净申购或净赎回时调整资产净值，把交易成本转由进出的投资者承担，以保护留在基金中的投资者。","example":"Swing pricing protects long-term holders from the costs created by large redemptions.","exampleZh":"摆动定价保护长期持有人，免受大额赎回带来的成本影响。"},{"id":"fin-240","bank":"finance","word":"redemption gate","full":"","ipa":"/rɪˈdempʃn ɡeɪt/","pos":"n.","meaning":"赎回限制。基金在单一交易日赎回量超过某比例时，可按文件规定限制或延后处理赎回的机制。","example":"The fund activated a redemption gate when outflows exceeded 10 percent of NAV.","exampleZh":"赎回量超过资产净值百分之十时，基金启动了赎回限制。"},{"id":"fin-241","bank":"finance","word":"lock-up period","full":"","ipa":"/ˈlɒk ʌp ˈpɪəriəd/","pos":"n.","meaning":"禁售期（锁定期）。投资后不能赎回或出售的期间，私募基金较常见。","example":"The hedge fund has a one-year lock-up period.","exampleZh":"该对冲基金设有一年禁售期。"},{"id":"fin-242","bank":"finance","word":"fund factsheet","full":"","ipa":"/ˈfʌnd ˈfæktʃiːt/","pos":"n.","meaning":"基金概览（基金月报）。基金公司定期发布的简要资料，载有表现、持仓、费用和风险等信息，属宣传材料，须与销售文件一并阅读。","example":"The fund factsheet shows the top ten holdings as of last month.","exampleZh":"基金概览列出截至上月的十大持仓。"},{"id":"fin-243","bank":"finance","word":"index fund","full":"","ipa":"/ˈɪndeks fʌnd/","pos":"n.","meaning":"指数基金。以追踪某一市场指数表现为目标的基金，通常收费较低。","example":"An index fund aims to match the market, not to beat it.","exampleZh":"指数基金的目标是跟上市场，而非跑赢市场。"},{"id":"fin-244","bank":"finance","word":"active management","full":"","ipa":"/ˌæktɪv ˈmænɪdʒmənt/","pos":"n.","meaning":"主动管理。基金经理通过选股、择时等方式，力求跑赢基准的投资方式，收费通常高于被动管理。","example":"Active management may justify higher fees only if it adds value after costs.","exampleZh":"只有扣除成本后仍能增值，主动管理才算对得起较高的收费。"},{"id":"fin-245","bank":"finance","word":"alpha","full":"","ipa":"/ˈælfə/","pos":"n.","meaning":"阿尔法（超额回报）。经风险调整后，投资回报超出基准或市场预期的部分，常用来衡量管理人的选股能力。","example":"The manager generated two percent of alpha over the benchmark.","exampleZh":"这位基金经理跑赢基准两个百分点的超额回报。"},{"id":"fin-246","bank":"finance","word":"beta","full":"","ipa":"/ˈbiːtə/","pos":"n.","meaning":"贝塔系数。衡量投资相对大市波动程度的指标；贝塔为 1 表示与市场同步，大于 1 表示波动较大。","example":"A stock with a beta of 1.5 tends to move more than the market.","exampleZh":"贝塔系数为 1.5 的股票，波动往往大于大市。"},{"id":"fin-247","bank":"finance","word":"Sharpe ratio","full":"","ipa":"/ˈʃɑːp ˌreɪʃiəʊ/","pos":"n.","meaning":"夏普比率。投资回报超出无风险利率的部分除以回报的标准差，衡量每承担一单位风险所获的超额回报。","example":"Fund B has the higher Sharpe ratio despite its lower return.","exampleZh":"基金乙回报虽低，夏普比率却较高。"},{"id":"fin-248","bank":"finance","word":"standard deviation","full":"","ipa":"/ˌstændəd ˌdiːviˈeɪʃn/","pos":"n.","meaning":"标准差。衡量回报偏离平均值程度的统计指标，常用来表示投资的波动性。","example":"The portfolio's annualised standard deviation is about 9 percent.","exampleZh":"该组合的年化标准差约为百分之九。"},{"id":"fin-249","bank":"finance","word":"correlation","full":"","ipa":"/ˌkɒrəˈleɪʃn/","pos":"n.","meaning":"相关系数（相关性）。衡量两项资产回报同向变动程度的指标，范围由负 1 至正 1；相关性低的资产组合起来有助分散风险。","example":"Bonds and equities showed high correlation during the 2022 sell-off.","exampleZh":"在 2022 年的抛售中，债券与股票呈现高度相关。"},{"id":"fin-250","bank":"finance","word":"rebalancing","full":"","ipa":"/ˌriːˈbælənsɪŋ/","pos":"n.","meaning":"再平衡。定期把投资组合的资产比例调回目标配置的做法。","example":"Annual rebalancing brought the equity weight back to 60 percent.","exampleZh":"每年的再平衡把股票比重调回百分之六十。"},{"id":"fin-251","bank":"finance","word":"dollar-cost averaging","full":"","ipa":"/ˌdɒlə ˌkɒst ˈævərɪdʒɪŋ/","pos":"n.","meaning":"平均成本法。定期以固定金额买入同一投资，价格低时买入较多份额、价格高时较少，以减少择时影响；不能保证获利。","example":"Dollar-cost averaging reduces timing risk but does not prevent losses.","exampleZh":"平均成本法可降低择时风险，但不能防止亏损。"},{"id":"fin-252","bank":"finance","word":"hedge fund","full":"","ipa":"/ˈhedʒ fʌnd/","pos":"n.","meaning":"对冲基金。采用较灵活策略（如沽空、杠杆、衍生工具）的私募投资基金，通常只向专业投资者发售。","example":"Hedge funds are generally available only to professional investors.","exampleZh":"对冲基金一般只向专业投资者发售。"},{"id":"fin-253","bank":"finance","word":"private equity","full":"","ipa":"/ˌpraɪvət ˈekwəti/","pos":"n.","meaning":"私募股权。投资于未上市公司股权的资产类别，投资期长、流动性低。","example":"Private equity commitments are usually locked up for ten years or more.","exampleZh":"私募股权的承诺资金通常锁定十年或以上。"},{"id":"fin-254","bank":"finance","word":"capital call","full":"","ipa":"/ˈkæpɪtl kɔːl/","pos":"n.","meaning":"资本催缴（提款通知）。私募基金在找到投资项目时，要求投资者按认缴承诺分批注资的通知。","example":"Clients must keep enough cash to meet capital calls at short notice.","exampleZh":"客户须预留足够现金，以便在短时间内应付资本催缴。"},{"id":"fin-255","bank":"finance","word":"IRR","full":"Internal Rate of Return","ipa":"/ˌaɪ ɑːr ˈɑː/","pos":"n.","meaning":"内部回报率。使一系列现金流的净现值等于零的折现率，常用来衡量私募投资或保险储蓄计划的年化回报。","example":"The illustrated IRR is not guaranteed and depends on future dividends.","exampleZh":"演示中的内部回报率并无保证，取决于将来的红利。"},{"id":"fin-256","bank":"finance","word":"REIT","full":"Real Estate Investment Trust","ipa":"/riːt/","pos":"n.","meaning":"房地产投资信托基金。主要投资于可产生收入的房地产、并把大部分收入分派给持有人的集体投资计划，在香港多为上市交易。","example":"The REIT's distributions depend on rental income from its shopping malls.","exampleZh":"这只房地产投资信托基金的分派取决于其商场的租金收入。"},{"id":"fin-257","bank":"finance","word":"leveraged and inverse product","full":"Leveraged and Inverse Product (L&I Product)","ipa":"/ˈliːvərɪdʒd ənd ˌɪnvɜːs ˈprɒdʌkt/","pos":"n.","meaning":"杠杆及反向产品。在交易所买卖、旨在提供某指数单日表现的倍数或反向倍数回报的产品；持有超过一天，回报可能明显偏离指数的倍数。","example":"Leveraged and inverse products are designed for short-term trading, not long-term holding.","exampleZh":"杠杆及反向产品是为短线买卖而设，并非供长期持有。"},{"id":"fin-258","bank":"finance","word":"HNWI","full":"High-Net-Worth Individual","ipa":"/ˌeɪtʃ en ˌdʌbljuː ˈaɪ/","pos":"n.","meaning":"高净值人士。可投资资产达到较高水平的个人客户，具体门槛因机构而异，不等同于法例上的专业投资者。","example":"Being an HNWI does not automatically make you a professional investor.","exampleZh":"成为高净值人士，并不自动等于专业投资者。"},{"id":"fin-259","bank":"finance","word":"relationship manager","full":"Relationship Manager (RM)","ipa":"/rɪˈleɪʃnʃɪp ˌmænɪdʒə/","pos":"n.","meaning":"客户经理。负责维系客户关系、了解客户需要并协调银行各项服务的人员；若进行受规管活动，须具备相应牌照或注册。","example":"Your relationship manager will arrange a portfolio review next month.","exampleZh":"您的客户经理会在下月安排一次组合检讨。"},{"id":"fin-260","bank":"finance","word":"family office","full":"","ipa":"/ˈfæməli ˌɒfɪs/","pos":"n.","meaning":"家族办公室。为一个或多个富裕家族管理投资、税务、传承及其他事务的专门机构。","example":"The family office oversees the investments of three generations.","exampleZh":"这家家族办公室负责管理三代人的投资。"},{"id":"fin-261","bank":"finance","word":"settlor","full":"","ipa":"/ˈsetlə/","pos":"n.","meaning":"财产授予人（委托人）。设立信托并把资产转移给受托人的人。","example":"The settlor signed a letter of wishes to guide the trustee.","exampleZh":"财产授予人签署了一份意愿书，为受托人提供指引。"},{"id":"fin-262","bank":"finance","word":"beneficiary","full":"","ipa":"/ˌbenɪˈfɪʃəri/","pos":"n.","meaning":"受益人。根据信托、保单或遗嘱享有利益的人。","example":"She named her two children as beneficiaries of the policy.","exampleZh":"她把两个孩子指定为保单的受益人。"},{"id":"fin-263","bank":"finance","word":"succession planning","full":"","ipa":"/səkˈseʃn ˈplænɪŋ/","pos":"n.","meaning":"传承规划。预先安排财富或家族企业在下一代之间转移和管理的方式。","example":"Succession planning should start well before it is urgently needed.","exampleZh":"传承规划应在迫切需要之前及早开始。"},{"id":"fin-264","bank":"finance","word":"investment objective","full":"","ipa":"/ɪnˈvestmənt əbˌdʒektɪv/","pos":"n.","meaning":"投资目标。客户希望通过投资达成的目的，如保本、收益或资本增值，是评估适合性的重要依据。","example":"Your investment objective is income, so we focus on bond funds.","exampleZh":"您的投资目标是取得收益，所以我们以债券基金为主。"},{"id":"fin-265","bank":"finance","word":"risk tolerance","full":"","ipa":"/ˈrɪsk ˌtɒlərəns/","pos":"n.","meaning":"风险承受能力。客户在财务上和心理上能承受投资亏损的程度。","example":"A product with high volatility may exceed your risk tolerance.","exampleZh":"高波动的产品可能超出您的风险承受能力。"},{"id":"fin-266","bank":"finance","word":"net worth","full":"","ipa":"/ˌnet ˈwɜːθ/","pos":"n.","meaning":"净资产（身家）。总资产减去总负债后的价值。","example":"We use your net worth to assess how much concentration risk is reasonable.","exampleZh":"我们会以您的净资产评估多少集中风险属于合理。"},{"id":"fin-267","bank":"finance","word":"nominee","full":"","ipa":"/ˌnɒmɪˈniː/","pos":"n.","meaning":"代名人。代表实际拥有人登记持有证券或资产的人或公司。","example":"Your shares are held through the bank's nominee company.","exampleZh":"您的股票通过银行的代名人公司持有。"},{"id":"fin-268","bank":"finance","word":"safekeeping","full":"","ipa":"/ˌseɪfˈkiːpɪŋ/","pos":"n.","meaning":"保管服务。由银行或托管人为客户保管证券及其他资产，并处理相关的公司行动。","example":"Bonds bought through us are held in safekeeping in your custody account.","exampleZh":"经我们买入的债券会存放在您的托管账户中保管。"},{"id":"fin-269","bank":"finance","word":"Code of Conduct","full":"","ipa":"/ˌkəʊd əv ˈkɒndʌkt/","pos":"n.","meaning":"操守准则。在香港通常指证监会《证券及期货事务监察委员会持牌人或注册人操守准则》，规定中介人在诚实公平、了解客户、适合性等方面的责任。","example":"Under the Code of Conduct, we must ensure the product is suitable for you.","exampleZh":"根据操守准则，我们必须确保产品适合您。"},{"id":"fin-270","bank":"finance","word":"responsible officer","full":"Responsible Officer (RO)","ipa":"/rɪˌspɒnsəbl ˈɒfɪsə/","pos":"n.","meaning":"负责人员。获证监会核准、负责直接监督持牌法团受规管活动的人员。","example":"Each licensed corporation must have at least two responsible officers for each regulated activity.","exampleZh":"每家持牌法团须为每项受规管活动委任至少两名负责人员。"},{"id":"fin-271","bank":"finance","word":"relevant individual","full":"","ipa":"/ˈreləvənt ˌɪndɪˈvɪdʒuəl/","pos":"n.","meaning":"有关人士。在注册机构（如银行）中进行受规管活动、并已登记在金管局纪录册上的人员。","example":"Only relevant individuals may advise clients on securities.","exampleZh":"只有有关人士才可就证券向客户提供意见。"},{"id":"fin-272","bank":"finance","word":"registered institution","full":"","ipa":"/ˈredʒɪstəd ˌɪnstɪˈtjuːʃn/","pos":"n.","meaning":"注册机构。获证监会注册、可进行受规管活动的认可财务机构（主要是银行），其相关业务由金管局作前线监管。","example":"As a registered institution, the bank is supervised by the HKMA for its securities business.","exampleZh":"作为注册机构，该银行的证券业务由金管局监管。"},{"id":"fin-273","bank":"finance","word":"regulated activity","full":"","ipa":"/ˈreɡjuleɪtɪd ækˈtɪvəti/","pos":"n.","meaning":"受规管活动。《证券及期货条例》列明须领牌或注册方可进行的活动，例如第 1 类“证券交易”、第 4 类“就证券提供意见”、第 9 类“提供资产管理”。","example":"Advising on securities is Type 4 regulated activity.","exampleZh":"就证券提供意见属于第 4 类受规管活动。"},{"id":"fin-274","bank":"finance","word":"PEP","full":"Politically Exposed Person","ipa":"/ˌpiː iː ˈpiː/","pos":"n.","meaning":"政治人物。担任或曾担任重要公职的人士，以及其家人和密切联系人；按反洗钱规定须采取更严格的尽职审查。","example":"Because the client is a PEP, senior management approval is required.","exampleZh":"由于客户属政治人物，须取得高级管理层批准。"},{"id":"fin-275","bank":"finance","word":"source of wealth","full":"","ipa":"/ˌsɔːs əv ˈwelθ/","pos":"n.","meaning":"财富来源。客户整体财富是如何累积而来的，例如经营业务、受雇收入或继承。","example":"Please describe your source of wealth, such as business income or inheritance.","exampleZh":"请说明您的财富来源，例如业务收入或继承。"},{"id":"fin-276","bank":"finance","word":"source of funds","full":"","ipa":"/ˌsɔːs əv ˈfʌndz/","pos":"n.","meaning":"资金来源。某一笔具体交易或存入款项的来源，与整体的财富来源不同。","example":"We need to verify the source of funds for this transfer.","exampleZh":"我们须核实这笔转账的资金来源。"},{"id":"fin-277","bank":"finance","word":"EDD","full":"Enhanced Due Diligence","ipa":"/ˌiː diː ˈdiː/","pos":"n.","meaning":"加强尽职审查。对高风险客户（如政治人物）采取的额外审查措施，包括核实财富来源和加强持续监察。","example":"Enhanced due diligence is required for customers from high-risk jurisdictions.","exampleZh":"来自高风险司法管辖区的客户须接受加强尽职审查。"},{"id":"fin-278","bank":"finance","word":"STR","full":"Suspicious Transaction Report","ipa":"/ˌes tiː ˈɑː/","pos":"n.","meaning":"可疑交易报告。机构知悉或怀疑某财产与犯罪得益或恐怖分子财产有关时，向联合财富情报组提交的报告。","example":"Staff must not tip off the customer after filing an STR.","exampleZh":"员工在提交可疑交易报告后，不得向客户通风报讯。"},{"id":"fin-279","bank":"finance","word":"JFIU","full":"Joint Financial Intelligence Unit","ipa":"/ˌdʒeɪ ef aɪ ˈjuː/","pos":"n.","meaning":"联合财富情报组。由香港警务处和香港海关人员组成、负责接收和分析可疑交易报告的机构。","example":"Suspicious transaction reports are filed with the JFIU.","exampleZh":"可疑交易报告须提交予联合财富情报组。"},{"id":"fin-280","bank":"finance","word":"sanctions screening","full":"","ipa":"/ˈsæŋkʃnz ˈskriːnɪŋ/","pos":"n.","meaning":"制裁名单筛查。把客户、交易对手和付款资料与制裁名单比对，以免与受制裁人士或实体进行交易。","example":"The payment was held for sanctions screening.","exampleZh":"这笔付款因进行制裁名单筛查而被暂缓。"},{"id":"fin-281","bank":"finance","word":"cooling-off period","full":"","ipa":"/ˌkuːlɪŋ ˈɒf ˈpɪəriəd/","pos":"n.","meaning":"冷静期。客户在购买某些产品（如长期保险或部分非上市结构性产品）后，可在指定期间内取消并取回款项（或扣除市值调整）的期间。","example":"You may cancel within the cooling-off period, subject to any market value adjustment.","exampleZh":"您可在冷静期内取消，但可能须作市值调整。"},{"id":"fin-282","bank":"finance","word":"audio recording","full":"","ipa":"/ˈɔːdiəʊ rɪˌkɔːdɪŋ/","pos":"n.","meaning":"录音。按金管局要求，银行在向个人客户销售投资产品时，对适合性评估和风险披露过程进行录音并保存记录。","example":"The sales process will be audio recorded for your protection.","exampleZh":"为保障您，销售过程将会录音。"},{"id":"fin-283","bank":"finance","word":"vulnerable customer","full":"","ipa":"/ˈvʌlnərəbl ˈkʌstəmə/","pos":"n.","meaning":"弱势客户。因年龄、教育程度、健康或认知能力等因素，较易在投资决定中受损的客户，银行须给予额外保障，例如安排陪同人。","example":"Additional safeguards apply when selling to vulnerable customers.","exampleZh":"向弱势客户销售时须采取额外保障措施。"},{"id":"fin-284","bank":"finance","word":"conflict of interest","full":"","ipa":"/ˌkɒnflɪkt əv ˈɪntrəst/","pos":"n.","meaning":"利益冲突。机构或员工自身利益可能与客户利益相悖的情况，须予以识别、管理及披露。","example":"We must disclose any conflict of interest before making a recommendation.","exampleZh":"作出建议之前，我们必须披露任何利益冲突。"},{"id":"fin-285","bank":"finance","word":"information barrier","full":"","ipa":"/ˌɪnfəˈmeɪʃn ˈbæriə/","pos":"n.","meaning":"信息屏障（又称“中国墙”）。机构内部为防止非公开信息在部门之间流通而设的制度和措施。","example":"Information barriers separate the research team from the deal team.","exampleZh":"信息屏障把研究团队与交易团队隔开。"},{"id":"fin-286","bank":"finance","word":"insider dealing","full":"","ipa":"/ɪnˌsaɪdə ˈdiːlɪŋ/","pos":"n.","meaning":"内幕交易。掌握上市公司未公开的股价敏感信息时买卖其证券或鼓励他人买卖，属《证券及期货条例》下的市场失当行为及刑事罪行。","example":"Insider dealing can lead to imprisonment in Hong Kong.","exampleZh":"在香港，内幕交易可被判监禁。"},{"id":"fin-287","bank":"finance","word":"front running","full":"","ipa":"/ˌfrʌnt ˈrʌnɪŋ/","pos":"n.","meaning":"抢先交易。在知悉客户大额指令后、执行该指令前先为自己或他人交易，以图获利的不当行为。","example":"Front running a client order is a serious breach of conduct rules.","exampleZh":"抢先于客户指令进行交易，严重违反操守规则。"},{"id":"fin-288","bank":"finance","word":"best execution","full":"","ipa":"/ˌbest ˌeksɪˈkjuːʃn/","pos":"n.","meaning":"最佳执行。中介人须采取一切合理步骤，在价格、成本、速度、成交可能性等方面为客户争取最佳交易结果的责任。","example":"Our best execution policy explains how we choose execution venues.","exampleZh":"我们的最佳执行政策说明我们如何选择交易场所。"},{"id":"fin-289","bank":"finance","word":"churning","full":"","ipa":"/ˈtʃɜːnɪŋ/","pos":"n.","meaning":"过度交易（炒单）。为赚取佣金而频繁替客户买卖，与客户利益不符的不当行为。","example":"Frequent switching without good reason may be regarded as churning.","exampleZh":"无合理理由的频繁转换，可能被视为过度交易。"},{"id":"fin-290","bank":"finance","word":"mis-selling","full":"","ipa":"/ˌmɪs ˈselɪŋ/","pos":"n.","meaning":"不当销售。向客户销售与其需要、风险承受能力或认知不相符的产品，或未充分披露风险的行为。","example":"Proper risk disclosure helps prevent mis-selling.","exampleZh":"充分披露风险，有助防止不当销售。"},{"id":"fin-291","bank":"finance","word":"limit order","full":"","ipa":"/ˈlɪmɪt ˌɔːdə/","pos":"n.","meaning":"限价盘。只按指定价格或更佳价格成交的买卖指令，可控制价格但不保证成交。","example":"Place a limit order if you do not want to pay more than 50 dollars.","exampleZh":"如果您不想以高于 50 元买入，请下限价盘。"},{"id":"fin-292","bank":"finance","word":"market order","full":"","ipa":"/ˈmɑːkɪt ˌɔːdə/","pos":"n.","meaning":"市价盘。按当时市场可得价格立即成交的指令，成交较快但价格不确定。","example":"A market order may be filled at a poor price in a thin market.","exampleZh":"在交投淡薄的市场，市价盘可能以不理想的价格成交。"},{"id":"fin-293","bank":"finance","word":"stop-loss order","full":"","ipa":"/ˈstɒp lɒs ˌɔːdə/","pos":"n.","meaning":"止损盘。价格触及预设水平时自动触发卖出（或买入）的指令，用以限制亏损；在急跌或跳空时，实际成交价可能差于预设价。","example":"A stop-loss order may be executed well below the trigger price if the market gaps down.","exampleZh":"若市场跳空下跌，止损盘的成交价可能远低于触发价。"},{"id":"fin-294","bank":"finance","word":"partial fill","full":"","ipa":"/ˌpɑːʃl ˈfɪl/","pos":"n.","meaning":"部分成交。指令只有部分数量按要求成交，余下部分仍未执行或被取消。","example":"We received a partial fill of 200,000 dollars on your bond order.","exampleZh":"您的债券指令部分成交，金额为二十万美元。"},{"id":"fin-295","bank":"finance","word":"slippage","full":"","ipa":"/ˈslɪpɪdʒ/","pos":"n.","meaning":"滑点（价格偏差）。预期成交价与实际成交价之间的差距，市场急速变动或流动性不足时较大。","example":"Slippage was significant because the order was executed during the news release.","exampleZh":"由于指令在消息公布期间执行，滑点相当大。"},{"id":"fin-296","bank":"finance","word":"block trade","full":"","ipa":"/ˈblɒk treɪd/","pos":"n.","meaning":"大宗交易。规模远大于一般交易、通常经私下协商后执行的证券买卖。","example":"The bank arranged a block trade to sell the founder's shares.","exampleZh":"银行安排了一笔大宗交易，出售创办人的股份。"},{"id":"fin-297","bank":"finance","word":"board lot","full":"","ipa":"/ˈbɔːd lɒt/","pos":"n.","meaning":"每手股数。在香港交易所买卖股票的标准交易单位，不同股票每手股数可不同；不足一手称为碎股。","example":"The board lot for this stock is 500 shares.","exampleZh":"这只股票每手为 500 股。"},{"id":"fin-298","bank":"finance","word":"odd lot","full":"","ipa":"/ˈɒd lɒt/","pos":"n.","meaning":"碎股。少于一手的股票数量，通常须在特别的碎股市场买卖，价格可能较差。","example":"Selling an odd lot may take longer and fetch a lower price.","exampleZh":"出售碎股可能需时较长，价格也可能较低。"},{"id":"fin-299","bank":"finance","word":"DVP","full":"Delivery Versus Payment","ipa":"/ˌdiː viː ˈpiː/","pos":"n.","meaning":"货银对付。证券交收与款项支付同时进行的结算方式，以消除一方交付后另一方不履约的风险。","example":"Bond trades settle on a DVP basis through Euroclear.","exampleZh":"债券交易通过欧洲结算以货银对付方式交收。"},{"id":"fin-300","bank":"finance","word":"clearing","full":"","ipa":"/ˈklɪərɪŋ/","pos":"n.","meaning":"结算（清算）。在交易执行后、交收之前，确认交易细节并计算各方应收应付证券和款项的过程。","example":"HKSCC acts as the central counterparty for clearing in the Hong Kong market.","exampleZh":"香港中央结算有限公司作为香港市场结算的中央对手方。"}],"general":[{"id":"gen-001","bank":"general","word":"articulate","full":"","ipa":"/ɑːˈtɪkjuleɪt/","pos":"v.","meaning":"清楚地表达。指把想法、理由或立场说得明白、有条理。作形容词时读作 /ɑːˈtɪkjələt/，表示“表达能力强的”。在会议上把复杂产品讲清楚，靠的就是这种能力。","example":"She articulated the difference between knock-in and knock-out in plain language.","exampleZh":"她用浅白的语言把敲入和敲出的区别讲清楚了。"},{"id":"gen-002","bank":"general","word":"concise","full":"","ipa":"/kənˈsaɪs/","pos":"adj.","meaning":"简洁的。指用较少的文字把要点说完整，不绕弯、不堆砌。商务电邮、条款对照和向客户作摘要时尤其需要简洁，但不能因此漏掉关键风险。","example":"Please give a concise summary of the three remaining risks.","exampleZh":"请就余下的三项风险作一个简洁的摘要。"},{"id":"gen-003","bank":"general","word":"elaborate","full":"","ipa":"/ɪˈlæbəreɪt/","pos":"v.","meaning":"详细说明。在已给出要点之后，补充细节、例子或推理过程。作形容词时读作 /ɪˈlæbərət/，意为“复杂精细的”。对方说“Could you elaborate?”通常是在请你展开说明。","example":"Could you elaborate on how the memory coupon works in a missed period?","exampleZh":"你能否详细说明，若某一期未达条件，记忆票息将如何运作？"},{"id":"gen-004","bank":"general","word":"clarify","full":"","ipa":"/ˈklærɪfaɪ/","pos":"v.","meaning":"澄清；说明清楚。用于消除歧义、确认口径或把容易混淆的概念区分开来。比单纯重复原话更进一步，是把含义说准确。","example":"Let me clarify that the figure is indicative and not a final offer.","exampleZh":"我先澄清一下：这个数字只是指示性的，并不是最终报价。"},{"id":"gen-005","bank":"general","word":"revert","full":"","ipa":"/rɪˈvɜːt/","pos":"v.","meaning":"回复。在香港及不少国际商务电邮里，常表示稍后向对方回信或汇报进展，例如 “I will revert shortly。” 这是地区常用用法；在一般词典里，revert 的基本义是“回复到原先状态”，正式国际英语里更常说 reply。","example":"I will revert to you this afternoon after checking with the issuer.","exampleZh":"我向发行人核对后，今天下午再回复你。"},{"id":"gen-006","bank":"general","word":"follow-up","full":"","ipa":"/ˈfɒləʊ ʌp/","pos":"n.","meaning":"跟进。指在初次沟通、会议或请求之后，为推动进展而作的后续联系或行动。动词写作 follow up。及时跟进能减少事项被搁置。","example":"A short follow-up email will help us close the outstanding points.","exampleZh":"一封简短的跟进电邮，有助于我们把未决问题收尾。"},{"id":"gen-007","bank":"general","word":"pending","full":"","ipa":"/ˈpendɪŋ/","pos":"adj.","meaning":"待决的；尚未完成的。指正在等待回复、批准、文件或下一步行动的事项。也可以作介词，表示“在……之前／有待”。","example":"Two items are still pending the client's signed confirmation.","exampleZh":"还有两项事宜，有待客户签署确认。"},{"id":"gen-008","bank":"general","word":"forthcoming","full":"","ipa":"/ˌfɔːθˈkʌmɪŋ/","pos":"adj.","meaning":"即将到来的；乐于提供信息的。既可指即将举行的会议或即将公布的结果，也可形容一个人是否愿意把情况说出来。后一种用法里，not forthcoming 表示不太配合或不愿透露。","example":"Please circulate the pack before the forthcoming investment meeting.","exampleZh":"请在即将召开的投资会议之前把材料分发出去。"},{"id":"gen-009","bank":"general","word":"discrepancy","full":"","ipa":"/dɪˈskrepənsi/","pos":"n.","meaning":"出入；不一致之处。指两份文件、两组数字或两种说法之间对不上的地方。发现出入后应核对来源，而不是先假定哪一边一定正确。","example":"There is a discrepancy between the term sheet and the trade confirmation.","exampleZh":"条款清单和成交确认书之间有一处不一致。"},{"id":"gen-010","bank":"general","word":"consistent","full":"","ipa":"/kənˈsɪstənt/","pos":"adj.","meaning":"一致的；连贯的。指不同材料、不同时点或不同人员的说法彼此吻合，或行为与原则保持同一标准。营销材料必须与法律文件保持一致。","example":"The marketing wording must be consistent with the prospectus.","exampleZh":"营销用语必须与募集说明书保持一致。"},{"id":"gen-011","bank":"general","word":"material","full":"","ipa":"/məˈtɪəriəl/","pos":"adj.","meaning":"重大的；实质性的。在商务与法律语境中，不一定指“材料”，而指足以影响判断或决策的重要事项。a material change 即可能改变结论的重要变化。","example":"Any material change in the issuer's credit should be flagged immediately.","exampleZh":"发行人信用出现任何重大变化，都应立即标记出来。"},{"id":"gen-012","bank":"general","word":"mitigate","full":"","ipa":"/ˈmɪtɪɡeɪt/","pos":"v.","meaning":"减轻；缓解。指采取措施降低风险或不利影响的程度，而不是把风险完全消除。可以说 mitigate a risk / a loss / an impact。","example":"Diversification can mitigate concentration risk, but it cannot remove market risk.","exampleZh":"分散投资可以减轻集中度风险，但不能消除市场风险。"},{"id":"gen-013","bank":"general","word":"exacerbate","full":"","ipa":"/ɪɡˈzæsəbeɪt/","pos":"v.","meaning":"加剧；使恶化。指让已经存在的问题或风险变得更严重。与 mitigate 相反。使用杠杆或过度集中，往往会加剧亏损。","example":"A wide bid-offer spread can exacerbate losses if the client has to exit early.","exampleZh":"若客户不得不提前退出，较宽的买卖差价可能加剧亏损。"},{"id":"gen-014","bank":"general","word":"contingent","full":"","ipa":"/kənˈtɪndʒənt/","pos":"adj.","meaning":"有条件的；视情况而定的。指某结果取决于另一事件是否发生。名词 contingency 表示应急安排或或有情况。","example":"Physical delivery is contingent on the knock-in event having been triggered.","exampleZh":"是否进行实物交割，取决于是否已经触发敲入。"},{"id":"gen-015","bank":"general","word":"subsequent","full":"","ipa":"/ˈsʌbsɪkwənt/","pos":"adj.","meaning":"随后的；之后发生的。用于正式书面语，表示在某一时点或事件之后。subsequent to 相当于 after，但语气更正式。","example":"Any subsequent amendment should be initialled by both parties.","exampleZh":"此后的任何修订，均应由双方简签确认。"},{"id":"gen-016","bank":"general","word":"prior","full":"","ipa":"/ˈpraɪə/","pos":"adj.","meaning":"在先的；事先的。指在某一行动或时点之前已经存在或必须完成的。prior approval 即事先批准；prior notice 即事先通知。","example":"The issuer's prior approval is required before the materials are sent out.","exampleZh":"在发出材料之前，须获得发行人的事先批准。"},{"id":"gen-017","bank":"general","word":"preliminary","full":"","ipa":"/prɪˈlɪmɪnəri/","pos":"adj.","meaning":"初步的。指尚未最终确定、仍可能修改的版本或结论，例如初步条款、初步估值或初稿。对外发送时应标明其初步性质，以免被当作定稿。","example":"This is only a preliminary comparison and should not be sent to the client yet.","exampleZh":"这只是初步对照，尚不宜发送给客户。"},{"id":"gen-018","bank":"general","word":"substantiate","full":"","ipa":"/səbˈstænʃieɪt/","pos":"v.","meaning":"证实；提供依据。指用文件、数据或事实来支撑某一说法或结论。没有依据的表述，在合规审查中往往难以通过。","example":"Can we substantiate this performance claim with official data?","exampleZh":"我们能否用官方数据来证实这一业绩表述？"},{"id":"gen-019","bank":"general","word":"caveat","full":"","ipa":"/ˈkæviæt/","pos":"n.","meaning":"限制说明；需要注意的保留意见。用来提醒对方：结论成立是有条件的，或存在例外、风险与口径限制。加注 caveat 不是推卸，而是把边界说清。","example":"One important caveat is that past performance is not a guide to future results.","exampleZh":"一个重要的限制说明是：过往业绩并不预示未来结果。"},{"id":"gen-020","bank":"general","word":"prudent","full":"","ipa":"/ˈpruːdnt/","pos":"adj.","meaning":"审慎的。指在信息不完整或后果较大时，仍保持小心、克制和负责任的判断。金融机构常把prudent 与风险管理、合适性及保守估计联系在一起。","example":"It would be prudent to wait for the final terms before making a recommendation.","exampleZh":"在作出建议之前先等最终条款，会是较为审慎的做法。"},{"id":"gen-021","bank":"general","word":"onus","full":"","ipa":"/ˈəʊnəs/","pos":"n.","meaning":"责任；举证责任。the onus is on someone to do something 表示某事应由谁负责去完成或证明。语气正式，常见于书面讨论责任划分。","example":"The onus is on us to explain the worst-case loss clearly.","exampleZh":"清楚地说明最坏情况下的亏损，是我们的责任。"},{"id":"gen-022","bank":"general","word":"remit","full":"","ipa":"/ˈriːmɪt/","pos":"n.","meaning":"职责范围。指一个人或一个团队被授权处理的事务边界。动词 remit /rɪˈmɪt/ 另有“汇款”或“提交”等意思，这里取名词用法。","example":"Product wording is within our remit; tax advice is not.","exampleZh":"产品措辞属于我们的职责范围，税务建议则不是。"},{"id":"gen-023","bank":"general","word":"mandate","full":"","ipa":"/ˈmændeɪt/","pos":"n.","meaning":"授权；委托范围。在财富管理中常指客户给予团队的投资授权，包括可投资范围、限制和目标。也可泛指一项正式任务或授权。","example":"The portfolio must stay within the agreed investment mandate.","exampleZh":"投资组合必须保持在约定的投资授权范围之内。"},{"id":"gen-024","bank":"general","word":"jurisdiction","full":"","ipa":"/ˌdʒʊərɪsˈdɪkʃn/","pos":"n.","meaning":"司法管辖区；管辖权。既可指某个法律适用的地区，也可指某机构或法院有权处理的范围。跨境产品、销售限制和税务问题都常涉及不同管辖区。","example":"The selling restrictions differ from one jurisdiction to another.","exampleZh":"销售限制因司法管辖区而不同。"},{"id":"gen-025","bank":"general","word":"counterpart","full":"","ipa":"/ˈkaʊntəpɑːt/","pos":"n.","meaning":"对应的人；对等的一方。指在另一家机构、另一个团队或另一份文件中，职位或角色与自己相对应的人。注意不要与 counterparty（交易对手）混淆。","example":"I will check the timeline with my counterpart at the issuing bank.","exampleZh":"我会与发行银行的对应同事核对时间表。"},{"id":"gen-026","bank":"general","word":"liaise","full":"","ipa":"/liˈeɪz/","pos":"v.","meaning":"联络；沟通协调。指在两个或多个团队之间传递信息、对齐安排。在英式商务英语中很常见。名词是 liaison。","example":"Please liaise with operations on the settlement date.","exampleZh":"请就交收日与运营部门联络。"},{"id":"gen-027","bank":"general","word":"stakeholder","full":"","ipa":"/ˈsteɪkhəʊldə/","pos":"n.","meaning":"利益相关方。指会受到某项决定影响、或能影响该决定的个人或团体，如客户、合规、产品、运营和发行人。识别利益相关方有助于把该问的人问到。","example":"We should brief all internal stakeholders before the launch.","exampleZh":"在推出之前，我们应向所有内部相关方作简报。"},{"id":"gen-028","bank":"general","word":"deliverable","full":"","ipa":"/dɪˈlɪvərəbl/","pos":"n.","meaning":"交付成果。指一项工作必须交出的具体产出，如对照表、条款审阅意见或演示文稿。把 deliverable 写清楚，有助于避免“做了很多但没交件”的情况。","example":"The main deliverable this week is a one-page product comparison.","exampleZh":"本周的主要交付成果是一页纸的产品对照。"},{"id":"gen-029","bank":"general","word":"milestone","full":"","ipa":"/ˈmaɪlstəʊn/","pos":"n.","meaning":"里程碑。项目中可检查进度的关键时点或阶段性目标，例如完成尽职调查、取得内部批准或完成发行。里程碑应尽可能具体、可验证。","example":"Internal approval is the next milestone before we can send the pack to clients.","exampleZh":"在向客户发送材料之前，下一个里程碑是取得内部批准。"},{"id":"gen-030","bank":"general","word":"escalate","full":"","ipa":"/ˈeskəleɪt/","pos":"v.","meaning":"上报；升级处理。指把无法在本层解决的问题提交给更合适的上级、专家或委员会。及时上报并不等于推诿，拖延不上报反而可能扩大风险。也可表示问题本身在加剧。","example":"If the issuer does not reply today, we should escalate the query.","exampleZh":"若发行人今天仍不回复，我们就应把该询问上报。"},{"id":"gen-031","bank":"general","word":"bottleneck","full":"","ipa":"/ˈbɒtlnek/","pos":"n.","meaning":"瓶颈。指流程中导致整体变慢的卡住点，例如等待一个签字、一个系统或一个外部回复。识别瓶颈后，应优先处理它，而不是只加快其他已经顺畅的环节。","example":"Legal review has become the bottleneck for new product launches.","exampleZh":"法律审阅已成为新产品推出的瓶颈。"},{"id":"gen-032","bank":"general","word":"trade-off","full":"","ipa":"/ˈtreɪd ɒf/","pos":"n.","meaning":"取舍；权衡。指为了得到某方面的好处，而必须接受另一方面的代价。结构性产品里，更高票息往往意味着更严格的障碍或更高风险，这就是一种取舍。","example":"There is a trade-off between a higher coupon and a lower knock-in barrier.","exampleZh":"更高的票息与更低的敲入障碍之间存在取舍。"},{"id":"gen-033","bank":"general","word":"underpin","full":"","ipa":"/ˌʌndəˈpɪn/","pos":"v.","meaning":"支撑；构成……的基础。指某项结论、价格或判断是由哪些事实、假设或安排支撑起来的。审查产品时，要问回报宣传背后由什么条件 underpin。","example":"These terms are underpinned by the current level of implied volatility.","exampleZh":"这些条款是以当前的隐含波动率水平为支撑的。"},{"id":"gen-034","bank":"general","word":"notwithstanding","full":"","ipa":"/ˌnɒtwɪθˈstændɪŋ/","pos":"prep./adv.","meaning":"尽管；虽然如此。较为正式的书面语，用来引出与前述情况看似相反但仍成立的信息。可放在句首或句尾，相当于 despite 或 nevertheless 的正式说法。","example":"Notwithstanding the attractive coupon, the principal is fully at risk.","exampleZh":"尽管票息看起来吸引，本金仍全部处于风险之中。"},{"id":"gen-035","bank":"general","word":"disclose","full":"","ipa":"/dɪsˈkləʊz/","pos":"v.","meaning":"披露。指按监管、合同或合规要求，把重要事实、风险、利益冲突或费用告知客户或监管机构。该披露的未披露，可能构成违规。","example":"All relevant fees must be disclosed to the client in writing.","exampleZh":"所有相关费用都必须以书面形式向客户披露。"},{"id":"gen-036","bank":"general","word":"indemnity","full":"","ipa":"/ɪnˈdemnəti/","pos":"n.","meaning":"弥偿；赔偿保证。一方承诺就特定损失向另一方作出补偿的安排。具体范围、上限和除外事项以合同条款为准，不能望文生义地理解为“全部都能赔”。","example":"The clause provides an indemnity for losses arising from third-party claims.","exampleZh":"该条款就第三方索赔所造成的损失提供弥偿。"},{"id":"gen-037","bank":"general","word":"waiver","full":"","ipa":"/ˈweɪvə/","pos":"n.","meaning":"弃权；豁免安排。指明确放弃某项权利，或批准在特定条件下不严格执行某项要求。弃权通常应书面作出，并且往往只适用于这一次，并不自动成为永久例外。","example":"A waiver of that internal rule would require compliance approval.","exampleZh":"若要豁免该项内部规则，须取得合规批准。"},{"id":"gen-038","bank":"general","word":"amendment","full":"","ipa":"/əˈmendmənt/","pos":"n.","meaning":"修订。对已有文件、条款或授权所作的正式修改。修订后应以完整、可核对的版本为准，并保留修订记录。","example":"The amendment updates the observation dates but leaves the coupon unchanged.","exampleZh":"该修订更新了观察日，但票息保持不变。"},{"id":"gen-039","bank":"general","word":"provision","full":"","ipa":"/prəˈvɪʒn/","pos":"n.","meaning":"条款；规定。法律或合同中就某一事项作出的具体规定。也可指会计上的“拨备”，本词条取合同条款义。阅读文件时应定位到具体 provision，而不是只看摘要。","example":"Please refer to the provision on market disruption events.","exampleZh":"请参阅有关市场中断事件的条款。"},{"id":"gen-040","bank":"general","word":"clause","full":"","ipa":"/klɔːz/","pos":"n.","meaning":"条款；分款。合同或法律文件中相对独立的一条规定。与 provision 相近，clause 更强调条文本身的编号与文字。引用时应写清条款号。","example":"The governing law clause is set out at the end of the terms.","exampleZh":"管辖法律条款列于条款文件的末尾。"},{"id":"gen-041","bank":"general","word":"execute","full":"","ipa":"/ˈeksɪkjuːt/","pos":"v.","meaning":"签署生效；执行。在法律和营运语境中，常指正式签署文件使其中条款生效，也可指按指示完成交易。注意它在普通英语里还有“处决”之义，商务语境中通常没有该意思。","example":"The agreement will become effective once both parties have executed it.","exampleZh":"双方签署完成后，该协议即行生效。"},{"id":"gen-042","bank":"general","word":"binding","full":"","ipa":"/ˈbaɪndɪŋ/","pos":"adj.","meaning":"有约束力的。指在法律上必须遵守的安排或文件。指示性条款通常不是最终有约束力的承诺，而成交确认书或已签署的最终条款则往往具有约束力。","example":"The indicative quote is not legally binding.","exampleZh":"该指示性报价在法律上并不具有约束力。"},{"id":"gen-043","bank":"general","word":"discretionary","full":"","ipa":"/dɪˈskreʃənəri/","pos":"adj.","meaning":"酌情的；全权的。指在约定范围内可以由一方自行判断如何处理。财富管理中的 discretionary mandate 即全权委托授权；也用于“酌情批准”等场合。","example":"The manager may make discretionary switches within the agreed asset ranges.","exampleZh":"管理人可在约定的资产区间内酌情进行转换。"},{"id":"gen-044","bank":"general","word":"fiduciary","full":"","ipa":"/fɪˈdjuːʃəri/","pos":"adj./n.","meaning":"受信的；受信责任。指一方因受委托而须为另一方的利益诚实、审慎行事。是否构成法律上的受信责任，取决于具体关系和适用法律，不能随便自称或否认。","example":"A trustee owes fiduciary duties to the beneficiaries.","exampleZh":"受托人对受益人负有受信责任。"},{"id":"gen-045","bank":"general","word":"confidential","full":"","ipa":"/ˌkɒnfɪˈdenʃl/","pos":"adj.","meaning":"保密的。指不得向未经授权的人披露的信息，如客户资料、未公开条款和内部文件。处理保密信息应遵循最小必要原则和公司政策。","example":"Client holdings are confidential and must not be discussed outside the team.","exampleZh":"客户持仓属于保密信息，不得在团队以外讨论。"},{"id":"gen-046","bank":"general","word":"proprietary","full":"","ipa":"/prəˈpraɪətri/","pos":"adj.","meaning":"专有的；内部所有的。指属于某一机构、不宜对外公开的方法、模型、系统或资料。proprietary information 通常受保密及知识产权安排保护。","example":"The pricing model is proprietary and should not be copied into client emails.","exampleZh":"该定价模型属于公司专有资料，不应复制到给客户的电邮中。"},{"id":"gen-047","bank":"general","word":"compliant","full":"","ipa":"/kəmˈplaɪənt/","pos":"adj.","meaning":"符合规定的。指行为、文件或流程符合法律、监管要求或内部政策。它强调“达到要求”，并不自动等于“最好的做法”或“没有其他风险”。","example":"The pack is not compliant until the risk warning is added.","exampleZh":"在补上风险提示之前，这份材料仍不符合规定。"},{"id":"gen-048","bank":"general","word":"breach","full":"","ipa":"/briːtʃ/","pos":"n./v.","meaning":"违反；违约。指未能遵守合同、法规、政策或保密义务。发现可能的 breach 后，通常应按内部程序及时报告，而不是自行消化。","example":"A late report of a potential breach can make the matter worse.","exampleZh":"对潜在违规迟迟不报，可能使问题变得更严重。"},{"id":"gen-049","bank":"general","word":"adverse","full":"","ipa":"/ˈædvɜːs/","pos":"adj.","meaning":"不利的。形容朝负面方向发展的情况、影响或变化，如 adverse market move（不利的市场变动）、adverse comment（负面意见）。语气比 bad 更正式。","example":"An adverse move in the underlying may trigger knock-in.","exampleZh":"挂钩标的出现不利变动，可能触发敲入。"},{"id":"gen-050","bank":"general","word":"plausible","full":"","ipa":"/ˈplɔːzəbl/","pos":"adj.","meaning":"说得通的；似乎合理的。指某解释或情景表面上站得住，但仍需验证。它不等于“已经证实”，只表示值得认真考虑。","example":"That is a plausible explanation, but we still need to check the dates.","exampleZh":"这个解释说得通，但我们仍须核对日期。"},{"id":"gen-051","bank":"general","word":"anomaly","full":"","ipa":"/əˈnɒməli/","pos":"n.","meaning":"异常；与预期不符的情况。可能是数据错误、流程遗漏，也可能真的反映了特殊市场现象。发现 anomaly 后，应先查核再下结论。","example":"The pricing anomaly disappeared after we corrected the day-count.","exampleZh":"在我们更正计息基准后，那个定价异常就消失了。"},{"id":"gen-052","bank":"general","word":"rationale","full":"","ipa":"/ˌræʃəˈnɑːl/","pos":"n.","meaning":"理由；逻辑依据。指作出某一建议、决定或设计时背后的一套原因。把 rationale 写清楚，便于日后复核和向不在场的人解释。","example":"Please document the rationale for recommending this tenor.","exampleZh":"请把建议这一期限的理由记录下来。"},{"id":"gen-053","bank":"general","word":"implication","full":"","ipa":"/ˌɪmplɪˈkeɪʃn/","pos":"n.","meaning":"影响；可能的含意。指某事实或决定将会带来的后果，不一定在字面上直接说出来。分析条款时，既要看文字，也要看对客户的实际 implication。","example":"The implication of a lower barrier is a higher chance of principal loss.","exampleZh":"障碍更低，意味着本金亏损的可能性更高。"},{"id":"gen-054","bank":"general","word":"accordingly","full":"","ipa":"/əˈkɔːdɪŋli/","pos":"adv.","meaning":"因此；相应地。用于正式书面语，表示后面的行动是依据前面的情况作出的。常放在句首或句中，连接分析与结论。","example":"The final terms have changed; please update the comparison pack accordingly.","exampleZh":"最终条款已有变更，请相应更新对照材料。"},{"id":"gen-055","bank":"general","word":"nevertheless","full":"","ipa":"/ˌnevəðəˈles/","pos":"adv.","meaning":"尽管如此； nevertheless 用来承认前一句的事实，同时提出并不因此改变的判断或行动。是书面语中常用的转折副词。","example":"The coupon is attractive; nevertheless, the capital is at risk.","exampleZh":"票息确实吸引；尽管如此，本金仍处于风险之中。"},{"id":"gen-056","bank":"general","word":"furthermore","full":"","ipa":"/ˌfɜːðəˈmɔː/","pos":"adv.","meaning":"此外；而且。用于在已有论点上再补充一层理由或事实，常见于正式书面表达。不宜在同一段里反复堆砌。","example":"The document is overdue. Furthermore, two figures still need to be checked.","exampleZh":"该文件已经逾期。此外，还有两个数字有待核对。"},{"id":"gen-057","bank":"general","word":"conversely","full":"","ipa":"/ˈkɒnvɜːsli/","pos":"adv.","meaning":"相反地。用来引出与前面情况方向相反的对照。适合比较两种情景、两种产品或两种结果。","example":"A higher barrier reduces knock-in risk; conversely, it usually means a lower coupon.","exampleZh":"更高的障碍会降低敲入风险；相反，票息通常也会更低。"},{"id":"gen-058","bank":"general","word":"whereas","full":"","ipa":"/ˌweərˈæz/","pos":"conj.","meaning":"然而；而……则。用于对比两种情况，书面语气较强。法律文件里也常用 whereas 引出背景陈述，日常工作对照中多取其对比义。","example":"The first note is cash-settled, whereas the second may deliver shares.","exampleZh":"第一份票据以现金结算，而第二份则可能交割股票。"},{"id":"gen-059","bank":"general","word":"albeit","full":"","ipa":"/ˌɔːlˈbiːɪt/","pos":"conj.","meaning":"虽然；尽管。后面通常接短语而非完整句子，用来承认一个限制条件，同时不推翻主句。比 although 更紧凑，偏书面。","example":"The explanation is clear, albeit rather brief.","exampleZh":"这个说明是清楚的，虽然相当简短。"},{"id":"gen-060","bank":"general","word":"namely","full":"","ipa":"/ˈneɪmli/","pos":"adv.","meaning":"即；也就是。用来引出对前面概括的具体列举或点明。适合在已经给出类别之后，再把具体项目说出来。","example":"Two dates remain outstanding, namely the initial fixing date and the first observation date.","exampleZh":"还有两个日期未定，即初始定盘日和首个观察日。"},{"id":"gen-061","bank":"general","word":"respectively","full":"","ipa":"/rɪˈspektɪvli/","pos":"adv.","meaning":"分别；依次为。用于两个或多个项目与前面同样顺序的对象一一对应。使用时必须保证前后顺序严格一致，否则容易造成严重误解。","example":"Notes A and B mature in June and December respectively.","exampleZh":"票据 A 和票据 B 分别于六月和十二月到期。"},{"id":"gen-062","bank":"general","word":"predominantly","full":"","ipa":"/prɪˈdɒmɪnəntli/","pos":"adv.","meaning":"主要地；大多。表示某特征或构成占大多数，但不一定是全部。比 mainly 稍正式，适合描述组合构成或客户结构。","example":"The book is predominantly invested in investment-grade bonds.","exampleZh":"该组合主要投资于投资级债券。"},{"id":"gen-063","bank":"general","word":"marginally","full":"","ipa":"/ˈmɑːdʒɪnəli/","pos":"adv.","meaning":"略微地；只是稍微。表示差别很小，不应当被夸大成显著变化。写作时若差别其实很大，就不要用这个词。","example":"The new coupon is only marginally higher than the previous offer.","exampleZh":"新的票息只比此前报价略高一点。"},{"id":"gen-064","bank":"general","word":"substantially","full":"","ipa":"/səbˈstænʃəli/","pos":"adv.","meaning":"实质上；大幅度地。表示程度可观或差别足够重要。与 marginally 相对，常用来强调影响已经不小。","example":"The unwind cost has increased substantially since last week.","exampleZh":"自上周以来，平仓成本已大幅上升。"},{"id":"gen-065","bank":"general","word":"inherently","full":"","ipa":"/ɪnˈherəntli/","pos":"adv.","meaning":"本质上；固有地。表示某风险或特征是事物本身带有的，而不是临时附加的。例如非保本结构性产品 inherently 带有本金损失可能。","example":"A worst-of structure is inherently more sensitive to the weakest name in the basket.","exampleZh":"表现最差结构本质上对篮子里最弱的那一只更为敏感。"},{"id":"gen-066","bank":"general","word":"explicitly","full":"","ipa":"/ɪkˈsplɪsɪtli/","pos":"adv.","meaning":"明确地；清楚地写出或说出。指没有含糊、不靠暗示。重要限制、风险和销售范围应 explicitly 写明。","example":"The term sheet explicitly states that the product is not principal-protected.","exampleZh":"条款清单明确写明该产品并不保本。"},{"id":"gen-067","bank":"general","word":"implicitly","full":"","ipa":"/ɪmˈplɪsɪtli/","pos":"adv.","meaning":"含蓄地；未明说但可推知。指没有直接写出来，却可以从上下文或行为中推断。重要风险不宜只 implicitly 表达，而应写清楚。","example":"The email implicitly assumed that the client would hold to maturity.","exampleZh":"那封电邮含蓄地假定客户会持有至到期。"},{"id":"gen-068","bank":"general","word":"arguably","full":"","ipa":"/ˈɑːɡjuəbli/","pos":"adv.","meaning":"可以说；有理由认为。用来提出一个站得住但并非唯一的判断，语气留有讨论余地。不宜用它来回避本应明确的合规结论。","example":"This is arguably the clearest one-page comparison we have prepared this month.","exampleZh":"可以说，这是我们本月准备过的最清楚的一页对照。"},{"id":"gen-069","bank":"general","word":"tentatively","full":"","ipa":"/ˈtentətɪvli/","pos":"adv.","meaning":"暂定地；试探性地。表示时间、结论或安排尚未最终确定，仍可能修改。对外沟通时应把“暂定”说清，以免被当成承诺。","example":"The call is tentatively scheduled for 11:00, subject to the client's availability.","exampleZh":"电话会议暂定于十一时，须视客户是否有空而定。"},{"id":"gen-070","bank":"general","word":"promptly","full":"","ipa":"/ˈprɒmptli/","pos":"adv.","meaning":"迅速地；及时地。强调在合理短的时间内采取行动，但不等于不计质量地匆忙完成。处理客户投诉、差错和截止日期时常用。","example":"Please reply promptly if any figure in the confirmation is incorrect.","exampleZh":"若确认书中的任何数字有误，请及时回复。"},{"id":"gen-071","bank":"general","word":"thoroughly","full":"","ipa":"/ˈθʌrəli/","pos":"adv.","meaning":"彻底地；仔细全面地。指检查或准备时没有明显遗漏。thorough 审阅不等于无限拖延，但仍须覆盖关键风险与数字。","example":"The documents have been thoroughly checked against the final terms.","exampleZh":"文件已对照最终条款作了全面核对。"},{"id":"gen-072","bank":"general","word":"meticulously","full":"","ipa":"/məˈtɪkjələsli/","pos":"adv.","meaning":"一丝不苟地。语气比 thoroughly 更强调对细节的认真，适合描述对数字、日期、名称和条款编号的校对。","example":"She meticulously checked every ISIN and observation date in the table.","exampleZh":"她一丝不苟地核对了表中的每一个国际证券识别码和观察日。"},{"id":"gen-073","bank":"general","word":"inadvertently","full":"","ipa":"/ˌɪnədˈvɜːtəntli/","pos":"adv.","meaning":"不小心地；非故意地。用于说明某错误并非有意造成，但仍须纠正并检讨流程。承认 inadvertent error 并立即修正，通常好过回避。","example":"An outdated barrier was inadvertently left in the draft.","exampleZh":"草稿里不小心留下了一个过时的障碍水平。"},{"id":"gen-074","bank":"general","word":"deliberately","full":"","ipa":"/dɪˈlɪbərətli/","pos":"adv.","meaning":"故意地；有意地。也可表示“经过慎重考虑地”。在合规语境中，deliberately withhold 信息是严重问题；在工作安排里，deliberately leave time 则是有意留出时间。","example":"We deliberately left the risk warning on the first page.","exampleZh":"我们有意把风险提示放在第一页。"},{"id":"gen-075","bank":"general","word":"feasible","full":"","ipa":"/ˈfiːzəbl/","pos":"adj.","meaning":"可行的。指在现有时间、系统、法律和资源条件下能够做得到。可行不等于值得做，还要看风险、成本和是否合规。","example":"It is not feasible to reissue the pack after 5 p.m. today.","exampleZh":"今天下午五时后再重做这套材料，并不可行。"},{"id":"gen-076","bank":"general","word":"viable","full":"","ipa":"/ˈvaɪəbl/","pos":"adj.","meaning":"可行且站得住的。比 feasible 更强调在商业、经济或长期意义上“能够持续成立”，而不只是技术上做得到。a viable option 即一个真正能用的方案。","example":"Early exit is not a viable option if the unwind cost remains this high.","exampleZh":"若平仓成本仍然这么高，提前退出就不是一个站得住的选择。"},{"id":"gen-077","bank":"general","word":"resilient","full":"","ipa":"/rɪˈzɪliənt/","pos":"adj.","meaning":"有韧性的；能承受压力后恢复的。可形容人、团队、流程或投资组合在受到冲击后仍能维持运作或恢复。它是描述能力的词，并不保证不会受损。","example":"A more resilient process would catch this error before the email goes out.","exampleZh":"更有韧性的流程，应能在电邮发出之前发现这个错误。"},{"id":"gen-078","bank":"general","word":"robust","full":"","ipa":"/rəʊˈbʌst/","pos":"adj.","meaning":"稳健的；经得起检验的。指方法、结论或系统在压力、质疑或不同假设下仍然可靠。评审材料时，常问这个比较是否 robust。","example":"We need a more robust check than a single manual look at the spreadsheet.","exampleZh":"我们需要比只人工看一次表格更稳健的核对方法。"},{"id":"gen-079","bank":"general","word":"ambiguous","full":"","ipa":"/æmˈbɪɡjuəs/","pos":"adj.","meaning":"含糊的；可作多种解释的。条款或电邮一旦 ambiguous，就容易造成执行错误或争议。发现歧义应主动澄清，而不是各自按自己的理解继续做。","example":"The sentence is ambiguous as to whether the barrier is observed intra-day.","exampleZh":"这句话在障碍是否按盘中价格观察这一点上含糊不清。"},{"id":"gen-080","bank":"general","word":"unequivocal","full":"","ipa":"/ˌʌnɪˈkwɪvəkl/","pos":"adj.","meaning":"毫不含糊的；明确的。表示意思清楚、没有两可余地。重要的风险提示、销售限制和“不构成投资建议”等声明，应当 unequivocal。","example":"The document should include an unequivocal statement that the capital is at risk.","exampleZh":"文件中应有毫不含糊的声明：本金处于风险之中。"},{"id":"gen-081","bank":"general","word":"comprehensive","full":"","ipa":"/ˌkɒmprɪˈhensɪv/","pos":"adj.","meaning":"全面的；涵盖面广的。指覆盖了应覆盖的主要方面。全面并不等于冗长，也不等于没有重点；仍应把最关键的风险放在显眼位置。","example":"A comprehensive review should cover legal terms, pricing and operational details.","exampleZh":"全面的审阅应覆盖法律条款、定价和运营细节。"},{"id":"gen-082","bank":"general","word":"succinct","full":"","ipa":"/səkˈsɪŋkt/","pos":"adj.","meaning":"简练的。与 concise 相近，强调短而到位。一页通、会议结论和向管理层汇报时，尤其需要 succinct 的表达。","example":"Please keep the executive summary succinct and specific.","exampleZh":"请把给管理层的摘要写得简练而具体。"},{"id":"gen-083","bank":"general","word":"coherent","full":"","ipa":"/kəʊˈhɪərənt/","pos":"adj.","meaning":"连贯的；逻辑清楚的。指各部分能够形成一个说得通的整体，而不是彼此打架。材料中的数字、结论和风险提示必须 coherent。","example":"The recommendation is not coherent with a conservative risk profile.","exampleZh":"这一建议与保守的风险取向并不连贯。"},{"id":"gen-084","bank":"general","word":"pertinent","full":"","ipa":"/ˈpɜːtɪnənt/","pos":"adj.","meaning":"相关且切题的。比 relevant 更强调“正好针对当前问题”。写电邮或开会时，应先给 pertinent 的信息，再补充背景。","example":"Please only attach the pages that are pertinent to this trade.","exampleZh":"请只附上与这笔交易相关的页码。"},{"id":"gen-085","bank":"general","word":"redundant","full":"","ipa":"/rɪˈdʌndənt/","pos":"adj.","meaning":"多余的；重复的。指信息、步骤或表达已经不必要。在人事语境中也可指被裁员，使用时要注意场合，以免造成误会。","example":"The second paragraph is redundant and can be removed.","exampleZh":"第二段是多余的，可以删去。"},{"id":"gen-086","bank":"general","word":"obsolete","full":"","ipa":"/ˈɒbsəliːt/","pos":"adj.","meaning":"过时的；已不再适用的。指模板、条款、利率基准或流程已被新的安排取代。继续使用 obsolete 的材料可能导致错误披露。","example":"This template is obsolete after the new disclosure rules took effect.","exampleZh":"新的披露规则生效后，这份模板已经过时。"},{"id":"gen-087","bank":"general","word":"unprecedented","full":"","ipa":"/ʌnˈpresɪdentɪd/","pos":"adj.","meaning":"前所未有的。表示在已知经验里没有先例。这个词分量较重，只有在确实找不到可比情况时才适合使用，否则会显得夸张。","example":"The market move was unusually sharp, though not necessarily unprecedented.","exampleZh":"这轮市场波动异常剧烈，但未必称得上前所未有。"},{"id":"gen-088","bank":"general","word":"overdue","full":"","ipa":"/ˌəʊvəˈdjuː/","pos":"adj.","meaning":"逾期的；早该完成的。既可指已经过了截止日期，也可指某件早该做却一直没做的事。用于提醒时，语气可以坚定但不必指责。","example":"The issuer's reply is already overdue.","exampleZh":"发行人的回复已经逾期。"},{"id":"gen-089","bank":"general","word":"imminent","full":"","ipa":"/ˈɪmɪnənt/","pos":"adj.","meaning":"即将发生的；临近的。强调某事很可能很快发生。不要把尚不确定的可能性说成 imminent，以免造成不必要的紧张或误导。","example":"An imminent rate announcement may affect today's pricing.","exampleZh":"即将公布的利率决定可能影响今日定价。"},{"id":"gen-090","bank":"general","word":"intermittent","full":"","ipa":"/ˌɪntəˈmɪtənt/","pos":"adj.","meaning":"间歇的；时断时续的。形容不是持续不断，而是来一阵、停一阵的情况，如间歇性的系统故障或断续的市场波动。","example":"The system outage was intermittent, which made testing more difficult.","exampleZh":"系统故障时断时续，使测试更加困难。"},{"id":"gen-091","bank":"general","word":"recurring","full":"","ipa":"/rɪˈkɜːrɪŋ/","pos":"adj.","meaning":"反复出现的。指同一类问题或事项不止一次发生。recurring error 往往说明流程需要修复，而不是只改这一次的结果。","example":"This is a recurring error in the date field and needs a lasting fix.","exampleZh":"这是日期栏里反复出现的错误，需要一个能持久见效的修正。"},{"id":"gen-092","bank":"general","word":"residual","full":"","ipa":"/rɪˈzɪdjuəl/","pos":"adj.","meaning":"残余的；剩余的。指在采取措施之后仍然留下的部分，如 residual risk（剩余风险）。承认剩余风险，是诚实披露的一部分。","example":"Even after hedging, some residual currency risk remains.","exampleZh":"即使做了对冲，仍会留下一些残余的汇率风险。"},{"id":"gen-093","bank":"general","word":"incremental","full":"","ipa":"/ˌɪŋkrəˈmentl/","pos":"adj.","meaning":"增量的；逐步增加的。指每一小步的变化，而不是一次性的大改动。incremental change 便于控制风险，但有时也不足以解决问题。","example":"We made incremental improvements to the checklist after each incident.","exampleZh":"每次出现问题后，我们都对清单作了增量改进。"},{"id":"gen-094","bank":"general","word":"aggregate","full":"","ipa":"/ˈæɡrɪɡət/","pos":"adj./n.","meaning":"合计的；总量。指把各项加总后的结果。作动词时读作 /ˈæɡrɪɡeɪt/，表示“汇总”。看合计时不要忽略内部的集中度或相互抵消。","example":"The aggregate exposure to the same issuer must be kept within the limit.","exampleZh":"对同一发行人的合计敞口必须控制在限额以内。"},{"id":"gen-095","bank":"general","word":"insight","full":"","ipa":"/ˈɪnsaɪt/","pos":"n.","meaning":"洞见；有帮助的理解。指能够解释现象或指导行动的认识，而不只是复述数据。好的 insight 通常具体、可检验，并且对下一步有用。","example":"The review offered a useful insight into why clients were confused by the barrier language.","exampleZh":"这次回顾提供了一个有用的认识：为何客户会被障碍表述弄糊涂。"},{"id":"gen-096","bank":"general","word":"takeaway","full":"","ipa":"/ˈteɪkəweɪ/","pos":"n.","meaning":"要点收获。会议或材料读完后应记住并带走的关键结论。写会议纪要时，把 takeaway 单列出来，比只堆讨论过程更有用。","example":"The main takeaway is that the two notes use different observation methods.","exampleZh":"主要要点是：这两份票据采用了不同的观察方式。"},{"id":"gen-097","bank":"general","word":"recap","full":"","ipa":"/ˈriːkæp/","pos":"n./v.","meaning":"扼要重述。把已经讨论过的要点再归纳一遍，便于对齐理解或留给缺席的人。会议结束前作一个短 recap，往往能减少事后误解。","example":"Let me recap the three actions we agreed on.","exampleZh":"我来扼要重述一下我们商定的三项行动。"},{"id":"gen-098","bank":"general","word":"defer","full":"","ipa":"/dɪˈfɜː/","pos":"v.","meaning":"推迟；暂缓。指有意识地把事项移到更合适的时间处理，或把决定交给更合适的人（defer to someone）。推迟时应说明原因和新的时点，以免变成不了了之。","example":"We will defer the launch until the final terms are available.","exampleZh":"我们将把推出时间推迟到最终条款齐备之后。"},{"id":"gen-099","bank":"general","word":"expedite","full":"","ipa":"/ˈekspədaɪt/","pos":"v.","meaning":"加快办理。指在不违反必要控制的前提下，优先处理某事项以缩短等待时间。加快不等于跳过合规或核对步骤。","example":"Could you please expedite the review so that we can meet the trade date?","exampleZh":"可否加快审阅，以便我们赶上交易日？"},{"id":"gen-100","bank":"general","word":"facilitate","full":"","ipa":"/fəˈsɪlɪteɪt/","pos":"v.","meaning":"促成；提供便利。指通过安排、协调或提供工具，使事情更容易完成。它强调帮助过程顺利进行，而不是代替别人作决定。","example":"A shared checklist will facilitate handover between the two teams.","exampleZh":"一份共用清单将方便两个团队之间的交接。"},{"id":"gen-101","bank":"general","word":"coordinate","full":"","ipa":"/kəʊˈɔːdɪneɪt/","pos":"v.","meaning":"协调。把多方的时间、材料和责任对齐，避免重复或遗漏。协调的关键是明确谁做什么、截止何时、以及信息如何同步。","example":"Please coordinate with the duty team so that the files arrive in one pack.","exampleZh":"请与值班团队协调，确保文件汇成一套送达。"},{"id":"gen-102","bank":"general","word":"consolidate","full":"","ipa":"/kənˈsɒlɪdeɪt/","pos":"v.","meaning":"整合；合并整理。把分散的信息、持仓或文件归拢到一处，以便比较和管理。整合后应检查是否出现重复计算或口径不一致。","example":"Please consolidate the comments into a single version.","exampleZh":"请把各方意见整合到同一个版本里。"},{"id":"gen-103","bank":"general","word":"streamline","full":"","ipa":"/ˈstriːmlaɪn/","pos":"v.","meaning":"精简流程。去掉重复步骤，使工作更顺畅。精简应以不削弱必要控制为前提，尤其不能为了速度而删掉风险核对。","example":"We should streamline the checklist without removing the legal sign-off.","exampleZh":"我们应精简清单，但不可去掉法律会签。"},{"id":"gen-104","bank":"general","word":"prioritize","full":"","ipa":"/praɪˈɒrɪtaɪz/","pos":"v.","meaning":"排定优先次序。根据紧急程度、影响和截止日期，决定先做哪一件。同时宣布每件事都是第一优先，等于没有优先次序。","example":"Please prioritize the client-facing pack over the internal briefing notes.","exampleZh":"请把面向客户的材料放在内部简报之前处理。"},{"id":"gen-105","bank":"general","word":"allocate","full":"","ipa":"/ˈæləkeɪt/","pos":"v.","meaning":"分配。把时间、额度、任务或资金分给特定对象。分配时应写清数量、对象和限制，避免口头一说就以为已经落实。","example":"The team will allocate time tomorrow morning to finish the review.","exampleZh":"团队将把明天上午的时间分配出来，用于完成这项审阅。"},{"id":"gen-106","bank":"general","word":"withhold","full":"","ipa":"/wɪðˈhəʊld/","pos":"v.","meaning":"扣留；暂不提供。既可指依法预提税款，也可指暂时不发放信息或款项。若 withhold 的是客户应知的重要信息，通常会有合规问题。","example":"Do not withhold a known risk from the comparison pack.","exampleZh":"不要把已知风险从对照材料中隐去。"},{"id":"gen-107","bank":"general","word":"waive","full":"","ipa":"/weɪv/","pos":"v.","meaning":"放弃（权利）；不坚持执行。与名词 waiver 对应。是否可以 waive 某项要求，通常需要有权人士批准，并且应记录在案。","example":"Operations cannot waive the cut-off time without approval.","exampleZh":"未经批准，运营部门不能放宽截止时间。"},{"id":"gen-108","bank":"general","word":"endorse","full":"","ipa":"/ɪnˈdɔːs/","pos":"v.","meaning":"赞同；背书。指正式表示支持某一文件、建议或安排。在向外部使用时要谨慎：未经授权，个人意见不应被写成公司 endorse 的结论。","example":"The committee endorsed the revised product paper.","exampleZh":"委员会对修订后的产品文件表示赞同。"},{"id":"gen-109","bank":"general","word":"acknowledge","full":"","ipa":"/əkˈnɒlɪdʒ/","pos":"v.","meaning":"确认收到；承认。既可表示“已收到来信”，也可表示承认某一事实或限制。及时 acknowledge 客户来信，是基本的职业礼貌。","example":"Please acknowledge receipt of this email and let us know if any item is unclear.","exampleZh":"请确认收到此邮件，如有任何一项不清楚，请告知我们。"},{"id":"gen-110","bank":"general","word":"convey","full":"","ipa":"/kənˈveɪ/","pos":"v.","meaning":"转达；表达。指把信息、态度或歉意准确传递给对方。选择用词时要考虑 convey 出去的语气是否合适，尤其是在谈风险和拒绝时。","example":"Please convey our thanks to the client for the quick reply.","exampleZh":"请向客户转达我们对其迅速回复的感谢。"},{"id":"gen-111","bank":"general","word":"address","full":"","ipa":"/əˈdres/","pos":"v.","meaning":"处理；回应（某问题）。在商务英语里常指面对关切、风险或疑问并作出处理，而不只是“写地址”。address a concern 即回应并处理该关切。","example":"The revised pack addresses the questions raised in yesterday's meeting.","exampleZh":"修订后的材料回应了昨天会议上提出的问题。"},{"id":"gen-112","bank":"general","word":"flag","full":"","ipa":"/flæɡ/","pos":"v.","meaning":"标出；提醒注意。指把可能的问题、截止日期或异常清楚地标识出来，以便他人看见并跟进。及时 flag 问题，往往比事后解释更有价值。","example":"Please flag any inconsistency between the Chinese and English versions.","exampleZh":"中英文版本如有任何不一致，请标出。"},{"id":"gen-113","bank":"general","word":"align","full":"","ipa":"/əˈlaɪn/","pos":"v.","meaning":"对齐；取得一致。指让各方的理解、口径、时间表或目标保持一致。会前 align 关键数字，可以减少会上的来回修正。","example":"Let us align the wording with compliance before we send it out.","exampleZh":"在发出之前，让我们先与合规对齐措辞。"},{"id":"gen-114","bank":"general","word":"gauge","full":"","ipa":"/ɡeɪdʒ/","pos":"v./n.","meaning":"估量；判断。指在信息不完整时，对反应、风险或可能性作出合理估计。名词也可指“量尺”或“标准”。gauge interest 即试探兴趣或意向。","example":"A short call will help us gauge whether the client wants a shorter tenor.","exampleZh":"一次简短通话，有助于我们判断客户是否希望更短的期限。"},{"id":"gen-115","bank":"general","word":"assess","full":"","ipa":"/əˈses/","pos":"v.","meaning":"评估。对风险、合适性、影响或质量作出有依据的判断。评估应写明所依据的资料和限制，而不是只给一个印象式的结论。","example":"We need to assess whether this product fits the client's horizon and risk profile.","exampleZh":"我们需要评估该产品是否符合客户的投资年期和风险取向。"},{"id":"gen-116","bank":"general","word":"ascertain","full":"","ipa":"/ˌæsəˈteɪn/","pos":"v.","meaning":"查明；确定。指通过查核把尚未确定的事实查清楚。语气正式，适合在事实还不清时使用，而不适合代替已经明确的结论。","example":"Please ascertain whether the observation is close-only or continuous.","exampleZh":"请查明该观察是仅看收市价，还是持续观察。"},{"id":"gen-117","bank":"general","word":"verify","full":"","ipa":"/ˈverɪfaɪ/","pos":"v.","meaning":"核实。对照可靠来源，确认数字、名称、日期或身份是否正确。verify 强调核对已有信息，而不只是凭记忆确认。","example":"Please verify the ISIN against the trade confirmation.","exampleZh":"请对照成交确认书核实国际证券识别码。"},{"id":"gen-118","bank":"general","word":"reconcile","full":"","ipa":"/ˈrekənsaɪl/","pos":"v.","meaning":"对账；使一致。把两套记录或两份文件逐项对照，找出差异并解释清楚。运营、估值和持仓管理中都常用到 reconcile。","example":"We need to reconcile the portfolio report with the custodian's records.","exampleZh":"我们需要把组合报告与托管人的记录核对一致。"},{"id":"gen-119","bank":"general","word":"rectify","full":"","ipa":"/ˈrektɪfaɪ/","pos":"v.","meaning":"纠正。把已经发现的错误改正过来，并尽量防止再次发生。纠正时应同时更新所有已发出的相关版本，避免旧错误继续流传。","example":"Please rectify the coupon figure and resend the pack today.","exampleZh":"请纠正票息数字，并于今天重新发送材料。"},{"id":"gen-120","bank":"general","word":"compromise","full":"","ipa":"/ˈkɒmprəmaɪz/","pos":"n./v.","meaning":"折中；妥协。指各方让出一部分立场以达成可接受的方案。作动词时也可表示“损害”某原则或安全，使用时要看上下文，以免产生歧义。","example":"After a brief discussion, the teams reached a compromise on the timeline.","exampleZh":"经过简短讨论，各团队就时间表达成了折中方案。"},{"id":"gen-121","bank":"general","word":"consensus","full":"","ipa":"/kənˈsensəs/","pos":"n.","meaning":"共识。指相关方在主要问题上大体达成一致。共识不等于没有保留意见，但通常意味着可以据此推进下一步。","example":"There was a consensus to wait for the issuer's revised terms.","exampleZh":"各方达成共识：等待发行人的修订条款。"},{"id":"gen-122","bank":"general","word":"impartial","full":"","ipa":"/ɪmˈpɑːʃl/","pos":"adj.","meaning":"不偏不倚的。指在比较或判断时不偏向某一方或某一产品。内部材料若声称比较是 impartial，就应避免只展示对某一结论有利的信息。","example":"An impartial comparison should present both the benefits and the risks.","exampleZh":"一份不偏不倚的对照，应同时呈现好处与风险。"},{"id":"gen-123","bank":"general","word":"constructive","full":"","ipa":"/kənˈstrʌktɪv/","pos":"adj.","meaning":"建设性的。指批评或意见的目的是帮助改进，而不是只指出问题或指责。给出 constructive feedback 时，最好同时说明建议如何改。","example":"Thank you for the constructive comments on the draft.","exampleZh":"感谢你对草稿提出的建设性意见。"},{"id":"gen-124","bank":"general","word":"proactive","full":"","ipa":"/prəʊˈæktɪv/","pos":"adj.","meaning":"主动的；提前行动的。指在问题变大之前就采取措施，而不是被动等待。主动沟通截止日期、风险变化和文件缺口，通常更有职业素养。","example":"A proactive reminder helped the client return the forms on time.","exampleZh":"一次主动提醒，帮助客户按时交回了表格。"},{"id":"gen-125","bank":"general","word":"accountable","full":"","ipa":"/əˈkaʊntəbl/","pos":"adj.","meaning":"须负责的。指对某项结果负有被问责的责任，即使部分工作由他人执行。明确谁是 accountable，有助于避免事情落到两不管。","example":"The product owner remains accountable for the accuracy of the pack.","exampleZh":"产品负责人仍须对材料的准确性负责。"},{"id":"gen-126","bank":"general","word":"transparent","full":"","ipa":"/trænˈspærənt/","pos":"adj.","meaning":"透明的；清楚可见的。指把方法、费用、假设和限制开放给相关方查看，而不是藏在不易发现的地方。透明有助于建立信任，但仍须遵守保密规定。","example":"The fee explanation should be transparent and easy to find.","exampleZh":"费用说明应当透明，并且容易找到。"},{"id":"gen-127","bank":"general","word":"integrity","full":"","ipa":"/ɪnˈteɡrəti/","pos":"n.","meaning":"诚信；完整。既指诚实、不刻意误导的品格，也可指数据或文件保持完整、未被不当改动。职业工作中，integrity 往往体现在即使对自己不利也如实说明。","example":"Data integrity requires that we keep an unaltered copy of the original file.","exampleZh":"数据完整性要求我们保留一份未经改动的原始文件副本。"},{"id":"gen-128","bank":"general","word":"credibility","full":"","ipa":"/ˌkredəˈbɪləti/","pos":"n.","meaning":"可信度。指他人是否愿意相信你的陈述、数据或判断。数字错误、口径前后不一，都会削弱 credibility。","example":"A single unchecked typo in the yield can damage the team's credibility.","exampleZh":"收益率上一个未经核对的笔误，就可能损害团队的可信度。"},{"id":"gen-129","bank":"general","word":"discretion","full":"","ipa":"/dɪˈskreʃn/","pos":"n.","meaning":"谨慎处理；酌情判断。既指对敏感信息保持沉默和分寸，也指在授权范围内作出判断。at your discretion 表示由你酌情决定。","example":"Please use discretion when discussing client matters in public areas.","exampleZh":"在公共区域谈论客户事务时，请注意分寸。"},{"id":"gen-130","bank":"general","word":"tact","full":"","ipa":"/tækt/","pos":"n.","meaning":"得体；圆转。在传递不便消息、纠正错误或拒绝要求时，仍能照顾对方体面并保持清楚。得体不等于含糊其辞，关键信息仍须说清。","example":"She declined the request with tact, and also explained the policy reason.","exampleZh":"她得体地拒绝了该项请求，并说明了政策上的原因。"},{"id":"gen-131","bank":"general","word":"composure","full":"","ipa":"/kəmˈpəʊʒə/","pos":"n.","meaning":"镇定。在压力、抱怨或突发错误面前保持冷静和清楚表达的能力。保持 composure 有助于把问题处理得更准，而不是被情绪带走。","example":"He kept his composure and listed the facts in order.","exampleZh":"他保持镇定，并把事实按顺序列了出来。"},{"id":"gen-132","bank":"general","word":"perseverance","full":"","ipa":"/ˌpɜːsɪˈvɪərəns/","pos":"n.","meaning":"坚持；毅力。指在困难或重复性工作中仍持续努力，但不等于盲目硬撑。把问题拆小、按计划推进，也是 perseverance 的一种表现。","example":"Checking the remaining sixty terms will take perseverance, but it is necessary.","exampleZh":"核对余下的六十项条款需要毅力，但这是必要的。"},{"id":"gen-133","bank":"general","word":"initiative","full":"","ipa":"/ɪˈnɪʃətɪv/","pos":"n.","meaning":"主动性；倡议。指在没有被人一步步吩咐时，也能看到需要并先行动。也可指一项正式启动的计划。take the initiative 即主动迈出第一步。","example":"She took the initiative to prepare a one-page glossary for the new joiners.","exampleZh":"她主动为新同事准备了一页术语表。"},{"id":"gen-134","bank":"general","word":"proficiency","full":"","ipa":"/prəˈfɪʃnsi/","pos":"n.","meaning":"熟练程度。指在某项技能上能够稳定、准确地完成任务的水平，例如语言、系统或专业工具。proficiency 通常通过实际使用而不是自称来体现。","example":"The role requires proficiency in both written Chinese and English.","exampleZh":"该岗位要求中英文书面表达都达到熟练水平。"},{"id":"gen-135","bank":"general","word":"nuance","full":"","ipa":"/ˈnjuːɑːns/","pos":"n.","meaning":"细微差别。指表面上相似的事物在含义、语气或条款上的小差异。这些差异往往决定风险是否被说准，因此值得放慢速度看清楚。","example":"There is an important nuance between official closing price and last traded price.","exampleZh":"官方收市价与最后成交价之间有一个重要的细微差别。"},{"id":"gen-136","bank":"general","word":"constraint","full":"","ipa":"/kənˈstreɪnt/","pos":"n.","meaning":"约束；限制条件。指时间、监管、系统、额度或政策等方面不能随便突破的边界。设计方案时应先承认 constraint，再谈可行路径。","example":"The main constraint is that the pack must be issued in both languages today.","exampleZh":"主要约束是：这套材料今天必须中英文一并发出。"},{"id":"gen-137","bank":"general","word":"threshold","full":"","ipa":"/ˈθreʃhəʊld/","pos":"n.","meaning":"门槛；阈值。超过该水平就会触发某一行动、警告或不同处理方式的分界点。内部审批、风险评级和补仓安排都常设有 threshold。","example":"Any loss above this threshold must be reported the same day.","exampleZh":"任何超过该门槛的亏损，都必须在当天报告。"},{"id":"gen-138","bank":"general","word":"precedent","full":"","ipa":"/ˈpresɪdənt/","pos":"n.","meaning":"先例。以往曾经采用、可能影响本次如何处理的例子。有 precedent 不等于必须照搬，因为每笔交易的事实和监管要求可能不同。","example":"We should not treat last year's exception as a binding precedent.","exampleZh":"我们不应把去年的例外当成必须遵循的先例。"},{"id":"gen-139","bank":"general","word":"repercussion","full":"","ipa":"/ˌriːpəˈkʌʃn/","pos":"n.","meaning":"连带影响；后果。通常指决定或事件在事后引发的较广泛、不一定立刻显现的影响。评估方案时，除了直接结果，也要考虑可能的 repercussions。","example":"A misleading sentence in the pack could have serious repercussions.","exampleZh":"材料中一句有误导性的话，可能带来严重的连带影响。"},{"id":"gen-140","bank":"general","word":"outlook","full":"","ipa":"/ˈaʊtlʊk/","pos":"n.","meaning":"展望；前景看法。指对未来一段时间市场、业务或情况的判断。展望是意见而不是保证，对外表述时应避免说成确定会发生。","example":"The house outlook on rates is a view, not a promise of future performance.","exampleZh":"机构对利率的展望只是一种看法，并不是对未来表现的承诺。"},{"id":"gen-141","bank":"general","word":"trajectory","full":"","ipa":"/trəˈdʒektəri/","pos":"n.","meaning":"轨迹；走向。形容事物沿着某一方向发展的路径，如学习进度、业务增长或利率路径。它是描述趋势的词，并不保证该方向会持续。","example":"Her learning trajectory has been steady since she started reviewing every morning.","exampleZh":"自从她开始每天早晨复习，学习轨迹一直很平稳。"},{"id":"gen-142","bank":"general","word":"momentum","full":"","ipa":"/məˈmentəm/","pos":"n.","meaning":"势头。指事情正在积累的前进力量，如学习、项目或市场行情的 momentum。势头可以保持，也会中断，因此需要用规律来巩固。","example":"A short daily session is enough to keep the momentum going.","exampleZh":"每天一小段时间，就足以把学习势头保持下去。"},{"id":"gen-143","bank":"general","word":"setback","full":"","ipa":"/ˈsetbæk/","pos":"n.","meaning":"挫折；反复。指进展中遇到的后退或延误。把 setback 当成可以检讨的信息，而不是否定全部努力，通常更有助于恢复进度。","example":"Missing one study day is a setback, not a reason to stop the habit.","exampleZh":"漏学一天只是一次反复，不是放弃这个习惯的理由。"},{"id":"gen-144","bank":"general","word":"buffer","full":"","ipa":"/ˈbʌfə/","pos":"n.","meaning":"缓冲。为应对延误、波动或意外而预留的时间、资金或额度。留出 buffer 是审慎安排，不是浪费。","example":"Please leave a buffer of one hour before the client call in case the review runs long.","exampleZh":"请在客户通话前预留一小时缓冲，以防审阅超时。"},{"id":"gen-145","bank":"general","word":"contingency","full":"","ipa":"/kənˈtɪndʒənsi/","pos":"n.","meaning":"应急安排；或有情况。指为可能发生但不希望发生的事情预先准备的计划。a contingency plan 即备选方案。","example":"Our contingency is to use the previous approved template if the new one is delayed.","exampleZh":"我们的应急安排是：若新模板延误，就使用此前已批准的模板。"},{"id":"gen-146","bank":"general","word":"workaround","full":"","ipa":"/ˈwɜːkəraʊnd/","pos":"n.","meaning":"权宜办法。在正式解决方案尚未到位时，用来暂时绕过障碍的做法。权宜办法应标明其临时性，并评估是否引入新的操作风险。","example":"This workaround is acceptable for today, but it should not become the process.","exampleZh":"这个权宜办法今天可以用，但不应当变成正式流程。"},{"id":"gen-147","bank":"general","word":"backlog","full":"","ipa":"/ˈbæklɒɡ/","pos":"n.","meaning":"积压。已经到来但尚未处理完的工作量。面对 backlog，通常需要先分类、再排优先次序，而不是平均用力。","example":"There is a backlog of confirmations to be checked this afternoon.","exampleZh":"今天下午还有一批成交确认书积压待核。"},{"id":"gen-148","bank":"general","word":"bandwidth","full":"","ipa":"/ˈbændwɪdθ/","pos":"n.","meaning":"可用精力或时间（亦指网络带宽）。在办公室英语里，常用来表示某人当前还能承担多少额外工作。询问 bandwidth 是在尊重对方负荷，而不是推脱的托词。","example":"I do not have the bandwidth for another review until tomorrow.","exampleZh":"在明天之前，我没有余力再做另一项审阅。"},{"id":"gen-149","bank":"general","word":"turnaround","full":"","ipa":"/ˈtɜːnəraʊnd/","pos":"n.","meaning":"周转时间；完成并交回所需的时间。也指业绩或局面的扭转。向协作方提出请求时，说明所需 turnaround，有助于对方安排。","example":"The usual turnaround for a legal review is one business day.","exampleZh":"法律审阅通常的周转时间是一个营业日。"},{"id":"gen-150","bank":"general","word":"handover","full":"","ipa":"/ˈhændəʊvə/","pos":"n.","meaning":"交接。把未完事项、文件、风险点和联系人清楚地交给下一个负责人。完整的 handover 应让对方不必再回头追问关键事实。","example":"A written handover will help the duty colleague follow up tomorrow morning.","exampleZh":"一份书面交接，将方便值班同事明天上午继续跟进。"},{"id":"gen-151","bank":"general","word":"agenda","full":"","ipa":"/əˈdʒendə/","pos":"n.","meaning":"议程。会议上要讨论的事项清单及其先后次序。会前发出议程，可让与会者有所准备。","example":"I have attached the agenda for Thursday's review meeting.","exampleZh":"随函附上星期四检讨会议的议程。"},{"id":"gen-152","bank":"general","word":"minutes","full":"","ipa":"/ˈmɪnɪts/","pos":"n.","meaning":"会议记录。以书面形式记下会议的讨论要点、决定和跟进事项；此义项恒用复数。","example":"Could you circulate the minutes by the end of the day?","exampleZh":"可否在今天下班前传阅会议记录？"},{"id":"gen-153","bank":"general","word":"action item","full":"","ipa":"/ˈækʃn ˌaɪtəm/","pos":"n.","meaning":"待办事项（跟进事项）。会议后须由指定人员在限期内完成的具体工作。","example":"The action item on pricing is assigned to Lui, due Friday.","exampleZh":"定价方面的跟进事项由 Lui 负责，星期五前完成。"},{"id":"gen-154","bank":"general","word":"touch base","full":"","ipa":"/ˌtʌtʃ ˈbeɪs/","pos":"phr.","meaning":"简短联系一下。指与对方简单沟通、互通近况，语气轻松。","example":"Let's touch base next week once the issuer confirms the terms.","exampleZh":"等发行人确认条款后，我们下星期再联系一下。"},{"id":"gen-155","bank":"general","word":"circle back","full":"","ipa":"/ˌsɜːkl ˈbæk/","pos":"phr.","meaning":"稍后再回到（某话题）。表示现在先放一放，之后再跟进或讨论。","example":"Can we circle back to the fee question after lunch?","exampleZh":"午饭后我们再回头讨论收费问题，好吗？"},{"id":"gen-156","bank":"general","word":"loop in","full":"","ipa":"/ˌluːp ˈɪn/","pos":"phr.","meaning":"把（某人）拉进来（让其知情）。在电邮或讨论中加入相关人员，让对方掌握情况。","example":"I've looped in our compliance colleague for her view.","exampleZh":"我已把合规部同事加进来，听听她的意见。"},{"id":"gen-157","bank":"general","word":"heads-up","full":"","ipa":"/ˈhedz ʌp/","pos":"n.","meaning":"预先提醒。事前给对方的简短通知，让其有心理准备。","example":"Just a heads-up: the system will be down for maintenance tonight.","exampleZh":"先提醒一下：系统今晚会停机维护。"},{"id":"gen-158","bank":"general","word":"FYI","full":"For Your Information","ipa":"/ˌef waɪ ˈaɪ/","pos":"abbr.","meaning":"供参考。用于转发资料或告知事项，通常表示对方无须即时回应。","example":"FYI, the client has moved the meeting to 3 p.m.","exampleZh":"供参考：客户已把会议改到下午三时。"},{"id":"gen-159","bank":"general","word":"ASAP","full":"As Soon As Possible","ipa":"/ˌeɪ es eɪ ˈpiː/","pos":"abbr.","meaning":"尽快。语气较急，对上司或客户使用时宜改说具体期限，以免显得生硬。","example":"Please send me the signed form ASAP.","exampleZh":"请尽快把签好的表格发给我。"},{"id":"gen-160","bank":"general","word":"EOD","full":"End of Day","ipa":"/ˌiː əʊ ˈdiː/","pos":"abbr.","meaning":"当天下班前（当日结束前）。跨时区沟通时最好注明时区。","example":"I'll send the revised draft by EOD Hong Kong time.","exampleZh":"我会在香港时间今天下班前发出修订稿。"},{"id":"gen-161","bank":"general","word":"ETA","full":"Estimated Time of Arrival","ipa":"/ˌiː tiː ˈeɪ/","pos":"abbr.","meaning":"预计到达时间。在职场也可泛指某项工作的预计完成时间。","example":"Do you have an ETA on the final term sheet?","exampleZh":"最终条款书预计什么时候能出来？"},{"id":"gen-162","bank":"general","word":"OOO","full":"Out of Office","ipa":"/ˌəʊ əʊ ˈəʊ/","pos":"abbr.","meaning":"不在办公室（休假或外出）。常见于自动回复中。","example":"I'm OOO until Monday with limited access to email.","exampleZh":"我星期一前不在办公室，查看电邮的机会有限。"},{"id":"gen-163","bank":"general","word":"out-of-office reply","full":"","ipa":"/ˌaʊt əv ˈɒfɪs rɪˌplaɪ/","pos":"n.","meaning":"外出自动回复。离开办公室期间系统自动发出的电邮回复，通常注明回来日期及代理联系人。","example":"Please set an out-of-office reply naming your backup.","exampleZh":"请设置外出自动回复，并注明代理同事。"},{"id":"gen-164","bank":"general","word":"per my last email","full":"","ipa":"/pə maɪ ˌlɑːst ˈiːmeɪl/","pos":"phr.","meaning":"如我上一封电邮所述。语气偏冷淡，暗示对方没细看来信，正式沟通中宜慎用。","example":"Per my last email, the deadline is Friday.","exampleZh":"如我上一封电邮所述，截止日期是星期五。"},{"id":"gen-165","bank":"general","word":"kindly","full":"","ipa":"/ˈkaɪndli/","pos":"adv.","meaning":"请（客气用语）。在商务英语中用于礼貌提出请求，相当于 please，但用多了会显得公式化。","example":"Kindly confirm receipt of this email.","exampleZh":"请确认收到本邮件。"},{"id":"gen-166","bank":"general","word":"attached","full":"","ipa":"/əˈtætʃt/","pos":"adj.","meaning":"附上的（随函附件）。在电邮中指附件中的文件。","example":"Please find attached the updated factsheet.","exampleZh":"随函附上更新后的产品资料。"},{"id":"gen-167","bank":"general","word":"enclosed","full":"","ipa":"/ɪnˈkləʊzd/","pos":"adj.","meaning":"随信附上的。多用于纸本信件，指同一信封内附带的文件。","example":"Enclosed is a copy of the signed agreement.","exampleZh":"随信附上已签署协议的副本。"},{"id":"gen-168","bank":"general","word":"regarding","full":"","ipa":"/rɪˈɡɑːdɪŋ/","pos":"prep.","meaning":"关于。正式程度高于 about，常用于电邮主题和开头。","example":"I am writing regarding your enquiry about the bond fund.","exampleZh":"来函是关于您询问的债券基金。"},{"id":"gen-169","bank":"general","word":"with reference to","full":"","ipa":"/wɪð ˈrefrəns tə/","pos":"phr.","meaning":"兹提述；关于。用于正式书信开头，指明所回复的来信或事项。","example":"With reference to your letter of 3 May, we confirm the transfer.","exampleZh":"兹提述您 5 月 3 日的来信，我们确认已完成转账。"},{"id":"gen-170","bank":"general","word":"at your earliest convenience","full":"","ipa":"/ət jɔːr ˌɜːliɪst kənˈviːniəns/","pos":"phr.","meaning":"在您方便时尽早。比 ASAP 客气得多的催促说法。","example":"Please review the document at your earliest convenience.","exampleZh":"请您在方便时尽早审阅该文件。"},{"id":"gen-171","bank":"general","word":"look forward to","full":"","ipa":"/ˌlʊk ˈfɔːwəd tə/","pos":"phr.","meaning":"期待。后面接名词或动名词，如 look forward to hearing from you。","example":"I look forward to meeting you on Tuesday.","exampleZh":"期待星期二与您见面。"},{"id":"gen-172","bank":"general","word":"sign-off","full":"","ipa":"/ˈsaɪn ɒf/","pos":"n.","meaning":"批准；签署确认。指主管或相关部门正式同意某文件或方案；也可指电邮结尾的署名语。","example":"We need legal sign-off before sending this to clients.","exampleZh":"发给客户之前，我们需要法务部批准。"},{"id":"gen-173","bank":"general","word":"cc","full":"carbon copy","ipa":"/ˌsiː ˈsiː/","pos":"v.","meaning":"抄送。把电邮副本同时发给其他相关人员，让其知悉。","example":"Please cc my assistant on any scheduling emails.","exampleZh":"有关安排时间的电邮请抄送我的助理。"},{"id":"gen-174","bank":"general","word":"bcc","full":"blind carbon copy","ipa":"/ˌbiː siː ˈsiː/","pos":"v.","meaning":"密件抄送。抄送给他人而不让其他收件人看到其地址；群发外部邮件时可保护私隐。","example":"Use bcc when emailing a large group of clients.","exampleZh":"群发电邮给大批客户时，请使用密件抄送。"},{"id":"gen-175","bank":"general","word":"reply all","full":"","ipa":"/rɪˌplaɪ ˈɔːl/","pos":"v.","meaning":"全部回复。回复所有收件人和抄送人；只需回复发件人时应避免使用。","example":"Please don't reply all to the company-wide announcement.","exampleZh":"请不要全部回复全公司的通告。"},{"id":"gen-176","bank":"general","word":"forward","full":"","ipa":"/ˈfɔːwəd/","pos":"v.","meaning":"转发。把收到的电邮或信息发给另一人。转发前应确认内容可以外传。","example":"Could you forward me the client's original request?","exampleZh":"可否把客户原来的要求转发给我？"},{"id":"gen-177","bank":"general","word":"subject line","full":"","ipa":"/ˈsʌbdʒɪkt laɪn/","pos":"n.","meaning":"（电邮）主题栏。简明说明邮件内容和所需行动，便于对方分辨轻重缓急。","example":"Put \"Action required\" in the subject line so it doesn't get missed.","exampleZh":"在主题栏写上“需要处理”，以免被忽略。"},{"id":"gen-178","bank":"general","word":"gentle reminder","full":"","ipa":"/ˌdʒentl rɪˈmaɪndə/","pos":"n.","meaning":"温馨提示（礼貌提醒）。用于委婉地提醒对方尚未完成的事项。","example":"This is a gentle reminder that the form is due tomorrow.","exampleZh":"温馨提示：表格明天截止提交。"},{"id":"gen-179","bank":"general","word":"follow through","full":"","ipa":"/ˌfɒləʊ ˈθruː/","pos":"phr.","meaning":"贯彻到底；兑现。把已答应或已开始的事做完。","example":"She always follows through on what she promises clients.","exampleZh":"她答应客户的事总会做到。"},{"id":"gen-180","bank":"general","word":"take ownership","full":"","ipa":"/ˌteɪk ˈəʊnəʃɪp/","pos":"phr.","meaning":"主动承担责任。把某项工作视为自己的责任并负责到底。","example":"I'd like you to take ownership of the onboarding checklist.","exampleZh":"我希望您负责开户核对清单这件事。"},{"id":"gen-181","bank":"general","word":"on the same page","full":"","ipa":"/ɒn ðə ˌseɪm ˈpeɪdʒ/","pos":"phr.","meaning":"看法一致；有共识。指各方对情况或计划的理解相同。","example":"Let's make sure we're on the same page before we call the client.","exampleZh":"致电客户之前，我们先确定大家意见一致。"},{"id":"gen-182","bank":"general","word":"ballpark figure","full":"","ipa":"/ˈbɔːlpɑːk ˌfɪɡə/","pos":"n.","meaning":"大概数字（粗略估算）。不精确但大致可信的估计。","example":"Can you give m
