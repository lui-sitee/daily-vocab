部分预算用于社会福利。"},{"id":"ielts-0241","bank":"ielts","word":"biodiversity","full":"","ipa":"/ˌbaɪəʊdaɪˈvɜːsəti/","pos":"n.","meaning":"生物多样性。某地区内动植物及其他生物种类的丰富程度。","example":"Tropical rainforests have the highest biodiversity on Earth.","exampleZh":"热带雨林拥有地球上最丰富的生物多样性。"},{"id":"ielts-0242","bank":"ielts","word":"deforestation","full":"","ipa":"/diːˌfɒrɪˈsteɪʃn/","pos":"n.","meaning":"砍伐森林；毁林。大规模清除森林的行为。","example":"Deforestation is a major cause of habitat loss.","exampleZh":"砍伐森林是栖息地丧失的主要原因。"},{"id":"ielts-0243","bank":"ielts","word":"desertification","full":"","ipa":"/dɪˌzɜːtɪfɪˈkeɪʃn/","pos":"n.","meaning":"沙漠化（荒漠化）。土地因干旱、过度放牧等原因逐渐变成沙漠的过程。","example":"Overgrazing has accelerated desertification in the region.","exampleZh":"过度放牧加快了该地区的沙漠化。"},{"id":"ielts-0244","bank":"ielts","word":"emission","full":"","ipa":"/ɪˈmɪʃn/","pos":"n.","meaning":"排放；排放物。常用复数，如 carbon emissions（碳排放）。","example":"Cars are a major source of carbon emissions in cities.","exampleZh":"汽车是城市碳排放的主要来源。"},{"id":"ielts-0245","bank":"ielts","word":"carbon footprint","full":"","ipa":"/ˌkɑːbən ˈfʊtprɪnt/","pos":"n.","meaning":"碳足迹。个人、机构或产品在一段时间内直接或间接排放的温室气体总量。","example":"Flying less is one way to reduce your carbon footprint.","exampleZh":"少坐飞机是减少碳足迹的方法之一。"},{"id":"ielts-0246","bank":"ielts","word":"renewable","full":"","ipa":"/rɪˈnjuːəbl/","pos":"adj.","meaning":"可再生的。renewable energy 指太阳能、风能等可再生能源。","example":"The country aims to generate half its electricity from renewable sources.","exampleZh":"该国目标是一半电力来自可再生能源。"},{"id":"ielts-0247","bank":"ielts","word":"fossil fuel","full":"","ipa":"/ˈfɒsl ˌfjuːəl/","pos":"n.","meaning":"化石燃料。由古代生物遗骸形成的燃料，如煤、石油和天然气。","example":"Burning fossil fuels releases carbon dioxide.","exampleZh":"燃烧化石燃料会释放二氧化碳。"},{"id":"ielts-0248","bank":"ielts","word":"conservation","full":"","ipa":"/ˌkɒnsəˈveɪʃn/","pos":"n.","meaning":"保育；保护；节约（能源）。","example":"Wildlife conservation depends on protecting natural habitats.","exampleZh":"野生动物保育有赖于保护自然栖息地。"},{"id":"ielts-0249","bank":"ielts","word":"habitat","full":"","ipa":"/ˈhæbɪtæt/","pos":"n.","meaning":"栖息地；生境。动植物自然生长的环境。","example":"Many species are losing their natural habitat.","exampleZh":"许多物种正在失去其自然栖息地。"},{"id":"ielts-0250","bank":"ielts","word":"endangered","full":"","ipa":"/ɪnˈdeɪndʒəd/","pos":"adj.","meaning":"濒危的。endangered species 指濒危物种。","example":"The giant panda is no longer classified as endangered.","exampleZh":"大熊猫已不再列为濒危物种。"},{"id":"ielts-0251","bank":"ielts","word":"extinction","full":"","ipa":"/ɪkˈstɪŋkʃn/","pos":"n.","meaning":"灭绝；绝种。","example":"Thousands of species face extinction this century.","exampleZh":"本世纪有数以千计的物种面临灭绝。"},{"id":"ielts-0252","bank":"ielts","word":"ecosystem","full":"","ipa":"/ˈiːkəʊsɪstəm/","pos":"n.","meaning":"生态系统。某一环境中所有生物及其与环境的相互关系。","example":"Plastic waste is damaging marine ecosystems.","exampleZh":"塑胶垃圾正在破坏海洋生态系统。"},{"id":"ielts-0253","bank":"ielts","word":"pollutant","full":"","ipa":"/pəˈluːtənt/","pos":"n.","meaning":"污染物。","example":"Factories must reduce the pollutants they release into rivers.","exampleZh":"工厂必须减少排入河流的污染物。"},{"id":"ielts-0254","bank":"ielts","word":"contaminate","full":"","ipa":"/kənˈtæmɪneɪt/","pos":"v.","meaning":"污染；弄脏。尤指使水、食物或土壤含有有害物质。","example":"Chemicals from the mine contaminated the water supply.","exampleZh":"矿场的化学物质污染了食水供应。"},{"id":"ielts-0255","bank":"ielts","word":"landfill","full":"","ipa":"/ˈlændfɪl/","pos":"n.","meaning":"堆填区；垃圾填埋场。","example":"Most of the city's waste still goes to landfill.","exampleZh":"该市大部分垃圾仍送往堆填区。"},{"id":"ielts-0256","bank":"ielts","word":"recycle","full":"","ipa":"/ˌriːˈsaɪkl/","pos":"v.","meaning":"回收；循环再用。","example":"Glass bottles can be recycled many times.","exampleZh":"玻璃瓶可以多次回收再造。"},{"id":"ielts-0257","bank":"ielts","word":"sustainable","full":"","ipa":"/səˈsteɪnəbl/","pos":"adj.","meaning":"可持续的。在不损害后代满足需要的前提下满足当前需要的。","example":"We need a more sustainable way of producing food.","exampleZh":"我们需要一种更可持续的粮食生产方式。"},{"id":"ielts-0258","bank":"ielts","word":"global warming","full":"","ipa":"/ˌɡləʊbl ˈwɔːmɪŋ/","pos":"n.","meaning":"全球变暖。主要因温室气体增加而导致的地球平均气温上升。","example":"Global warming is causing sea levels to rise.","exampleZh":"全球变暖导致海平面上升。"},{"id":"ielts-0259","bank":"ielts","word":"greenhouse gas","full":"","ipa":"/ˌɡriːnhaʊs ˈɡæs/","pos":"n.","meaning":"温室气体。如二氧化碳、甲烷等能吸收热量、使地球变暖的气体。","example":"Methane is a powerful greenhouse gas.","exampleZh":"甲烷是一种威力强大的温室气体。"},{"id":"ielts-0260","bank":"ielts","word":"drought","full":"","ipa":"/draʊt/","pos":"n.","meaning":"旱灾；干旱。长时间缺少降雨。","example":"The drought destroyed most of the harvest.","exampleZh":"旱灾毁了大部分收成。"},{"id":"ielts-0261","bank":"ielts","word":"famine","full":"","ipa":"/ˈfæmɪn/","pos":"n.","meaning":"饥荒。大范围严重缺乏粮食。","example":"Millions died during the famine.","exampleZh":"这场饥荒导致数以百万计的人死亡。"},{"id":"ielts-0262","bank":"ielts","word":"erosion","full":"","ipa":"/ɪˈrəʊʒn/","pos":"n.","meaning":"侵蚀；腐蚀；逐渐削弱。","example":"Trees help prevent soil erosion.","exampleZh":"树木有助防止水土流失。"},{"id":"ielts-0263","bank":"ielts","word":"irrigation","full":"","ipa":"/ˌɪrɪˈɡeɪʃn/","pos":"n.","meaning":"灌溉。以人工方式向农田供水。","example":"Irrigation allows farmers to grow crops in dry areas.","exampleZh":"灌溉使农民可以在干旱地区种植农作物。"},{"id":"ielts-0264","bank":"ielts","word":"pesticide","full":"","ipa":"/ˈpestɪsaɪd/","pos":"n.","meaning":"杀虫剂；农药。","example":"Overuse of pesticides can harm bees.","exampleZh":"过量使用杀虫剂可能伤害蜜蜂。"},{"id":"ielts-0265","bank":"ielts","word":"fertiliser","full":"","ipa":"/ˈfɜːtəlaɪzə/","pos":"n.","meaning":"肥料。英式拼法 fertiliser，美式 fertilizer。","example":"Chemical fertilisers can pollute nearby rivers.","exampleZh":"化学肥料可能污染附近的河流。"},{"id":"ielts-0266","bank":"ielts","word":"organic","full":"","ipa":"/ɔːˈɡænɪk/","pos":"adj.","meaning":"有机的；有机耕种的。指不用化学农药和肥料生产的。","example":"Organic vegetables are usually more expensive.","exampleZh":"有机蔬菜通常比较贵。"},{"id":"ielts-0267","bank":"ielts","word":"livestock","full":"","ipa":"/ˈlaɪvstɒk/","pos":"n.","meaning":"牲畜；家畜。统称牛、羊、猪等。","example":"Livestock farming produces large amounts of methane.","exampleZh":"畜牧业产生大量甲烷。"},{"id":"ielts-0268","bank":"ielts","word":"agriculture","full":"","ipa":"/ˈæɡrɪkʌltʃə/","pos":"n.","meaning":"农业。","example":"Agriculture uses about seventy percent of the world's fresh water.","exampleZh":"农业用去全球约七成的淡水。"},{"id":"ielts-0269","bank":"ielts","word":"harvest","full":"","ipa":"/ˈhɑːvɪst/","pos":"n./v.","meaning":"收成；收割。","example":"A poor harvest pushed up food prices.","exampleZh":"收成欠佳推高了粮价。"},{"id":"ielts-0270","bank":"ielts","word":"wildlife","full":"","ipa":"/ˈwaɪldlaɪf/","pos":"n.","meaning":"野生动物。不可数名词。","example":"The national park is home to a variety of wildlife.","exampleZh":"国家公园里栖息着各种野生动物。"},{"id":"ielts-0271","bank":"ielts","word":"poaching","full":"","ipa":"/ˈpəʊtʃɪŋ/","pos":"n.","meaning":"偷猎。非法捕猎动物。","example":"Poaching has pushed rhinos close to extinction.","exampleZh":"偷猎令犀牛濒临灭绝。"},{"id":"ielts-0272","bank":"ielts","word":"ozone layer","full":"","ipa":"/ˈəʊzəʊn ˌleɪə/","pos":"n.","meaning":"臭氧层。大气层中吸收大部分太阳紫外线的一层。","example":"The ozone layer is slowly recovering.","exampleZh":"臭氧层正在慢慢恢复。"},{"id":"ielts-0273","bank":"ielts","word":"acid rain","full":"","ipa":"/ˌæsɪd ˈreɪn/","pos":"n.","meaning":"酸雨。因空气污染而含有酸性物质的雨水。","example":"Acid rain damages forests and buildings.","exampleZh":"酸雨损害森林和建筑物。"},{"id":"ielts-0274","bank":"ielts","word":"smog","full":"","ipa":"/smɒɡ/","pos":"n.","meaning":"烟雾（雾霾）。烟尘与雾混合形成的污浊空气。","example":"Heavy smog forced schools to close.","exampleZh":"严重雾霾迫使学校停课。"},{"id":"ielts-0275","bank":"ielts","word":"urban sprawl","full":"","ipa":"/ˌɜːbən ˈsprɔːl/","pos":"n.","meaning":"城市无序扩张。城市向周边郊区不断低密度蔓延的现象。","example":"Urban sprawl increases dependence on cars.","exampleZh":"城市无序扩张增加了对汽车的依赖。"},{"id":"ielts-0276","bank":"ielts","word":"congestion","full":"","ipa":"/kənˈdʒestʃən/","pos":"n.","meaning":"（交通）挤塞；拥堵。","example":"A congestion charge reduced traffic in central London.","exampleZh":"拥堵费减少了伦敦市中心的交通流量。"},{"id":"ielts-0277","bank":"ielts","word":"commute","full":"","ipa":"/kəˈmjuːt/","pos":"v./n.","meaning":"通勤；上下班往返。","example":"Many workers commute more than an hour each way.","exampleZh":"许多工人单程通勤超过一小时。"},{"id":"ielts-0278","bank":"ielts","word":"infrastructure","full":"","ipa":"/ˈɪnfrəstrʌktʃə/","pos":"n.","meaning":"基础设施。道路、铁路、供水、电力等社会运作所需的基本设施。","example":"Developing countries need investment in infrastructure.","exampleZh":"发展中国家需要投资基础设施。"},{"id":"ielts-0279","bank":"ielts","word":"pedestrian","full":"","ipa":"/pəˈdestriən/","pos":"n./adj.","meaning":"行人；步行的。pedestrian zone 行人专用区。","example":"The main street has been made pedestrian-only.","exampleZh":"主街已改为行人专用。"},{"id":"ielts-0280","bank":"ielts","word":"suburb","full":"","ipa":"/ˈsʌbɜːb/","pos":"n.","meaning":"郊区；市郊住宅区。","example":"Many families move to the suburbs for more space.","exampleZh":"许多家庭为了更大空间而搬到郊区。"},{"id":"ielts-0281","bank":"ielts","word":"rural","full":"","ipa":"/ˈrʊərəl/","pos":"adj.","meaning":"乡村的；农村的。反义词 urban。","example":"Rural areas often lack good healthcare.","exampleZh":"乡郊地区往往缺乏良好的医疗服务。"},{"id":"ielts-0282","bank":"ielts","word":"urban","full":"","ipa":"/ˈɜːbən/","pos":"adj.","meaning":"城市的；都市的。","example":"More than half the world's population lives in urban areas.","exampleZh":"全球过半人口居住在城市地区。"},{"id":"ielts-0283","bank":"ielts","word":"metropolitan","full":"","ipa":"/ˌmetrəˈpɒlɪtən/","pos":"adj.","meaning":"大都会的；大城市的。","example":"The metropolitan area has a population of ten million.","exampleZh":"这个大都会地区有一千万人口。"},{"id":"ielts-0284","bank":"ielts","word":"overcrowding","full":"","ipa":"/ˌəʊvəˈkraʊdɪŋ/","pos":"n.","meaning":"过度拥挤。","example":"Overcrowding in prisons is a serious problem.","exampleZh":"监狱过度拥挤是一个严重问题。"},{"id":"ielts-0285","bank":"ielts","word":"slum","full":"","ipa":"/slʌm/","pos":"n.","meaning":"贫民窟。居住条件恶劣的贫困地区。","example":"Millions of people live in slums without clean water.","exampleZh":"数以百万计的人住在没有洁净食水的贫民窟。"},{"id":"ielts-0286","bank":"ielts","word":"affordable","full":"","ipa":"/əˈfɔːdəbl/","pos":"adj.","meaning":"负担得起的；价格合理的。","example":"The city needs more affordable housing.","exampleZh":"这座城市需要更多可负担的房屋。"},{"id":"ielts-0287","bank":"ielts","word":"gentrification","full":"","ipa":"/ˌdʒentrɪfɪˈkeɪʃn/","pos":"n.","meaning":"士绅化（中产化）。旧区因较富裕人士迁入而改造升级，常导致原居民被迫迁出。","example":"Gentrification has pushed up rents in the old district.","exampleZh":"士绅化推高了旧区的租金。"},{"id":"ielts-0288","bank":"ielts","word":"solar power","full":"","ipa":"/ˌsəʊlə ˈpaʊə/","pos":"n.","meaning":"太阳能（发电）。","example":"Solar power has become much cheaper in the past decade.","exampleZh":"过去十年，太阳能发电已便宜得多。"},{"id":"ielts-0289","bank":"ielts","word":"wind turbine","full":"","ipa":"/ˈwɪnd ˌtɜːbaɪn/","pos":"n.","meaning":"风力涡轮机（风车）。把风能转化为电能的装置。","example":"Some residents complain about the noise from wind turbines.","exampleZh":"一些居民投诉风力涡轮机发出噪音。"},{"id":"ielts-0290","bank":"ielts","word":"hydroelectric","full":"","ipa":"/ˌhaɪdrəʊɪˈlektrɪk/","pos":"adj.","meaning":"水力发电的。","example":"The dam supplies hydroelectric power to the region.","exampleZh":"这座水坝为该地区提供水力发电。"},{"id":"ielts-0291","bank":"ielts","word":"nuclear power","full":"","ipa":"/ˌnjuːkliə ˈpaʊə/","pos":"n.","meaning":"核能（核电）。","example":"Supporters argue that nuclear power produces little carbon.","exampleZh":"支持者认为核电的碳排放很少。"},{"id":"ielts-0292","bank":"ielts","word":"emission-free","full":"","ipa":"/ɪˈmɪʃn friː/","pos":"adj.","meaning":"零排放的。使用时不排放污染物或温室气体的。","example":"Electric buses are emission-free at the point of use.","exampleZh":"电动巴士在使用时是零排放的。"},{"id":"ielts-0293","bank":"ielts","word":"carbon dioxide","full":"","ipa":"/ˌkɑːbən daɪˈɒksaɪd/","pos":"n.","meaning":"二氧化碳。化学式 CO₂，主要的温室气体。","example":"Plants absorb carbon dioxide from the air.","exampleZh":"植物吸收空气中的二氧化碳。"},{"id":"ielts-0294","bank":"ielts","word":"climate change","full":"","ipa":"/ˈklaɪmət ˌtʃeɪndʒ/","pos":"n.","meaning":"气候变化。长期的全球或区域气候模式改变。","example":"Climate change is making extreme weather more frequent.","exampleZh":"气候变化令极端天气更加频繁。"},{"id":"ielts-0295","bank":"ielts","word":"extreme weather","full":"","ipa":"/ɪkˌstriːm ˈweðə/","pos":"n.","meaning":"极端天气。如热浪、暴雨、强烈风暴等异常天气。","example":"Extreme weather events are costing billions each year.","exampleZh":"极端天气每年造成数以十亿计的损失。"},{"id":"ielts-0296","bank":"ielts","word":"sea level","full":"","ipa":"/ˈsiː ˌlevl/","pos":"n.","meaning":"海平面。","example":"Rising sea levels threaten low-lying islands.","exampleZh":"海平面上升威胁地势低的岛屿。"},{"id":"ielts-0297","bank":"ielts","word":"glacier","full":"","ipa":"/ˈɡlæsiə/","pos":"n.","meaning":"冰川。","example":"Glaciers in the Alps are shrinking rapidly.","exampleZh":"阿尔卑斯山的冰川正迅速缩小。"},{"id":"ielts-0298","bank":"ielts","word":"melt","full":"","ipa":"/melt/","pos":"v.","meaning":"融化；熔化。","example":"Arctic ice is melting faster than expected.","exampleZh":"北极冰层融化的速度比预期更快。"},{"id":"ielts-0299","bank":"ielts","word":"flood","full":"","ipa":"/flʌd/","pos":"n./v.","meaning":"洪水；水浸；淹没。","example":"Heavy rain caused flooding in low-lying areas.","exampleZh":"大雨导致低洼地区水浸。"},{"id":"ielts-0300","bank":"ielts","word":"wildfire","full":"","ipa":"/ˈwaɪldfaɪə/","pos":"n.","meaning":"山火；野火。","example":"Hot, dry summers increase the risk of wildfires.","exampleZh":"炎热干燥的夏季增加山火风险。"},{"id":"ielts-0301","bank":"ielts","word":"heatwave","full":"","ipa":"/ˈhiːtweɪv/","pos":"n.","meaning":"热浪。连续多日异常炎热的天气。","example":"The heatwave led to a sharp rise in electricity use.","exampleZh":"热浪导致用电量急升。"},{"id":"ielts-0302","bank":"ielts","word":"disposable","full":"","ipa":"/dɪˈspəʊzəbl/","pos":"adj.","meaning":"一次性的；用完即弃的。disposable income 另指“可支配收入”。","example":"Many cafés now charge extra for disposable cups.","exampleZh":"不少咖啡店现在对一次性杯额外收费。"},{"id":"ielts-0303","bank":"ielts","word":"single-use plastic","full":"","ipa":"/ˌsɪŋɡl juːs ˈplæstɪk/","pos":"n.","meaning":"一次性塑胶。只用一次便丢弃的塑胶制品，如吸管、餐具。","example":"The city has banned single-use plastic cutlery.","exampleZh":"该市已禁止使用一次性塑胶餐具。"},{"id":"ielts-0304","bank":"ielts","word":"biodegradable","full":"","ipa":"/ˌbaɪəʊdɪˈɡreɪdəbl/","pos":"adj.","meaning":"可生物降解的。能被细菌等自然分解的。","example":"Biodegradable packaging breaks down more quickly.","exampleZh":"可生物降解的包装分解得更快。"},{"id":"ielts-0305","bank":"ielts","word":"compost","full":"","ipa":"/ˈkɒmpɒst/","pos":"n./v.","meaning":"堆肥；把……制成堆肥。","example":"Food waste can be turned into compost.","exampleZh":"厨余可以制成堆肥。"},{"id":"ielts-0306","bank":"ielts","word":"reservoir","full":"","ipa":"/ˈrezəvwɑː/","pos":"n.","meaning":"水塘；水库。","example":"Water levels in the reservoir are dangerously low.","exampleZh":"水塘的水位低得危险。"},{"id":"ielts-0307","bank":"ielts","word":"scarcity","full":"","ipa":"/ˈskeəsəti/","pos":"n.","meaning":"短缺；稀少。","example":"Water scarcity affects more than two billion people.","exampleZh":"缺水影响超过二十亿人。"},{"id":"ielts-0308","bank":"ielts","word":"depletion","full":"","ipa":"/dɪˈpliːʃn/","pos":"n.","meaning":"耗尽；枯竭。","example":"The depletion of fish stocks threatens coastal communities.","exampleZh":"鱼类资源枯竭威胁沿海社区。"},{"id":"ielts-0309","bank":"ielts","word":"overfishing","full":"","ipa":"/ˌəʊvəˈfɪʃɪŋ/","pos":"n.","meaning":"过度捕捞。","example":"Overfishing has caused cod numbers to collapse.","exampleZh":"过度捕捞导致鳕鱼数量骤减。"},{"id":"ielts-0310","bank":"ielts","word":"endangered species","full":"","ipa":"/ɪnˌdeɪndʒəd ˈspiːʃiːz/","pos":"n.","meaning":"濒危物种。","example":"Trade in endangered species is banned under international law.","exampleZh":"国际法禁止买卖濒危物种。"},{"id":"ielts-0311","bank":"ielts","word":"nature reserve","full":"","ipa":"/ˈneɪtʃə rɪˌzɜːv/","pos":"n.","meaning":"自然保护区。","example":"The wetlands were turned into a nature reserve.","exampleZh":"这片湿地被划为自然保护区。"},{"id":"ielts-0312","bank":"ielts","word":"wetland","full":"","ipa":"/ˈwetlənd/","pos":"n.","meaning":"湿地。","example":"Wetlands provide important habitats for migratory birds.","exampleZh":"湿地为候鸟提供重要的栖息地。"},{"id":"ielts-0313","bank":"ielts","word":"green belt","full":"","ipa":"/ˈɡriːn belt/","pos":"n.","meaning":"绿化带。环绕城市、限制建设的开阔绿地。","example":"Building on the green belt is strictly controlled.","exampleZh":"在绿化带上兴建受到严格限制。"},{"id":"ielts-0314","bank":"ielts","word":"public transport","full":"","ipa":"/ˌpʌblɪk ˈtrænspɔːt/","pos":"n.","meaning":"公共交通。美式英语多说 public transportation。","example":"Cheaper public transport would encourage people to leave their cars at home.","exampleZh":"较便宜的公共交通会鼓励人们不开车。"},{"id":"ielts-0315","bank":"ielts","word":"car-sharing","full":"","ipa":"/ˈkɑː ʃeərɪŋ/","pos":"n.","meaning":"共享汽车；拼车。","example":"Car-sharing schemes are popular in large European cities.","exampleZh":"共享汽车计划在欧洲大城市很受欢迎。"},{"id":"ielts-0316","bank":"ielts","word":"cycle lane","full":"","ipa":"/ˈsaɪkl leɪn/","pos":"n.","meaning":"单车径（自行车道）。","example":"The council plans to build more cycle lanes.","exampleZh":"议会计划兴建更多单车径。"},{"id":"ielts-0317","bank":"ielts","word":"high-rise","full":"","ipa":"/ˈhaɪ raɪz/","pos":"adj./n.","meaning":"高层的；高楼。","example":"Most people in Hong Kong live in high-rise flats.","exampleZh":"大部分香港人住在高楼大厦的单位里。"},{"id":"ielts-0318","bank":"ielts","word":"skyscraper","full":"","ipa":"/ˈskaɪskreɪpə/","pos":"n.","meaning":"摩天大楼。","example":"The city skyline is dominated by skyscrapers.","exampleZh":"这座城市的天际线以摩天大楼为主。"},{"id":"ielts-0319","bank":"ielts","word":"amenity","full":"","ipa":"/əˈmiːnəti/","pos":"n.","meaning":"便利设施（多用复数）。如商店、公园、图书馆等。","example":"The new estate lacks basic amenities such as shops.","exampleZh":"新屋苑缺乏商店等基本设施。"},{"id":"ielts-0320","bank":"ielts","word":"facility","full":"","ipa":"/fəˈsɪləti/","pos":"n.","meaning":"设施；设备（多用复数）；能力。","example":"The school has excellent sports facilities.","exampleZh":"这所学校的体育设施非常好。"},{"id":"ielts-0321","bank":"ielts","word":"noise pollution","full":"","ipa":"/ˈnɔɪz pəˌluːʃn/","pos":"n.","meaning":"噪音污染。","example":"Noise pollution near airports can affect sleep.","exampleZh":"机场附近的噪音污染可能影响睡眠。"},{"id":"ielts-0322","bank":"ielts","word":"light pollution","full":"","ipa":"/ˈlaɪt pəˌluːʃn/","pos":"n.","meaning":"光污染。过量人造光令夜空变亮、影响生态与睡眠。","example":"Light pollution makes it hard to see the stars in cities.","exampleZh":"光污染令人在城市里很难看到星星。"},{"id":"ielts-0323","bank":"ielts","word":"waste disposal","full":"","ipa":"/ˈweɪst dɪˌspəʊzl/","pos":"n.","meaning":"废物处理。","example":"Waste disposal is a growing problem for island cities.","exampleZh":"废物处理是岛屿城市日益严重的问题。"},{"id":"ielts-0324","bank":"ielts","word":"energy-efficient","full":"","ipa":"/ˈenədʒi ɪˌfɪʃnt/","pos":"adj.","meaning":"节能的；能源效率高的。","example":"Energy-efficient light bulbs last much longer.","exampleZh":"节能灯泡寿命长得多。"},{"id":"ielts-0325","bank":"ielts","word":"insulation","full":"","ipa":"/ˌɪnsjuˈleɪʃn/","pos":"n.","meaning":"隔热；绝缘；隔音材料。","example":"Good insulation cuts heating bills.","exampleZh":"良好的隔热能减少暖气费。"},{"id":"ielts-0326","bank":"ielts","word":"electric vehicle","full":"Electric Vehicle (EV)","ipa":"/ɪˌlektrɪk ˈviːəkl/","pos":"n.","meaning":"电动车。以电池电力驱动的汽车。","example":"Sales of electric vehicles have risen sharply.","exampleZh":"电动车的销量大幅上升。"},{"id":"ielts-0327","bank":"ielts","word":"sustainability","full":"","ipa":"/səˌsteɪnəˈbɪləti/","pos":"n.","meaning":"可持续性。","example":"Sustainability is now a key concern for many businesses.","exampleZh":"可持续性已成为许多企业的主要考虑。"},{"id":"ielts-0328","bank":"ielts","word":"environmentalist","full":"","ipa":"/ɪnˌvaɪrənˈmentəlɪst/","pos":"n.","meaning":"环保人士；环境保护主义者。","example":"Environmentalists oppose the new airport runway.","exampleZh":"环保人士反对兴建新的机场跑道。"},{"id":"ielts-0329","bank":"ielts","word":"ecological","full":"","ipa":"/ˌiːkəˈlɒdʒɪkl/","pos":"adj.","meaning":"生态的。","example":"The oil spill was an ecological disaster.","exampleZh":"这次漏油是一场生态灾难。"},{"id":"ielts-0330","bank":"ielts","word":"offset","full":"","ipa":"/ˈɒfset/","pos":"v.","meaning":"抵消；补偿。carbon offsetting 指以植林等方式抵消碳排放。","example":"Some airlines let passengers offset the emissions from their flights.","exampleZh":"一些航空公司让乘客为航班的碳排放作出抵消。"},{"id":"ielts-0331","bank":"ielts","word":"precipitation","full":"","ipa":"/prɪˌsɪpɪˈteɪʃn/","pos":"n.","meaning":"降水（量）。包括雨、雪、冰雹等。","example":"Annual precipitation has fallen in the south.","exampleZh":"南部的年降水量减少了。"},{"id":"ielts-0332","bank":"ielts","word":"humidity","full":"","ipa":"/hjuːˈmɪdəti/","pos":"n.","meaning":"湿度。","example":"High humidity makes the heat feel worse.","exampleZh":"湿度高令炎热感觉更难受。"},{"id":"ielts-0333","bank":"ielts","word":"monsoon","full":"","ipa":"/ˌmɒnˈsuːn/","pos":"n.","meaning":"季风；雨季。","example":"The monsoon brings most of the year's rain.","exampleZh":"季风带来全年大部分的雨量。"},{"id":"ielts-0334","bank":"ielts","word":"natural disaster","full":"","ipa":"/ˌnætʃrəl dɪˈzɑːstə/","pos":"n.","meaning":"自然灾害。如地震、洪水、台风等。","example":"Poor countries suffer most from natural disasters.","exampleZh":"贫穷国家受自然灾害的打击最大。"},{"id":"ielts-0335","bank":"ielts","word":"curriculum","full":"","ipa":"/kəˈrɪkjələm/","pos":"n.","meaning":"课程（全部课程设置）。复数 curricula 或 curriculums。","example":"Coding has been added to the primary school curriculum.","exampleZh":"编程已纳入小学课程。"},{"id":"ielts-0336","bank":"ielts","word":"syllabus","full":"","ipa":"/ˈsɪləbəs/","pos":"n.","meaning":"教学大纲。某一科目的具体教学内容。","example":"The exam covers everything on the syllabus.","exampleZh":"考试涵盖教学大纲的全部内容。"},{"id":"ielts-0337","bank":"ielts","word":"tuition","full":"","ipa":"/tjuˈɪʃn/","pos":"n.","meaning":"教学；学费（美式多用 tuition fees）。private tuition 指补习。","example":"Many parents pay for private tuition after school.","exampleZh":"许多家长为孩子付钱课后补习。"},{"id":"ielts-0338","bank":"ielts","word":"tuition fees","full":"","ipa":"/tjuˈɪʃn fiːz/","pos":"n.","meaning":"学费。","example":"Tuition fees for overseas students have risen sharply.","exampleZh":"海外学生的学费大幅上涨。"},{"id":"ielts-0339","bank":"ielts","word":"scholarship","full":"","ipa":"/ˈskɒləʃɪp/","pos":"n.","meaning":"奖学金；学术成就。","example":"She won a full scholarship to study in London.","exampleZh":"她获得全额奖学金到伦敦读书。"},{"id":"ielts-0340","bank":"ielts","word":"undergraduate","full":"","ipa":"/ˌʌndəˈɡrædʒuət/","pos":"n./adj.","meaning":"本科生；本科的。","example":"Undergraduate courses usually last three or four years.","exampleZh":"本科课程通常为期三至四年。"},{"id":"ielts-0341","bank":"ielts","word":"postgraduate","full":"","ipa":"/ˌpəʊstˈɡrædʒuət/","pos":"n./adj.","meaning":"研究生；研究生的。","example":"He is doing a postgraduate degree in engineering.","exampleZh":"他正在修读工程学研究生课程。"},{"id":"ielts-0342","bank":"ielts","word":"dissertation","full":"","ipa":"/ˌdɪsəˈteɪʃn/","pos":"n.","meaning":"学位论文（尤指硕士或学士论文）。","example":"Her dissertation examined youth unemployment.","exampleZh":"她的论文研究青年失业问题。"},{"id":"ielts-0343","bank":"ielts","word":"seminar","full":"","ipa":"/ˈsemɪnɑː/","pos":"n.","meaning":"研讨课；研讨会。","example":"Students are expected to speak in seminars.","exampleZh":"学生须在研讨课上发言。"},{"id":"ielts-0344","bank":"ielts","word":"tutorial","full":"","ipa":"/tjuːˈtɔːriəl/","pos":"n.","meaning":"导修课；辅导课；教程。","example":"Each student has a weekly tutorial with a professor.","exampleZh":"每名学生每周与教授上一次导修课。"},{"id":"ielts-0345","bank":"ielts","word":"lecture","full":"","ipa":"/ˈlektʃə/","pos":"n./v.","meaning":"讲座；讲课；训斥。","example":"Many lectures are now recorded and posted online.","exampleZh":"许多讲课现在会录影并上载到网上。"},{"id":"ielts-0346","bank":"ielts","word":"literacy","full":"","ipa":"/ˈlɪtərəsi/","pos":"n.","meaning":"读写能力；识字。也可指某方面的知识，如 digital literacy。","example":"Adult literacy rates have improved greatly.","exampleZh":"成人识字率已大为改善。"},{"id":"ielts-0347","bank":"ielts","word":"numeracy","full":"","ipa":"/ˈnjuːmərəsi/","pos":"n.","meaning":"计算能力；基本数学能力。","example":"Employers complain about poor numeracy among school leavers.","exampleZh":"雇主抱怨离校生的计算能力差。"},{"id":"ielts-0348","bank":"ielts","word":"vocational","full":"","ipa":"/vəʊˈkeɪʃənl/","pos":"adj.","meaning":"职业的；职业培训的。vocational training 职业培训。","example":"Vocational courses prepare students for specific jobs.","exampleZh":"职业课程为学生投身特定工作做准备。"},{"id":"ielts-0349","bank":"ielts","word":"apprenticeship","full":"","ipa":"/əˈprentɪʃɪp/","pos":"n.","meaning":"学徒制；学徒期。边工作边学习技能的培训安排。","example":"He started an apprenticeship as an electrician.","exampleZh":"他开始当电工学徒。"},{"id":"ielts-0350","bank":"ielts","word":"compulsory","full":"","ipa":"/kəmˈpʌlsəri/","pos":"adj.","meaning":"必修的；强制的。","example":"Education is compulsory until the age of sixteen.","exampleZh":"十六岁以前须接受强制教育。"},{"id":"ielts-0351","bank":"ielts","word":"extracurricular","full":"","ipa":"/ˌekstrəkəˈrɪkjələ/","pos":"adj.","meaning":"课外的。","example":"Extracurricular activities help students develop social skills.","exampleZh":"课外活动有助学生培养社交能力。"},{"id":"ielts-0352","bank":"ielts","word":"assignment","full":"","ipa":"/əˈsaɪnmənt/","pos":"n.","meaning":"作业；任务；派任。","example":"The assignment must be submitted by Friday.","exampleZh":"作业须在星期五前提交。"},{"id":"ielts-0353","bank":"ielts","word":"plagiarism","full":"","ipa":"/ˈpleɪdʒərɪzəm/","pos":"n.","meaning":"抄袭；剽窃。","example":"Universities use software to detect plagiarism.","exampleZh":"大学利用软件侦测抄袭。"},{"id":"ielts-0354","bank":"ielts","word":"peer pressure","full":"","ipa":"/ˈpɪə ˌpreʃə/","pos":"n.","meaning":"同侪压力（朋辈压力）。来自同龄人的影响，促使人做出相同行为。","example":"Peer pressure can lead teenagers to start smoking.","exampleZh":"同侪压力可能导致青少年开始吸烟。"},{"id":"ielts-0355","bank":"ielts","word":"motivation","full":"","ipa":"/ˌməʊtɪˈveɪʃn/","pos":"n.","meaning":"动机；积极性。","example":"Students with high motivation tend to perform better.","exampleZh":"积极性高的学生往往表现较好。"},{"id":"ielts-0356","bank":"ielts","word":"aptitude","full":"","ipa":"/ˈæptɪtjuːd/","pos":"n.","meaning":"天资；才能；倾向。","example":"She showed an early aptitude for music.","exampleZh":"她很早就显露出音乐天分。"},{"id":"ielts-0357","bank":"ielts","word":"assessment","full":"","ipa":"/əˈsesmənt/","pos":"n.","meaning":"评估；考核。continuous assessment 指持续评核。","example":"Coursework counts for forty percent of the assessment.","exampleZh":"课业占评核的百分之四十。"},{"id":"ielts-0358","bank":"ielts","word":"qualification","full":"","ipa":"/ˌkwɒlɪfɪˈkeɪʃn/","pos":"n.","meaning":"资格；学历；资历证明。","example":"Workers without qualifications find it harder to get jobs.","exampleZh":"没有学历的工人较难找到工作。"},{"id":"ielts-0359","bank":"ielts","word":"diploma","full":"","ipa":"/dɪˈpləʊmə/","pos":"n.","meaning":"文凭；毕业证书。","example":"She received a diploma in nursing.","exampleZh":"她获得护理文凭。"},{"id":"ielts-0360","bank":"ielts","word":"enrol","full":"","ipa":"/ɪnˈrəʊl/","pos":"v.","meaning":"注册；入学；报名。英式拼法 enrol，美式 enroll。","example":"More adults are enrolling in online courses.","exampleZh":"越来越多成年人报读网上课程。"},{"id":"ielts-0361","bank":"ielts","word":"dropout","full":"","ipa":"/ˈdrɒpaʊt/","pos":"n.","meaning":"辍学者；退学。dropout rate 辍学率。","example":"The dropout rate is highest among poorer students.","exampleZh":"贫困学生的辍学率最高。"},{"id":"ielts-0362","bank":"ielts","word":"truancy","full":"","ipa":"/ˈtruːənsi/","pos":"n.","meaning":"逃学。无合理原因而缺课。","example":"Truancy is often linked to problems at home.","exampleZh":"逃学往往与家庭问题有关。"},{"id":"ielts-0363","bank":"ielts","word":"distance learning","full":"","ipa":"/ˌdɪstəns ˈlɜːnɪŋ/","pos":"n.","meaning":"遥距学习。学生不必到校，通过网络或函授学习。","example":"Distance learning allows working adults to study part-time.","exampleZh":"遥距学习让在职成人可以兼读。"},{"id":"ielts-0364","bank":"ielts","word":"homeschooling","full":"","ipa":"/ˈhəʊmskuːlɪŋ/","pos":"n.","meaning":"在家教育。由父母等在家中教育孩子而不上学。","example":"Homeschooling is legal in many countries.","exampleZh":"在家教育在许多国家是合法的。"},{"id":"ielts-0365","bank":"ielts","word":"rote learning","full":"","ipa":"/ˌrəʊt ˈlɜːnɪŋ/","pos":"n.","meaning":"死记硬背。靠反复背诵而非理解来学习。","example":"Critics say rote learning discourages creativity.","exampleZh":"批评者认为死记硬背会扼杀创意。"},{"id":"ielts-0366","bank":"ielts","word":"critical thinking","full":"","ipa":"/ˌkrɪtɪkl ˈθɪŋkɪŋ/","pos":"n.","meaning":"批判性思维。客观分析、评估信息与论点后作出判断的能力。","example":"Universities should teach critical thinking skills.","exampleZh":"大学应教授批判性思维。"},{"id":"ielts-0367","bank":"ielts","word":"creativity","full":"","ipa":"/ˌkriːeɪˈtɪvəti/","pos":"n.","meaning":"创造力；创意。","example":"Art lessons encourage creativity.","exampleZh":"美术课鼓励创意。"},{"id":"ielts-0368","bank":"ielts","word":"academic","full":"","ipa":"/ˌækəˈdemɪk/","pos":"adj./n.","meaning":"学术的；学业的；学者。","example":"Academic performance is not the only measure of success.","exampleZh":"学业成绩不是衡量成功的唯一标准。"},{"id":"ielts-0369","bank":"ielts","word":"discipline","full":"","ipa":"/ˈdɪsəplɪn/","pos":"n.","meaning":"纪律；学科；自律。","example":"Physics is a demanding academic discipline.","exampleZh":"物理是一门艰深的学科。"},{"id":"ielts-0370","bank":"ielts","word":"mixed-ability","full":"","ipa":"/ˌmɪkst əˈbɪləti/","pos":"adj.","meaning":"（班级）能力混合的。不按学生能力分班的。","example":"Teaching mixed-ability classes can be challenging.","exampleZh":"教授能力混合的班级颇具挑战。"},{"id":"ielts-0371","bank":"ielts","word":"single-sex school","full":"","ipa":"/ˌsɪŋɡl seks ˈskuːl/","pos":"n.","meaning":"单性别学校（男校或女校）。","example":"Some parents prefer single-sex schools for their daughters.","exampleZh":"一些家长偏好让女儿入读女校。"},{"id":"ielts-0372","bank":"ielts","word":"boarding school","full":"","ipa":"/ˈbɔːdɪŋ skuːl/","pos":"n.","meaning":"寄宿学校。","example":"He was sent to boarding school at the age of eleven.","exampleZh":"他十一岁就被送进寄宿学校。"},{"id":"ielts-0373","bank":"ielts","word":"lifelong learning","full":"","ipa":"/ˌlaɪflɒŋ ˈlɜːnɪŋ/","pos":"n.","meaning":"终身学习。","example":"Lifelong learning is essential in a fast-changing job market.","exampleZh":"在瞬息万变的就业市场，终身学习至关重要。"},{"id":"ielts-0374","bank":"ielts","word":"tertiary education","full":"","ipa":"/ˌtɜːʃəri ˌedʒuˈkeɪʃn/","pos":"n.","meaning":"高等教育（专上教育）。中学以后的大学或学院教育。","example":"Access to tertiary education has widened.","exampleZh":"接受高等教育的机会扩大了。"},{"id":"ielts-0375","bank":"ielts","word":"illiterate","full":"","ipa":"/ɪˈlɪtərət/","pos":"adj.","meaning":"不识字的；文盲的。","example":"Millions of adults remain illiterate.","exampleZh":"仍有数以百万计的成年人不识字。"},{"id":"ielts-0376","bank":"ielts","word":"obesity","full":"","ipa":"/əʊˈbiːsəti/","pos":"n.","meaning":"肥胖症；过度肥胖。","example":"Childhood obesity has doubled in thirty years.","exampleZh":"儿童肥胖率在三十年间翻了一番。"},{"id":"ielts-0377","bank":"ielts","word":"nutrition","full":"","ipa":"/njuˈtrɪʃn/","pos":"n.","meaning":"营养；营养学。","example":"Good nutrition is vital in the first years of life.","exampleZh":"生命最初几年的营养至关重要。"},{"id":"ielts-0378","bank":"ielts","word":"nutrient","full":"","ipa":"/ˈnjuːtriənt/","pos":"n.","meaning":"营养素；养分。","example":"Vegetables contain essential nutrients.","exampleZh":"蔬菜含有必需的营养素。"},{"id":"ielts-0379","bank":"ielts","word":"sedentary","full":"","ipa":"/ˈsedntri/","pos":"adj.","meaning":"久坐不动的；缺少运动的。","example":"A sedentary lifestyle increases the risk of heart disease.","exampleZh":"久坐不动的生活方式增加患心脏病的风险。"},{"id":"ielts-0380","bank":"ielts","word":"epidemic","full":"","ipa":"/ˌepɪˈdemɪk/","pos":"n.","meaning":"流行病；（坏事的）盛行。","example":"Some experts speak of an obesity epidemic.","exampleZh":"一些专家称肥胖问题已成流行病。"},{"id":"ielts-0381","bank":"ielts","word":"pandemic","full":"","ipa":"/pænˈdemɪk/","pos":"n.","meaning":"大流行病。在多国或全球范围扩散的疾病。","example":"The pandemic changed the way people work.","exampleZh":"大流行病改变了人们的工作方式。"},{"id":"ielts-0382","bank":"ielts","word":"vaccine","full":"","ipa":"/ˈvæksiːn/","pos":"n.","meaning":"疫苗。","example":"The vaccine has saved millions of lives.","exampleZh":"这种疫苗拯救了数以百万计的生命。"},{"id":"ielts-0383","bank":"ielts","word":"vaccination","full":"","ipa":"/ˌvæksɪˈneɪʃn/","pos":"n.","meaning":"接种疫苗。","example":"Vaccination rates have fallen in some areas.","exampleZh":"一些地区的疫苗接种率下降了。"},{"id":"ielts-0384","bank":"ielts","word":"immunity","full":"","ipa":"/ɪˈmjuːnəti/","pos":"n.","meaning":"免疫力；豁免。","example":"Breast milk helps babies build immunity.","exampleZh":"母乳有助婴儿建立免疫力。"},{"id":"ielts-0385","bank":"ielts","word":"chronic","full":"","ipa":"/ˈkrɒnɪk/","pos":"adj.","meaning":"慢性的；长期的。chronic disease 慢性病。","example":"Diabetes is a chronic disease that needs long-term care.","exampleZh":"糖尿病是需要长期护理的慢性病。"},{"id":"ielts-0386","bank":"ielts","word":"diagnosis","full":"","ipa":"/ˌdaɪəɡˈnəʊsɪs/","pos":"n.","meaning":"诊断。复数 diagnoses。","example":"Early diagnosis greatly improves survival rates.","exampleZh":"及早诊断可大大提高存活率。"},{"id":"ielts-0387","bank":"ielts","word":"symptom","full":"","ipa":"/ˈsɪmptəm/","pos":"n.","meaning":"症状；征兆。","example":"Common symptoms include fever and headache.","exampleZh":"常见症状包括发烧和头痛。"},{"id":"ielts-0388","bank":"ielts","word":"therapy","full":"","ipa":"/ˈθerəpi/","pos":"n.","meaning":"疗法；治疗；心理治疗。","example":"Music therapy can help patients with dementia.","exampleZh":"音乐治疗有助认知障碍症病人。"},{"id":"ielts-0389","bank":"ielts","word":"prescription","full":"","ipa":"/prɪˈskrɪpʃn/","pos":"n.","meaning":"处方；药方。","example":"Antibiotics are available only on prescription.","exampleZh":"抗生素须凭医生处方才能购买。"},{"id":"ielts-0390","bank":"ielts","word":"surgery","full":"","ipa":"/ˈsɜːdʒəri/","pos":"n.","meaning":"外科手术；（英式）诊所。","example":"He needed surgery on his knee.","exampleZh":"他的膝盖需要动手术。"},{"id":"ielts-0391","bank":"ielts","word":"life expectancy","full":"","ipa":"/ˈlaɪf ɪkˌspektənsi/","pos":"n.","meaning":"预期寿命。","example":"Life expectancy in Hong Kong is among the highest in the world.","exampleZh":"香港的预期寿命是全球最高之一。"},{"id":"ielts-0392","bank":"ielts","word":"mortality","full":"","ipa":"/mɔːˈtæləti/","pos":"n.","meaning":"死亡率；必死性。infant mortality 婴儿死亡率。","example":"Infant mortality has fallen dramatically.","exampleZh":"婴儿死亡率大幅下降。"},{"id":"ielts-0393","bank":"ielts","word":"ageing population","full":"","ipa":"/ˌeɪdʒɪŋ ˌpɒpjuˈleɪʃn/","pos":"n.","meaning":"人口老化。长者在人口中所占比例上升。英式拼法 ageing。","example":"An ageing population puts pressure on healthcare.","exampleZh":"人口老化对医疗系统构成压力。"},{"id":"ielts-0394","bank":"ielts","word":"elderly","full":"","ipa":"/ˈeldəli/","pos":"adj.","meaning":"年长的；上了年纪的。the elderly 指长者（比 old people 委婉）。","example":"Care homes for the elderly are in short supply.","exampleZh":"安老院舍供不应求。"},{"id":"ielts-0395","bank":"ielts","word":"pension","full":"","ipa":"/ˈpenʃn/","pos":"n.","meaning":"退休金；养老金。","example":"Many people worry that their pension will not be enough.","exampleZh":"许多人担心退休金不够用。"},{"id":"ielts-0396","bank":"ielts","word":"healthcare","full":"","ipa":"/ˈhelθkeə/","pos":"n.","meaning":"医疗保健；医疗服务。","example":"Healthcare should be available to everyone.","exampleZh":"医疗服务应人人可得。"},{"id":"ielts-0397","bank":"ielts","word":"hygiene","full":"","ipa":"/ˈhaɪdʒiːn/","pos":"n.","meaning":"卫生。personal hygiene 个人卫生。","example":"Good hygiene helps prevent the spread of disease.","exampleZh":"良好的卫生习惯有助防止疾病传播。"},{"id":"ielts-0398","bank":"ielts","word":"sanitation","full":"","ipa":"/ˌsænɪˈteɪʃn/","pos":"n.","meaning":"卫生设施（尤指排污和供水系统）。","example":"Poor sanitation is a major cause of disease.","exampleZh":"卫生设施欠佳是疾病的主要成因。"},{"id":"ielts-0399","bank":"ielts","word":"malnutrition","full":"","ipa":"/ˌmælnjuˈtrɪʃn/","pos":"n.","meaning":"营养不良。","example":"Malnutrition affects children's physical and mental development.","exampleZh":"营养不良影响儿童的身心发展。"},{"id":"ielts-0400","bank":"ielts","word":"wellbeing","full":"","ipa":"/ˈwelbiːɪŋ/","pos":"n.","meaning":"福祉；健康快乐的状态。英式常写作 wellbeing 或 well-being。","example":"Green spaces improve people's wellbeing.","exampleZh":"绿化空间能提升人们的身心健康。"},{"id":"ielts-0401","bank":"ielts","word":"mental health","full":"","ipa":"/ˌmentl ˈhelθ/","pos":"n.","meaning":"心理健康；精神健康。","example":"Schools are paying more attention to students' mental health.","exampleZh":"学校越来越关注学生的精神健康。"},{"id":"ielts-0402","bank":"ielts","word":"anxiety","full":"","ipa":"/æŋˈzaɪəti/","pos":"n.","meaning":"焦虑；忧虑。","example":"Exam anxiety is common among teenagers.","exampleZh":"考试焦虑在青少年中很常见。"},{"id":"ielts-0403","bank":"ielts","word":"depression","full":"","ipa":"/dɪˈpreʃn/","pos":"n.","meaning":"抑郁症；沮丧；（经济）萧条。","example":"Depression is one of the most common mental illnesses.","exampleZh":"抑郁症是最常见的精神疾病之一。"},{"id":"ielts-0404","bank":"ielts","word":"addiction","full":"","ipa":"/əˈdɪkʃn/","pos":"n.","meaning":"成瘾；沉迷。","example":"Smartphone addiction is a growing concern.","exampleZh":"沉迷智能手机的问题日益令人关注。"},{"id":"ielts-0405","bank":"ielts","word":"placebo","full":"","ipa":"/pləˈsiːbəʊ/","pos":"n.","meaning":"安慰剂。没有药效、用于对照实验的药物或疗法。","example":"Half the patients were given a placebo.","exampleZh":"一半病人获发安慰剂。"},{"id" drinks are high in calories.","exampleZh":"含糖饮品热量很高。"},{"id":"ielts-0416","bank":"ielts","word":"cardiovascular","full":"","ipa":"/ˌkɑːdiəʊˈvæskjələ/","pos":"adj.","meaning":"心血管的。","example":"Smoking increases the risk of cardiovascular disease.","exampleZh":"吸烟增加患心血管疾病的风险。"},{"id":"ielts-0417","bank":"ielts","word":"diabetes","full":"","ipa":"/ˌdaɪəˈbiːtiːz/","pos":"n.","meaning":"糖尿病。","example":"Type 2 diabetes is linked to obesity.","exampleZh":"二型糖尿病与肥胖有关。"},{"id":"ielts-0418","bank":"ielts","word":"cancer","full":"","ipa":"/ˈkænsə/","pos":"n.","meaning":"癌症。","example":"Early screening can detect cancer before symptoms appear.","exampleZh":"及早筛查可在症状出现前发现癌症。"},{"id":"ielts-0419","bank":"ielts","word":"dementia","full":"","ipa":"/dɪˈmenʃə/","pos":"n.","meaning":"认知障碍症（痴呆症）。","example":"Dementia affects memory and daily functioning.","exampleZh":"认知障碍症影响记忆和日常功能。"},{"id":"ielts-0420","bank":"ielts","word":"disability","full":"","ipa":"/ˌdɪsəˈbɪləti/","pos":"n.","meaning":"残疾；伤残。","example":"Buildings should be accessible to people with disabilities.","exampleZh":"建筑物应方便残疾人士进出。"},{"id":"ielts-0421","bank":"ielts","word":"physiotherapy","full":"","ipa":"/ˌfɪziəʊˈθerəpi/","pos":"n.","meaning":"物理治疗。","example":"After the accident she needed months of physiotherapy.","exampleZh":"意外后她需要做几个月物理治疗。"},{"id":"ielts-0422","bank":"ielts","word":"GP","full":"General Practitioner","ipa":"/ˌdʒiː ˈpiː/","pos":"n.","meaning":"普通科医生（家庭医生）。英式用语。","example":"You should see your GP if the symptoms continue.","exampleZh":"若症状持续，应去看家庭医生。"},{"id":"ielts-0423","bank":"ielts","word":"public health","full":"","ipa":"/ˌpʌblɪk ˈhelθ/","pos":"n.","meaning":"公共卫生。","example":"Smoking bans have improved public health.","exampleZh":"禁烟措施改善了公共卫生。"},{"id":"ielts-0424","bank":"ielts","word":"lifestyle","full":"","ipa":"/ˈlaɪfstaɪl/","pos":"n.","meaning":"生活方式。","example":"Many diseases are linked to lifestyle choices.","exampleZh":"许多疾病与生活方式的选择有关。"},{"id":"ielts-0425","bank":"ielts","word":"workout","full":"","ipa":"/ˈwɜːkaʊt/","pos":"n.","meaning":"锻炼；健身。","example":"A thirty-minute workout three times a week is enough for most people.","exampleZh":"对大多数人来说，每周锻炼三次、每次三十分钟已足够。"},{"id":"ielts-0426","bank":"ielts","word":"insomnia","full":"","ipa":"/ɪnˈsɒmniə/","pos":"n.","meaning":"失眠。","example":"Too much screen time at night can cause insomnia.","exampleZh":"晚上看屏幕太久可能导致失眠。"},{"id":"ielts-0427","bank":"ielts","word":"fatigue","full":"","ipa":"/fəˈtiːɡ/","pos":"n.","meaning":"疲劳；疲倦。","example":"Driver fatigue causes many road accidents.","exampleZh":"司机疲劳驾驶导致许多交通意外。"},{"id":"ielts-0428","bank":"ielts","word":"offender","full":"","ipa":"/əˈfendə/","pos":"n.","meaning":"犯罪者；违法者。repeat offender 惯犯。","example":"Young offenders need education rather than prison.","exampleZh":"年轻罪犯需要的是教育而非监禁。"},{"id":"ielts-0429","bank":"ielts","word":"juvenile","full":"","ipa":"/ˈdʒuːvənaɪl/","pos":"adj./n.","meaning":"青少年的；未成年人。juvenile crime 青少年犯罪。","example":"Juvenile crime has fallen over the past decade.","exampleZh":"过去十年青少年罪案有所减少。"},{"id":"ielts-0430","bank":"ielts","word":"delinquency","full":"","ipa":"/dɪˈlɪŋkwənsi/","pos":"n.","meaning":"（尤指青少年的）违法行为；不良行为。","example":"Poverty is often linked to juvenile delinquency.","exampleZh":"贫穷往往与青少年违法行为相关。"},{"id":"ielts-0431","bank":"ielts","word":"rehabilitation","full":"","ipa":"/ˌriːəˌbɪlɪˈteɪʃn/","pos":"n.","meaning":"改过自新；康复。帮助罪犯重新融入社会，或帮助病人恢复健康。","example":"Prisons should focus more on rehabilitation.","exampleZh":"监狱应更着重帮助犯人改过自新。"},{"id":"ielts-0432","bank":"ielts","word":"deterrent","full":"","ipa":"/dɪˈterənt/","pos":"n.","meaning":"威慑；阻吓因素。","example":"Heavy fines act as a deterrent to littering.","exampleZh":"重罚对乱抛垃圾起阻吓作用。"},{"id":"ielts-0433","bank":"ielts","word":"punishment","full":"","ipa":"/ˈpʌnɪʃmənt/","pos":"n.","meaning":"惩罚；处罚。capital punishment 指死刑。","example":"Some argue that harsher punishment does not reduce crime.","exampleZh":"有人认为更重的刑罚并不能减少罪案。"},{"id":"ielts-0434","bank":"ielts","word":"imprisonment","full":"","ipa":"/ɪmˈprɪznmənt/","pos":"n.","meaning":"监禁；入狱。","example":"He was sentenced to five years' imprisonment.","exampleZh":"他被判入狱五年。"},{"id":"ielts-0435","bank":"ielts","word":"sentence","full":"","ipa":"/ˈsentəns/","pos":"n./v.","meaning":"判决；刑罚；判刑。","example":"The judge handed down a lighter sentence.","exampleZh":"法官作出较轻的判决。"},{"id":"ielts-0436","bank":"ielts","word":"probation","full":"","ipa":"/prəˈbeɪʃn/","pos":"n.","meaning":"缓刑；试用期。","example":"First-time offenders are often put on probation.","exampleZh":"初犯者往往获判缓刑。"},{"id":"ielts-0437","bank":"ielts","word":"community service","full":"","ipa":"/kəˌmjuːnəti ˈsɜːvɪs/","pos":"n.","meaning":"社会服务令（社区服务）。法院判令罪犯无偿为社区工作以代替监禁。","example":"He was ordered to do 200 hours of community service.","exampleZh":"他被判须做二百小时社会服务。"},{"id":"ielts-0438","bank":"ielts","word":"surveillance","full":"","ipa":"/sɜːˈveɪləns/","pos":"n.","meaning":"监视；监控。","example":"CCTV surveillance has become common in city centres.","exampleZh":"闭路电视监控在市中心已很普遍。"},{"id":"ielts-0439","bank":"ielts","word":"vandalism","full":"","ipa":"/ˈvændəlɪzəm/","pos":"n.","meaning":"蓄意破坏公物（的行为）。","example":"Vandalism costs the council thousands each year.","exampleZh":"蓄意破坏公物每年令议会损失数以千计的款项。"},{"id":"ielts-0440","bank":"ielts","word":"burglary","full":"","ipa":"/ˈbɜːɡləri/","pos":"n.","meaning":"入屋盗窃。","example":"Burglary rates fall when neighbours watch out for each other.","exampleZh":"邻里守望相助时，入屋盗窃案会减少。"},{"id":"ielts-0441","bank":"ielts","word":"fraud","full":"","ipa":"/frɔːd/","pos":"n.","meaning":"欺诈；诈骗。","example":"Online fraud targets older people in particular.","exampleZh":"网上诈骗尤其以长者为目标。"},{"id":"ielts-0442","bank":"ielts","word":"victim","full":"","ipa":"/ˈvɪktɪm/","pos":"n.","meaning":"受害者；牺牲品。","example":"Victims of crime should receive support.","exampleZh":"罪案受害者应获得支援。"},{"id":"ielts-0443","bank":"ielts","word":"witness","full":"","ipa":"/ˈwɪtnəs/","pos":"n./v.","meaning":"证人；目击者；目睹。","example":"Several witnesses saw the accident.","exampleZh":"有几名目击者看到这宗意外。"},{"id":"ielts-0444","bank":"ielts","word":"verdict","full":"","ipa":"/ˈvɜːdɪkt/","pos":"n.","meaning":"（陪审团的）裁决；判断。","example":"The jury reached a guilty verdict.","exampleZh":"陪审团作出有罪裁决。"},{"id":"ielts-0445","bank":"ielts","word":"trial","full":"","ipa":"/ˈtraɪəl/","pos":"n.","meaning":"审讯；试验。clinical trial 临床试验。","example":"The trial lasted three weeks.","exampleZh":"审讯持续了三星期。"},{"id":"ielts-0446","bank":"ielts","word":"law enforcement","full":"","ipa":"/ˈlɔː ɪnˌfɔːsmənt/","pos":"n.","meaning":"执法；执法机关。","example":"Law enforcement agencies are using new technology to fight crime.","exampleZh":"执法机构正利用新科技打击罪案。"},{"id":"ielts-0447","bank":"ielts","word":"legal","full":"","ipa":"/ˈliːɡl/","pos":"adj.","meaning":"法律的；合法的。反义词 illegal。","example":"It is legal to vote at eighteen.","exampleZh":"年满十八岁即可合法投票。"},{"id":"ielts-0448","bank":"ielts","word":"illegal","full":"","ipa":"/ɪˈliːɡl/","pos":"adj.","meaning":"非法的；违法的。","example":"Illegal dumping of waste is a serious offence.","exampleZh":"非法倾倒废物是严重罪行。"},{"id":"ielts-0449","bank":"ielts","word":"prosecute","full":"","ipa":"/ˈprɒsɪkjuːt/","pos":"v.","meaning":"检控；起诉。","example":"Shops that sell alcohol to minors will be prosecuted.","exampleZh":"向未成年人出售酒类的商店会被检控。"},{"id":"ielts-0450","bank":"ielts","word":"penalty","full":"","ipa":"/ˈpenəlti/","pos":"n.","meaning":"惩罚；罚款；（球赛）点球。","example":"The penalty for drink-driving is severe.","exampleZh":"醉酒驾驶的刑罚很重。"},{"id":"ielts-0451","bank":"ielts","word":"civil liberties","full":"","ipa":"/ˌsɪvl ˈlɪbətiz/","pos":"n.","meaning":"公民自由。言论、集会等受法律保障的个人权利。","example":"Critics say the new law threatens civil liberties.","exampleZh":"批评者认为新法律威胁公民自由。"},{"id":"ielts-0452","bank":"ielts","word":"human rights","full":"","ipa":"/ˌhjuːmən ˈraɪts/","pos":"n.","meaning":"人权。","example":"The organisation campaigns for human rights.","exampleZh":"该组织为人权奔走。"},{"id":"ielts-0453","bank":"ielts","word":"crime rate","full":"","ipa":"/ˈkraɪm reɪt/","pos":"n.","meaning":"犯罪率。","example":"The crime rate has dropped for five consecutive years.","exampleZh":"犯罪率已连续五年下降。"},{"id":"ielts-0454","bank":"ielts","word":"cybercrime","full":"","ipa":"/ˈsaɪbəkraɪm/","pos":"n.","meaning":"网络罪行。","example":"Cybercrime costs businesses billions every year.","exampleZh":"网络罪行每年令企业损失数以十亿计。"},{"id":"ielts-0455","bank":"ielts","word":"hacker","full":"","ipa":"/ˈhækə/","pos":"n.","meaning":"黑客。非法入侵电脑系统的人。","example":"Hackers stole the personal data of millions of users.","exampleZh":"黑客盗取了数以百万计用户的个人资料。"},{"id":"ielts-0456","bank":"ielts","word":"identity theft","full":"","ipa":"/aɪˈdentəti ˌθeft/","pos":"n.","meaning":"身份盗窃。盗用他人个人资料作诈骗等用途。","example":"Identity theft often begins with a phishing email.","exampleZh":"身份盗窃常从一封钓鱼电邮开始。"},{"id":"ielts-0457","bank":"ielts","word":"broadcast","full":"","ipa":"/ˈbrɔːdkɑːst/","pos":"v./n.","meaning":"广播；播放；节目。","example":"The match was broadcast live around the world.","exampleZh":"比赛向全球直播。"},{"id":"ielts-0458","bank":"ielts","word":"journalism","full":"","ipa":"/ˈdʒɜːnəlɪzəm/","pos":"n.","meaning":"新闻业；新闻工作。","example":"Investigative journalism holds powerful people to account.","exampleZh":"调查报道使有权势者须承担责任。"},{"id":"ielts-0459","bank":"ielts","word":"censorship","full":"","ipa":"/ˈsensəʃɪp/","pos":"n.","meaning":"审查制度；审查。","example":"Internet censorship limits access to information.","exampleZh":"网络审查限制了获取资讯的途径。"},{"id":"ielts-0460","bank":"ielts","word":"propaganda","full":"","ipa":"/ˌprɒpəˈɡændə/","pos":"n.","meaning":"宣传（常带贬义，指有偏颇的政治宣传）。","example":"The film was criticised as government propaganda.","exampleZh":"这部电影被批评为政府的宣传品。"},{"id":"ielts-0461","bank":"ielts","word":"advertising","full":"","ipa":"/ˈædvətaɪzɪŋ/","pos":"n.","meaning":"广告业；广告（总称）。","example":"Advertising aimed at children should be restricted.","exampleZh":"针对儿童的广告应受到限制。"},{"id":"ielts-0462","bank":"ielts","word":"consumerism","full":"","ipa":"/kənˈsjuːmərɪzəm/","pos":"n.","meaning":"消费主义。认为大量消费是好事的观念或社会风气。","example":"Critics blame consumerism for the growing waste problem.","exampleZh":"批评者把日益严重的垃圾问题归咎于消费主义。"},{"id":"ielts-0463","bank":"ielts","word":"sponsor","full":"","ipa":"/ˈspɒnsə/","pos":"n./v.","meaning":"赞助商；赞助。","example":"The event is sponsored by a local bank.","exampleZh":"这项活动由一家本地银行赞助。"},{"id":"ielts-0464","bank":"ielts","word":"audience","full":"","ipa":"/ˈɔːdiəns/","pos":"n.","meaning":"观众；听众；受众。","example":"The programme attracts a young audience.","exampleZh":"这个节目吸引年轻观众。"},{"id":"ielts-0465","bank":"ielts","word":"tabloid","full":"","ipa":"/ˈtæblɔɪd/","pos":"n.","meaning":"小报。版面较小、以名人八卦和耸动新闻为主的报纸。","example":"Tabloids often invade celebrities' privacy.","exampleZh":"小报常侵犯名人的私隐。"},{"id":"ielts-0466","bank":"ielts","word":"editorial","full":"","ipa":"/ˌedɪˈtɔːriəl/","pos":"n./adj.","meaning":"社论；编辑的。","example":"The newspaper's editorial criticised the new tax.","exampleZh":"报章社论批评新税项。"},{"id":"ielts-0467","bank":"ielts","word":"objectivity","full":"","ipa":"/ˌɒbdʒekˈtɪvəti/","pos":"n.","meaning":"客观性。","example":"Readers expect objectivity from news reports.","exampleZh":"读者期望新闻报道客观。"},{"id":"ielts-0468","bank":"ielts","word":"sensational","full":"","ipa":"/senˈseɪʃənl/","pos":"adj.","meaning":"耸人听闻的；轰动的。","example":"Sensational headlines attract more clicks.","exampleZh":"耸人听闻的标题能吸引更多点击。"},{"id":"ielts-0469","bank":"ielts","word":"coverage","full":"","ipa":"/ˈkʌvərɪdʒ/","pos":"n.","meaning":"新闻报道；覆盖范围；（保险）保障范围。","example":"The election received wide media coverage.","exampleZh":"选举获得传媒广泛报道。"},{"id":"ielts-0470","bank":"ielts","word":"social media","full":"","ipa":"/ˌsəʊʃl ˈmiːdiə/","pos":"n.","meaning":"社交媒体。","example":"Social media allows news to spread within minutes.","exampleZh":"社交媒体让新闻在几分钟内传开。"},{"id":"ielts-0471","bank":"ielts","word":"influencer","full":"","ipa":"/ˈɪnfluənsə/","pos":"n.","meaning":"网红（意见领袖）。在社交媒体上有大量追随者、能影响他人消费的人。","example":"Brands pay influencers to promote their products.","exampleZh":"品牌付钱请网红推广产品。"},{"id":"ielts-0472","bank":"ielts","word":"viral","full":"","ipa":"/ˈvaɪrəl/","pos":"adj.","meaning":"（网上）迅速传播的；病毒的。go viral 爆红。","example":"The video went viral overnight.","exampleZh":"这段影片一夜之间爆红。"},{"id":"ielts-0473","bank":"ielts","word":"privacy","full":"","ipa":"/ˈprɪvəsi/","pos":"n.","meaning":"私隐；隐私。","example":"Many users worry about their online privacy.","exampleZh":"许多用户担心网上私隐。"},{"id":"ielts-0474","bank":"ielts","word":"misinformation","full":"","ipa":"/ˌmɪsɪnfəˈmeɪʃn/","pos":"n.","meaning":"错误信息。不准确的资讯（不一定故意）；故意散播的称 disinformation。","example":"Misinformation about vaccines spreads quickly online.","exampleZh":"有关疫苗的错误信息在网上迅速流传。"},{"id":"ielts-0475","bank":"ielts","word":"fake news","full":"","ipa":"/ˌfeɪk ˈnjuːz/","pos":"n.","meaning":"假新闻。","example":"It can be difficult to tell real news from fake news.","exampleZh":"有时很难分辨真新闻和假新闻。"},{"id":"ielts-0476","bank":"ielts","word":"innovation","full":"","ipa":"/ˌɪnəˈveɪʃn/","pos":"n.","meaning":"创新；新发明。","example":"Innovation is the key to economic growth.","exampleZh":"创新是经济增长的关键。"},{"id":"ielts-0477","bank":"ielts","word":"invention","full":"","ipa":"/ɪnˈvenʃn/","pos":"n.","meaning":"发明；发明物。","example":"The printing press was one of the most important inventions in history.","exampleZh":"印刷机是历史上最重要的发明之一。"},{"id":"ielts-0478","bank":"ielts","word":"breakthrough","full":"","ipa":"/ˈbreɪkθruː/","pos":"n.","meaning":"突破；重大进展。","example":"Scientists have made a breakthrough in cancer research.","exampleZh":"科学家在癌症研究上取得突破。"},{"id":"ielts-0479","bank":"ielts","word":"gadget","full":"","ipa":"/ˈɡædʒɪt/","pos":"n.","meaning":"小器具；小装置。","example":"Teenagers spend a lot of money on electronic gadgets.","exampleZh":"青少年在电子小玩意上花很多钱。"},{"id":"ielts-0480","bank":"ielts","word":"device","full":"","ipa":"/dɪˈvaɪs/","pos":"n.","meaning":"装置；设备；手段。","example":"Mobile devices are banned in exam halls.","exampleZh":"试场内禁止使用流动装置。"},{"id":"ielts-0481","bank":"ielts","word":"digital","full":"","ipa":"/ˈdɪdʒɪtl/","pos":"adj.","meaning":"数码的；数字的。","example":"Digital skills are essential for most },{"id":"ielts-0509","bank":"ielts","word":"unemployment","full":"","ipa":"/ˌʌnɪmˈplɔɪmənt/","pos":"n.","meaning":"失业；失业率。","example":"Youth unemployment remains high in southern Europe.","exampleZh":"南欧的青年失业率仍然高企。"},{"id":"ielts-0510","bank":"ielts","word":"inflation","full":"","ipa":"/ɪnˈfleɪʃn/","pos":"n.","meaning":"通货膨胀。一般物价水平持续上升。","example":"High inflation reduces the value of savings.","exampleZh":"高通胀令储蓄贬值。"},{"id":"ielts-0511","bank":"ielts","word":"recession","full":"","ipa":"/rɪˈseʃn/","pos":"n.","meaning":"经济衰退。通常指国内生产总值连续两季下跌。","example":"Many businesses closed during the recession.","exampleZh":"经济衰退期间许多企业倒闭。"},{"id":"ielts-0512","bank":"ielts","word":"poverty","full":"","ipa":"/ˈpɒvəti/","pos":"n.","meaning":"贫穷；贫困。","example":"Education is one of the best ways out of poverty.","exampleZh":"教育是脱贫的最佳途径之一。"},{"id":"ielts-0513","bank":"ielts","word":"inequality","full":"","ipa":"/ˌɪnɪˈkwɒləti/","pos":"n.","meaning":"不平等；不均。","example":"Income inequality has widened in many countries.","exampleZh":"许多国家的收入不平等扩大了。"},{"id":"ielts-0514","bank":"ielts","word":"wealth gap","full":"","ipa":"/ˈwelθ ɡæp/","pos":"n.","meaning":"贫富差距。","example":"The wealth gap between rich and poor is growing.","exampleZh":"贫富差距日益扩大。"},{"id":"ielts-0515","bank":"ielts","word":"taxation","full":"","ipa":"/tækˈseɪʃn/","pos":"n.","meaning":"税收；征税制度。","example":"Higher taxation could fund better public services.","exampleZh":"提高税收可为更好的公共服务提供资金。"},{"id":"ielts-0516","bank":"ielts","word":"subsidy","full":"","ipa":"/ˈsʌbsədi/","pos":"n.","meaning":"补贴；津贴。","example":"Farmers receive government subsidies.","exampleZh":"农民获得政府补贴。"},{"id":"ielts-0517","bank":"ielts","word":"tariff","full":"","ipa":"/ˈtærɪf/","pos":"n.","meaning":"关税；价目表。","example":"The government raised tariffs on imported steel.","exampleZh":"政府提高了进口钢材的关税。"},{"id":"ielts-0518","bank":"ielts","word":"trade deficit","full":"","ipa":"/ˈtreɪd ˌdefɪsɪt/","pos":"n.","meaning":"贸易逆差。进口值大于出口值。","example":"The country has a larg d":"wage","full":"","ipa":"/weɪdʒ/","pos":"n.","meaning":"工资（通常按小时或周计）。","example":"Wages have not kept up with rising prices.","exampleZh":"工资追不上物价上涨。"},{"id":"ielts-0539","bank":"ielts","word":"promotion","full":"","ipa":"/prəˈməʊʃn/","pos":"n.","meaning":"升职；推广；促销。","example":"She got a promotion after two years.","exampleZh":"她两年后获得升职。"},{"id":"ielts-0540","bank":"ielts","word":"recruitment","full":"","ipa":"/rɪˈkruːtmənt/","pos":"n.","meaning":"招聘；招募。","example":"Online recruitment has become the norm.","exampleZh":"网上招聘已成为常态。"},{"id":"ielts-0541","bank":"ielts","word":"labour market","full":"","ipa":"/ˈleɪbə ˌmɑːkɪt/","pos":"n.","meaning":"劳动力市场。","example":"Graduates face a competitive labour market.","exampleZh":"毕业生面对竞争激烈的劳动力市场。"},{"id":"ielts-0542","bank":"ielts","word":"skilled","full":"","ipa":"/skɪld/","pos":"adj.","meaning":"熟练的；有技能的。skilled workers 技术工人。","example":"There is a shortage of skilled workers.","exampleZh":"技术工人短缺。"},{"id":"ielts-0543","bank":"ielts","word":"manual labour","full":"","ipa":"/ˌmænjuəl ˈleɪbə/","pos":"n.","meaning":"体力劳动。","example":"Machines have replaced much manual labour.","exampleZh":"机器取代了许多体力劳动。"},{"id":"ielts-0544","bank":"ielts","word":"white-collar","full":"","ipa":"/ˌwaɪt ˈkɒlə/","pos":"adj.","meaning":"白领的。指办公室工作的。","example":"White-collar jobs are increasingly affected by AI.","exampleZh":"白领工作越来越受人工智能影响。"},{"id":"ielts-0545","bank":"ielts","word":"blue-collar","full":"","ipa":"/ˌbluː ˈkɒlə/","pos":"adj.","meaning":"蓝领的。指体力或技术劳动的。","example":"Blue-collar workers were hit hardest by factory closures.","exampleZh":"工厂倒闭对蓝领工人打击最大。"},{"id":"ielts-0546","bank":"ielts","word":"gender equality","full":"","ipa":"/ˌdʒendə iˈkwɒləti/","pos":"n.","meaning":"性别平等。","example":"Gender equality in the workplace has improved.","exampleZh":"职场上的性别平等有所改善。"},{"id":"ielts-0547","bank":"ielts","word":"pay gap","full":"","ipa":"/ˈpeɪ ɡæp/","pos":"n.","meaning":"薪酬差距（尤指男女薪酬差距）。","example":"The gender pay gap still exists in most industries.","exampleZh":"大多数行业仍存在男女薪酬差距。"},{"id":"ielts-0548","bank":"ielts","word":"glass ceiling","full":"","ipa":"/ˌɡlɑːs ˈsiːlɪŋ/","pos":"n.","meaning":"玻璃天花板。阻碍女性或少数群体晋升到高层的无形障碍。","example":"Few women break through the glass ceiling in finance.","exampleZh":"在金融业中，能突破玻璃天花板的女性不多。"},{"id":"ielts-0549","bank":"ielts","word":"telecommute","full":"","ipa":"/ˌtelikəˈmjuːt/","pos":"v.","meaning":"远程办公；在家工作。","example":"More employees now telecommute two days a week.","exampleZh":"现在有更多员工每周两天远程办公。"},{"id":"ielts-0550","bank":"ielts","word":"nuclear family","full":"","ipa":"/ˌnjuːkliə ˈfæməli/","pos":"n.","meaning":"核心家庭。只有父母和子女组成的家庭。","example":"The nuclear family is now the most common type in cities.","exampleZh":"核心家庭现在是城市中最常见的家庭类型。"},{"id":"ielts-0551","bank":"ielts","word":"extended family","full":"","ipa":"/ɪkˌstendɪd ˈfæməli/","pos":"n.","meaning":"大家庭。包括祖父母、叔伯姨舅等亲属的家庭。","example":"In the past, extended families often lived together.","exampleZh":"过去，大家庭往往同住。"},{"id":"ielts-0552","bank":"ielts","word":"upbringing","full":"","ipa":"/ˈʌpbrɪŋɪŋ/","pos":"n.","meaning":"养育；教养。","example":"A strict upbringing shaped his character.","exampleZh":"严格的家教塑造了他的性格。"},{"id":"ielts-0553","bank":"ielts","word":"sibling","full":"","ipa":"/ˈsɪblɪŋ/","pos":"n.","meaning":"兄弟姐妹。","example":"Children with siblings learn to share early.","exampleZh":"有兄弟姐妹的孩子很早就学会分享。"},{"id":"ielts-0554","bank":"ielts","word":"generation gap","full":"","ipa":"/ˌdʒenəˈreɪʃn ɡæp/","pos":"n.","meaning":"代沟。","example":"Technology has widened the generation gap.","exampleZh":"科技加深了代沟。"},{"id":"ielts-0555","bank":"ielts","word":"parenting","full":"","ipa":"/ˈpeərəntɪŋ/","pos":"n.","meaning":"育儿；养育子女（的方式）。","example":"Parenting styles differ between cultures.","exampleZh":"不同文化的育儿方式各不相同。"},{"id":"ielts-0556","bank":"ielts","word":"childcare","full":"","ipa":"/ˈtʃaɪldkeə/","pos":"n.","meaning":"托儿服务；照顾儿童。","example":"Affordable childcare helps mothers return to work.","exampleZh":"可负担的托儿服务有助母亲重返职场。"},{"id":"ielt ":"Assimilation can mean losing one's original culture.","exampleZh":"同化可能意味着失去原有文化。"},{"id":"ielts-0567","bank":"ielts","word":"immigrant","full":"","ipa":"/ˈɪmɪɡrənt/","pos":"n.","meaning":"（外来）移民。","example":"Immigrants contribute to the economy.","exampleZh":"移民对经济有所贡献。"},{"id":"ielts-0568","bank":"ielts","word":"emigrate","full":"","ipa":"/ˈemɪɡreɪt/","pos":"v.","meaning":"移居外国（移出）。","example":"Many doctors emigrate in search of higher pay.","exampleZh":"许多医生为追求更高薪酬而移居外国。"},{"id":"ielts-0569","bank":"ielts","word":"refugee","full":"","ipa":"/ˌrefjuˈdʒiː/","pos":"n.","meaning":"难民。","example":"The war has created millions of refugees.","exampleZh":"这场战争造成数以百万计的难民。"},{"id":"ielts-0570","bank":"ielts","word":"asylum","full":"","ipa":"/əˈsaɪləm/","pos":"n.","meaning":"政治庇护；收容所。seek asylum 寻求庇护。","example":"He applied for asylum after fleeing his country.","exampleZh":"他逃离祖国后申请政治庇护。"},{"id":"ielts-0571","bank":"ielts","word":"multicultural","full":"","ipa":"/ˌmʌltiˈkʌltʃərəl/","pos":"adj.","meaning":"多元文化的。","example":"London is a multicultural city.","exampleZh":"伦敦是一座多元文化的城市。"},{"id":"ielts-0572","bank":"ielts","word":"identity","full":"","ipa":"/aɪˈdentəti/","pos":"n.","meaning":"身份；认同；特性。","example":"Language is an important part of cultural identity.","exampleZh":"语言是文化认同的重要部分。"},{"id":"ielts-0573","bank":"ielts","word":"custom","full":"","ipa":"/ˈkʌstəm/","pos":"n.","meaning":"习俗；风俗；惯例。","example":"It is a custom to give red packets at Chinese New Year.","exampleZh":"农历新年派利是是一种习俗。"},{"id":"ielts-0574","bank":"ielts","word":"ritual","full":"","ipa":"/ˈrɪtʃuəl/","pos":"n.","meaning":"仪式；惯常做法。","example":"Weddings involve many traditional rituals.","exampleZh":"婚礼包含许多传统仪式。"},{"id":"ielts-0575","bank":"ielts","word":"festival","full":"","ipa":"/ˈfestɪvl/","pos":"n.","meaning":"节日；节庆活动。","example":"The music festival attracts thousands of visitors.","exampleZh":"这个音乐节吸引数以千计的游客。"},{"id":"ielts-0576","bank":"ielts","word":"heritage","full":"","ipa":"/ˈherɪtɪdʒ/","pos":"n.","meaning":"遗产（文化或自然）；传统。","example":"The old town is a World Heritage Site.","exampleZh":"这座古城是世界遗产。"},{"id":"ielts-0577","bank":"ielts","word":"monument","full":"","ipa":"/ˈmɒnjumənt/","pos":"n.","meaning":"纪念碑；历史遗迹。","example":"Ancient monuments should be protected.","exampleZh":"古代遗迹应受保护。"},{"id":"ielts-0578","bank":"ielts","word":"preservation","full":"","ipa":"/ˌprezəˈveɪʃn/","pos":"n.","meaning":"保存；保护。","example":"The preservation of old buildings is expensive.","exampleZh":"保存旧建筑费用高昂。"},{"id":"ielts-0579","bank":"ielts","word":"authenticity","full":"","ipa":"/ˌɔːθenˈtɪsəti/","pos":"n.","meaning":"真实性；地道。","example":"Tourists want authenticity, not staged shows.","exampleZh":"游客想要的是真实体验，而非刻意安排的表演。"},{"id":"ielts-0580","bank":"ielts","word":"ecotourism","full":"","ipa":"/ˈiːkəʊtʊərɪzəm/","pos":"n.","meaning":"生态旅游。以保护自然环境、惠及当地居民为原则的旅游。","example":"Ecotourism can fund conservation projects.","exampleZh":"生态旅游可以资助保育项目。"},{"id":"ielts-0581","bank":"ielts","word":"hospitality","full":"","ipa":"/ˌhɒspɪˈtæləti/","pos":"n.","meaning":"款待；好客；酒店及餐饮业。","example":"The hospitality industry employs many young people.","exampleZh":"酒店及餐饮业雇用了许多年轻人。"},{"id":"ielts-0582","bank":"ielts","word":"destination","full":"","ipa":"/ˌdestɪˈneɪʃn/","pos":"n.","meaning":"目的地。","example":"Japan is a popular destination for Hong Kong travellers.","exampleZh":"日本是香港旅客的热门目的地。"},{"id":"ielts-0583","bank":"ielts","word":"landmark","full":"","ipa":"/ˈlændmɑːk/","pos":"n.","meaning":"地标；里程碑。","example":"The bridge is a famous landmark.","exampleZh":"这座桥是著名地标。"},{"id":"ielts-0584","bank":"ielts","word":"mass tourism","full":"","ipa":"/ˌmæs ˈtʊərɪzəm/","pos":"n.","meaning":"大众旅游（大规模旅游）。","example":"Mass tourism can damage fragile environments.","exampleZh":"大规模旅游可能破坏脆弱的环境。"},{"id":"ielts-0585","bank":"ielts","word":"overtourism","full":"","ipa":"/ˌəʊvəˈtʊərɪzəm/","pos":"n.","meaning":"过度旅游。游客过多，对当地居民和环境造成负面影响。","example":"Venice is struggling with overtourism.","exampleZh":"威尼斯饱受过度旅游之苦。"},{
